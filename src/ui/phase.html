<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>진행 상황</title>
		<!--@theme-->
		<style>
			/*
			 * 밤/낮 진행 화면.
			 *
			 * 배경은 CSS 그라디언트고 글자는 흐름 배치다(.panel.night/.day).
			 * 예전처럼 <img> 위에 position:absolute로 얹지 않으므로 어떤
			 * 폭에서도 겹치지 않는다.
			 *
			 * 개정에서 바뀐 것
			 * ---------------
			 * 1. 머리말이 신분 줄(.idbar) + 지시 줄(.lead) 두 층이 됐다.
			 *    가장 큰 글씨가 "밤"이라는 상태 이름에서 "기다리세요"·"토론하세요"
			 *    라는 명령문으로 바뀐다 — 처음 하는 사람은 상태는 알아도 할 일을
			 *    몰랐다. 문구는 서버가 보낸다(PhasePayload.lead).
			 * 2. 직업 칩 옆에 능력 한 줄(abilityLine)이 상시 붙는다. 21종에서는
			 *    이름만으로 자기가 무엇을 할 수 있는지 알 수 없다.
			 * 3. 타이머가 링에서 큰 숫자 + 전체 폭 선(.timeline)으로 바뀌었다.
			 *    그리는 쪽은 shared.js의 startTimer 하나다.
			 * 4. note가 .lead-sub로 올라갔다. 이 화면에는 진행률 문구가 없어서
			 *    둘째 줄이 비어 있었고, 아래 한 줄로 두면 무대와 겹쳐 읽혔다.
			 * 5. 밤사이 사건이 한 줄씩 도착하고, 하늘 글리프가 아주 느리게
			 *    떠 있다. 판 전체의 분위기 레이어는 theme.css(.panel.night/.day)가
			 *    맡고, 이 파일은 이 화면에만 있는 두 요소를 움직인다.
			 *
			 * 세로 예산: 다섯 층 합이 203px이라 모바일 24%면 충분하다
			 * (WidgetSize.PHASE.mobile을 28 → 24로 낮추는 요청과 짝이다).
			 */
			.stage {
				display: flex;
				flex-direction: column;
				justify-content: center;
				gap: var(--s2);
				flex: 1 1 auto;
				min-height: 0;
			}

			.sky-row {
				display: flex;
				align-items: center;
				gap: var(--s2);
			}

			/*
			 * 하늘. 달이든 해든 아주 느리게 떠 있다.
			 *
			 * 2px는 보려고 해야 보이는 폭이고, 그게 이 움직임에 필요한 전부다.
			 * 이 글리프는 화면에서 유일하게 "지금이 밤인가 낮인가"만 말하는
			 * 요소라 눈에 걸려야 하지만, 옆의 남은 시간보다 크게 움직이는 순간
			 * 시선을 잘못된 곳에 붙잡아 둔다.
			 *
			 * span이지만 .sky-row가 flex라 블록으로 취급돼 transform이 먹는다.
			 */
			.sky {
				font-size: var(--t-xl);
				line-height: 1;
				animation: sky-drift 6s ease-in-out infinite;
			}

			@keyframes sky-drift {
				0%,
				100% {
					transform: translateY(0);
				}
				50% {
					transform: translateY(-2px);
				}
			}

			/*
			 * 밤사이 사건이 한 줄씩 도착한다. 지연은 아래 init에서 박는다.
			 *
			 * 세 명이 죽은 아침에 세 줄이 한꺼번에 나타나면 그것은 목록이지
			 * 사건이 아니다. 90ms 간격이면 마지막 줄까지 0.2초 안에 끝나서
			 * 기다림은 생기지 않으면서 "하나, 둘, 셋"으로 읽힌다.
			 *
			 * 왼쪽에서 들어오는 이유는 이 상자의 왼쪽 붉은 선이다 — 줄이 그
			 * 선에서 뻗어 나오는 것처럼 보인다.
			 */
			.stack span {
				animation: deathline 300ms var(--ease) both;
			}

			@keyframes deathline {
				from {
					opacity: 0;
					transform: translateX(-6px);
				}
			}

			.turn {
				flex: 0 0 auto;
				font-size: var(--t-lg);
				font-weight: 800;
				letter-spacing: -0.01em;
				white-space: nowrap;
			}

			/*
			 * 살아 있는 번호 명단.
			 *
			 * 전에는 이 자리에 익명의 막대가 인원수만큼 있었다. 비율은 읽혔지만
			 * "누가 남았는가"가 없었고, 그것을 아는 화면은 투표 격자뿐인데
			 * 격자는 투표 단계에만 열린다 — 정작 이야기를 나누는 낮 토론 동안
			 * 사람들은 채팅에서 "3번 죽었나?"를 되물어 확인했다.
			 *
			 * 죽은 번호를 지우지 않고 남기는 것은 투표 격자와 같은 이유다.
			 * 자리가 밀리면 어제 3번이 있던 곳에 오늘 다른 사람이 온다.
			 *
			 * 12명이면 한 줄에 다 들어가지 않아 한 층(약 20px)이 늘어난다.
			 * .stage가 flex: 1 1 auto라 그만큼을 무대에서 가져간다 — 머리말과
			 * 타이머는 밀리지 않는다.
			 */
			.roster {
				display: flex;
				gap: 3px;
				margin-left: auto;
				flex-wrap: wrap;
				justify-content: flex-end;
				min-width: 0;
			}

			.roster i {
				min-width: 16px;
				padding: 0 2px;
				font-size: var(--t-xs);
				font-style: normal;
				font-weight: 700;
				font-variant-numeric: tabular-nums;
				line-height: 1.45;
				text-align: center;
				color: var(--bg);
				background: var(--ok);
				border-radius: var(--r1);
			}

			/*
			 * 죽은 번호. 취소선까지 두는 것은 색만으로 가르면 작은 글씨에서
			 * 초록과 회색이 붙어 보이기 때문이다 — 이 줄은 화면에서 가장 작다.
			 */
			.roster i.gone {
				color: var(--ink-2);
				background: var(--surface-2);
				text-decoration: line-through;
			}

			/*
			 * 볼 수만 있는 화면 (유령 · 관전자).
			 *
			 * 지금까지 산 사람의 화면과 갈리는 것은 직업 칩 한 개와 지시문 한
			 * 줄이었다. 둘 다 작은 글씨라, 관전으로 들어온 사람은 자기 화면이
			 * 남들과 같은 줄 알고 무대를 눌러 보다 "이 게임 고장났나"를 물었다.
			 * 색을 빼고 테두리를 둘러 화면 전체가 한 번에 그 사실을 말한다.
			 *
			 * box-shadow에 var(--shadow)를 함께 적는 이유는 .panel이 이미 그
			 * 값을 쓰고 있어서다. 안쪽 테두리만 적으면 판이 배경에서 떠 보이는
			 * 그림자가 사라진다.
			 */
			.panel.watching {
				box-shadow:
					inset 0 0 0 2px var(--dead),
					var(--shadow);
			}

			.panel.watching .stage {
				filter: saturate(0.3);
			}

			/*
			 * ±15초. 타이머 오른쪽에 세로로 붙인다. 가로로 놓으면 좁은 폭에서
			 * 직업 칩이 줄어드는데, 이 화면에서 가장 자주 읽는 것이 그 칩이다.
			 *
			 * 한 낮에 한 번뿐인 버튼이라 다 쓰면 통째로 사라진다. 비활성으로
			 * 남기면 "왜 안 눌리지"를 매번 다시 확인하게 된다.
			 */
			.time-vote {
				display: flex;
				flex-direction: column;
				gap: 2px;
				flex: 0 0 auto;
			}

			.time-vote button {
				min-width: 36px;
				padding: 2px var(--s1);
				font: inherit;
				font-size: var(--t-xs);
				font-weight: 700;
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
				color: var(--ink-2);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-radius: var(--r1);
				cursor: pointer;
				transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
			}
			.time-vote button:hover {
				color: var(--ink);
				border-color: var(--accent);
			}
			.time-vote button:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}
		</style>
	</head>
	<body>
		<div class="panel" id="panel">
			<div class="idbar">
				<span class="chip" id="myrole">직업</span>
				<span class="ability" id="ability"></span>
				<span class="stat" id="alive">생존 -/-</span>
			</div>

			<div class="lead">
				<div class="lead-text">
					<div class="lead-title" id="lead">기다리세요</div>
					<div class="lead-sub" id="note" role="status" aria-live="polite"></div>
				</div>
				<div class="clock" id="timer"></div>

				<!--
					토론 시간 조절. 연장과 단축이 횟수를 공유하고, 한 낮에 딱
					한 번 누를 수 있다. 낮에 살아 있는 사람에게만 보인다 —
					밤 화면과 관전 화면은 서버가 timeVote: false로 보낸다.
				-->
				<div class="time-vote hidden" id="timevote">
					<button type="button" id="tplus" aria-label="토론 시간 15초 연장">+15</button>
					<button type="button" id="tminus" aria-label="토론 시간 15초 단축">−15</button>
				</div>
			</div>

			<div class="timeline" aria-hidden="true"><i></i></div>

			<div class="stage">
				<div class="sky-row">
					<span class="sky" id="sky" aria-hidden="true">🌙</span>
					<span class="turn" id="turn">밤</span>
					<!--
						살아 있는 번호. 옆의 stat이 "생존 4/5"를 글자로 읽어
						주므로 여기는 화면에서 빼둔다 — 스크린 리더가 번호
						열둘을 하나씩 읽으면 정작 남은 시간에 닿지 못한다.
					-->
					<span class="roster" id="roster" aria-hidden="true"></span>
				</div>
				<div class="stack hidden" id="deaths"></div>
			</div>

			<!--
				관전자에게만 보이는 나가기. 관전자는 좌석이 없어 대기실 위젯이
				없고, 이 화면이 판이 끝날 때까지 유지되므로 여기 말고는 돌아갈
				길이 없다. 참가자에게는 숨긴다 — 게임 중 이탈 버튼이 아니다.
			-->
			<div class="foot" id="spectateActions" hidden>
				<button type="button" class="btn ghost grow" id="guide">게임 방법</button>
				<button type="button" class="btn ghost grow" id="quit">관전 종료</button>
			</div>
		</div>

		<!--@shared-->
		<script>
			/**
			 * 살아 있는 번호를 그대로, 죽은 번호는 지워서 적는다.
			 *
			 * 목록이 비어 오는 경우(옛 서버·재생 오류)에는 인원수만큼 익명
			 * 칸을 그린다. 번호를 모르는 채로 비율만 남는 것이 예전 화면이라,
			 * 물러나도 지금보다 나빠지지는 않는다.
			 */
			function paintRoster(seats, alive, total) {
				const marks = [];
				if (seats.length > 0) {
					for (const seat of seats) {
						marks.push(html`<i class="${seat.alive ? "" : "gone"}">${seat.num}</i>`);
					}
				} else {
					for (let i = 0; i < total; i++) {
						marks.push(html`<i class="${i < alive ? "" : "gone"}">·</i>`);
					}
				}
				qs("#roster").innerHTML = html`${marks}`;
				qs("#alive").textContent = `생존 ${alive}/${total}`;
			}

			qs("#quit").addEventListener("click", () => {
				Parent.send({ type: "spectate-quit" });
			});
			qs("#guide").addEventListener("click", () => {
				Parent.send({ type: "guide" });
			});

			/**
			 * 시간 조절 버튼을 켜고 끈다.
			 *
			 * 누른 직후 바로 숨긴다. 서버도 timeVote: false를 담은 timer를
			 * 되보내지만 그 사이 한 번 더 누를 수 있고, 두 번째 누름은 서버가
			 * 막아 "이미 조절했습니다"만 뜬다 — 눌리는데 아무 일도 안 나는
			 * 버튼이 되면 첫 번째가 먹혔는지 알 수 없다.
			 */
			function paintTimeVote(on) {
				qs("#timevote").classList.toggle("hidden", !on);
			}

			function sendTime(delta) {
				paintTimeVote(false);
				Parent.send({ type: "time", delta });
			}

			qs("#tplus").addEventListener("click", () => sendTime(15));
			qs("#tminus").addEventListener("click", () => sendTime(-15));

			Parent.on({
				init(data) {
					const night = data.phase === "night";
					const panel = qs("#panel");
					// 관전자는 같은 위젯을 단계마다 다시 쓴다. 이전 클래스를 걷지
					// 않으면 밤에도 day와 night가 함께 남아 선언 순서에 따라 낮 배경이 이긴다.
					panel.classList.remove("night", "day");
					panel.classList.add(night ? "night" : "day");
					qs("#sky").textContent = night ? "🌙" : "🌅";
					qs("#turn").textContent = data.turn
						? data.turn + (night ? "번째 밤" : "번째 아침")
						: night
							? "밤"
							: "아침";

					// 칩 문구는 서버가 완성해서 보낸다(identityOf). 죽으면 직업이
					// 아니라 "유령"이 찍히고, 관전자는 "관전"이 찍힌다.
					// glyph와 abilityLine도 같은 곳에서 온다 — 위젯은 직업이
					// 몇 종인지도, 무슨 능력이 있는지도 알 필요가 없다
					const role = qs("#myrole");
					role.textContent = (data.glyph ? data.glyph + " " : "") + (data.role || "");
					role.classList.remove("dead", "mafia", "citizen");
					role.classList.add(
						data.alive === false ? "dead" : data.team === "mafia" ? "mafia" : "citizen"
					);
					qs("#ability").textContent = data.abilityLine || "";

					// 지시 줄. 서버가 보내지 않으면 단계 이름으로 물러난다 —
					// 빈 줄이 남는 것보다 낫다
					qs("#lead").textContent = data.lead || (night ? "기다리세요" : "토론하세요");

					qs("#spectateActions").hidden = !data.spectating;

					/*
					 * 볼 수만 있는 사람인가. 관전자와 유령을 한 상태로 묶는다 —
					 * 둘의 차이는 이 판에 좌석이 있었느냐뿐이고, 지금 할 수 있는
					 * 일은 똑같이 없다. 그 사실을 화면 전체가 말하게 한다.
					 */
					panel.classList.toggle(
						"watching",
						data.spectating === true || data.alive === false
					);

					paintRoster(
						Array.isArray(data.seats) ? data.seats : [],
						data.aliveCount,
						data.total
					);
					qs("#note").textContent = data.note || "";

					// 밤사이 죽은 사람. 예전에는 채팅으로만 흘러가 놓치기 쉬웠다.
					// 빈 목록이면 상자째 숨긴다 — 왼쪽 붉은 선만 남으면
					// "무슨 일이 있었는데 글이 안 떴나"로 읽힌다
					// 지연을 여기서 박는 이유는 줄 수에 상한이 없기 때문이다.
					// :nth-child로 적으면 열두 명짜리 방에서 뒤쪽 줄이 지연 없이
					// 한꺼번에 뜬다
					const deaths = Array.isArray(data.deaths) ? data.deaths : [];
					qs("#deaths").classList.toggle("hidden", deaths.length === 0);
					qs("#deaths").innerHTML = html`${deaths.map(
						(line, i) =>
							html`<span
								class="${line.indexOf("☠") >= 0 ? "" : "good"}"
								style="animation-delay:${i * 90}ms"
								>${line}</span
							>`
					)}`;

					paintTimeVote(data.timeVote === true);
					startTimer(qs("#timer"), data.timer);
				},

				/**
				 * 남은 시간이 바깥에서 바뀌었다.
				 *
				 * 위젯은 자기 시계를 돌리므로 평소에는 서버가 매 초 보내지
				 * 않는다. 누군가 ±15초를 눌렀을 때만 한 번 맞춘다.
				 */
				timer(data) {
					paintTimeVote(data.timeVote === true);
					startTimer(qs("#timer"), data.timer);
				},
			});
		</script>
	</body>
</html>
