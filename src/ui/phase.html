<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>진행 상황</title>
		<!--@theme-->
		<style>
			/*
			 * 밤/낮 진행 화면.
			 *
			 * 배경은 CSS 그라디언트고 글자는 흐름 배치다(.panel.night/.day).
			 * 예전처럼 <img> 위에 position:absolute로 얹지 않으므로 어떤
			 * 폭에서도 겹치지 않는다.
			 *
			 * 개정에서 바뀐 것
			 * ---------------
			 * 1. 머리말이 신분 줄(.idbar) + 지시 줄(.lead) 두 층이 됐다.
			 *    가장 큰 글씨가 "밤"이라는 상태 이름에서 "기다리세요"·"토론하세요"
			 *    라는 명령문으로 바뀐다 — 처음 하는 사람은 상태는 알아도 할 일을
			 *    몰랐다. 문구는 서버가 보낸다(PhasePayload.lead).
			 * 2. 직업 칩 옆에 능력 한 줄(abilityLine)이 상시 붙는다. 21종에서는
			 *    이름만으로 자기가 무엇을 할 수 있는지 알 수 없다.
			 * 3. 타이머가 링에서 큰 숫자 + 전체 폭 선(.timeline)으로 바뀌었다.
			 *    그리는 쪽은 shared.js의 startTimer 하나다.
			 * 4. note가 .lead-sub로 올라갔다. 이 화면에는 진행률 문구가 없어서
			 *    둘째 줄이 비어 있었고, 아래 한 줄로 두면 무대와 겹쳐 읽혔다.
			 *
			 * 세로 예산: 다섯 층 합이 203px이라 모바일 24%면 충분하다
			 * (WidgetSize.PHASE.mobile을 28 → 24로 낮추는 요청과 짝이다).
			 */
			.stage {
				display: flex;
				flex-direction: column;
				justify-content: center;
				gap: var(--s2);
				flex: 1 1 auto;
				min-height: 0;
			}

			.sky-row {
				display: flex;
				align-items: center;
				gap: var(--s2);
			}

			.sky {
				font-size: var(--t-xl);
				line-height: 1;
			}

			.turn {
				font-size: var(--t-lg);
				font-weight: 800;
				letter-spacing: -0.01em;
			}

			/* 생존/전체를 막대로도 보여준다. 숫자만 있으면 비율이 안 읽힌다 */
			.alive-bar {
				display: flex;
				gap: 3px;
				margin-left: auto;
				flex-wrap: wrap;
				justify-content: flex-end;
			}

			.alive-bar i {
				display: block;
				width: 13px;
				height: 6px;
				border-radius: 99px;
				background: var(--ok);
			}

			.alive-bar i.gone {
				background: var(--dead);
			}

			/*
			 * ±15초. 타이머 오른쪽에 세로로 붙인다. 가로로 놓으면 좁은 폭에서
			 * 직업 칩이 줄어드는데, 이 화면에서 가장 자주 읽는 것이 그 칩이다.
			 *
			 * 한 낮에 한 번뿐인 버튼이라 다 쓰면 통째로 사라진다. 비활성으로
			 * 남기면 "왜 안 눌리지"를 매번 다시 확인하게 된다.
			 */
			.time-vote {
				display: flex;
				flex-direction: column;
				gap: 2px;
				flex: 0 0 auto;
			}

			.time-vote button {
				min-width: 36px;
				padding: 2px var(--s1);
				font: inherit;
				font-size: var(--t-xs);
				font-weight: 700;
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
				color: var(--ink-2);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-radius: var(--r1);
				cursor: pointer;
				transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
			}
			.time-vote button:hover {
				color: var(--ink);
				border-color: var(--accent);
			}
			.time-vote button:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}
		</style>
	</head>
	<body>
		<div class="panel" id="panel">
			<div class="idbar">
				<span class="chip" id="myrole">직업</span>
				<span class="ability" id="ability"></span>
				<span class="stat" id="alive">생존 -/-</span>
			</div>

			<div class="lead">
				<div class="lead-text">
					<div class="lead-title" id="lead">기다리세요</div>
					<div class="lead-sub" id="note" role="status" aria-live="polite"></div>
				</div>
				<div class="clock" id="timer"></div>

				<!--
					토론 시간 조절. 연장과 단축이 횟수를 공유하고, 한 낮에 딱
					한 번 누를 수 있다. 낮에 살아 있는 사람에게만 보인다 —
					밤 화면과 관전 화면은 서버가 timeVote: false로 보낸다.
				-->
				<div class="time-vote hidden" id="timevote">
					<button type="button" id="tplus" aria-label="토론 시간 15초 연장">+15</button>
					<button type="button" id="tminus" aria-label="토론 시간 15초 단축">−15</button>
				</div>
			</div>

			<div class="timeline" aria-hidden="true"><i></i></div>

			<div class="stage">
				<div class="sky-row">
					<span class="sky" id="sky" aria-hidden="true">🌙</span>
					<span class="turn" id="turn">밤</span>
					<span class="alive-bar" id="bar" aria-hidden="true"></span>
				</div>
				<div class="stack hidden" id="deaths"></div>
			</div>

			<!--
				관전자에게만 보이는 나가기. 관전자는 좌석이 없어 대기실 위젯이
				없고, 이 화면이 판이 끝날 때까지 유지되므로 여기 말고는 돌아갈
				길이 없다. 참가자에게는 숨긴다 — 게임 중 이탈 버튼이 아니다.
			-->
			<button type="button" class="btn ghost" id="quit" hidden>관전 종료</button>
		</div>

		<!--@shared-->
		<script>
			/** 생존자를 채운 막대, 사망자를 비운 막대로 그린다 */
			function paintAlive(alive, total) {
				const pips = [];
				for (let i = 0; i < total; i++) {
					pips.push(html`<i class="${i < alive ? "" : "gone"}"></i>`);
				}
				qs("#bar").innerHTML = html`${pips}`;
				qs("#alive").textContent = `생존 ${alive}/${total}`;
			}

			qs("#quit").addEventListener("click", () => {
				Parent.send({ type: "spectate-quit" });
			});

			/**
			 * 시간 조절 버튼을 켜고 끈다.
			 *
			 * 누른 직후 바로 숨긴다. 서버도 timeVote: false를 담은 timer를
			 * 되보내지만 그 사이 한 번 더 누를 수 있고, 두 번째 누름은 서버가
			 * 막아 "이미 조절했습니다"만 뜬다 — 눌리는데 아무 일도 안 나는
			 * 버튼이 되면 첫 번째가 먹혔는지 알 수 없다.
			 */
			function paintTimeVote(on) {
				qs("#timevote").classList.toggle("hidden", !on);
			}

			function sendTime(delta) {
				paintTimeVote(false);
				Parent.send({ type: "time", delta });
			}

			qs("#tplus").addEventListener("click", () => sendTime(15));
			qs("#tminus").addEventListener("click", () => sendTime(-15));

			Parent.on({
				init(data) {
					const night = data.phase === "night";
					qs("#panel").classList.add(night ? "night" : "day");
					qs("#sky").textContent = night ? "🌙" : "🌅";
					qs("#turn").textContent = data.turn
						? data.turn + (night ? "번째 밤" : "번째 아침")
						: night
							? "밤"
							: "아침";

					// 칩 문구는 서버가 완성해서 보낸다(identityOf). 죽으면 직업이
					// 아니라 "유령"이 찍히고, 관전자는 "관전"이 찍힌다.
					// glyph와 abilityLine도 같은 곳에서 온다 — 위젯은 직업이
					// 몇 종인지도, 무슨 능력이 있는지도 알 필요가 없다
					const role = qs("#myrole");
					role.textContent = (data.glyph ? data.glyph + " " : "") + (data.role || "");
					role.classList.add(
						data.alive === false ? "dead" : data.team === "mafia" ? "mafia" : "citizen"
					);
					qs("#ability").textContent = data.abilityLine || "";

					// 지시 줄. 서버가 보내지 않으면 단계 이름으로 물러난다 —
					// 빈 줄이 남는 것보다 낫다
					qs("#lead").textContent = data.lead || (night ? "기다리세요" : "토론하세요");

					qs("#quit").hidden = !data.spectating;

					paintAlive(data.aliveCount, data.total);
					qs("#note").textContent = data.note || "";

					// 밤사이 죽은 사람. 예전에는 채팅으로만 흘러가 놓치기 쉬웠다.
					// 빈 목록이면 상자째 숨긴다 — 왼쪽 붉은 선만 남으면
					// "무슨 일이 있었는데 글이 안 떴나"로 읽힌다
					const deaths = Array.isArray(data.deaths) ? data.deaths : [];
					qs("#deaths").classList.toggle("hidden", deaths.length === 0);
					qs("#deaths").innerHTML = html`${deaths.map(
						line => html`<span class="${line.indexOf("☠") >= 0 ? "" : "good"}">${line}</span>`
					)}`;

					paintTimeVote(data.timeVote === true);
					startTimer(qs("#timer"), data.timer);
				},

				/**
				 * 남은 시간이 바깥에서 바뀌었다.
				 *
				 * 위젯은 자기 시계를 돌리므로 평소에는 서버가 매 초 보내지
				 * 않는다. 누군가 ±15초를 눌렀을 때만 한 번 맞춘다.
				 */
				timer(data) {
					paintTimeVote(data.timeVote === true);
					startTimer(qs("#timer"), data.timer);
				},
			});
		</script>
	</body>
</html>
