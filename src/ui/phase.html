<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>진행 상황</title>
		<!--@theme-->
		<style>
			/*
			 * 밤/낮 진행 화면.
			 *
			 * 기존에는 night.html과 morning.html 두 파일이었는데, 배경 이미지
			 * URL과 타이머 색 되돌림 값(#fff vs #484848)만 달랐다. 둘 다
			 * <img>를 깔고 그 위에 position:absolute로 글자를 얹었다.
			 * 이미지는 width:100%로 늘어나는데 글자 오프셋은 px 고정이라,
			 * 위젯 폭이 조금만 달라지면 "총인원 8명, 생존 6명"이 그림 밖으로
			 * 밀려났다. 모바일에서 특히 그랬다.
			 *
			 * 이제 배경은 CSS 그라디언트고 글자는 흐름 배치다. 어떤 폭에서도
			 * 겹치지 않는다.
			 *
			 * 그리고 여기에 "내 직업"을 상시 노출한다. 예전에는 직업 카드가
			 * 5초 뜨고 사라진 뒤로 자기 직업을 다시 확인할 방법이 없었다.
			 * 초보자가 가장 많이 헤매던 지점이다.
			 */
			.stage {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: var(--s2);
				flex: 1 1 auto;
				min-height: 0;
				text-align: center;
			}

			.sky {
				font-size: var(--t-2xl);
				line-height: 1;
			}

			.turn {
				font-size: var(--t-xl);
				font-weight: 800;
				letter-spacing: -0.02em;
			}

			/* 생존/전체를 막대로도 보여준다. 숫자만 있으면 비율이 안 읽힌다 */
			.alive-bar {
				display: flex;
				gap: 3px;
				justify-content: center;
				flex-wrap: wrap;
			}

			.alive-bar i {
				width: 14px;
				height: 6px;
				border-radius: 99px;
				background: var(--ok);
			}

			.alive-bar i.gone {
				background: var(--dead);
			}

			.deaths {
				display: flex;
				flex-direction: column;
				gap: 2px;
				font-size: var(--t-sm);
				color: var(--mafia);
			}
		</style>
	</head>
	<body>
		<div class="panel" id="panel">
			<div class="hd">
				<div class="hd-title grow">
					<span class="chip" id="myrole">직업</span>
					<span class="hd-sub" id="alive">생존 -/-</span>
				</div>
				<div class="timer" id="timer"></div>
			</div>

			<div class="stage">
				<div class="sky" id="sky" aria-hidden="true">🌙</div>
				<div class="turn" id="turn">밤</div>
				<div class="alive-bar" id="bar" aria-hidden="true"></div>
				<div class="deaths" id="deaths"></div>
			</div>

			<p class="note" id="note" role="status" aria-live="polite"></p>

			<!--
				관전자에게만 보이는 나가기. 관전자는 좌석이 없어 대기실 위젯이
				없고, 이 화면이 판이 끝날 때까지 유지되므로 여기 말고는 돌아갈
				길이 없다. 참가자에게는 숨긴다 — 게임 중 이탈 버튼이 아니다.
			-->
			<button type="button" class="btn ghost" id="quit" hidden>관전 종료</button>
		</div>

		<!--@shared-->
		<script>
			/** 생존자를 채운 막대, 사망자를 비운 막대로 그린다 */
			function paintAlive(alive, total) {
				const pips = [];
				for (let i = 0; i < total; i++) {
					pips.push(html`<i class="${i < alive ? "" : "gone"}"></i>`);
				}
				qs("#bar").innerHTML = html`${pips}`;
				qs("#alive").textContent = `생존 ${alive}/${total}`;
			}

			qs("#quit").addEventListener("click", () => {
				Parent.send({ type: "spectate-quit" });
			});

			Parent.on({
				init(data) {
					const night = data.phase === "night";
					qs("#panel").classList.add(night ? "night" : "day");
					qs("#sky").textContent = night ? "🌙" : "🌅";
					qs("#turn").textContent = data.turn
						? data.turn + (night ? "번째 밤" : "번째 아침")
						: night
							? "밤"
							: "아침";

					// 칩 문구는 서버가 완성해서 보낸다. 전에는 "죽으면 유령"이라는
					// 규칙이 여기에만 있어서, 같은 칩을 쓰는 roleAction 위젯은 그
					// 규칙을 몰랐다. 이제 "유령"도 "관전"도 서버가 골라 보낸다.
					const role = qs("#myrole");
					role.textContent = data.role || "";
					role.classList.add(
						data.alive === false ? "dead" : data.team === "mafia" ? "mafia" : "citizen"
					);

					qs("#quit").hidden = !data.spectating;

					paintAlive(data.aliveCount, data.total);
					qs("#note").textContent = data.note || "";

					// 밤사이 죽은 사람. 예전에는 채팅으로만 흘러가 놓치기 쉬웠다
					const deaths = Array.isArray(data.deaths) ? data.deaths : [];
					qs("#deaths").innerHTML = html`${deaths.map(line => html`<span>${line}</span>`)}`;

					startTimer(qs("#timer"), data.timer);
				},
			});
		</script>
	</body>
</html>
