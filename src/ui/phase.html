<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>진행 상황</title>
		<!--@theme-->
		<style>
			/*
			 * 밤/낮 진행 화면.
			 *
			 * 기존에는 night.html과 morning.html 두 파일이었는데, 배경 이미지
			 * URL과 타이머 색 되돌림 값(#fff vs #484848)만 달랐다. 둘 다
			 * <img>를 깔고 그 위에 position:absolute로 글자를 얹었다.
			 * 이미지는 width:100%로 늘어나는데 글자 오프셋은 px 고정이라,
			 * 위젯 폭이 조금만 달라지면 "총인원 8명, 생존 6명"이 그림 밖으로
			 * 밀려났다. 모바일에서 특히 그랬다.
			 *
			 * 이제 배경은 CSS 그라디언트고 글자는 흐름 배치다. 어떤 폭에서도
			 * 겹치지 않는다.
			 *
			 * 그리고 여기에 "내 직업"을 상시 노출한다. 예전에는 직업 카드가
			 * 5초 뜨고 사라진 뒤로 자기 직업을 다시 확인할 방법이 없었다.
			 * 초보자가 가장 많이 헤매던 지점이다.
			 */
			.stage {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: var(--s2);
				flex: 1 1 auto;
				min-height: 0;
				text-align: center;
			}

			.sky {
				font-size: var(--t-2xl);
				line-height: 1;
			}

			.turn {
				font-size: var(--t-xl);
				font-weight: 800;
				letter-spacing: -0.02em;
			}

			/* 생존/전체를 막대로도 보여준다. 숫자만 있으면 비율이 안 읽힌다 */
			.alive-bar {
				display: flex;
				gap: 3px;
				justify-content: center;
				flex-wrap: wrap;
			}

			.alive-bar i {
				width: 14px;
				height: 6px;
				border-radius: 99px;
				background: var(--ok);
			}

			.alive-bar i.gone {
				background: var(--dead);
			}

			.deaths {
				display: flex;
				flex-direction: column;
				gap: 2px;
				font-size: var(--t-sm);
				color: var(--mafia);
			}

			/*
			 * ±15초. 타이머 오른쪽에 세로로 붙인다.
			 *
			 * 가로로 놓으면 머리말이 [직업칩][생존][타이머][−][+]가 되어
			 * 좁은 폭에서 직업 칩이 줄어든다 — 이 화면에서 가장 자주 읽는
			 * 것이 직업 칩이다. 세로로 쌓으면 폭은 34px 하나만 더 든다.
			 *
			 * 한 낮에 한 번뿐인 버튼이라 다 쓰면 통째로 사라진다. 비활성으로
			 * 남기면 "왜 안 눌리지"를 매번 다시 확인하게 된다.
			 */
			.time-vote {
				display: flex;
				flex-direction: column;
				gap: 2px;
				flex: 0 0 auto;
			}

			.time-vote button {
				min-width: 34px;
				padding: 1px var(--s1);
				font: inherit;
				font-size: var(--t-xs);
				font-weight: 700;
				font-variant-numeric: tabular-nums;
				color: var(--ink-2);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-radius: var(--r1);
				cursor: pointer;
				transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
			}
			.time-vote button:hover {
				color: var(--ink);
				border-color: var(--accent);
			}
			.time-vote button:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}
		</style>
	</head>
	<body>
		<div class="panel" id="panel">
			<div class="hd">
				<div class="hd-title grow">
					<span class="chip" id="myrole">직업</span>
					<span class="hd-sub" id="alive">생존 -/-</span>
				</div>
				<div class="timer" id="timer"></div>

				<!--
					토론 시간 조절. 마피아42와 같은 규칙이다 — 연장과 단축이
					횟수를 공유하고, 한 낮에 딱 한 번 누를 수 있다.

					낮에 살아 있는 사람에게만 보인다. 밤 화면과 관전 화면은
					서버가 timeVote: false로 보내므로 이 묶음이 뜨지 않는다.
				-->
				<div class="time-vote hidden" id="timevote">
					<button type="button" id="tplus" aria-label="토론 시간 15초 연장">+15</button>
					<button type="button" id="tminus" aria-label="토론 시간 15초 단축">−15</button>
				</div>
			</div>

			<div class="stage">
				<div class="sky" id="sky" aria-hidden="true">🌙</div>
				<div class="turn" id="turn">밤</div>
				<div class="alive-bar" id="bar" aria-hidden="true"></div>
				<div class="deaths" id="deaths"></div>
			</div>

			<p class="note" id="note" role="status" aria-live="polite"></p>

			<!--
				관전자에게만 보이는 나가기. 관전자는 좌석이 없어 대기실 위젯이
				없고, 이 화면이 판이 끝날 때까지 유지되므로 여기 말고는 돌아갈
				길이 없다. 참가자에게는 숨긴다 — 게임 중 이탈 버튼이 아니다.
			-->
			<button type="button" class="btn ghost" id="quit" hidden>관전 종료</button>
		</div>

		<!--@shared-->
		<script>
			/** 생존자를 채운 막대, 사망자를 비운 막대로 그린다 */
			function paintAlive(alive, total) {
				const pips = [];
				for (let i = 0; i < total; i++) {
					pips.push(html`<i class="${i < alive ? "" : "gone"}"></i>`);
				}
				qs("#bar").innerHTML = html`${pips}`;
				qs("#alive").textContent = `생존 ${alive}/${total}`;
			}

			qs("#quit").addEventListener("click", () => {
				Parent.send({ type: "spectate-quit" });
			});

			/**
			 * 시간 조절 버튼을 켜고 끈다.
			 *
			 * 누른 직후 바로 숨긴다. 서버도 timeVote: false를 담은 timer를
			 * 되보내지만 그 사이 한 번 더 누를 수 있고, 두 번째 누름은 서버가
			 * 막아 "이미 조절했습니다"만 뜬다 — 눌리는데 아무 일도 안 나는
			 * 버튼이 되면 첫 번째가 먹혔는지 알 수 없다.
			 */
			function paintTimeVote(on) {
				qs("#timevote").classList.toggle("hidden", !on);
			}

			function sendTime(delta) {
				paintTimeVote(false);
				Parent.send({ type: "time", delta });
			}

			qs("#tplus").addEventListener("click", () => sendTime(15));
			qs("#tminus").addEventListener("click", () => sendTime(-15));

			Parent.on({
				init(data) {
					const night = data.phase === "night";
					qs("#panel").classList.add(night ? "night" : "day");
					qs("#sky").textContent = night ? "🌙" : "🌅";
					qs("#turn").textContent = data.turn
						? data.turn + (night ? "번째 밤" : "번째 아침")
						: night
							? "밤"
							: "아침";

					// 칩 문구는 서버가 완성해서 보낸다. 전에는 "죽으면 유령"이라는
					// 규칙이 여기에만 있어서, 같은 칩을 쓰는 roleAction 위젯은 그
					// 규칙을 몰랐다. 이제 "유령"도 "관전"도 서버가 골라 보낸다.
					const role = qs("#myrole");
					role.textContent = data.role || "";
					role.classList.add(
						data.alive === false ? "dead" : data.team === "mafia" ? "mafia" : "citizen"
					);

					qs("#quit").hidden = !data.spectating;

					paintAlive(data.aliveCount, data.total);
					qs("#note").textContent = data.note || "";

					// 밤사이 죽은 사람. 예전에는 채팅으로만 흘러가 놓치기 쉬웠다
					const deaths = Array.isArray(data.deaths) ? data.deaths : [];
					qs("#deaths").innerHTML = html`${deaths.map(line => html`<span>${line}</span>`)}`;

					paintTimeVote(data.timeVote === true);
					startTimer(qs("#timer"), data.timer);
				},

				/**
				 * 남은 시간이 바깥에서 바뀌었다.
				 *
				 * 위젯은 자기 시계를 돌리므로 평소에는 서버가 매 초 보내지
				 * 않는다. 누군가 ±15초를 눌렀을 때만 한 번 맞춘다.
				 */
				timer(data) {
					paintTimeVote(data.timeVote === true);
					startTimer(qs("#timer"), data.timer);
				},
			});
		</script>
	</body>
</html>
