<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>밤 행동</title>
		<!--@theme-->
		<style>
			/*
			 * 밤에 누구를 지목할 것인가. 그것 하나만 한다.
			 *
			 * 기존 roleAction.html의 문제 셋:
			 *
			 * 1. 직업별 문구를 한국어 문자열 switch로 골랐다.
			 *      switch (_myRole) { case "영매": ... case "경찰": ... }
			 *    직업을 추가하면 서버뿐 아니라 이 파일도 고쳐야 했고,
			 *    직업 이름을 바꾸면 조용히 기본 분기로 떨어졌다.
			 *    이제 무엇을 하라는 문구는 서버가 보낸다.
			 *
			 * 2. 밤 채팅이 이 화면에 얹혀 있었다. 그래서 채팅은 밤에만,
			 *    그것도 이 위젯이 열린 사람에게만 존재했고 위젯이 닫히는 순간
			 *    대화가 통째로 사라졌다. 자동 스크롤은 붙이기 *전에* 높이를 재고
			 *    붙인 *뒤에* 그 값으로 내려서 늘 한 줄씩 어긋나 있었다.
			 *    채팅은 chat.html로 독립했고 이 파일에서 그 코드는 전부 사라졌다.
			 *
			 * 3. 아이콘 6종을 base64로 품어 132KB였다. 그중 일부는 그려지지도
			 *    않는 자리에 있었다.
			 */

			/* 지목이 전부이므로 격자가 화면을 다 쓴다 */
			.body .grid {
				align-content: center;
			}

			.ability-art {
				--ability-border: clamp(10px, 3vh, 18px);
				position: relative;
				isolation: isolate;
				display: grid;
				place-items: center;
				flex: 0 0 auto;
				height: clamp(64px, 23vh, 132px);
				width: auto;
				max-width: 100%;
				aspect-ratio: 4 / 3;
				margin: 0 auto;
				padding: var(--ability-border);
				background: linear-gradient(160deg, rgba(20, 16, 15, 0.74), rgba(20, 16, 15, 0.9));
			}

			.ability-art::before {
				content: "";
				position: absolute;
				inset: 0;
				z-index: -1;
				border: var(--ability-border) solid transparent;
				border-image-source: url("art_ui_ability_frame.png");
				border-image-slice: 52 59 47 59 fill;
				border-image-width: var(--ability-border);
				border-image-repeat: stretch;
				pointer-events: none;
			}

			.ability-art img {
				width: 100%;
				aspect-ratio: 16 / 9;
				object-fit: contain;
				border-radius: var(--r2);
			}

			/*
			 * 지목이 확정된 순간.
			 *
			 * 테두리 색만 바뀌면 "눌리긴 한 건가"가 남는다 — 서버 왕복이 끼어
			 * 있어서 누른 시점과 표시가 바뀌는 시점이 붙어 있지 않기 때문이다.
			 * 한 번 튀어 오르면 그 사이가 메워진다.
			 */
			.tile.picked {
				animation: confirm 320ms var(--ease);
			}

			@keyframes confirm {
				40% {
					transform: scale(1.06);
				}
			}

			/* 고르고 난 격자. 고른 타일만 남기고 나머지는 물러난다 */
			.grid.locked .tile:not(.picked) {
				opacity: 0.45;
				filter: grayscale(1);
			}
		</style>
	</head>
	<body>
		<div class="panel night">
			<div class="hd">
				<div class="hd-title grow">
					<span class="chip" id="myrole">직업</span>
					<span class="hd-sub ellip" id="prompt"></span>
				</div>
				<span class="chip" id="tally"></span>
				<div class="timer" id="timer"></div>
			</div>

			<div class="progress" aria-hidden="true"><i id="progress"></i></div>
			<div class="ability-art" id="abilityStage"><img id="abilityArt" alt="" /></div>

			<div class="body" id="body">
				<div class="grid scroll" id="grid" role="group" aria-label="지목 대상"></div>
			</div>

			<p class="note" id="note" role="status" aria-live="polite"></p>
		</div>

		<!--@shared-->
		<script>
			let myNum = 0;
			let picked = null;
			let canPick = false;

			function tile(seat) {
				const mine = seat.num === myNum;
				const caption = mine ? "나" : seat.alive ? seat.name || "" : "사망";
				const classes =
					"tile" + (mine ? " me" : "") + (seat.alive ? "" : " dead") + (seat.ally ? " ally" : "");
				// 마피아 팀원은 직업까지 보인다. 배지로 색 외의 표시도 남긴다
				const badge = seat.ally && !mine ? html`<span class="badge">🔻</span>` : "";

				return html`<button
					type="button"
					class="${classes}"
					data-num="${seat.num}"
					${flag(!seat.alive, "disabled")}
					aria-label="${seat.num}번 ${seat.name || ""}"
				>
					${badge}<span class="num">${seat.num}</span><span class="cap ellip">${caption}</span>
				</button>`;
			}

			qs("#grid").addEventListener("click", event => {
				const el = event.target.closest(".tile");
				if (!el || el.disabled || !canPick) return;
				Parent.send({ type: "select", num: Number(el.dataset.num) });
			});

			Parent.on({
				init(data) {
					myNum = Number(data.myNum) || 0;
					picked = null;

					const role = qs("#myrole");
					role.textContent = data.role || "";
					role.classList.add(data.team === "mafia" ? "mafia" : "citizen");
					qs("#prompt").textContent = data.prompt || "";
					const art = qs("#abilityArt");
					art.src = data.art || "";
					qs("#abilityStage").classList.toggle("hidden", !data.art);

					const seats = Array.isArray(data.seats) ? data.seats : [];
					canPick = seats.length > 0;
					qs("#grid").innerHTML = html`${seats.map(tile)}`;
					qs("#grid").classList.toggle("hidden", !canPick);
					qs("#grid").classList.remove("locked");

					qs("#note").textContent = data.note || "";
					if (data.timer) startTimer(qs("#timer"), data.timer);
				},

				/*
				 * 몇 명이 지목을 마쳤는가. 인원수만 싣는다 — 누가 무엇을 골랐는지가
				 * 한 글자라도 새면 밤이 밤이 아니게 된다.
				 *
				 * 낮의 개표 진행률과 같은 값을 하는데 밤에 더 급하다. 낮에는 채팅이
				 * 돌아서 아직 안 한 사람이 티가 나지만, 밤에는 아무 신호가 없어
				 * 전원이 끝난 뒤에도 남은 시간을 끝까지 앉아서 기다렸다.
				 */
				progress(data) {
					const done = Number(data.acted) || 0;
					const total = Number(data.total) || 0;
					qs("#progress").style.width = (total > 0 ? (done / total) * 100 : 0) + "%";
					const tally = qs("#tally");
					tally.textContent = total > 0 ? `${done}/${total}` : "";
					tally.setAttribute("aria-label", `${total}명 중 ${done}명 지목 완료`);
				},

				// 서버가 지목을 받아들였을 때만 표시가 바뀐다. 기존에는 누른 즉시
				// 빨간 테두리를 그려서, 서버가 거절해도 화면은 선택된 것처럼 보였다
				selectResponse(data) {
					picked = Number(data.num);
					canPick = false;
					for (const el of qsa(".tile")) {
						const isPick = Number(el.dataset.num) === picked;
						el.classList.toggle("picked", isPick);
						if (!isPick) el.disabled = true;
					}
					// 격자 전체를 물린다. 비활성 타일만으로는 "내 차례가 끝났다"가
					// 아니라 "왜 안 눌리지"로 읽힌다
					qs("#grid").classList.add("locked");
					qs("#note").textContent = `✔ ${picked}번을 지목했습니다.`;
				},
			});
		</script>
	</body>
</html>
