<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>밤 행동</title>
		<!--@theme-->
		<style>
			/*
			 * 밤에 누구를 지목할 것인가. 그것 하나만 한다.
			 *
			 * 무엇을 하라는 문구는 서버가 보낸다(prompt). 직업 이름을 switch하지
			 * 않으므로 직업이 21종이든 24종이든 이 파일은 그대로다.
			 *
			 * 개정에서 바뀐 것
			 * ---------------
			 * 1. 머리말이 신분 줄 + 지시 줄 두 층이 됐다. prompt가 이제 hd-sub
			 *    (12px 흐린 글씨)가 아니라 화면에서 가장 큰 글씨다 — 이 화면에서
			 *    사람이 읽어야 하는 단 한 줄이 그것이기 때문이다.
			 * 2. 직업 칩 옆에 능력 한 줄(abilityLine)이 붙는다.
			 * 3. 진행률(acted/total)이 지시 줄 둘째 줄로 올라간다. 4px 막대는
			 *    남고, 글자는 "몇 명 남았는가"까지 말한다 — 밤에는 서로 무엇을
			 *    하는지 보이지 않아 이 값이 낮보다 급하다.
			 * 4. 동료 타일의 캡션은 다른 타일과 똑같이 이름이다. SeatView에
			 *    직업이 없고, 넣으면 그 한 필드가 밤의 비밀을 통째로 옮긴다.
			 *    같은 편이라는 사실은 🔻 배지와 적색 테두리가 말한다.
			 */

			/*
			 * 지목이 확정된 순간.
			 *
			 * 테두리 색만 바뀌면 "눌리긴 한 건가"가 남는다 — 서버 왕복이 끼어
			 * 있어서 누른 시점과 표시가 바뀌는 시점이 붙어 있지 않기 때문이다.
			 * 한 번 튀어 오르면 그 사이가 메워진다.
			 */
			.tile.picked {
				animation: confirm 320ms var(--ease);
			}

			@keyframes confirm {
				40% {
					transform: scale(1.06);
				}
			}

			/* 고르고 난 격자. 고른 타일만 남기고 나머지는 물러난다 */
			.grid.locked .tile:not(.picked) {
				opacity: 0.45;
				filter: grayscale(1);
			}

			/*
			 * 문구 고르기. 격자와 자리를 바꿔서 뜬다.
			 *
			 * 채팅창의 .quick과 같은 일을 하지만 가로 스크롤을 쓰지 않는다 —
			 * 여섯 문장이 한 줄로 늘어서면 뒤쪽 셋은 있는 줄도 모른다.
			 */
			.choices {
				display: flex;
				flex-direction: column;
				justify-content: center;
				gap: var(--s1);
				overflow-y: auto;
			}

			.choices button {
				padding: var(--s2) var(--s3);
				font: inherit;
				font-size: var(--t-sm);
				text-align: left;
				color: var(--ink);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-radius: var(--r2);
				cursor: pointer;
			}

			.choices button:hover {
				background: var(--surface-3);
			}

			.choices button:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}
		</style>
	</head>
	<body>
		<div class="panel night">
			<div class="idbar">
				<span class="chip" id="myrole">직업</span>
				<span class="ability" id="ability"></span>
				<span class="stat" id="tally"></span>
			</div>

			<div class="lead">
				<div class="lead-text">
					<div class="lead-title" id="prompt"></div>
					<div class="lead-sub count" id="progresstext"></div>
				</div>
				<div class="clock" id="timer"></div>
			</div>

			<div class="timeline" aria-hidden="true"><i></i></div>
			<div class="progress" aria-hidden="true"><i id="progress"></i></div>

			<div class="body" id="body">
				<div class="grid scroll" id="grid" role="group" aria-label="지목 대상"></div>
				<div class="choices hidden" id="choices" role="group" aria-label="보낼 문구"></div>
			</div>

			<p class="note" id="note" role="status" aria-live="polite"></p>
		</div>

		<!--@shared-->
		<script>
			let myNum = 0;
			let picked = null;
			let canPick = false;
			// 내 칸을 잠그는가. 건달처럼 자기 지목이 확정된 헛턴인 직업만 참이다
			let noSelf = false;
			// 무덤을 고르는 직업인가 (영매·성직자). 참이면 산 칸과 죽은 칸의
			// 역할이 통째로 뒤바뀐다
			let targetsDead = false;

			/**
			 * 이 화면에서 고를 수 있는 칸인가.
			 *
			 * 죽었다는 것과 못 고른다는 것이 늘 같은 말이 아니다 — 무덤을 고르는
			 * 직업에게는 정확히 반대다. 잠금과 회색 처리가 둘 다 이 함수를 보므로
			 * "보이기는 고를 수 있게 보이는데 눌리지 않는" 칸이 생기지 않는다
			 */
			function pickable(seat) {
				return targetsDead ? !seat.alive : seat.alive;
			}

			function tile(seat) {
				const mine = seat.num === myNum;
				const caption = mine ? "나" : seat.alive ? seat.name || "" : "사망";
				// dead 클래스는 여기서 "죽었다"가 아니라 "이 화면에서 못 고른다"는
				// 뜻으로 쓴다. theme.css가 :disabled와 같은 회색을 주므로 무덤
				// 화면에서는 산 사람 칸이 그 회색을 받는다
				const classes =
					"tile" +
					(mine ? " me" : "") +
					(pickable(seat) ? "" : " dead") +
					(seat.ally ? " ally" : "");
				// 마피아 팀원은 배지로 알린다. 캡션은 다른 칸과 똑같이 이름이다 —
				// 직업을 찍으려면 SeatView에 없는 필드가 필요하고, 그 필드는
				// 밤에 알아야 할 것보다 훨씬 많은 것을 옮긴다
				const badge = seat.ally && !mine ? html`<span class="badge">🔻</span>` : "";

				return html`<button
					type="button"
					class="${classes}"
					data-num="${seat.num}"
					${flag(!pickable(seat) || (mine && noSelf), "disabled")}
					aria-label="${seat.num}번 ${seat.name || ""}${seat.ally ? " (같은 편)" : ""}"
				>
					${badge}<span class="num">${seat.num}</span><span class="cap">${caption}</span>
				</button>`;
			}

			qs("#grid").addEventListener("click", event => {
				const el = event.target.closest(".tile");
				if (!el || el.disabled || !canPick) return;
				Parent.send({ type: "select", num: Number(el.dataset.num) });
			});

			// 대상은 보내지 않는다. 서버가 이미 갖고 있고, 위젯이 다시 보내면
			// 조작된 메시지 하나가 문구와 대상을 함께 정할 수 있게 된다
			qs("#choices").addEventListener("click", event => {
				const el = event.target.closest("button");
				if (!el) return;
				Parent.send({ type: "phrase", index: Number(el.dataset.index) });
			});

			Parent.on({
				init(data) {
					myNum = Number(data.myNum) || 0;
					picked = null;
					// 격자를 그리기 전에 정해야 한다. tile()이 이 두 값을 읽는다
					noSelf = !!data.noSelf;
					targetsDead = !!data.targetsDead;

					const role = qs("#myrole");
					role.textContent = (data.glyph ? data.glyph + " " : "") + (data.role || "");
					role.classList.add(data.team === "mafia" ? "mafia" : "citizen");
					qs("#ability").textContent = data.abilityLine || "";
					qs("#prompt").textContent = data.prompt || "";

					const seats = Array.isArray(data.seats) ? data.seats : [];
					canPick = seats.length > 0;
					qs("#grid").innerHTML = html`${seats.map(tile)}`;
					qs("#grid").classList.toggle("hidden", !canPick);
					qs("#grid").classList.remove("locked");

					qs("#note").textContent = data.note || "";
					// 밤마다 위젯을 새로 열지만 열린 채로 init이 다시 오는 길이
					// 있다(재접속·화면 복구). 지난밤의 문구 목록이 남으면 격자
					// 대신 그것이 뜬 채로 밤이 시작된다
					qs("#choices").classList.add("hidden");
					qs("#choices").innerHTML = "";
					if (data.timer) startTimer(qs("#timer"), data.timer);
				},

				/*
				 * 몇 명이 지목을 마쳤는가. 인원수만 싣는다 — 누가 무엇을 골랐는지가
				 * 한 글자라도 새면 밤이 밤이 아니게 된다.
				 *
				 * 낮의 개표 진행률과 같은 값을 하는데 밤에 더 급하다. 낮에는 채팅이
				 * 돌아서 아직 안 한 사람이 티가 나지만, 밤에는 아무 신호가 없어
				 * 전원이 끝난 뒤에도 남은 시간을 끝까지 앉아서 기다렸다.
				 */
				progress(data) {
					const done = Number(data.acted) || 0;
					const total = Number(data.total) || 0;
					qs("#progress").style.width = (total > 0 ? (done / total) * 100 : 0) + "%";
					const tally = qs("#tally");
					tally.textContent = total > 0 ? `${done}/${total}` : "";
					tally.setAttribute("aria-label", `${total}명 중 ${done}명 지목 완료`);
					// 막대와 분수만으로는 "몇 명을 더 기다리는가"가 안 읽힌다.
					// 남은 수를 글자로 적으면 기다릴지 말지를 바로 정할 수 있다
					const leftCount = total - done;
					qs("#progresstext").textContent =
						total > 0
							? leftCount > 0
								? `${done}/${total} 지목 완료 · ${leftCount}명 남음`
								: `${total}명 모두 지목했습니다`
							: "";
				},

				/*
				 * 지목만으로 끝나지 않는 능력의 두 번째 화면 (시민의 쪽지).
				 *
				 * 문구 목록을 위젯이 갖고 있지 않은 이유는 나머지 전부와 같다 —
				 * 문구는 기획이 가장 자주 손대는 것이고, 여기 두면 문구 한 줄을
				 * 고치는 일이 위젯 빌드를 다시 돌리는 일이 된다.
				 */
				phrases(data) {
					const options = Array.isArray(data.options) ? data.options : [];
					qs("#grid").classList.add("hidden");
					qs("#choices").classList.remove("hidden");
					qs("#choices").innerHTML = html`${options.map(
						(text, i) => html`<button type="button" data-index="${i}">${text}</button>`
					)}`;
					// 이 화면에서는 지시 줄이 그 문장을 받는다. 아래 note에 두면
					// 화면에서 가장 큰 글씨가 지난 단계의 지목 안내로 남는다
					const num = Number(data.num) || 0;
					qs("#prompt").textContent = `${num}번에게 보낼 문구를 고르세요.`;
					qs("#note").textContent = "";
				},

				// 서버가 지목을 받아들였을 때만 표시가 바뀐다. 기존에는 누른 즉시
				// 빨간 테두리를 그려서, 서버가 거절해도 화면은 선택된 것처럼 보였다
				selectResponse(data) {
					picked = Number(data.num);
					canPick = false;
					for (const el of qsa(".tile")) {
						const isPick = Number(el.dataset.num) === picked;
						el.classList.toggle("picked", isPick);
						if (!isPick) el.disabled = true;
					}
					// 격자 전체를 물린다. 비활성 타일만으로는 "내 차례가 끝났다"가
					// 아니라 "왜 안 눌리지"로 읽힌다
					qs("#grid").classList.add("locked");
					// 문구를 고르고 온 경우다. 목록을 치우고 격자를 되돌려 놓아야
					// 누구를 골랐는지가 화면에 남는다
					qs("#choices").classList.add("hidden");
					qs("#grid").classList.remove("hidden");
					qs("#note").textContent = `✔ ${picked}번을 지목했습니다.`;
					// 할 일이 끝났다는 것을 가장 큰 글씨가 말해야 한다. 지목
					// 안내가 그대로 남아 있으면 아직 눌러야 하는 것처럼 보인다
					qs("#prompt").textContent = "지목했습니다 — 기다리세요";
				},
			});
		</script>
	</body>
</html>
