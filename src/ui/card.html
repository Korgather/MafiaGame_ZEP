<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>카드</title>
		<!--@theme-->
		<style>
			/*
			 * 카드 위젯 — 직업 공개 · 첫 안내 · 직업 도감이 한 파일에 산다.
			 *
			 * 셋의 화면은 같다 — 글리프 하나, 제목 한 줄, 설명 한 문단,
			 * 덧붙임 한 문단. 다른 것은 "몇 장인가"와 "장을 어떻게 넘기는가"뿐이다.
			 *   none  — 한 장. 넘길 것이 없다 (직업 공개)
			 *   steps — 앞으로만 넘긴다. 점으로 어디쯤인지 (첫 안내)
			 *   grid  — 목록에서 골라 들어가고 목록으로 돌아온다 (직업 도감)
			 *
			 * 개정에서 가장 크게 바뀐 것: 도감 목록이 정사각 격자에서
			 * 한 줄에 한 직업인 목록이 됐다.
			 *
			 * 정사각 타일은 글리프와 이름 두 조각만 담는다. 직업이 21종이 되면
			 * "무슨 능력인가"가 빠진 채 21개의 네모가 늘어서고, 그중 하나를
			 * 고르려면 전부 한 번씩 열어봐야 한다. 한 줄에 글리프·이름·능력
			 * 한 줄을 함께 두면 목록에서 훑고 필요한 것만 연다. 24종이 되어도
			 * 줄만 늘어난다.
			 *
			 * 능력 한 줄은 CardView.summary다(RoleDef.summary). ability를 위젯이
			 * 자르지 않는 이유는 길이가 제각각이기 때문이다 — 군인의 ability는
			 * 46자라 어디서 잘라도 문장 중간이다.
			 */

			/* ---------- 카드 한 장 ---------- */
			.card {
				position: relative;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: var(--s3);
				flex: 1 1 auto;
				min-height: 0;
				padding: var(--s4);
				text-align: center;
				border-radius: var(--r3);
				border: 2px solid var(--line);
				background: radial-gradient(120% 80% at 50% 0%, var(--surface-2), var(--bg));
				animation: reveal 420ms var(--ease);
			}

			.card.mafia {
				border-color: var(--mafia);
				background: radial-gradient(120% 80% at 50% 0%, var(--mafia-dim), var(--bg));
			}
			.card.citizen {
				border-color: var(--citizen);
				background: radial-gradient(120% 80% at 50% 0%, var(--citizen-dim), var(--bg));
			}

			@keyframes reveal {
				from {
					opacity: 0;
					transform: rotateY(-12deg) scale(0.94);
				}
			}

			/*
			 * 직업 공개(nav=none)만 제대로 뒤집는다. 한 장뿐이라 넘길 것이 없는
			 * 화면이고, 판에서 가장 긴장되는 순간이다. 안내·도감은 장을 넘길
			 * 때마다 도니까 같은 연출을 주면 멀미가 난다.
			 */
			.card.solo {
				animation: flip 620ms var(--ease);
			}

			@keyframes flip {
				from {
					opacity: 0.2;
					transform: perspective(900px) rotateY(-90deg);
				}
				65% {
					opacity: 1;
					transform: perspective(900px) rotateY(7deg);
				}
			}

			/* 도는 동안 글자가 같이 돌면 읽히지 않는다. 카드가 앉은 뒤에 뜬다 */
			.card.solo > * {
				animation: rise 260ms var(--ease) 380ms both;
			}

			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(6px);
				}
			}

			.glyph {
				font-size: var(--t-2xl);
				line-height: 1;
			}

			.role {
				font-size: var(--t-xl);
				font-weight: 800;
				letter-spacing: -0.02em;
			}

			.ability-text {
				font-size: var(--t-md);
				color: var(--ink);
				word-break: keep-all;
			}

			.tip {
				font-size: var(--t-sm);
				color: var(--ink-2);
				word-break: keep-all;
			}

			/* 남은 시간을 막대로. 카드가 곧 닫힌다는 것을 알 수 있어야 한다 */
			.fuse {
				position: absolute;
				left: var(--s4);
				right: var(--s4);
				bottom: var(--s2);
				height: 3px;
				border-radius: 99px;
				background: var(--surface-3);
				overflow: hidden;
			}

			.fuse i {
				display: block;
				height: 100%;
				width: 100%;
				background: var(--accent);
				transform-origin: left;
			}

			/* ---------- 도감 목록 ---------- */
			#list {
				display: flex;
				flex-direction: column;
				gap: 5px;
				flex: 1 1 auto;
				min-height: 0;
			}

			/* 진영 구분선. 서버가 마피아 팀을 앞에 몰아서 보낸다(Guide.roleBook) */
			.sect {
				display: flex;
				align-items: center;
				gap: var(--s2);
				flex: 0 0 auto;
				font-size: var(--t-xs);
				font-weight: 800;
				color: var(--ink-3);
			}
			.sect::after {
				content: "";
				flex: 1 1 auto;
				height: 1px;
				background: var(--line);
			}
			.sect.mafia {
				color: var(--mafia-ink);
			}
			.sect.mafia::after {
				background: var(--mafia-dim);
			}
			.sect.citizen {
				color: var(--citizen-ink);
			}
			.sect.citizen::after {
				background: var(--citizen-dim);
			}

			/* 직업 한 줄 */
			.rolerow {
				display: flex;
				align-items: center;
				gap: var(--s3);
				flex: 0 0 auto;
				padding: 7px var(--s2);
				font: inherit;
				text-align: left;
				color: var(--ink);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-left: 3px solid var(--line);
				border-radius: var(--r2);
				cursor: pointer;
				transition: background var(--dur) var(--ease);
			}
			.rolerow:hover {
				background: var(--surface-3);
			}
			.rolerow:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}
			.rolerow.mafia {
				border-left-color: var(--mafia);
			}
			.rolerow.citizen {
				border-left-color: var(--citizen);
			}

			.rolerow .g {
				flex: 0 0 auto;
				font-size: var(--t-lg);
				line-height: 1;
			}

			/*
			 * 이름 칸. 고정 폭(flex-basis)으로 두면 "테러리스트"·"자경단원" 같은
			 * 5자 이름에서 줄이 접힌다 — 시스템 한글 글꼴이 기기마다 달라서
			 * 어떤 값을 골라도 어딘가에서는 좁다. 최소 폭만 주고 나머지는
			 * 능력 한 줄에게 넘긴다(그쪽은 ellipsis가 받는다).
			 */
			.rolerow .nm {
				flex: 0 0 auto;
				min-width: 62px;
				font-size: var(--t-sm);
				font-weight: 800;
				white-space: nowrap;
			}

			.rolerow .sm {
				flex: 1 1 auto;
				min-width: 0;
				font-size: var(--t-xs);
				color: var(--ink-2);
				overflow: hidden;
				white-space: nowrap;
				text-overflow: ellipsis;
			}

			/* ---------- 몇 장 중 몇 번째인가 ---------- */
			.dots {
				display: flex;
				justify-content: center;
				gap: var(--s1);
				flex: 0 0 auto;
			}

			.dots i {
				width: 6px;
				height: 6px;
				border-radius: 99px;
				background: var(--surface-3);
				transition: background var(--dur) var(--ease);
			}

			.dots i.on {
				background: var(--accent);
			}
		</style>
	</head>
	<body>
		<div class="panel">
			<div class="hd hidden" id="hd">
				<div class="hd-title grow"><span id="heading"></span></div>
				<span class="hd-sub" id="sub"></span>
			</div>

			<div class="body">
				<!-- 도감 목록. nav=grid에서만 쓴다 -->
				<div class="scroll hidden" id="list" aria-label="직업 목록"></div>

				<!-- 카드 한 장 -->
				<div class="card" id="card" role="status" aria-live="polite">
					<div class="glyph" id="glyph" aria-hidden="true">🎭</div>
					<div>
						<div class="role" id="role"></div>
						<span class="chip hidden" id="team"></span>
					</div>
					<div class="ability-text" id="ability"></div>
					<div class="tip" id="tip"></div>
					<div class="fuse hidden" id="fusebar" aria-hidden="true"><i id="fuse"></i></div>
				</div>
			</div>

			<div class="dots hidden" id="dots" aria-hidden="true"></div>

			<div class="foot">
				<button class="btn ghost hidden" id="back" type="button">← 목록</button>
				<button class="btn ghost grow hidden" id="book" type="button">📖 직업 보러 가기</button>
				<button class="btn ghost grow" id="close" type="button">닫기</button>
				<button class="btn primary grow hidden" id="next" type="button">다음 →</button>
			</div>
		</div>

		<!--@shared-->
		<script>
			/*
			 * 서버가 보낸 카드 묶음. 여기서 만들어내는 내용은 없다 —
			 * 직업 설명은 ROLE_DEFS가, 안내 문구는 domain/Guide.ts가 소유한다.
			 * 위젯이 문구를 들고 있으면 직업을 고쳤을 때 화면만 옛말을 한다.
			 */
			let cards = [];
			let nav = "none";
			let index = 0;
			/* 도감에서 목록을 보고 있는가. 카드를 고르면 false가 된다 */
			let listing = false;
			/* 마지막 장에서 도감으로 건너갈 수 있는가 */
			let bookLink = false;
			/* 목록 화면의 머리말. ""이면 도감으로 본다 (paint 참고) */
			let heading = "";

			const TEAM_LABEL = { mafia: "마피아 팀", citizen: "시민 팀" };

			/** 진영별 장수. 머리말이 "적이 몇인가"에 먼저 답하게 한다 */
			function countTeam(team) {
				let n = 0;
				for (const card of cards) {
					if (card.team === team) n++;
				}
				return n;
			}

			function paintList() {
				/*
				 * 서버가 마피아 팀을 앞에 몰아서 보낸다(Guide.roleBook).
				 * 위젯은 팀이 바뀌는 자리에 구분선을 넣을 뿐이다 — 여기서 다시
				 * 정렬하면 순서를 정하는 곳이 둘이 되고, 둘은 언젠가 어긋난다.
				 */
				let out = "";
				let team = "";
				for (let i = 0; i < cards.length; i++) {
					const card = cards[i];
					// 진영이 없는 묶음(도움말)에서는 색도 구분선도 빼야 한다.
					// team을 안 보고 갈랐던 옛 코드는 진영 없는 카드 전부를
					// 시민색으로 칠하고 맨 위에 "그 밖 11" 머리말을 하나 뿌렸다
					const side = card.team ? (card.team === "mafia" ? "mafia" : "citizen") : "";
					if (card.team && card.team !== team) {
						team = card.team;
						out += html`<div class="sect ${side}">
							${TEAM_LABEL[team] || "그 밖"} ${countTeam(team)}
						</div>`;
					}
					// summary가 없으면 body로 물러난다. 서버가 아직 그 필드를
					// 보내지 않아도 목록이 빈 줄로 뜨지 않게 하는 보루다
					out += html`<button
						class="rolerow ${side}"
						type="button"
						data-i="${i}"
						aria-label="${card.title} 설명 보기"
					>
						<span class="g" aria-hidden="true">${card.glyph}</span>
						<span class="nm">${card.title}</span>
						<span class="sm">${card.summary || card.body}</span>
					</button>`;
				}
				qs("#list").innerHTML = out;
			}

			function paintCard() {
				const card = cards[index];
				if (!card) return;

				const face = qs("#card");
				face.classList.remove("mafia", "citizen");
				if (card.team) face.classList.add(card.team === "mafia" ? "mafia" : "citizen");
				// 넘길 것이 없는 화면에서만 제대로 뒤집는다
				face.classList.toggle("solo", nav === "none");

				qs("#glyph").textContent = card.glyph || "🎭";
				qs("#role").textContent = card.title || "";
				qs("#ability").textContent = card.body || "";
				qs("#tip").textContent = card.note || "";

				const team = qs("#team");
				// 규칙 안내 카드에는 진영이 없다. 빈 칩을 남기면 회색 알약만 뜬다
				team.classList.toggle("hidden", !card.team);
				team.classList.remove("mafia", "citizen");
				if (card.team) {
					team.textContent = TEAM_LABEL[card.team];
					team.classList.add(card.team === "mafia" ? "mafia" : "citizen");
				}

				// 장을 넘길 때마다 뒤집히는 연출을 다시 태운다
				face.style.animation = "none";
				void face.offsetWidth;
				face.style.animation = "";
			}

			function paintFoot() {
				const last = index >= cards.length - 1;
				const steps = nav === "steps";

				flip("#back", nav === "grid" && !listing);
				flip("#book", steps && last && bookLink);
				flip("#next", steps && !last);
				// 닫기는 어느 화면에서도 사라지지 않는다. 겹쳐 뜬 카드에서
				// 가장 급한 일은 아래 화면으로 돌아가는 것이다
				flip("#close", true);

				qs("#close").textContent = steps ? (last ? "시작하기" : "건너뛰기") : "닫기";
				qs("#close").classList.toggle("primary", steps && last);
				qs("#close").classList.toggle("ghost", !(steps && last));
			}

			function flip(selector, on) {
				qs(selector).classList.toggle("hidden", !on);
			}

			function paint() {
				const showList = nav === "grid" && listing;
				flip("#list", showList);
				flip("#card", !showList);
				flip("#dots", nav === "steps");
				flip("#hd", nav !== "none");

				if (nav === "grid") {
					// 격자는 이제 도감 하나가 아니다(도움말도 같은 모양이다).
					// 서버가 머리말을 적어 보내면 그것을 쓰고, 비워 보내면
					// 도감이다 — 도감은 이 위젯이 처음부터 알던 화면이라
					// 여기가 그 이름의 제자리다
					qs("#heading").textContent = heading || "직업 도감";
					// 종수만으로는 "적이 몇인가"에 답하지 못한다. 도감을 여는
					// 사람이 가장 먼저 세는 것이 그 수다. 다만 도감에서만 뜻이
					// 있다 — 명령어 목록에서 "11종 · 마피아 0"은 거짓말이다
					qs("#sub").textContent =
						showList && !heading
							? `${cards.length}종 · 마피아 ${countTeam("mafia")} / 시민 ${countTeam("citizen")}`
							: "";
				} else if (nav === "steps") {
					qs("#heading").textContent = "처음이신가요?";
					qs("#sub").textContent = index + 1 + " / " + cards.length;
				}

				if (nav === "steps") {
					let dots = "";
					for (let i = 0; i < cards.length; i++) {
						dots += html`<i class="${i === index ? "on" : ""}"></i>`;
					}
					qs("#dots").innerHTML = dots;
				}

				if (!showList) paintCard();
				paintFoot();
			}

			qs("#close").addEventListener("click", () => {
				Parent.send({ type: "close", completed: nav === "steps" && index >= cards.length - 1 });
			});

			qs("#book").addEventListener("click", () => {
				Parent.send({ type: "book" });
			});

			qs("#next").addEventListener("click", () => {
				if (index < cards.length - 1) index++;
				paint();
			});

			qs("#back").addEventListener("click", () => {
				listing = true;
				paint();
			});

			qs("#list").addEventListener("click", event => {
				const row = event.target.closest(".rolerow");
				if (!row) return;
				index = Number(row.dataset.i);
				listing = false;
				paint();
			});

			Parent.on({
				init(data) {
					cards = data.cards || [];
					nav = data.nav || "none";
					bookLink = data.bookLink === true;
					// 옛 payload(장면 검사기)에는 이 칸이 없다. 없으면 도감이다
					heading = data.heading ? String(data.heading) : "";
					index = 0;
					listing = nav === "grid";

					if (listing) paintList();
					paint();

					// 카드가 열려 있는 시간만큼 막대가 줄어든다
					const seconds = Number(data.timer) || 0;
					flip("#fusebar", seconds > 0);
					if (seconds > 0) {
						const fuse = qs("#fuse");
						fuse.style.transition = `transform ${seconds}s linear`;
						requestAnimationFrame(() => {
							fuse.style.transform = "scaleX(0)";
						});
					}
				},
			});
		</script>
	</body>
</html>
