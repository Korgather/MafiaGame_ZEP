<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>카드</title>
		<!--@theme-->
		<style>
			/*
			 * 카드 위젯 — 직업 공개 · 첫 안내 · 직업 도감이 한 파일에 산다.
			 *
			 * 옛날 이야기: 직업 하나당 HTML 파일 하나였다(7개). 일곱 파일은
			 * background-image URL 한 줄을 빼면 바이트 단위로 같았고, 그중 셋은
			 * 그림을 base64로 품어 148KB였다. 나머지 넷은 imgur를 봤다.
			 * 그림에는 직업 이름 말고 아무 정보도 없어서, 카드가 떠 있는 동안
			 * "나는 무엇이고 무엇을 해야 하는가"를 알려주지 못했다.
			 *
			 * 지금 셋을 한 파일에 두는 이유도 같은 판단의 연장이다. 셋의 화면은
			 * 같다 — 글리프 하나, 제목 한 줄, 설명 한 문단, 덧붙임 한 문단.
			 * 다른 것은 "몇 장인가"와 "장을 어떻게 넘기는가"뿐이라서, 파일을
			 * 나누면 카드 모양을 고칠 때마다 세 곳을 똑같이 고쳐야 한다.
			 * 그 셋이 어긋나는 것이 정확히 예전 일곱 파일에서 벌어진 일이다.
			 *
			 * 넘기는 방식은 nav 하나가 정한다.
			 *   none  — 한 장. 넘길 것이 없다 (직업 공개)
			 *   steps — 앞으로만 넘긴다. 점으로 어디쯤인지 보여준다 (첫 안내)
			 *   grid  — 목록에서 골라 들어가고 목록으로 돌아온다 (직업 도감)
			 */

			/* ---------- 카드 한 장 ---------- */
			.card {
				position: relative;
				isolation: isolate;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: var(--s3);
				flex: 0 1 auto;
				height: 100%;
				width: auto;
				max-width: min(100%, 260px);
				max-height: 100%;
				aspect-ratio: 2 / 3;
				margin: 0 auto;
				padding: var(--s4);
				text-align: center;
				border-radius: var(--r3);
				border: 0;
				background-color: var(--surface);
				background-image: url("art_ui_card_front.png");
				background-position: center;
				background-size: 100% 100%;
				background-repeat: no-repeat;
				animation: reveal 420ms var(--ease);
			}

			.card.mafia {
				box-shadow: 0 0 0 2px var(--mafia) inset;
			}
			.card.citizen {
				box-shadow: 0 0 0 2px var(--citizen) inset;
			}

			@keyframes reveal {
				from {
					opacity: 0;
					transform: rotateY(-12deg) scale(0.94);
				}
			}

			/*
			 * 직업 공개(nav=none)만 제대로 뒤집는다.
			 *
			 * 한 장뿐이라 넘길 것이 없는 화면이고, 판에서 가장 긴장되는 순간이다.
			 * 안내·도감은 장을 넘길 때마다 도니까 같은 연출을 주면 멀미가 난다.
			 *
			 * 뒷면을 그린 두 면짜리 카드를 쓰지 않은 이유: #card는 도감에서
			 * hidden으로 껐다 켜지는 엘리먼트라 앞뒤를 만들려면 래퍼를 하나 더
			 * 끼우고 paint()의 flip 대상도 바꿔야 한다. rotateY(-90deg)는 화면에서
			 * 두께가 0이라 "엎어져 있다가 앞면으로 떨어진다"로 똑같이 읽힌다.
			 */
			.card.solo {
				animation: flip 620ms var(--ease);
			}

			@keyframes flip {
				from {
					opacity: 0.2;
					transform: perspective(900px) rotateY(-90deg);
				}
				65% {
					opacity: 1;
					transform: perspective(900px) rotateY(7deg);
				}
			}

			/* 도는 동안 글자가 같이 돌면 읽히지 않는다. 카드가 앉은 뒤에 뜬다 */
			.card.solo > * {
				animation: rise 260ms var(--ease) 380ms both;
			}

			.btn.skip::before {
				content: "";
				width: 18px;
				height: 18px;
				background: url("art_icon_skip.png") center / contain no-repeat;
			}

			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(6px);
				}
			}

			.card-art {
				width: clamp(92px, 34vw, 148px);
				height: clamp(92px, 34vw, 148px);
				object-fit: contain;
				filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.48));
			}

			.card.guide {
				background: linear-gradient(rgba(20, 16, 15, 0.72), rgba(20, 16, 15, 0.88));
				border: 26px solid transparent;
				border-image-source: url("art_ui_tutorial_frame.png");
				border-image-slice: 83 67 70 80 fill;
				border-image-width: 26px;
				border-image-repeat: stretch;
			}

			.card.solo::before {
				content: "";
				position: absolute;
				inset: 0;
				z-index: 5;
				aspect-ratio: 2 / 3;
				border-radius: inherit;
				background: url("art_ui_card_back.png") center / 100% 100% no-repeat;
				pointer-events: none;
				animation: reveal-back 620ms var(--ease) forwards;
			}

			.card.solo::after {
				content: "";
				position: absolute;
				left: 50%;
				top: 50%;
				z-index: 6;
				width: 84px;
				height: 84px;
				background: url("art_ui_loading_emblem.png") center / contain no-repeat;
				filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.55));
				pointer-events: none;
				animation: reveal-emblem 620ms var(--ease) forwards;
			}

			@keyframes reveal-back {
				0%, 44% { opacity: 1; }
				70%, 100% { opacity: 0; }
			}

			@keyframes reveal-emblem {
				0% { opacity: 0; transform: translate(-50%, -50%) scale(0.72) rotate(-12deg); }
				18%, 44% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
				70%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.08) rotate(8deg); }
			}

			.glyph {
				display: none;
				font-size: var(--t-2xl);
				line-height: 1;
			}

			.card-art.hidden + .glyph {
				display: block;
			}

			.tile-art {
				width: 44px;
				height: 44px;
				object-fit: contain;
			}

			.role {
				font-size: var(--t-xl);
				font-weight: 800;
				letter-spacing: -0.02em;
			}

			.ability {
				font-size: var(--t-md);
				color: var(--ink);
				word-break: keep-all;
			}

			.tip {
				font-size: var(--t-sm);
				color: var(--ink-2);
				word-break: keep-all;
			}

			/* 남은 시간을 막대로. 카드가 곧 닫힌다는 것을 알 수 있어야 한다 */
			.fuse {
				position: absolute;
				left: var(--s4);
				right: var(--s4);
				bottom: var(--s2);
				height: 3px;
				border-radius: 99px;
				background: var(--surface-3);
				overflow: hidden;
			}

			.fuse i {
				display: block;
				height: 100%;
				width: 100%;
				background: var(--accent);
				transform-origin: left;
			}

			/* ---------- 도감 목록 ---------- */
			/*
			 * 참가자 타일(.tile)을 그대로 쓴다. 밤 지목·투표와 같은 격자라서
			 * "네모를 누르면 그것이 열린다"를 새로 배울 필요가 없다.
			 * 진영은 테두리 색으로만 구분한다 — 도감에서는 아직 적이 아니라
			 * 사전 항목이라 지목 화면만큼 세게 칠할 이유가 없다.
			 */
			#list {
				display: flex;
				flex-direction: column;
				gap: var(--s2);
				flex: 1 1 auto;
				min-height: 0;
			}

			.tile.mafia {
				border-color: var(--mafia);
			}
			.tile.citizen {
				border-color: var(--citizen);
			}
			.tile .num {
				font-size: var(--t-xl);
			}
			.tile .cap {
				color: var(--ink-2);
			}

			/* 진영 구분선 */
			.sect {
				display: flex;
				align-items: center;
				gap: var(--s2);
				font-size: var(--t-xs);
				font-weight: 700;
				color: var(--ink-3);
			}
			.sect::after {
				content: "";
				flex: 1 1 auto;
				height: 1px;
				background: var(--line);
			}

			/* ---------- 몇 장 중 몇 번째인가 ---------- */
			.dots {
				display: flex;
				justify-content: center;
				gap: var(--s1);
				flex: 0 0 auto;
			}

			.dots i {
				width: 6px;
				height: 6px;
				border-radius: 99px;
				background: var(--surface-3);
				transition: background var(--dur) var(--ease);
			}

			.dots i.on {
				background: var(--accent);
			}
		</style>
	</head>
	<body>
		<div class="panel">
			<div class="hd hidden" id="hd">
				<div class="hd-title grow"><span id="heading"></span></div>
				<span class="hd-sub" id="sub"></span>
			</div>

			<div class="body">
				<!-- 도감 목록. nav=grid에서만 쓴다 -->
				<div class="scroll hidden" id="list" aria-label="직업 목록"></div>

				<!-- 카드 한 장 -->
				<div class="card" id="card" role="status" aria-live="polite">
					<img class="card-art" id="art" alt="" />
					<div class="glyph" id="glyph" aria-hidden="true">🎭</div>
					<div>
						<div class="role" id="role"></div>
						<span class="chip hidden" id="team"></span>
					</div>
					<div class="ability" id="ability"></div>
					<div class="tip" id="tip"></div>
					<div class="fuse hidden" id="fusebar" aria-hidden="true"><i id="fuse"></i></div>
				</div>
			</div>

			<div class="dots hidden" id="dots" aria-hidden="true"></div>

			<div class="foot">
				<button class="btn ghost hidden" id="back" type="button">← 목록</button>
				<button class="btn ghost grow hidden" id="book" type="button">📖 직업 보러 가기</button>
				<button class="btn ghost grow" id="close" type="button">닫기</button>
				<button class="btn primary grow hidden" id="next" type="button">다음 →</button>
			</div>
		</div>

		<!--@shared-->
		<script>
			/*
			 * 서버가 보낸 카드 묶음. 여기서 만들어내는 내용은 없다 —
			 * 직업 설명은 ROLE_DEFS가, 안내 문구는 domain/Guide.ts가 소유한다.
			 * 위젯이 문구를 들고 있으면 직업을 고쳤을 때 화면만 옛말을 한다.
			 */
			let cards = [];
			let nav = "none";
			let index = 0;
			/* 도감에서 목록을 보고 있는가. 카드를 고르면 false가 된다 */
			let listing = false;
			/* 마지막 장에서 도감으로 건너갈 수 있는가 */
			let bookLink = false;

			const TEAM_LABEL = { mafia: "마피아 팀", citizen: "시민 팀" };

			function paintList() {
				/*
				 * 서버가 마피아 팀을 앞에 몰아서 보낸다(domain/Guide.ts의 roleBook).
				 * 위젯은 팀이 바뀌는 자리에 구분선을 넣고 격자를 새로 열 뿐이다 —
				 * 여기서 다시 정렬하면 순서를 정하는 곳이 둘이 되고, 둘은 언젠가
				 * 어긋난다.
				 */
				let out = "";
				let team = "";
				for (let i = 0; i < cards.length; i++) {
					const card = cards[i];
					if (card.team !== team) {
						if (team) out += "</div>";
						team = card.team;
						out +=
							html`<div class="sect">${TEAM_LABEL[team] || "그 밖"}</div>` +
							'<div class="grid">';
					}
					out += html`<button
						class="tile ${card.team === "mafia" ? "mafia" : "citizen"}"
						type="button"
						data-i="${i}"
						aria-label="${card.title} 설명 보기"
					>
						<img class="tile-art" src="${card.image || ""}" alt="" />
						<span class="cap">${card.title}</span>
					</button>`;
				}
				if (team) out += "</div>";
				qs("#list").innerHTML = out;
			}

			function paintCard() {
				const card = cards[index];
				if (!card) return;

				const face = qs("#card");
				face.classList.remove("mafia", "citizen", "guide");
				if (card.team) face.classList.add(card.team === "mafia" ? "mafia" : "citizen");
				else face.classList.add("guide");
				// 넘길 것이 없는 화면에서만 제대로 뒤집는다
				face.classList.toggle("solo", nav === "none");

				const art = qs("#art");
				art.classList.toggle("hidden", !card.image);
				art.src = card.image || "";
				art.onerror = () => art.classList.add("hidden");
				qs("#glyph").textContent = card.glyph || "🎭";
				qs("#role").textContent = card.title || "";
				qs("#ability").textContent = card.body || "";
				qs("#tip").textContent = card.note || "";

				const team = qs("#team");
				// 규칙 안내 카드에는 진영이 없다. 빈 칩을 남기면 회색 알약만 뜬다
				team.classList.toggle("hidden", !card.team);
				team.classList.remove("mafia", "citizen");
				if (card.team) {
					team.textContent = TEAM_LABEL[card.team];
					team.classList.add(card.team === "mafia" ? "mafia" : "citizen");
				}

				// 장을 넘길 때마다 뒤집히는 연출을 다시 태운다
				face.style.animation = "none";
				void face.offsetWidth;
				face.style.animation = "";
			}

			function paintFoot() {
				const last = index >= cards.length - 1;
				const steps = nav === "steps";

				flip("#back", nav === "grid" && !listing);
				flip("#book", steps && last && bookLink);
				flip("#next", steps && !last);
				// 닫기는 어느 화면에서도 사라지지 않는다. 도감 상세에서 감췄더니
				// 다 읽은 사람이 목록으로 되돌아간 뒤에야 닫을 수 있었다 —
				// 겹쳐 뜬 카드에서 가장 급한 일은 아래 화면으로 돌아가는 것이다
				flip("#close", true);

				qs("#close").textContent = steps ? (last ? "시작하기" : "건너뛰기") : "닫기";
				qs("#close").classList.toggle("skip", steps && !last);
				qs("#close").classList.toggle("primary", steps && last);
				qs("#close").classList.toggle("ghost", !(steps && last));
			}

			function flip(selector, on) {
				qs(selector).classList.toggle("hidden", !on);
			}

			function paint() {
				const showList = nav === "grid" && listing;
				flip("#list", showList);
				flip("#card", !showList);
				flip("#dots", nav === "steps");
				flip("#hd", nav !== "none");

				if (nav === "grid") {
					qs("#heading").textContent = "직업 도감";
					qs("#sub").textContent = showList ? cards.length + "종" : "";
				} else if (nav === "steps") {
					qs("#heading").textContent = "처음이신가요?";
					qs("#sub").textContent = index + 1 + " / " + cards.length;
				}

				if (nav === "steps") {
					let dots = "";
					for (let i = 0; i < cards.length; i++) {
						dots += html`<i class="${i === index ? "on" : ""}"></i>`;
					}
					qs("#dots").innerHTML = dots;
				}

				if (!showList) paintCard();
				paintFoot();
			}

			qs("#close").addEventListener("click", () => {
				Parent.send({ type: "close" });
			});

			qs("#book").addEventListener("click", () => {
				Parent.send({ type: "book" });
			});

			qs("#next").addEventListener("click", () => {
				if (index < cards.length - 1) index++;
				paint();
			});

			qs("#back").addEventListener("click", () => {
				listing = true;
				paint();
			});

			qs("#list").addEventListener("click", event => {
				const tile = event.target.closest(".tile");
				if (!tile) return;
				index = Number(tile.dataset.i);
				listing = false;
				paint();
			});

			Parent.on({
				init(data) {
					cards = data.cards || [];
					nav = data.nav || "none";
					bookLink = data.bookLink === true;
					index = 0;
					listing = nav === "grid";

					if (listing) paintList();
					paint();

					// 카드가 열려 있는 시간만큼 막대가 줄어든다
					const seconds = Number(data.timer) || 0;
					flip("#fusebar", seconds > 0);
					if (seconds > 0) {
						const fuse = qs("#fuse");
						fuse.style.transition = `transform ${seconds}s linear`;
						requestAnimationFrame(() => {
							fuse.style.transform = "scaleX(0)";
						});
					}
				},
			});
		</script>
	</body>
</html>
