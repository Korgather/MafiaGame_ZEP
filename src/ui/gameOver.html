<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>게임 종료</title>
		<!--@theme-->
		<style>
			/*
			 * 게임 결과.
			 *
			 * 마피아류 게임에서 정체 공개는 결과 화면의 본체다. 한 판이 끝나고
			 * "쟤가 마피아였어?"를 확인하는 순간이 다음 판을 시작하게 만든다.
			 *
			 * 개정에서 바뀐 것
			 * ---------------
			 * 1. 머리말 "정체 공개"를 뺐다. 아래 목록 자체가 그 말을 하고 있고,
			 *    그 자리는 처음 하는 사람이 먼저 읽어야 하는 "내가 이겼는가"에
			 *    내주는 편이 낫다. 진영 이름만 크게 두면 자기 결과를 한 번 더
			 *    번역해야 한다.
			 * 2. 신분 줄을 쓰지 않는다. 이 화면은 team+winner로 승패를,
			 *    RevealView로 정체를 이미 말하므로 직업 칩이 들어갈 자리가 없다.
			 * 3. 정체 목록에 직업 글리프를 붙였다(RevealView.glyph). 도감·신분
			 *    칩과 같은 어휘를 써야 "🔍이 경찰"이라는 것을 한 번만 배운다.
			 */
			.verdict {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: var(--s3);
				flex: 0 0 auto;
				padding: var(--s2) var(--s3);
				border: 1px solid var(--line);
				border-radius: var(--r2);
				background: var(--surface-2);
			}

			.verdict.mafia {
				color: var(--mafia-ink);
				border-color: var(--mafia);
				background: var(--mafia-dim);
			}
			.verdict.citizen {
				color: var(--citizen-ink);
				border-color: var(--citizen);
				background: var(--citizen-dim);
			}

			.verdict .crown {
				font-size: var(--t-xl);
				line-height: 1;
				animation: drop 500ms var(--ease);
			}

			@keyframes drop {
				from {
					opacity: 0;
					transform: translateY(-12px) scale(0.8);
				}
			}

			.verdict .who {
				font-size: var(--t-xl);
				font-weight: 800;
				letter-spacing: -0.02em;
			}

			/*
			 * 정체 공개 표. 한 줄에 한 명.
			 *
			 * 줄 간격과 위아래 여백이 여기서 특별히 좁은 것은 이 목록이 예산
			 * 안에 들어오지 않기 때문이다. 46%는 메인 위젯의 천장이고(Assets의
			 * 세로 예산) 그 안에서 목록에 돌아오는 자리는 212px인데, 12명 판의
			 * 명단은 399px을 요구한다. 한 줄을 30px에서 26px로 줄이면 여섯 줄
			 * 대신 일곱 줄이 보인다 — 한 줄을 더 얻는 것이 이 4px의 전부이고,
			 * 그래서 더 줄이지 않았다. 여기서 더 좁히면 왼쪽 진영 띠들이
			 * 서로 붙어 한 덩어리로 읽힌다.
			 */
			.reveal {
				display: flex;
				flex-direction: column;
				gap: 3px;
			}

			.rev {
				display: flex;
				align-items: center;
				gap: var(--s2);
				padding: 4px var(--s2);
				font-size: var(--t-sm);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-left-width: 3px;
				border-radius: var(--r1);
				/* 한 줄씩 나타난다 */
				animation: slide 320ms var(--ease) backwards;
			}

			.rev.mafia {
				border-left-color: var(--mafia);
			}
			.rev.citizen {
				border-left-color: var(--citizen);
			}

			.rev.gone {
				color: var(--ink-3);
			}

			@keyframes slide {
				from {
					opacity: 0;
					transform: translateX(-8px);
				}
			}

			.rev .seat {
				flex: 0 0 auto;
				width: 18px;
				font-weight: 800;
				color: var(--ink-3);
				text-align: right;
			}

			.rev .g {
				flex: 0 0 auto;
				font-size: var(--t-md);
				line-height: 1;
			}

			.rev .job {
				flex: 0 0 auto;
				font-weight: 800;
				white-space: nowrap;
			}
			.rev.mafia .job {
				color: var(--mafia-ink);
			}
			.rev.citizen .job {
				color: var(--citizen-ink);
			}

			.rev .fate {
				flex: 0 0 auto;
				font-size: var(--t-xs);
				white-space: nowrap;
				color: var(--ink-3);
			}
			.rev .fate.alive {
				color: var(--ok);
			}

			/*
			 * 잘린 목록.
			 *
			 * 12명 판의 명단은 이 화면보다 길고, 그 사실은 화면이 정한 것이
			 * 아니라 예산이 정한 것이다(46%가 메인 위젯의 천장). 데스크톱은
			 * 스크롤바가 늘 보이지만 모바일 웹뷰의 스크롤바는 손을 대는 동안만
			 * 나타나므로, 손을 대기 전에는 아래에 더 있다는 표시가 아무 데도
			 * 없었다 — 여덟 명이 죽고 살아난 판의 결과가 여섯 줄에서 끝난
			 * 것처럼 보인다.
			 *
			 * 마지막 줄을 흐리게 잘라 "여기서 끝이 아니다"를 말한다. 바닥까지
			 * 내리면 클래스를 떼므로 다 본 목록의 마지막 줄이 흐려지지 않는다.
			 * mask를 못 읽는 웹뷰에서는 아무 일도 일어나지 않고 스크롤은 그대로
			 * 된다 — 이 표시는 없으면 불편한 것이지 없으면 막히는 것이 아니다.
			 */
			.body.cut {
				-webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent);
				mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent);
			}

			/*
			 * "한 판 더" 옆의 인원수.
			 *
			 * 이 숫자가 그 버튼의 판단 근거다 — 혼자 누르고 빈 방에 남는 것과
			 * 여섯 명이 이미 눌렀다는 것을 알고 누르는 것은 전혀 다른 결정이다.
			 * 그래서 눌러야 보이는 값이 아니라 버튼 옆에 늘 붙어 있다.
			 *
			 * tabular-nums: 초읽기처럼 1초마다 바뀌는 자리는 아니지만 사람들이
			 * 연달아 누르는 몇 초 동안 폭이 흔들리면 버튼이 함께 움직인다.
			 */
			.waiting {
				display: flex;
				align-items: center;
				flex: 0 0 auto;
				padding: 0 var(--s2);
				font-size: var(--t-xs);
				font-weight: 800;
				font-variant-numeric: tabular-nums;
				color: var(--ink-2);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-radius: var(--r1);
			}
		</style>
	</head>
	<body>
		<div class="panel">
			<div class="lead">
				<div class="lead-text">
					<!--
						가장 큰 글씨가 "내가 이겼는가"다. 진영 이름(마피아 승리)은
						아래 띠가 맡는다 — 그쪽은 판의 사실이고 이쪽은 나의 결과다.
					-->
					<div class="lead-title" id="note" role="status" aria-live="polite">게임 종료</div>
					<div class="lead-sub" id="reason"></div>
				</div>
				<div class="clock" id="timer"></div>
			</div>

			<div class="timeline" aria-hidden="true"><i></i></div>

			<div class="verdict" id="verdict">
				<span class="crown" id="crown" aria-hidden="true">🏆</span>
				<span class="who" id="who">게임 종료</span>
			</div>

			<div class="body scroll" id="listbox">
				<div class="reveal" id="reveal"></div>
			</div>

			<!--
				판이 끝나면 좌석이 통째로 비워지고 전원이 방 선택 화면으로 돌아간다.
				방금 여덟 명이 한 판을 끝냈어도 다시 모이려면 각자 같은 방 번호를
				찾아 눌러야 했고, 이 화면에는 그 방이 몇 번인지도 적혀 있지 않았다.
			-->
			<div class="foot">
				<button type="button" class="btn primary grow" id="again">
					<span aria-hidden="true">🔁</span><span id="again-text">같은 방에서 한 판 더</span>
				</button>
				<span class="waiting" id="waiting" role="status" aria-live="polite"></span>
			</div>
		</div>

		<!--@shared-->
		<script>
			/** 정체 한 줄. 순서대로 조금씩 늦게 나타나 한 명씩 밝혀지는 것처럼 보인다 */
			function revealHtml(p, i) {
				const team = p.team === "mafia" ? "mafia" : "citizen";
				return html`<div
					class="rev ${team}${p.alive ? "" : " gone"}"
					style="animation-delay:${i * 60}ms"
				>
					<span class="seat">${p.num}</span>
					<span class="grow ellip">${p.name || ""}</span>
					<span class="g" aria-hidden="true">${p.glyph || ""}</span>
					<span class="job">${p.role || ""}</span>
					<span class="fate${p.alive ? " alive" : ""}">${p.alive ? "생존" : "사망"}</span>
				</div>`;
			}

			/**
			 * 목록이 아래로 더 남았는가.
			 *
			 * 두 조건을 함께 본다 — 내용이 상자보다 긴가(스크롤이 생겼는가),
			 * 그리고 아직 바닥이 아닌가. 앞의 것만 보면 다 내려본 뒤에도
			 * 마지막 줄이 흐려져서 글씨가 깨진 것처럼 보인다.
			 *
			 * 2px은 소수점 반올림 여유다. 확대/축소가 걸린 화면에서 두 값이
			 * 1px씩 어긋나 스크롤이 없는 목록에 잘림 표시가 붙는 것을 막는다.
			 */
			function paintCut() {
				const box = qs("#listbox");
				const hidden = box.scrollHeight - box.clientHeight;
				box.classList.toggle("cut", hidden > 2 && box.scrollTop < hidden - 2);
			}

			qs("#listbox").addEventListener("scroll", paintCut);

			/**
			 * "한 판 더" 현황. init에 실려 오고, 누가 누를 때마다 rematch 조각으로
			 * 다시 온다 — 화면을 다시 열지 않는 것은 위 정체 목록이 한 줄씩
			 * 밝혀지는 연출을 갖고 있어서다(재생하면 결과를 두 번 보게 된다).
			 */
			function paintRematch(state) {
				const data = state || {};
				const count = Number(data.count) || 0;
				const of = Number(data.of) || 0;
				// 분모가 0인 순간이 있다. 전원의 접속이 끊긴 뒤 혼자 돌아온 경로다
				qs("#waiting").textContent = of > 0 ? `${count}/${of}명` : "";
				const mine = data.mine === true;
				qs("#again").disabled = mine;
				// 누른 뒤에도 버튼을 남긴다. 사라지면 방금 누른 것이 먹혔는지
				// 확인할 자리가 없어지고, 옆의 숫자만으로는 그 하나가 나인지 모른다
				qs("#again-text").textContent = mine ? "기다리는 중" : "같은 방에서 한 판 더";
			}

			qs("#again").addEventListener("click", () => {
				// 서버가 좌석에 적고 방 전원에게 숫자를 다시 보낸다. 그 왕복 동안
				// 두 번 눌리면 연타 관문에 걸려 두 번째가 조용히 버려지므로,
				// 눌린 모습은 여기서 먼저 만든다
				qs("#again").disabled = true;
				Parent.send({ type: "again" });
			});

			Parent.on({
				init(data) {
					const mafiaWon = data.winner === "mafia";
					qs("#verdict").classList.add(mafiaWon ? "mafia" : "citizen");
					qs("#crown").textContent = mafiaWon ? "🔪" : "🕊️";
					qs("#who").textContent = mafiaWon ? "마피아 승리" : "시민 승리";
					qs("#reason").textContent = data.reason || "";

					// 내가 이겼는지부터 알려준다. 진영 이름만으로는 방금 처음
					// 해본 사람이 자기 결과를 바로 읽지 못한다
					qs("#note").textContent = data.team
						? data.team === data.winner
							? "당신의 팀이 이겼습니다"
							: "당신의 팀이 졌습니다"
						: "게임 종료";

					startTimer(qs("#timer"), data.timer);

					const players = Array.isArray(data.players) ? data.players : [];
					qs("#reveal").innerHTML = html`${players.map(revealHtml)}`;
					// 목록을 그린 직후에만 잰다. 이 화면에서 상자 높이가 바뀌는
					// 다른 경로는 없다 — 아래 rematch 조각은 버튼 안의 글자만 바꾼다
					paintCut();

					paintRematch(data.rematch);
				},

				// 키를 따옴표로 감쌀 필요는 없지만 이름은 메시지 타입과 글자
				// 그대로 같아야 한다 — Parent.on은 handlers[data.type]로 찾는다
				rematch(data) {
					paintRematch(data);
				},
			});
		</script>
	</body>
</html>
