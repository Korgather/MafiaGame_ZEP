<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>게임 종료</title>
		<!--@theme-->
		<style>
			/*
			 * 게임 결과.
			 *
			 * 기존에는 winCitizen.html / winMafia.html 두 파일이었고, 내용은
			 * imgur 이미지 <img> 한 줄이 전부였다(762바이트). 누가 마피아였는지
			 * 끝나고도 알 수 없었다.
			 *
			 * 마피아류 게임에서 정체 공개는 결과 화면의 본체다. 한 판이 끝나고
			 * "쟤가 마피아였어?"를 확인하는 순간이 다음 판을 시작하게 만든다.
			 * 그게 없으면 매 판이 그냥 끝난다.
			 */
			.verdict {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: var(--s1);
				flex: 0 0 auto;
				padding: var(--s3) 0;
				text-align: center;
			}

			.verdict .crown {
				font-size: var(--t-2xl);
				line-height: 1;
				animation: drop 500ms var(--ease);
			}

			@keyframes drop {
				from {
					opacity: 0;
					transform: translateY(-12px) scale(0.8);
				}
			}

			.verdict .who {
				font-size: var(--t-xl);
				font-weight: 800;
				letter-spacing: -0.02em;
			}

			.verdict.mafia .who {
				color: var(--mafia);
			}
			.verdict.citizen .who {
				color: var(--citizen);
			}

			/* 정체 공개 표. 한 줄에 한 명 */
			.reveal {
				display: flex;
				flex-direction: column;
				gap: var(--s1);
			}

			.rev {
				display: flex;
				align-items: center;
				gap: var(--s2);
				padding: var(--s1) var(--s2);
				font-size: var(--t-sm);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-left-width: 3px;
				border-radius: var(--r1);
				/* 한 줄씩 나타난다 */
				animation: slide 320ms var(--ease) backwards;
			}

			.rev.mafia {
				border-left-color: var(--mafia);
			}
			.rev.citizen {
				border-left-color: var(--citizen);
			}

			.rev.gone {
				color: var(--ink-3);
			}

			@keyframes slide {
				from {
					opacity: 0;
					transform: translateX(-8px);
				}
			}

			.rev .seat {
				flex: 0 0 auto;
				width: 20px;
				font-weight: 700;
				color: var(--ink-3);
				text-align: right;
			}

			.rev .job {
				flex: 0 0 auto;
				font-weight: 700;
			}
			.rev.mafia .job {
				color: var(--mafia);
			}
			.rev.citizen .job {
				color: var(--citizen);
			}
		</style>
	</head>
	<body>
		<div class="panel">
			<div class="hd">
				<div class="hd-title grow"><span id="heading">결과</span></div>
				<div class="timer" id="timer"></div>
			</div>

			<div class="verdict" id="verdict" role="status" aria-live="polite">
				<div class="crown" id="crown" aria-hidden="true">🏆</div>
				<div class="who" id="who">게임 종료</div>
				<div class="hd-sub" id="reason"></div>
			</div>

			<div class="body scroll">
				<div class="reveal" id="reveal"></div>
			</div>

			<p class="note" id="note"></p>
		</div>

		<!--@shared-->
		<script>
			onServer({
				init: function (data) {
					var mafiaWon = data.winner === "mafia";
					var verdict = $("#verdict");
					verdict.classList.add(mafiaWon ? "mafia" : "citizen");
					$("#crown").textContent = mafiaWon ? "🔪" : "🎉";
					$("#who").textContent = mafiaWon ? "마피아 승리" : "시민 승리";
					$("#reason").textContent = data.reason || "";

					// 내가 이겼는지부터 알려준다. 진영 이름만으로는 방금 처음
					// 해본 사람이 자기 결과를 바로 읽지 못한다
					if (data.team) {
						var iWon = data.team === data.winner;
						$("#note").textContent = iWon ? "당신의 팀이 이겼습니다." : "당신의 팀이 졌습니다.";
					}

					$("#heading").textContent = "정체 공개";
					startTimer($("#timer"), data.timer);

					var players = Array.isArray(data.players) ? data.players : [];
					$("#reveal").innerHTML = players
						.map(function (p, i) {
							var team = p.team === "mafia" ? "mafia" : "citizen";
							return (
								'<div class="rev ' +
								team +
								(p.alive ? "" : " gone") +
								'" style="animation-delay:' +
								i * 60 +
								'ms">' +
								'<span class="seat">' +
								p.num +
								"</span>" +
								'<span class="grow ellip">' +
								esc(p.name || "") +
								"</span>" +
								'<span class="job">' +
								esc(p.role || "") +
								"</span>" +
								'<span class="hd-sub">' +
								(p.alive ? "생존" : "사망") +
								"</span>" +
								"</div>"
							);
						})
						.join("");

					rearrange(data.isMobile);
				},
			});
		</script>
	</body>
</html>
