<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>채팅</title>
		<!--@theme-->
		<style>
			/*
			 * 통합 채팅 위젯. 다섯 층 중 그리는 층(ChatUI)이다.
			 *
			 * 이 파일이 모르는 것 —
			 *   직업이 무엇인지, 지금이 밤인지, 마피아가 누구인지.
			 * 아는 것 —
			 *   서버가 준 탭 목록(channels), 그중 쓸 수 있는 탭(write),
			 *   지금 내밀 빠른 메시지(quick), 받은 줄들(lines).
			 *
			 * 그래서 직업이 몇 종으로 늘어도, 단계가 하나 늘어도 이 파일은
			 * 그대로다. 규칙은 전부 ChatPermission의 표에 있다.
			 *
			 * 줄을 채널별로 나눠 갖지 않고 통째로 들고 필요할 때 거르는 이유:
			 * 서버는 "이 사람이 읽어도 되는 모든 줄"을 보내므로, 탭을 누를 때
			 * 필요한 것은 이미 전부 여기 있다. 왕복을 기다리지 않으니 탭 전환이
			 * 즉시 그려진다. 서버에는 미확인 계산을 위해 알리기만 한다.
			 */

			/* 접힌 막대와 펼친 창은 한 번에 하나만 산다 (.hidden으로 갈린다) */
		</style>
	</head>
	<body>
		<button type="button" class="chat-mini hidden" id="mini" aria-label="채팅 열기">
			<span id="miniGlyph">💬</span>
			<span class="grow ellip" id="miniText">채팅</span>
			<span class="badge-n hidden" id="miniBadge">0</span>
		</button>

		<div class="chat hidden" id="full">
			<div class="chat-head" id="chatHead">
				<!--
					래퍼가 한 겹 더 있는 이유는 오른쪽 페이드 때문이다. 페이드를
					스크롤되는 쪽(.chat-tabs)에 얹으면 탭과 함께 밀려가 버린다.
				-->
				<div class="chat-tabwrap" id="tabwrap">
					<div class="chat-tabs" id="tabs" role="tablist" aria-label="채팅 채널"></div>
				</div>
				<!--
				글리프만 있던 자리에 글자를 붙였다. ▾ 하나로는 "접힌다"는 뜻이
				전해지지 않는다. aria-label은 남긴다 — 낭독기에 ▾가 그대로
				읽히면 오히려 방해가 된다.
			-->
			<button type="button" class="chat-fold" id="fold" aria-label="채팅 접기">
				<span aria-hidden="true">▾</span>접기
			</button>
			</div>

			<div class="chat-body">
				<div class="chat-log scroll" id="log" role="log" aria-live="polite"></div>
				<button type="button" class="chat-jump hidden" id="jump">새 메시지 ↓</button>
				<div class="emoji-pad hidden" id="pad" role="group" aria-label="이모지"></div>
			</div>

			<div class="quick hidden" id="quick"></div>

			<div class="chat-entry">
				<button type="button" class="icon-btn" id="emoji" aria-label="이모지">☺</button>
				<!--
					명령어가 있다는 것을 알 길이 없었다. 쓸 수 있는 탭에서는
					안내 문구가 그 탭의 placeholder로 바뀌어 "(/도움말)"이
					사라지므로(ChatService의 channelViews), 정작 말을 할 수 있는
					사람만 명령어의 존재를 모르고 지나간다.
				-->
				<button type="button" class="icon-btn strong" id="help" aria-label="도움말">?</button>
				<!--
					maxlength는 편의일 뿐 한계가 아니다. 진짜 한계는 서버의
					MAX_CHAT_LENGTH다 (Widget.types.ts). 두 값은 같아야 한다.
				-->
				<input
					type="text"
					class="chat-input"
					id="input"
					maxlength="200"
					autocomplete="off"
					aria-label="메시지 입력"
				/>
				<button type="button" class="icon-btn" id="submit" aria-label="보내기">➤</button>
			</div>
		</div>

		<!--@shared-->
		<!--@native-chat-->
		<script>
			/** 위젯이 들고 있는 줄 수 상한. 서버 기록(120줄)보다 넉넉하다 */
			const MAX_LINES = 200;
			const MAX_TEXT = 200;
			/* 스크롤이 이만큼 안쪽이면 "바닥을 보고 있다"로 친다 */
			const BOTTOM_SLACK = 24;
			/** ↑로 되짚을 수 있는 이전 입력 수 */
			const MAX_SENT = 30;

			/*
			 * 이모지는 고정 목록이다. 스티커·커스텀 이모지를 붙일 자리이기도
			 * 하다 — 서버가 목록을 보내주도록 바꾸면 payload 한 필드로 끝난다.
			 */
			const EMOJI = [
				"👍",
				"👏",
				"🙏",
				"❤️",
				"😀",
				"😂",
				"😅",
				"😭",
				"😱",
				"😡",
				"🤔",
				"😎",
				"🔪",
				"👻",
				"🕵️",
				"🚨",
			];

			let lines = [];
			let channels = [];
			let quick = [];
			let active = "";
			let myId = "";
			let inputDisabled = false;

			/*
			 * 보낸 글 기록(↑/↓). 이 문서보다 오래 살아야 한다.
			 *
			 * 채팅 접기/펴기는 CSS가 아니라 크기가 다른 위젯으로 다시 여는
			 * 것이라(Widgets.ts의 openChat) 그때마다 문서가 통째로 새로 만들어진다.
			 * 여기 두면 한 번 접을 때마다 기록이 비어서, 방금 친 말도 못 되짚는다.
			 * 부모 창에 두면 프레임이 몇 번 갈리든 남는다.
			 */
			const sent = Parent.store.chatSent || (Parent.store.chatSent = []);
			let sentAt = sent.length;

			// ────────────────────────────────────────────────── 그리기

			/** epoch ms를 HH:MM으로. 서버는 UTC ms만 보내고 형식은 여기서 정한다 */
			function clock(at) {
				const d = new Date(Number(at) || 0);
				return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
			}

			function viewOf(id) {
				for (const view of channels) {
					if (view.id === id) return view;
				}
				return null;
			}

			/**
			 * 표가 딸린 줄 — 전원의 직업, 명령어 목록, 신고.
			 *
			 * 시각을 붙이지 않는다. 표는 벌어진 사건이 아니라 조회 결과라
			 * 몇 분에 나왔는지가 아무 의미가 없고, 전원 공개 표 바로 위에는
			 * 방금 같은 시각을 찍은 처형 안내가 이미 서 있다.
			 *
			 * tone은 서버가 준 문자열이지만 class에 그대로 얹지 않는다.
			 * 아는 두 값으로만 좁힌다 — 아래 bubble의 팀 배지와 같은 이유다.
			 */
			function card(line, cls) {
				const rows = line.rows.map(row => {
					const value = !row.value
						? ""
						: row.tone
							? html`<span class="chip ${row.tone === "mafia" ? "mafia" : "citizen"}"
									>${row.value}</span
								>`
							: html`<span class="val">${row.value}</span>`;
					return html`<div class="row${row.dim ? " dim" : ""}">
						<span class="ellip">${row.label}</span>${value}
					</div>`;
				});
				return html`<div class="msg card ${cls}">
					<div class="ttl">${line.text}</div>
					${rows}
				</div>`;
			}

			function bubble(line) {
				const when = html`<span class="when">${clock(line.at)}</span>`;

				/*
				 * 나 한 사람 앞으로 온 줄인가 (ChatMessage.to).
				 *
				 * kind와는 다른 축이다 — kind는 "무엇에 관한 말인가"이고 이쪽은
				 * "누구 앞으로 온 말인가"다. 그래서 덮어쓰지 않고 함께 붙는다.
				 * 표(rows)에는 붙이지 않는다: 개인 표는 /도움말·/신고뿐이고,
				 * 표는 이미 카드로 눈에 띈다.
				 */
				const pm = line.to !== "" ? " pm" : "";

				// 사람이 친 말이 아니면 가운데 한 줄로 눕힌다
				if (line.kind !== "USER") {
					const cls = line.kind === "EVENT" ? "evt" : line.kind === "NOTICE" ? "ntc" : "sys";
					if (line.rows && line.rows.length) return card(line, cls);
					return html`<div class="msg ${cls}${pm}">
						<div class="txt">${when} ${line.text}</div>
					</div>`;
				}

				// 내 말은 이름을 다시 읽을 필요가 없다. 시각만 남긴다
				const mine = line.senderId !== "" && line.senderId === myId;
				let who = when;
				if (!mine) {
					const chip = line.role
						? html`<span class="chip ${line.team === "mafia" ? "mafia" : "citizen"}"
								>${line.role}</span
							>`
						: "";
					const name = line.num > 0 ? line.num + "번 참가자" : line.name;
					/*
					 * 받은 귓속말에만 답장 버튼을 붙인다.
					 *
					 * 답장할 상대가 분명한 줄이 이것뿐이다 — 공개 발언에 붙이면
					 * 아무나 붙잡고 밀담을 거는 버튼이 되고, 게임 중에는 애초에
					 * 귓속말이 막혀 있어 누를 수 없는 버튼만 줄마다 늘어난다.
					 *
					 * 끼울 이름은 화면에 보이는 것을 그대로 쓴다. 참가 번호가
					 * 붙어 있으면 번호가 먼저다 — 닉네임에 공백이 있어도, 같은
					 * 이름이 둘이어도 번호는 하나뿐이다.
					 */
					const token = line.num > 0 ? String(line.num) : line.name;
					const reply =
						!inputDisabled && pm !== "" && line.senderId !== ""
							? html`<button
									type="button"
									class="reply"
									data-who="${token}"
									aria-label="${name}에게 답장"
								>
									↩
								</button>`
							: "";
					who = html`${chip}<span class="ellip">${name}</span>${when}${reply}`;
				}

				return html`<div class="msg${mine ? " mine" : ""}${pm}">
					<div class="who">${who}</div>
					<div class="txt">${line.text}</div>
				</div>`;
			}

			function nearBottom(el) {
				return el.scrollHeight - el.scrollTop - el.clientHeight < BOTTOM_SLACK;
			}

			function jump(show) {
				qs("#jump").classList.toggle("hidden", !show);
			}

			/** 활성 탭의 줄만 다시 그린다. 탭 전환·재접속이 지나는 길 */
			function render() {
				const el = qs("#log");
				el.innerHTML = html`${lines.filter(line => line.channel === active).map(bubble)}`;
				scrollToEnd(el);
				jump(false);
			}

			function append(line) {
				lines.push(line);
				if (lines.length > MAX_LINES) lines.splice(0, lines.length - MAX_LINES);
				if (line.channel !== active) return;

				const el = qs("#log");
				// 붙이기 *전에* 재야 한다. 붙인 뒤에 재면 방금 늘어난 높이 때문에
				// 늘 "위로 올라가 있음"이 되어 자동 스크롤이 영영 멈춘다.
				// 기존 roleAction.html의 밤 채팅이 정확히 이 순서로 어긋나 있었다.
				const follow = nearBottom(el);
				el.insertAdjacentHTML("beforeend", bubble(line));
				while (el.childElementCount > MAX_LINES) el.removeChild(el.firstElementChild);

				if (follow) scrollToEnd(el);
				// 읽던 자리를 뺏지 않는다. 새 줄이 왔다는 것만 알린다
				jump(!follow);
			}

			function badgeText(unread) {
				return unread > 99 ? "99+" : String(unread);
			}

			function tabHtml(view) {
				const badge = view.unread > 0 ? html`<span class="badge-n">${badgeText(view.unread)}</span>` : "";
				return html`<button
					type="button"
					role="tab"
					class="tab${view.write ? "" : " ro"}"
					aria-selected="${view.id === active}"
					data-id="${view.id}"
					aria-label="${view.label + (view.write ? "" : ", 읽기 전용")}"
				>
					<span aria-hidden="true">${view.glyph}</span><span>${view.label}</span>${badge}
				</button>`;
			}

			/*
			 * 오른쪽에 탭이 더 있는지 재서 페이드를 켠다.
			 *
			 * 재는 것 말고 방법이 없다. 탭 수로 짐작하면 글꼴·화면 폭에 따라
			 * 어긋나고, 페이드를 항상 켜 두면 탭이 둘뿐인 로비에서도 오른쪽
			 * 끝이 이유 없이 어두워진다. 2는 소수점 반올림 여유다 — 끝까지
			 * 밀어도 차이가 0이 되지 않는 엔진이 있다.
			 */
			function syncFade() {
				const el = qs("#tabs");
				qs("#tabwrap").classList.toggle("more", el.scrollWidth - el.scrollLeft - el.clientWidth > 2);
			}

			function drawTabs() {
				qs("#tabs").innerHTML = html`${channels.map(tabHtml)}`;
				syncFade();
				// 고른 탭이 잘린 자리에 있으면 아무것도 고르지 않은 것처럼 보인다.
				// 밤에는 탭이 넷까지 늘어나므로 실제로 일어난다
				const chosen = qs('.tab[aria-selected="true"]', qs("#tabs"));
				if (chosen) chosen.scrollIntoView({ inline: "nearest", block: "nearest" });

				const view = viewOf(active);
				const input = qs("#input");
				/*
				 * 일반 플레이어는 입력창을 잠그지 않는다. 명령어(/도움말)는 채널
				 * 권한과 무관하게 서버가 받아주고, 밤의 시민처럼 쓸 수 있는 탭이
				 * 하나도 없는 상황이 정상이기 때문이다. 게스트만 inputDisabled로
				 * 입력기 전체를 잠근다 — 채널 하나의 상태가 아니라 계정 권한이다.
				 *
				 * 문구는 서버가 통째로 준다. 여기서 지어내면 밤·사망·관전이
				 * 모두 "지금은 읽기만 됩니다" 한 줄로 뭉개진다 — 이유를 아는
				 * 곳은 권한 표 하나뿐인데 그것이 서버에 있다.
				 */
				input.disabled = inputDisabled;
				input.placeholder = view ? view.placeholder : "";
				for (const id of ["#emoji", "#help", "#submit"]) qs(id).disabled = inputDisabled;
				if (inputDisabled) {
					input.value = "";
					qs("#pad").classList.add("hidden");
				}
			}

			/**
			 * 방금 생긴 탭을 잠깐 강조한다. before는 직전의 탭 id 목록이다.
			 *
			 * 밤이 되면 🔪가, 방에 들어가면 💬가 조용히 하나 늘어난다. 아무도
			 * 알려주지 않으면 "밤에는 마피아끼리 말할 수 있다"를 모르고 판이 끝난다.
			 *
			 * 서버에 새 탭인지 묻지 않는다 — 직전 목록을 이 문서가 들고 있으니
			 * 여기서 알 수 있고, 물으면 payload 한 필드와 그것을 채우는 서버 쪽
			 * 판정이 함께 늘어난다. 이 문서가 스스로 아는 것은 스스로 판정한다.
			 *
			 * drawTabs()가 innerHTML을 통째로 새로 만들므로 반드시 그 뒤에 부른다.
			 */
			function flashNew(before) {
				for (const view of channels) {
					if (before.indexOf(view.id) >= 0) continue;
					const el = qs('.tab[data-id="' + view.id + '"]', qs("#tabs"));
					if (el) el.classList.add("fresh");
				}
			}

			/**
			 * 미확인 수만 갈아끼운다.
			 *
			 * 줄이 하나 올 때마다 drawTabs()를 부르면 탭 막대의 innerHTML이
			 * 통째로 새로 만들어진다. 탭에 포커스를 두고 키보드로 넘기던 중이면
			 * 포커스가 날아가고, 탭이 많아 가로 스크롤 중이면 스크롤도 처음으로
			 * 돌아간다. 실제로 바뀌는 것은 숫자 하나뿐이다.
			 */
			function drawBadges() {
				for (const tab of qsa(".tab", qs("#tabs"))) {
					const view = viewOf(tab.dataset.id);
					if (!view) continue;
					let badge = qs(".badge-n", tab);
					if (view.unread <= 0) {
						if (badge) badge.remove();
						continue;
					}
					if (!badge) {
						tab.insertAdjacentHTML("beforeend", '<span class="badge-n"></span>');
						badge = qs(".badge-n", tab);
					}
					badge.textContent = badgeText(view.unread);
				}
			}

			function drawQuick() {
				const view = viewOf(active);
				const usable = !inputDisabled && view !== null && view.write && quick.length > 0;
				qs("#quick").classList.toggle("hidden", !usable);
				if (!usable) return;
				// data-index는 누르는 쪽이 아니라 세는 쪽이 쓴다 — 장면 검사기가
				// "여덟 번째 칩이 그려졌나"를 물을 수 있는 유일한 손잡이다
				// (roleAction.html의 문구 버튼과 같은 방식)
				qs("#quick").innerHTML = html`${quick.map(
					(text, i) => html`<button type="button" data-index="${i}">${text}</button>`
				)}`;
			}

			/*
			 * 접힌 바에 뭐라고 쓸지.
			 *
			 * Enter로 열린다는 것은 아무 데도 안 적혀 있으면 아무도 모른다.
			 * 그렇다고 항상 적을 수는 없다 — 부모와 출처가 다르면 Enter는
			 * 정말로 안 먹고, 안 되는 조작을 적어두는 것이 안 적는 것보다 나쁘다.
			 */
			const MINI_LABEL = Parent.canReadKeys ? "채팅 (Enter)" : "채팅";

			/** 접힌 막대에 몇 개까지 나열할지. 그 줄에는 총합 배지가 이미 서 있다 */
			const MINI_MARKS = 3;

			function drawMini() {
				let total = 0;
				let single = "";
				const marks = [];
				for (const view of channels) {
					total += view.unread;
					if (view.unread <= 0) continue;
					single = view.glyph;
					marks.push(view.glyph + badgeText(view.unread));
				}
				const active_ = viewOf(active);

				/*
				 * 글리프는 "누르면 어디로 가게 되는가"다. 시끄러운 탭이 하나면
				 * 그쪽을 가리키고, 여럿이면 하나를 고를 수 없으니 채팅 자체를
				 * 뜻하는 💬로 물러난다. 조용하면 지금 보고 있던 탭이다.
				 */
				let glyph = active_ ? active_.glyph : "💬";
				if (marks.length === 1) glyph = single;
				else if (marks.length > 1) glyph = "💬";

				/*
				 * 글자 자리에는 "새 메시지"가 아니라 어느 탭인지를 적는다.
				 *
				 * 접혀 있는 동안 밖에서 보이는 것은 이 한 줄뿐이다. 총합만 있으면
				 * 5가 마피아 밀담인지 로비 잡담인지 알 수 없어서, 펴 보기 전에는
				 * 열어야 할 이유를 알 수 없다. 셋을 넘기면 ⋯ 로 접는다.
				 */
				const listed =
					marks.length <= MINI_MARKS ? marks.join(" ") : marks.slice(0, MINI_MARKS).join(" ") + " ⋯";

				qs("#miniGlyph").textContent = glyph;
				qs("#miniText").textContent = total > 0 ? listed : MINI_LABEL;
				qs("#miniBadge").textContent = badgeText(total);
				qs("#miniBadge").classList.toggle("hidden", total === 0);
				qs("#mini").classList.toggle("alert", total > 0);
			}

			function draw() {
				drawTabs();
				drawQuick();
				drawMini();
			}

			// ────────────────────────────────────────────────── 보낸 글 기록

			function remember(text) {
				// 같은 말을 두 번 이어 보냈다고 기록이 두 칸이 될 이유는 없다
				if (sent[sent.length - 1] !== text) sent.push(text);
				if (sent.length > MAX_SENT) sent.shift();
				resetRecall();
			}

			function resetRecall() {
				sentAt = sent.length;
			}

			/** step은 -1이 과거, +1이 최근. 끝까지 내려오면 빈 칸으로 돌아온다 */
			function recall(step) {
				const at = Math.max(0, Math.min(sent.length, sentAt + step));
				if (at === sentAt) return;
				sentAt = at;
				const input = qs("#input");
				input.value = at === sent.length ? "" : sent[at];
				// 커서를 끝으로. 안 하면 맨 앞에 놓여서 이어 쓰기가 어색하다
				input.setSelectionRange(input.value.length, input.value.length);
			}

			// ────────────────────────────────────────────────── 보내기

			function submit(text) {
				if (inputDisabled) return false;
				const trimmed = String(text == null ? "" : text).trim();
				if (trimmed === "") return false;
				const view = viewOf(active);
				// 명령어는 어느 탭에서든 통한다. 서버가 권한 검사보다 먼저 본다
				if (trimmed.charAt(0) !== "/" && (view === null || !view.write)) return false;
				Parent.send({ type: "send", channel: active, text: trimmed });
				remember(trimmed);
				return true;
			}

			/**
			 * 보내지 못한 글은 지우지 않는다.
			 *
			 * 읽기 전용 탭에서 Enter를 눌렀을 때 쓰던 문장이 조용히 사라지면
			 * 다시 칠 방법이 없다. 남겨두면 탭을 옮겨 그대로 보낼 수 있다.
			 */
			function submitInput() {
				if (!submit(qs("#input").value)) return;
				qs("#input").value = "";
				qs("#pad").classList.add("hidden");
			}

			// ────────────────────────────────────────────────── 채널 고르기

			function selectChannel(id) {
				if (id === active) return;

				// 줄은 이미 전부 여기 있으므로 서버를 기다릴 이유가 없다.
				// 기다리면 탭을 눌렀는데 아무 일도 안 일어난 것처럼 보인다.
				active = id;
				const view = viewOf(active);
				if (view) view.unread = 0;
				draw();
				render();
				Parent.send({ type: "channel", channel: active });
			}

			/** Tab으로 넘기기. channels는 서버가 정한 순서 그대로다 */
			function cycleChannel(step) {
				if (channels.length < 2) return;
				let at = 0;
				for (let i = 0; i < channels.length; i++) {
					if (channels[i].id === active) at = i;
				}
				selectChannel(channels[(at + step + channels.length) % channels.length].id);
			}

			// ────────────────────────────────────────────────── 조작

			qs("#tabs").addEventListener("click", event => {
				const el = event.target.closest(".tab");
				if (el) selectChannel(el.dataset.id);
			});

			// 손가락으로 탭 줄을 밀었을 때도 페이드를 다시 판정한다. 끝까지 밀었으면
			// 잘린 것이 없으므로 그림자가 남아 있어서는 안 된다
			qs("#tabs").addEventListener("scroll", syncFade);

			// 접기는 더 작은 위젯으로 다시 여는 것이다. 서버가 다시 열어준다.
			//
			// #fold가 아니라 머리말 전체에 건다. 채널을 고르는 탭만 빼면 이 줄에서
			// 할 일은 접는 것뿐이고, 탭 사이의 빈 자리는 원래 아무 일도 하지 않던
			// 곳이라 잃는 것이 없다. 손가락에게는 40px짜리 버튼 하나보다
			// 머리말 한 줄 전체가 훨씬 큰 과녁이다.
			qs("#chatHead").addEventListener("click", event => {
				if (event.target.closest(".tab")) return;
				Parent.send({ type: "toggle", open: false });
			});

			qs("#mini").addEventListener("click", () => {
				Parent.send({ type: "toggle", open: true });
			});

			qs("#jump").addEventListener("click", () => {
				scrollToEnd(qs("#log"));
				jump(false);
			});

			qs("#log").addEventListener("scroll", () => {
				if (nearBottom(qs("#log"))) jump(false);
			});

			/*
			 * 답장(↩). 보내지 않고 입력창을 채우기만 한다.
			 *
			 * 곧바로 보내면 무엇을 보낼지 정하기 전에 밀담이 나가고, 답장 전용
			 * 상태를 따로 들면 "지금 어디에 쓰는 중인가"가 화면 어디에도 없는
			 * 숨은 상태로 생긴다. 입력창에 명령어가 그대로 보이면 상태가 곧 화면이고,
			 * 마음이 바뀌면 Escape 한 번으로 지워진다.
			 *
			 * 줄 하나가 아니라 로그 전체에 건다 — render()가 innerHTML을 통째로
			 * 갈아치우므로 줄에 직접 건 리스너는 다음 탭 전환에 사라진다.
			 */
			qs("#log").addEventListener("click", event => {
				if (inputDisabled) return;
				const el = event.target.closest(".reply");
				if (!el) return;
				qs("#input").value = "/귓속말 " + el.dataset.who + " ";
				takeFocus(false);
			});

			qs("#emoji").addEventListener("click", () => {
				qs("#pad").classList.toggle("hidden");
			});

			/*
			 * 도움말. submit()을 지나지 않고 직접 보낸다.
			 *
			 * submit()은 보낸 글을 ↑ 기록에 남기는데(remember), 버튼으로 열어 본
			 * 도움말이 기록에 끼면 방금 친 말을 되짚으려던 사람이 자기가 치지도
			 * 않은 /도움말을 만난다.
			 *
			 * 채널은 지금 탭을 그대로 보낸다. 명령어는 권한 검사보다 먼저
			 * 처리되므로(ChatService.submit) 밤에 아무 데도 쓸 수 없는 시민도 열린다.
			 */
			qs("#help").addEventListener("click", () => {
				Parent.send({ type: "send", channel: active, text: "/도움말" });
			});

			qs("#pad").addEventListener("click", event => {
				if (event.target.tagName !== "BUTTON") return;
				const input = qs("#input");
				input.value = (input.value + event.target.textContent).slice(0, MAX_TEXT);
				qs("#pad").classList.add("hidden");
				input.focus();
			});

			qs("#quick").addEventListener("click", event => {
				if (event.target.tagName !== "BUTTON") return;
				submit(event.target.textContent);
			});

			qs("#submit").addEventListener("click", submitInput);

			// ────────────────────────────────────────────────── 키보드

			/**
			 * 입력창으로 포커스를 옮긴다. 접혀 있으면 먼저 펴야 한다.
			 *
			 * 펴기는 위젯을 다시 여는 것이라 이 문서가 그 자리에서 사라진다.
			 * 그래서 "펴고 나서 포커스"를 여기서 이어 할 수 없다 — 무엇에
			 * 포커스를 줄지 서버에 함께 알려주고, 새로 뜬 문서가 init에서 받는다.
			 */
			function focusInput(slash) {
				if (inputDisabled) return;
				if (qs("#full").classList.contains("hidden")) {
					Parent.send({ type: "toggle", open: true, focus: slash ? "command" : "input" });
					return;
				}
				takeFocus(slash);
			}

			function takeFocus(slash) {
				if (inputDisabled) return;
				// 게임 화면에서 들어온 길에서는 포커스가 아직 캔버스에 있다
				Parent.grabFocus();
				const input = qs("#input");
				// /는 명령어의 첫 글자다. 넣어두면 바로 이어 칠 수 있다
				if (slash && input.value === "") input.value = "/";
				input.focus();
				input.setSelectionRange(input.value.length, input.value.length);
			}

			qs("#input").addEventListener("keydown", event => {
				const input = qs("#input");

				if (event.key === "Enter") {
					submitInput();
					// 한 줄 보냈으면 곧바로 걸어 다닐 수 있어야 한다. 포커스를
					// 들고 있으면 WASD가 이 입력칸으로 들어온다
					Parent.releaseFocus();
					return;
				}

				if (event.key === "Escape") {
					// 두 걸음이다. 쓰던 글을 먼저 비우고, 빈 칸에서 한 번 더 누르면
					// 게임으로 돌아간다. 한 걸음이면 오타를 지우려다 창을 닫는다
					if (input.value !== "") {
						input.value = "";
						resetRecall();
						return;
					}
					qs("#pad").classList.add("hidden");
					input.blur();
					Parent.releaseFocus();
					return;
				}

				if (event.key === "Tab") {
					// 위젯 안에는 Tab으로 갈 만한 곳이 몇 개 없다. 채널 전환이
					// 훨씬 쓸모 있다. 밖으로 나가는 길은 Escape가 맡는다
					event.preventDefault();
					cycleChannel(event.shiftKey ? -1 : 1);
					return;
				}

				if (event.key === "ArrowUp" || event.key === "ArrowDown") {
					// 기본 동작은 커서를 글 끝으로 보내는 것이다. 되짚기와 겹친다
					event.preventDefault();
					recall(event.key === "ArrowUp" ? -1 : 1);
				}
			});

			/*
			 * 게임 화면(캔버스)에 포커스가 있는 동안 눌린 키.
			 *
			 * 위젯 안에서 누른 키는 여기로 오지 않는다 — 키 이벤트는 프레임
			 * 경계를 넘지 않기 때문이다. 그래서 "지금 채팅을 치는 중인가"를 따로
			 * 들고 있을 필요가 없고, 치는 동안 이동·단축키를 꺼줄 일도 없다.
			 * 입력창에 친 WASD는 애초에 ZEP 캔버스에 닿지 않는다.
			 *
			 * 부모와 출처가 다르면 이 구독은 조용히 없던 일이 된다(bridge.js).
			 * 그때는 채팅창을 눌러서 여는 지금까지의 길이 그대로 남는다.
			 */
			Parent.onKey(event => {
				if (event.key !== "Enter" && event.key !== "/") return;
				// ZEP 기본 채팅도 Enter로 열린다. 둘 다 열리면 지금 어느 쪽에
				// 쓰고 있는지 알 수 없다. 여기서 끊어 하나만 열리게 한다
				event.preventDefault();
				event.stopImmediatePropagation();
				focusInput(event.key === "/");
			});

			qs("#pad").innerHTML = html`${EMOJI.map(
				glyph => html`<button type="button" aria-label="${glyph}">${glyph}</button>`
			)}`;

			// ────────────────────────────────────────────────── 서버

			Parent.on({
				init(data) {
					myId = data.myId || "";
					channels = data.channels || [];
					quick = data.quick || [];
					active = data.active || "";
					lines = data.lines || [];
					inputDisabled = data.inputDisabled === true;

					const open = data.open === true;
					qs("#full").classList.toggle("hidden", !open);
					qs("#mini").classList.toggle("hidden", open);

					draw();
					render();

					/*
					 * 다른 위젯이 채워 달라고 부탁한 글 (프로필 창의 💌).
					 *
					 * 접혀 있었다면 서버가 펴면서 이 길로 실어 보낸다 — 펴기는
					 * 위젯을 다시 여는 것이라 접혀 있던 문서가 남겨 줄 방법이 없다.
					 */
					if (!inputDisabled && data.prefill) {
						qs("#input").value = String(data.prefill).slice(0, MAX_TEXT);
					}

					// 게임 화면에서 Enter로 펴고 들어온 경우. 앞 문서가 남긴
					// 의도를 이어받는 곳은 여기 하나뿐이다
					if (data.focus) takeFocus(data.focus === "command");
				},

				/** 이미 펴져 있을 때의 같은 부탁. 문서가 살아 있으니 바로 채운다 */
				prefill(data) {
					if (inputDisabled) return;
					qs("#input").value = String(data.text || "").slice(0, MAX_TEXT);
					takeFocus(false);
				},

				/*
				 * 권한만 바뀐 것이다 (단계 전환·사망·입퇴장). 다시 그리지 않는
				 * 이유는 읽던 자리와 입력하던 글자를 지키기 위해서다 —
				 * 활성 탭이 실제로 바뀌었을 때만 기록을 갈아끼운다.
				 */
				channels(data) {
					const next = data.active || active;
					const moved = next !== active;
					// 무엇이 늘었는지 알 수 있는 마지막 순간이다. 아래에서 덮인다
					const before = channels.map(view => view.id);
					channels = data.channels || [];
					quick = data.quick || [];
					inputDisabled = data.inputDisabled === true;
					active = next;
					draw();
					// init에서는 부르지 않는다 — 접었다 펴는 것도 새 문서라
					// 그때마다 모든 탭이 "방금 생긴 탭"이 되어 판마다 깜빡인다
					flashNew(before);
					if (moved) render();
				},

				/*
				 * 서버가 허락한 발언을 ZEP 기본 채팅으로도 내보낸다 —
				 * 내 아바타 위에 말풍선이 뜬다.
				 *
				 * 어느 채널이 여기 오는지도, 청중을 어디까지 넓힐지(data.area)도
				 * 서버가 정한다 (ChatChannel의 zepAudienceFor). 위젯은 판단하지
				 * 않는다 — 마피아 밀담이 이 길로 새면 게임이 그 자리에서 끝난다.
				 */
				say(data) {
					NativeChat.say(data.text, data.area);
				},

				line(data) {
					if (data.channels) channels = data.channels;
					if (data.line) append(data.line);
					drawBadges();
					drawMini();
				},
			});
		</script>
	</body>
</html>
