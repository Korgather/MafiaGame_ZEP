<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>채팅</title>
		<!--@theme-->
		<style>
			/*
			 * 통합 채팅 위젯. 다섯 층 중 그리는 층(ChatUI)이다.
			 *
			 * 이 파일이 모르는 것 —
			 *   직업이 무엇인지, 지금이 밤인지, 마피아가 누구인지.
			 * 아는 것 —
			 *   서버가 준 탭 목록(channels), 그중 쓸 수 있는 탭(write),
			 *   지금 내밀 빠른 메시지(quick), 받은 줄들(lines).
			 *
			 * 그래서 직업이 몇 종으로 늘어도, 단계가 하나 늘어도 이 파일은
			 * 그대로다. 규칙은 전부 ChatPermission의 표에 있다.
			 *
			 * 줄을 채널별로 나눠 갖지 않고 통째로 들고 필요할 때 거르는 이유:
			 * 서버는 "이 사람이 읽어도 되는 모든 줄"을 보내므로, 탭을 누를 때
			 * 필요한 것은 이미 전부 여기 있다. 왕복을 기다리지 않으니 탭 전환이
			 * 즉시 그려진다. 서버에는 미확인 계산을 위해 알리기만 한다.
			 */

			/* 접힌 막대와 펼친 창은 한 번에 하나만 산다 (.hidden으로 갈린다) */

			/*
			 * 사실·주장·추정을 모양으로 가른다.
			 *   사실(안내·사건·입퇴장) — 폭 전체의 띠. 누가 한 말이 아니다.
			 *   주장(발언) — 말풍선. 남의 말은 왼쪽, 내 말은 오른쪽.
			 *   추정(내 메모) — 점선 칩. 확정된 직업 칩(실선)과 섞이지 않는다.
			 */
			.msg.sys,
			.msg.evt,
			.msg.ntc {
				align-self: stretch;
			}
			.msg.sys .txt,
			.msg.evt .txt,
			.msg.ntc .txt {
				width: 100%;
				border-radius: var(--r1);
			}
			.msg.say {
				align-self: flex-start;
				-webkit-touch-callout: none;
			}
			.msg.say.mine {
				align-self: flex-end;
			}

			/* 채널마다 왼쪽 띠와 글리프. 색만으로 가르면 색을 못 보는 사람에게는 한 채널이다 */
			.msg.say .txt {
				border-left: 3px solid var(--stripe, var(--line));
			}
			.ch-global {
				--stripe: var(--ok);
			}
			.ch-room {
				--stripe: var(--citizen);
			}
			.ch-mafia {
				--stripe: var(--mafia);
			}
			.ch-ghost {
				--stripe: var(--dead);
			}
			.ch-lover {
				--stripe: var(--mafia-ink);
			}
			.msg .chg .gi,
			.chat-aud .gi {
				width: 12px;
				height: 12px;
				vertical-align: -2px;
			}

			/* 말한 사람의 참가 번호. 이름보다 먼저 눈에 걸려야 "3번이 그랬지"가 된다 */
			.msg .seatno {
				display: inline-grid;
				place-items: center;
				flex: 0 0 auto;
				min-width: 16px;
				height: 16px;
				padding: 0 3px;
				font-size: 9px;
				font-weight: 800;
				font-variant-numeric: tabular-nums;
				color: var(--bg);
				background: var(--ink-2);
				border-radius: 99px;
			}
			.msg .guess {
				flex: 0 0 auto;
				padding: 0 4px;
				font-size: 9px;
				color: var(--ink-2);
				border: 1px dashed var(--ink-3);
				border-radius: 99px;
			}

			/* 줄의 번호는 누르면 메모가 열린다. 단추처럼 보이되 줄 머리를 키우지 않는다 */
			button.seatno {
				border: none;
				font-family: inherit;
				cursor: pointer;
			}
			button.seatno:hover,
			button.seatno:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}

			/*
			 * 메모 로스터. 판이 도는 동안 채팅 머리말 아래에 번호 칩이 늘어선다.
			 * 메모는 "누가 무엇을 말했나"를 읽으면서 붙이는 것이라 로그 바로 위가
			 * 제자리다 — 행동 화면에 있을 때는 단계가 바뀔 때마다 손 아래에서 사라졌다.
			 */
			.roster {
				display: flex;
				gap: 4px;
				flex: 0 0 auto;
				padding: 4px var(--s2);
				overflow-x: auto;
				border-bottom: 1px solid var(--line);
				scrollbar-width: none;
			}
			.roster .rc {
				display: inline-flex;
				align-items: center;
				gap: 2px;
				flex: 0 0 auto;
				min-width: 30px;
				min-height: 26px;
				padding: 0 6px;
				font: inherit;
				font-size: var(--t-xs);
				font-weight: 800;
				font-variant-numeric: tabular-nums;
				color: var(--ink);
				background: var(--surface-2);
				/* 아직 아무 추정도 없는 칸은 점선 — "여기 붙일 수 있다" */
				border: 1px dashed var(--ink-3);
				border-radius: 99px;
				cursor: pointer;
			}
			.roster .rc.tagged {
				border-style: solid;
				border-color: var(--ink-2);
			}
			.roster .rc.dead {
				color: var(--ink-3);
				text-decoration: line-through;
				opacity: 0.6;
			}
			.roster .rc.me {
				cursor: default;
				border-style: solid;
				border-color: var(--accent);
			}
			.roster .rc .gi {
				width: 14px;
				height: 14px;
			}
			.roster .rc:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}
			.roster .rc-help {
				flex: 0 0 auto;
				align-self: center;
				font-size: var(--t-xs);
				color: var(--ink-3);
				white-space: nowrap;
			}

			/* 추정 고르기. 로그 위에 뜨고, 고르면 닫힌다 */
			.memo-pop {
				position: absolute;
				inset: var(--s1) var(--s1) auto var(--s1);
				z-index: 4;
				display: flex;
				flex-direction: column;
				gap: var(--s1);
				padding: var(--s2);
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: var(--r1);
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
			}
			.memo-pop.hidden {
				display: none;
			}
			.memo-pop .mp-title {
				font-size: var(--t-sm);
				font-weight: 800;
			}
			.memo-pop .mp-tags {
				display: flex;
				flex-wrap: wrap;
				gap: 4px;
			}
			.memo-pop .mp-tags button {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				min-height: 32px;
				padding: 0 var(--s2);
				font: inherit;
				font-size: var(--t-sm);
				color: var(--ink);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-radius: var(--r1);
				cursor: pointer;
			}
			.memo-pop .mp-tags button.on {
				border-color: var(--accent);
				box-shadow: inset 0 0 0 1px var(--accent);
			}
			.memo-pop .mp-tags button.clear {
				color: var(--ink-2);
				border-style: dashed;
			}
			.memo-pop .mp-tags button:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}
			.memo-pop .mp-foot {
				font-size: var(--t-xs);
				color: var(--ink-3);
			}

			/* 🚨 신고는 길게 누르거나 우클릭한 줄에만 뜬다. 줄마다 서 있으면 로그가 버튼밭이 된다 */
			.msg .report {
				display: none;
				flex: 0 0 auto;
				min-height: 24px;
				padding: 0 var(--s1);
				font: inherit;
				font-size: 11px;
				font-weight: 700;
				color: var(--danger);
				background: transparent;
				border: 1px solid var(--danger);
				border-radius: var(--r1);
				cursor: pointer;
				transition: background var(--dur) var(--ease);
			}
			.msg .report:hover {
				background: var(--surface-3);
			}
			.msg.reporting .report {
				display: inline-flex;
				align-items: center;
			}
			.msg .report:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}

			/* 보내기 전에 "누가 읽는가". 탭 이름만으로는 영매·관전자가 듣는지 모른다 */
			.chat-aud {
				flex: 0 1 auto;
				max-width: 40%;
				margin-left: var(--s1);
				padding: 2px 6px;
				overflow: hidden;
				font-size: var(--t-xs);
				white-space: nowrap;
				text-overflow: ellipsis;
				color: var(--ink-2);
				border: 1px solid var(--line);
				border-radius: 99px;
			}

			/* 막힌 이유. placeholder는 글을 치는 순간 가려지므로 보내려 할 때 한 번 더 말한다 */
			.chat-hint {
				flex: 0 0 auto;
				padding: 2px var(--s2);
				font-size: var(--t-xs);
				color: var(--danger);
				background: var(--surface);
				border-top: 1px solid var(--line);
			}
		</style>
	</head>
	<body>
		<button type="button" class="chat-mini hidden" id="mini" aria-label="채팅 열기">
			<span id="miniGlyph" data-glyph="auto">💬</span>
			<span class="grow ellip" id="miniText">채팅</span>
			<span class="badge-n hidden" id="miniBadge">0</span>
		</button>

		<div class="chat hidden" id="full">
			<div class="chat-head" id="chatHead">
				<!--
					래퍼가 한 겹 더 있는 이유는 오른쪽 페이드 때문이다. 페이드를
					스크롤되는 쪽(.chat-tabs)에 얹으면 탭과 함께 밀려가 버린다.
				-->
				<div class="chat-tabwrap" id="tabwrap">
					<div class="chat-tabs" id="tabs" role="tablist" aria-label="채팅 채널"></div>
				</div>
				<!--
				글리프만 있던 자리에 글자를 붙였다. ▾ 하나로는 "접힌다"는 뜻이
				전해지지 않는다. aria-label은 남긴다 — 낭독기에 ▾가 그대로
				읽히면 오히려 방해가 된다.
			-->
				<button type="button" class="chat-fold" id="fold" aria-label="채팅 접기">
					<span aria-hidden="true">▾</span>접기
				</button>
			</div>

			<div class="roster hidden" id="roster" role="group" aria-label="내 추정 메모"></div>

			<div class="chat-body">
				<div class="memo-pop hidden" id="memoPop" role="dialog" aria-labelledby="memoTitle">
					<div class="mp-title" id="memoTitle"></div>
					<div class="mp-tags" id="memoTags"></div>
					<div class="mp-foot">내 화면에만 보입니다</div>
				</div>
				<div class="chat-log scroll" id="log" role="log" aria-live="polite"></div>
				<button type="button" class="chat-jump hidden" id="jump">새 메시지 ↓</button>
				<div class="emoji-pad hidden" id="pad" role="group" aria-label="이모지"></div>
			</div>

			<div class="quick hidden" id="quick"></div>

			<div class="chat-hint hidden" id="hint" role="status" aria-live="polite"></div>

			<div class="chat-entry">
				<button type="button" class="icon-btn" id="emoji" aria-label="이모지">☺</button>
				<!--
					명령어가 있다는 것을 알 길이 없었다. 쓸 수 있는 탭에서는
					안내 문구가 그 탭의 placeholder로 바뀌어 "(/도움말)"이
					사라지므로(ChatService의 channelViews), 정작 말을 할 수 있는
					사람만 명령어의 존재를 모르고 지나간다.
				-->
				<button type="button" class="icon-btn strong" id="help" aria-label="도움말">?</button>
				<span class="chat-aud" id="aud"></span>
				<!--
					maxlength는 편의일 뿐 한계가 아니다. 진짜 한계는 서버의
					MAX_CHAT_LENGTH다 (Widget.types.ts). 두 값은 같아야 한다.
				-->
				<input
					type="text"
					class="chat-input"
					id="input"
					maxlength="200"
					autocomplete="off"
					aria-label="메시지 입력"
					aria-describedby="aud"
				/>
				<button type="button" class="icon-btn" id="submit" aria-label="보내기">➤</button>
			</div>
		</div>

		<!--@shared-->
		<!--@native-chat-->
		<script>
			/** 위젯이 들고 있는 줄 수 상한. 서버 기록(120줄)보다 넉넉하다 */
			const MAX_LINES = 200;
			const MAX_TEXT = 200;
			/* 스크롤이 이만큼 안쪽이면 "바닥을 보고 있다"로 친다 */
			const BOTTOM_SLACK = 24;
			/** ↑로 되짚을 수 있는 이전 입력 수 */
			const MAX_SENT = 30;

			/*
			 * 이모지는 고정 목록이다. 스티커·커스텀 이모지를 붙일 자리이기도
			 * 하다 — 서버가 목록을 보내주도록 바꾸면 payload 한 필드로 끝난다.
			 */
			const EMOJI = [
				"👍",
				"👏",
				"🙏",
				"❤️",
				"😀",
				"😂",
				"😅",
				"😭",
				"😱",
				"😡",
				"🤔",
				"😎",
				"🔪",
				"👻",
				"🕵️",
				"🚨",
			];

			let lines = [];
			let channels = [];
			let quick = [];
			let active = "";
			let myId = "";
			let inputDisabled = false;
			/* 메모(memoLoad/memoSave)를 찾는 열쇠. 판마다 바뀐다 */
			let gameId = "";
			/* 메모 로스터 — 판이 도는 동안만 서버가 채운다 */
			let seats = [];
			let myNum = 0;
			/* 메모 팝오버가 열린 번호. 0이면 닫힘 */
			let memoNum = 0;
			// 메모를 닫을 때 돌려줄 포커스. null이면 게임(캔버스)으로 돌려준다
			let memoBack = null;
			// 마우스로 누르는 순간 포커스가 단추로 옮겨 가므로, 누르기 직전 것을 적어 둔다
			let focusBefore = null;
			qs("#full").addEventListener(
				"pointerdown",
				() => (focusBefore = document.activeElement),
				true
			);

			/* 추정으로 붙일 수 있는 것. 직업 전부가 아니라 판단에 쓰는 굵은 칸만 둔다 */
			const MEMO_TAGS = [
				["🔪", "마피아"],
				["💉", "의사"],
				["🔍", "경찰"],
				["🧑", "시민"],
				["❓", "모름"],
			];
			/* 위로 올라가 읽는 동안 쌓인 줄 수 (#jump) */
			let unseen = 0;

			/*
			 * 보낸 글 기록(↑/↓). 이 문서보다 오래 살아야 한다.
			 *
			 * 채팅 접기/펴기는 CSS가 아니라 크기가 다른 위젯으로 다시 여는
			 * 것이라(Widgets.ts의 openChat) 그때마다 문서가 통째로 새로 만들어진다.
			 * 여기 두면 한 번 접을 때마다 기록이 비어서, 방금 친 말도 못 되짚는다.
			 * 부모 창에 두면 프레임이 몇 번 갈리든 남는다.
			 */
			const sent = Parent.store.chatSent || (Parent.store.chatSent = []);
			let sentAt = sent.length;

			// ────────────────────────────────────────────────── 그리기

			/** epoch ms를 HH:MM으로. 서버는 UTC ms만 보내고 형식은 여기서 정한다 */
			function clock(at) {
				const d = new Date(Number(at) || 0);
				return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
			}

			function viewOf(id) {
				for (const view of channels) {
					if (view.id === id) return view;
				}
				return null;
			}

			/**
			 * 표가 딸린 줄 — 전원의 직업, 명령어 목록, 신고.
			 *
			 * 시각을 붙이지 않는다. 표는 벌어진 사건이 아니라 조회 결과라
			 * 몇 분에 나왔는지가 아무 의미가 없고, 전원 공개 표 바로 위에는
			 * 방금 같은 시각을 찍은 처형 안내가 이미 서 있다.
			 *
			 * tone은 서버가 준 문자열이지만 class에 그대로 얹지 않는다.
			 * 아는 두 값으로만 좁힌다 — 아래 bubble의 팀 배지와 같은 이유다.
			 */
			function card(line, cls) {
				const rows = line.rows.map(row => {
					const value = !row.value
						? ""
						: row.tone
							? html`<span class="chip ${row.tone === "mafia" ? "mafia" : "citizen"}"
									>${row.value}</span
								>`
							: html`<span class="val">${row.value}</span>`;
					return html`<div class="row${row.dim ? " dim" : ""}">
						<span class="ellip">${row.label}</span>${value}
					</div>`;
				});
				return html`<div class="msg card ${cls}">
					<div class="ttl">${line.text}</div>
					${rows}
				</div>`;
			}

			/** 내가 이 번호에 붙인 추정. 적는 곳은 이 창(로스터·줄 번호)이고 보드는 읽기만 한다 */
			function guessOf(num) {
				return (gameId && memoLoad(gameId)[num]) || "";
			}

			function bubble(line) {
				const when = html`<span class="when">${clock(line.at)}</span>`;

				/*
				 * 나 한 사람 앞으로 온 줄인가 (ChatMessage.to).
				 *
				 * kind와는 다른 축이다 — kind는 "무엇에 관한 말인가"이고 이쪽은
				 * "누구 앞으로 온 말인가"다. 그래서 덮어쓰지 않고 함께 붙는다.
				 * 표(rows)에는 붙이지 않는다: 개인 표는 /도움말·/신고뿐이고,
				 * 표는 이미 카드로 눈에 띈다.
				 */
				const pm = line.to !== "" ? " pm" : "";

				// 사람이 친 말이 아니면 가운데 한 줄로 눕힌다
				if (line.kind !== "USER") {
					const cls = line.kind === "EVENT" ? "evt" : line.kind === "NOTICE" ? "ntc" : "sys";
					if (line.rows && line.rows.length) return card(line, cls);
					return html`<div class="msg ${cls}${pm}">
						<div class="txt">${when} ${line.text}</div>
					</div>`;
				}

				// 내 말은 이름을 다시 읽을 필요가 없다. 시각만 남긴다
				const mine = line.senderId !== "" && line.senderId === myId;
				const view = viewOf(line.channel);
				const mark = html`<span class="chg" aria-hidden="true"
					>${glyphHtml(view ? view.glyph : "")}</span
				>`;
				let who = html`${mark}${when}`;
				let reportable = false;
				if (!mine) {
					const chip = line.role
						? html`<span class="chip ${line.team === "mafia" ? "mafia" : "citizen"}"
								>${line.role}</span
							>`
						: "";
					const name = line.num > 0 ? line.num + "번 참가자" : line.name;
					/*
					 * 받은 귓속말에만 답장 버튼을 붙인다.
					 *
					 * 답장할 상대가 분명한 줄이 이것뿐이다 — 공개 발언에 붙이면
					 * 아무나 붙잡고 밀담을 거는 버튼이 되고, 게임 중에는 애초에
					 * 귓속말이 막혀 있어 누를 수 없는 버튼만 줄마다 늘어난다.
					 *
					 * 끼울 이름은 화면에 보이는 것을 그대로 쓴다. 참가 번호가
					 * 붙어 있으면 번호가 먼저다 — 닉네임에 공백이 있어도, 같은
					 * 이름이 둘이어도 번호는 하나뿐이다.
					 */
					const token = line.num > 0 ? String(line.num) : line.name;
					const reply =
						!inputDisabled && pm !== "" && line.senderId !== ""
							? html`<button
									type="button"
									class="reply"
									data-who="${token}"
									aria-label="${name}에게 답장"
								>
									↩
								</button>`
							: "";
					// 번호를 누르면 메모가 열린다. 로스터가 없는 대기실에서는 그냥 번호다
					const seatNo =
						line.num > 0 && seats.length
							? html`<button
									type="button"
									class="seatno"
									data-memo="${line.num}"
									aria-label="${line.num}번 메모"
								>
									${line.num}
								</button>`
							: line.num > 0
								? html`<span class="seatno" aria-hidden="true">${line.num}</span>`
								: "";
					// 비어 있어도 자리를 둔다. 메모를 바꾸면 로그를 다시 그리지 않고 이 칩만 고친다
					const guess = line.num > 0 ? guessOf(line.num) : "";
					const guessChip =
						line.num > 0
							? html`<span class="guess${guess ? "" : " hidden"}" data-g="${line.num}"
									>내 추정 ${glyphHtml(guess)}</span
								>`
							: "";
					// 신고는 /신고와 같은 길이다. 답장처럼 입력창만 채우므로 서버에 새 말이 없다
					reportable = !inputDisabled && line.senderId !== "";
					const report = reportable
						? html`<button
								type="button"
								class="report"
								data-who="${token}"
								aria-label="${name} 신고"
							>
								🚨 신고
							</button>`
						: "";
					who = html`${mark}${seatNo}${guessChip}${chip}<span class="ellip">${name}</span
						>${when}${reply}${report}`;
				}

				return html`<div
					class="msg say ch-${String(line.channel).toLowerCase()}${mine ? " mine" : ""}${pm}"
					${flag(reportable, "data-report")}
				>
					<div class="who">${who}</div>
					<div class="txt">${line.text}</div>
				</div>`;
			}

			function nearBottom(el) {
				return el.scrollHeight - el.scrollTop - el.clientHeight < BOTTOM_SLACK;
			}

			function jump(show) {
				if (!show) unseen = 0;
				const el = qs("#jump");
				el.textContent = "새 메시지 " + unseen + " ↓";
				el.classList.toggle("hidden", !show);
			}

			/** 활성 탭의 줄만 다시 그린다. 탭 전환·재접속이 지나는 길 */
			function render() {
				const el = qs("#log");
				el.innerHTML = html`${lines.filter(line => line.channel === active).map(bubble)}`;
				scrollToEnd(el);
				jump(false);
			}

			function append(line) {
				// 다시 열린 탭의 기록을 서버가 통째로 다시 보낸다(refresh). 이미 든 줄은 버린다
				if (lines.some(held => held.seq === line.seq)) return;
				lines.push(line);
				if (lines.length > MAX_LINES) lines.splice(0, lines.length - MAX_LINES);
				if (line.channel !== active) return;

				const el = qs("#log");
				// 붙이기 *전에* 재야 한다. 붙인 뒤에 재면 방금 늘어난 높이 때문에
				// 늘 "위로 올라가 있음"이 되어 자동 스크롤이 영영 멈춘다.
				// 기존 roleAction.html의 밤 채팅이 정확히 이 순서로 어긋나 있었다.
				const follow = nearBottom(el);
				el.insertAdjacentHTML("beforeend", bubble(line));
				while (el.childElementCount > MAX_LINES) el.removeChild(el.firstElementChild);

				if (follow) scrollToEnd(el);
				// 읽던 자리를 뺏지 않는다. 새 줄이 왔다는 것과 몇 줄인지만 알린다
				if (!follow) unseen++;
				jump(!follow);
			}

			function badgeText(unread) {
				return unread > 99 ? "99+" : String(unread);
			}

			function tabHtml(view) {
				const badge =
					view.unread > 0 ? html`<span class="badge-n">${badgeText(view.unread)}</span>` : "";
				return html`<button
					type="button"
					role="tab"
					class="tab${view.write ? "" : " ro"}"
					aria-selected="${view.id === active}"
					data-id="${view.id}"
					aria-label="${view.label + (view.write ? "" : ", 읽기 전용")}"
				>
					<span aria-hidden="true">${glyphHtml(view.glyph)}</span><span>${view.label}</span>${badge}
				</button>`;
			}

			/*
			 * 오른쪽에 탭이 더 있는지 재서 페이드를 켠다.
			 *
			 * 재는 것 말고 방법이 없다. 탭 수로 짐작하면 글꼴·화면 폭에 따라
			 * 어긋나고, 페이드를 항상 켜 두면 탭이 둘뿐인 로비에서도 오른쪽
			 * 끝이 이유 없이 어두워진다. 2는 소수점 반올림 여유다 — 끝까지
			 * 밀어도 차이가 0이 되지 않는 엔진이 있다.
			 */
			function syncFade() {
				const el = qs("#tabs");
				qs("#tabwrap").classList.toggle(
					"more",
					el.scrollWidth - el.scrollLeft - el.clientWidth > 2
				);
			}

			function drawTabs() {
				qs("#tabs").innerHTML = html`${channels.map(tabHtml)}`;
				syncFade();
				// 고른 탭이 잘린 자리에 있으면 아무것도 고르지 않은 것처럼 보인다.
				// 밤에는 탭이 넷까지 늘어나므로 실제로 일어난다
				const chosen = qs('.tab[aria-selected="true"]', qs("#tabs"));
				if (chosen) chosen.scrollIntoView({ inline: "nearest", block: "nearest" });

				const view = viewOf(active);
				const input = qs("#input");
				/*
				 * 일반 플레이어는 입력창을 잠그지 않는다. 명령어(/도움말)는 채널
				 * 권한과 무관하게 서버가 받아주고, 밤의 시민처럼 쓸 수 있는 탭이
				 * 하나도 없는 상황이 정상이기 때문이다. 게스트만 inputDisabled로
				 * 입력기 전체를 잠근다 — 채널 하나의 상태가 아니라 계정 권한이다.
				 *
				 * 문구는 서버가 통째로 준다. 여기서 지어내면 밤·사망·관전이
				 * 모두 "지금은 읽기만 됩니다" 한 줄로 뭉개진다 — 이유를 아는
				 * 곳은 권한 표 하나뿐인데 그것이 서버에 있다.
				 */
				input.disabled = inputDisabled;
				input.placeholder = view ? view.placeholder : "";
				qs("#aud").innerHTML = view ? html`${glyphHtml(view.glyph)} ${view.audience}` : "";
				qs("#aud").classList.toggle("hidden", !view);
				for (const id of ["#emoji", "#help", "#submit"]) qs(id).disabled = inputDisabled;
				if (inputDisabled) {
					input.value = "";
					qs("#pad").classList.add("hidden");
				}
			}

			/**
			 * 방금 생긴 탭을 잠깐 강조한다. before는 직전의 탭 id 목록이다.
			 *
			 * 밤이 되면 🔪가, 방에 들어가면 💬가 조용히 하나 늘어난다. 아무도
			 * 알려주지 않으면 "밤에는 마피아끼리 말할 수 있다"를 모르고 판이 끝난다.
			 *
			 * 서버에 새 탭인지 묻지 않는다 — 직전 목록을 이 문서가 들고 있으니
			 * 여기서 알 수 있고, 물으면 payload 한 필드와 그것을 채우는 서버 쪽
			 * 판정이 함께 늘어난다. 이 문서가 스스로 아는 것은 스스로 판정한다.
			 *
			 * drawTabs()가 innerHTML을 통째로 새로 만들므로 반드시 그 뒤에 부른다.
			 */
			function flashNew(before) {
				for (const view of channels) {
					if (before.indexOf(view.id) >= 0) continue;
					const el = qs('.tab[data-id="' + view.id + '"]', qs("#tabs"));
					if (el) el.classList.add("fresh");
				}
			}

			/**
			 * 미확인 수만 갈아끼운다.
			 *
			 * 줄이 하나 올 때마다 drawTabs()를 부르면 탭 막대의 innerHTML이
			 * 통째로 새로 만들어진다. 탭에 포커스를 두고 키보드로 넘기던 중이면
			 * 포커스가 날아가고, 탭이 많아 가로 스크롤 중이면 스크롤도 처음으로
			 * 돌아간다. 실제로 바뀌는 것은 숫자 하나뿐이다.
			 */
			function drawBadges() {
				for (const tab of qsa(".tab", qs("#tabs"))) {
					const view = viewOf(tab.dataset.id);
					if (!view) continue;
					let badge = qs(".badge-n", tab);
					if (view.unread <= 0) {
						if (badge) badge.remove();
						continue;
					}
					if (!badge) {
						tab.insertAdjacentHTML("beforeend", '<span class="badge-n"></span>');
						badge = qs(".badge-n", tab);
					}
					badge.textContent = badgeText(view.unread);
				}
			}

			function drawQuick() {
				const view = viewOf(active);
				const usable = !inputDisabled && view !== null && view.write && quick.length > 0;
				qs("#quick").classList.toggle("hidden", !usable);
				if (!usable) return;
				// data-index는 누르는 쪽이 아니라 세는 쪽이 쓴다 — 장면 검사기가
				// "여덟 번째 칩이 그려졌나"를 물을 수 있는 유일한 손잡이다
				// (roleAction.html의 문구 버튼과 같은 방식)
				qs("#quick").innerHTML = html`${quick.map(
					(text, i) => html`<button type="button" data-index="${i}">${text}</button>`
				)}`;
			}

			/*
			 * 접힌 바에 뭐라고 쓸지.
			 *
			 * Enter로 열린다는 것은 아무 데도 안 적혀 있으면 아무도 모른다.
			 * 그렇다고 항상 적을 수는 없다 — 부모와 출처가 다르면 Enter는
			 * 정말로 안 먹고, 안 되는 조작을 적어두는 것이 안 적는 것보다 나쁘다.
			 */
			const MINI_LABEL = Parent.canReadKeys ? "채팅 (Enter)" : "채팅";

			/** 접힌 막대에 몇 개까지 나열할지. 그 줄에는 총합 배지가 이미 서 있다 */
			const MINI_MARKS = 3;

			function drawMini() {
				let total = 0;
				let single = "";
				const marks = [];
				for (const view of channels) {
					total += view.unread;
					if (view.unread <= 0) continue;
					single = view.glyph;
					marks.push(view.glyph);
				}
				const active_ = viewOf(active);

				/*
				 * 글리프는 "누르면 어디로 가게 되는가"다. 시끄러운 탭이 하나면
				 * 그쪽을 가리키고, 여럿이면 하나를 고를 수 없으니 채팅 자체를
				 * 뜻하는 💬로 물러난다. 조용하면 지금 보고 있던 탭이다.
				 */
				let glyph = active_ ? active_.glyph : "💬";
				if (marks.length === 1) glyph = single;
				else if (marks.length > 1) glyph = "💬";

				/*
				 * 글자는 늘 "채팅"이다 — 접힌 막대가 무엇인지는 언제 봐도 같아야 한다.
				 * 어느 탭이 시끄러운지는 왼쪽 글리프가, 여럿이면 뒤에 붙는 글리프
				 * 목록이 말하고 개수는 배지 하나가 센다. 셋을 넘기면 ⋯ 로 접는다.
				 */
				const listed =
					marks.length <= 1
						? ""
						: " " + marks.slice(0, MINI_MARKS).join(" ") + (marks.length > MINI_MARKS ? " ⋯" : "");

				setGlyph(qs("#miniGlyph"), glyph);
				qs("#miniText").textContent = total > 0 ? "채팅" + listed : MINI_LABEL;
				qs("#miniBadge").textContent = badgeText(total);
				qs("#miniBadge").classList.toggle("hidden", total === 0);
				qs("#mini").classList.toggle("alert", total > 0);
			}

			/** 막힌 이유 한 줄. ""면 걷는다 */
			function hint(text) {
				qs("#hint").textContent = text;
				qs("#hint").classList.toggle("hidden", text === "");
			}

			/*
			 * 쓰던 글. 접기/펴기가 문서를 새로 만드므로 sent처럼 부모 창에 둔다 —
			 * 펴 보니 치던 문장이 사라져 있으면 다시 칠 이유를 잃는다.
			 */
			function saveDraft() {
				Parent.store.chatDraft = qs("#input").value;
			}

			function draw() {
				// 탭이나 권한이 바뀌면 방금의 "막힌 이유"는 더 이상 맞지 않는다
				hint("");
				drawTabs();
				drawQuick();
				drawMini();
			}

			// ────────────────────────────────────────────────── 메모

			function seatOf(num) {
				for (const seat of seats) {
					if (seat.num === num) return seat;
				}
				return null;
			}

			function drawRoster() {
				const memo = gameId ? memoLoad(gameId) : {};
				const chips = seats.map(seat => {
					const glyph = memo[seat.num] || "";
					const dead = seat.alive ? "" : " dead";
					if (seat.num === myNum) {
						return html`<span class="rc me${dead}" aria-label="${seat.num}번 나"
							>${seat.num} 나</span
						>`;
					}
					return html`<button
						type="button"
						class="rc${dead}${glyph ? " tagged" : ""}"
						data-memo="${seat.num}"
						aria-label="${seat.num}번 메모${glyph ? " · 지금 " + glyph : ""}"
					>
						${seat.num}${glyphHtml(glyph)}
					</button>`;
				});
				const anyTag = seats.some(seat => memo[seat.num]);
				qs("#roster").innerHTML = html`${chips}${
					anyTag ? "" : html`<span class="rc-help">번호를 눌러 추정을 메모하세요</span>`
				}`;
				qs("#roster").classList.toggle("hidden", seats.length === 0);
			}

			function openMemo(num) {
				const seat = seatOf(num);
				if (!seat || num === myNum) return;
				memoNum = num;
				const now = guessOf(num);
				qs("#memoTitle").textContent = `${seat.name} — 내 추정`;
				qs("#memoTags").innerHTML = html`${MEMO_TAGS.map(
					([glyph, name]) =>
						html`<button
							type="button"
							class="${glyph === now ? "on" : ""}"
							data-tag="${glyph}"
							aria-pressed="${glyph === now ? "true" : "false"}"
						>
							${glyphHtml(glyph)} ${name}
						</button>`
				)}${now ? html`<button type="button" class="clear" data-tag="">지우기</button>` : ""}`;
				qs("#memoPop").classList.remove("hidden");
				qs("#pad").classList.add("hidden");
				Parent.grabFocus();
				const first = qs("#memoTags button");
				if (first) first.focus();
			}

			function closeMemo() {
				if (!memoNum) return;
				const num = memoNum;
				memoNum = 0;
				qs("#memoPop").classList.add("hidden");
				// 칩은 태그를 붙이면 다시 그려진다. 키보드로 왔으면 새로 그린 같은 칩으로 돌아간다
				const back =
					memoBack && (memoBack.isConnected ? memoBack : qs(`#roster [data-memo="${num}"]`));
				memoBack = null;
				if (back) back.focus();
				else Parent.releaseFocus();
			}

			function setMemo(num, glyph) {
				const memo = memoLoad(gameId);
				// 판마다 처음 붙일 때 한 번만 알린다. 무엇을 붙였는지는 보내지 않는다
				const first = !Object.keys(memo).some(key => memo[key]);
				if (glyph) memo[num] = glyph;
				else delete memo[num];
				memoSave(gameId, memo);
				if (first && glyph) Parent.send({ type: "memo-used" });
				drawRoster();
				for (const el of qsa(`.guess[data-g="${num}"]`, qs("#log"))) {
					el.innerHTML = String(html`내 추정 ${glyphHtml(glyph)}`);
					el.classList.toggle("hidden", !glyph);
				}
			}

			// ────────────────────────────────────────────────── 보낸 글 기록

			function remember(text) {
				// 같은 말을 두 번 이어 보냈다고 기록이 두 칸이 될 이유는 없다
				if (sent[sent.length - 1] !== text) sent.push(text);
				if (sent.length > MAX_SENT) sent.shift();
				resetRecall();
			}

			function resetRecall() {
				sentAt = sent.length;
			}

			/** step은 -1이 과거, +1이 최근. 끝까지 내려오면 빈 칸으로 돌아온다 */
			function recall(step) {
				const at = Math.max(0, Math.min(sent.length, sentAt + step));
				if (at === sentAt) return;
				sentAt = at;
				const input = qs("#input");
				input.value = at === sent.length ? "" : sent[at];
				// 커서를 끝으로. 안 하면 맨 앞에 놓여서 이어 쓰기가 어색하다
				input.setSelectionRange(input.value.length, input.value.length);
			}

			// ────────────────────────────────────────────────── 보내기

			function submit(text) {
				if (inputDisabled) return false;
				const trimmed = String(text == null ? "" : text).trim();
				if (trimmed === "") return false;
				const view = viewOf(active);
				// 명령어는 어느 탭에서든 통한다. 서버가 권한 검사보다 먼저 본다
				if (trimmed.charAt(0) !== "/" && (view === null || !view.write)) return false;
				Parent.send({ type: "send", channel: active, text: trimmed });
				remember(trimmed);
				return true;
			}

			/**
			 * 보내지 못한 글은 지우지 않는다.
			 *
			 * 읽기 전용 탭에서 Enter를 눌렀을 때 쓰던 문장이 조용히 사라지면
			 * 다시 칠 방법이 없다. 남겨두면 탭을 옮겨 그대로 보낼 수 있다.
			 */
			function submitInput() {
				const input = qs("#input");
				if (!submit(input.value)) {
					// 빈 칸 Enter는 "게임으로 돌아가기"라 말하지 않는다. 글이 있는데 못 보낸 것만 알린다
					const view = viewOf(active);
					if (input.value.trim() !== "" || inputDisabled)
						hint("🔒 " + (view ? view.placeholder : ""));
					return;
				}
				hint("");
				input.value = "";
				saveDraft();
				qs("#pad").classList.add("hidden");
			}

			// ────────────────────────────────────────────────── 채널 고르기

			function selectChannel(id) {
				if (id === active) return;

				// 줄은 이미 전부 여기 있으므로 서버를 기다릴 이유가 없다.
				// 기다리면 탭을 눌렀는데 아무 일도 안 일어난 것처럼 보인다.
				active = id;
				const view = viewOf(active);
				if (view) view.unread = 0;
				draw();
				render();
				Parent.send({ type: "channel", channel: active });
			}

			/** Tab으로 넘기기. channels는 서버가 정한 순서 그대로다 */
			function cycleChannel(step) {
				if (channels.length < 2) return;
				let at = 0;
				for (let i = 0; i < channels.length; i++) {
					if (channels[i].id === active) at = i;
				}
				selectChannel(channels[(at + step + channels.length) % channels.length].id);
			}

			// ────────────────────────────────────────────────── 조작

			qs("#tabs").addEventListener("click", event => {
				const el = event.target.closest(".tab");
				if (el) selectChannel(el.dataset.id);
			});

			// 손가락으로 탭 줄을 밀었을 때도 페이드를 다시 판정한다. 끝까지 밀었으면
			// 잘린 것이 없으므로 그림자가 남아 있어서는 안 된다
			qs("#tabs").addEventListener("scroll", syncFade);

			// 접기는 더 작은 위젯으로 다시 여는 것이다. 서버가 다시 열어준다.
			//
			// #fold가 아니라 머리말 전체에 건다. 채널을 고르는 탭만 빼면 이 줄에서
			// 할 일은 접는 것뿐이고, 탭 사이의 빈 자리는 원래 아무 일도 하지 않던
			// 곳이라 잃는 것이 없다. 손가락에게는 40px짜리 버튼 하나보다
			// 머리말 한 줄 전체가 훨씬 큰 과녁이다.
			qs("#chatHead").addEventListener("click", event => {
				if (event.target.closest(".tab")) return;
				// 버튼·답장으로 채운 글은 input 이벤트를 안 지난다. 접기 직전에 한 번 더 적는다
				saveDraft();
				Parent.send({ type: "toggle", open: false });
			});

			qs("#mini").addEventListener("click", () => {
				Parent.send({ type: "toggle", open: true });
			});

			qs("#jump").addEventListener("click", () => {
				scrollToEnd(qs("#log"));
				jump(false);
			});

			qs("#log").addEventListener("scroll", () => {
				// 스크롤하는 손가락은 길게 누르기가 아니다
				cancelPress();
				if (nearBottom(qs("#log"))) jump(false);
			});

			/*
			 * 답장(↩). 보내지 않고 입력창을 채우기만 한다.
			 *
			 * 곧바로 보내면 무엇을 보낼지 정하기 전에 밀담이 나가고, 답장 전용
			 * 상태를 따로 들면 "지금 어디에 쓰는 중인가"가 화면 어디에도 없는
			 * 숨은 상태로 생긴다. 입력창에 명령어가 그대로 보이면 상태가 곧 화면이고,
			 * 마음이 바뀌면 Escape 한 번으로 지워진다.
			 *
			 * 줄 하나가 아니라 로그 전체에 건다 — render()가 innerHTML을 통째로
			 * 갈아치우므로 줄에 직접 건 리스너는 다음 탭 전환에 사라진다.
			 */
			/* 줄 번호·로스터 칩 → 메모. 입력이 잠긴 관전자도 자기 메모는 쓸 수 있다 */
			function memoClick(event) {
				const el = event.target.closest("[data-memo]");
				if (!el) return false;
				const num = Number(el.dataset.memo);
				if (memoNum === num) {
					closeMemo();
					return true;
				}
				// 키보드(detail 0)면 누른 칩으로, 마우스면 치던 입력칸으로만 돌아간다.
				// 열린 채로 다른 번호로 옮겨 가면 처음 돌아갈 곳을 그대로 둔다
				const input = qs("#input");
				if (!memoNum) memoBack = event.detail === 0 ? el : focusBefore === input ? input : null;
				openMemo(num);
				return true;
			}
			qs("#roster").addEventListener("click", memoClick);

			qs("#memoTags").addEventListener("click", event => {
				const el = event.target.closest("[data-tag]");
				if (!el || !memoNum) return;
				setMemo(memoNum, el.dataset.tag);
				closeMemo();
			});

			qs("#memoPop").addEventListener("keydown", event => {
				if (event.key === "Escape") closeMemo();
			});

			// 바깥을 누르면 닫는다. 팝오버 안과 메모를 여는 단추는 제 리스너가 맡는다
			qs("#full").addEventListener("click", event => {
				if (memoNum && !event.target.closest("#memoPop, [data-memo]")) closeMemo();
			});

			qs("#log").addEventListener("click", event => {
				if (memoClick(event)) return;
				if (inputDisabled) return;
				const report = event.target.closest(".report");
				if (report) {
					report.closest(".msg").classList.remove("reporting");
					qs("#input").value = "/신고 " + report.dataset.who + " ";
					takeFocus(false);
					return;
				}
				const el = event.target.closest(".reply");
				if (!el) return;
				qs("#input").value = "/귓속말 " + el.dataset.who + " ";
				takeFocus(false);
			});

			/*
			 * 🚨 신고 꺼내기. 우클릭, 손가락은 길게 누르기(~500ms).
			 *
			 * 줄마다 버튼을 세워 두면 발언 하나하나가 "신고하세요"로 읽힌다. 찾는
			 * 사람만 꺼내게 숨겨 두고, 꺼낸 줄은 한 번에 하나다.
			 */
			const LONG_PRESS = 500;
			let pressTimer = 0;

			function showReport(line) {
				for (const el of qsa(".msg.reporting", qs("#log"))) el.classList.remove("reporting");
				line.classList.add("reporting");
			}

			function cancelPress() {
				clearTimeout(pressTimer);
				pressTimer = 0;
			}

			qs("#log").addEventListener("contextmenu", event => {
				const line = event.target.closest(".msg[data-report]");
				if (!line) return;
				event.preventDefault();
				cancelPress();
				showReport(line);
			});

			qs("#log").addEventListener("pointerdown", event => {
				const line = event.target.closest(".msg[data-report]");
				// 마우스는 우클릭이 있다. 누른 채 끌어 글을 고르는 손을 막지 않는다
				if (!line || event.pointerType === "mouse") return;
				cancelPress();
				pressTimer = setTimeout(() => showReport(line), LONG_PRESS);
			});
			for (const type of ["pointerup", "pointercancel", "pointerleave"]) {
				qs("#log").addEventListener(type, cancelPress);
			}

			qs("#emoji").addEventListener("click", () => {
				qs("#pad").classList.toggle("hidden");
			});

			/*
			 * 도움말. submit()을 지나지 않고 직접 보낸다.
			 *
			 * submit()은 보낸 글을 ↑ 기록에 남기는데(remember), 버튼으로 열어 본
			 * 도움말이 기록에 끼면 방금 친 말을 되짚으려던 사람이 자기가 치지도
			 * 않은 /도움말을 만난다.
			 *
			 * 채널은 지금 탭을 그대로 보낸다. 명령어는 권한 검사보다 먼저
			 * 처리되므로(ChatService.submit) 밤에 아무 데도 쓸 수 없는 시민도 열린다.
			 */
			qs("#help").addEventListener("click", () => {
				Parent.send({ type: "send", channel: active, text: "/도움말" });
			});

			qs("#pad").addEventListener("click", event => {
				if (event.target.tagName !== "BUTTON") return;
				const input = qs("#input");
				input.value = (input.value + event.target.textContent).slice(0, MAX_TEXT);
				qs("#pad").classList.add("hidden");
				input.focus();
			});

			qs("#quick").addEventListener("click", event => {
				if (event.target.tagName !== "BUTTON") return;
				submit(event.target.textContent);
			});

			qs("#submit").addEventListener("click", submitInput);

			qs("#input").addEventListener("input", () => {
				hint("");
				saveDraft();
			});

			// ────────────────────────────────────────────────── 키보드

			/**
			 * 입력창으로 포커스를 옮긴다. 접혀 있으면 먼저 펴야 한다.
			 *
			 * 펴기는 위젯을 다시 여는 것이라 이 문서가 그 자리에서 사라진다.
			 * 그래서 "펴고 나서 포커스"를 여기서 이어 할 수 없다 — 무엇에
			 * 포커스를 줄지 서버에 함께 알려주고, 새로 뜬 문서가 init에서 받는다.
			 */
			function focusInput(slash) {
				if (inputDisabled) return;
				if (qs("#full").classList.contains("hidden")) {
					Parent.send({ type: "toggle", open: true, focus: slash ? "command" : "input" });
					return;
				}
				takeFocus(slash);
			}

			function takeFocus(slash) {
				if (inputDisabled) return;
				// 게임 화면에서 들어온 길에서는 포커스가 아직 캔버스에 있다
				Parent.grabFocus();
				const input = qs("#input");
				// /는 명령어의 첫 글자다. 넣어두면 바로 이어 칠 수 있다
				if (slash && input.value === "") input.value = "/";
				input.focus();
				input.setSelectionRange(input.value.length, input.value.length);
			}

			qs("#input").addEventListener("keydown", event => {
				const input = qs("#input");

				if (event.key === "Enter") {
					submitInput();
					// 한 줄 보냈으면 곧바로 걸어 다닐 수 있어야 한다. 포커스를
					// 들고 있으면 WASD가 이 입력칸으로 들어온다
					Parent.releaseFocus();
					return;
				}

				if (event.key === "Escape") {
					// 두 걸음이다. 쓰던 글을 먼저 비우고, 빈 칸에서 한 번 더 누르면
					// 게임으로 돌아간다. 한 걸음이면 오타를 지우려다 창을 닫는다
					if (input.value !== "") {
						input.value = "";
						saveDraft();
						resetRecall();
						return;
					}
					qs("#pad").classList.add("hidden");
					input.blur();
					Parent.releaseFocus();
					return;
				}

				if (event.key === "Tab") {
					// 위젯 안에는 Tab으로 갈 만한 곳이 몇 개 없다. 채널 전환이
					// 훨씬 쓸모 있다. 밖으로 나가는 길은 Escape가 맡는다
					event.preventDefault();
					cycleChannel(event.shiftKey ? -1 : 1);
					return;
				}

				if (event.key === "ArrowUp" || event.key === "ArrowDown") {
					// 기본 동작은 커서를 글 끝으로 보내는 것이다. 되짚기와 겹친다
					event.preventDefault();
					recall(event.key === "ArrowUp" ? -1 : 1);
				}
			});

			/*
			 * 게임 화면(캔버스)에 포커스가 있는 동안 눌린 키.
			 *
			 * 위젯 안에서 누른 키는 여기로 오지 않는다 — 키 이벤트는 프레임
			 * 경계를 넘지 않기 때문이다. 그래서 "지금 채팅을 치는 중인가"를 따로
			 * 들고 있을 필요가 없고, 치는 동안 이동·단축키를 꺼줄 일도 없다.
			 * 입력창에 친 WASD는 애초에 ZEP 캔버스에 닿지 않는다.
			 *
			 * 부모와 출처가 다르면 이 구독은 조용히 없던 일이 된다(bridge.js).
			 * 그때는 채팅창을 눌러서 여는 지금까지의 길이 그대로 남는다.
			 */
			Parent.onKey(event => {
				if (event.key !== "Enter" && event.key !== "/") return;
				// ZEP 기본 채팅도 Enter로 열린다. 둘 다 열리면 지금 어느 쪽에
				// 쓰고 있는지 알 수 없다. 여기서 끊어 하나만 열리게 한다
				event.preventDefault();
				event.stopImmediatePropagation();
				focusInput(event.key === "/");
			});

			qs("#pad").innerHTML = html`${EMOJI.map(
				glyph => html`<button type="button" aria-label="${glyph}">${glyph}</button>`
			)}`;

			// ────────────────────────────────────────────────── 서버

			Parent.on({
				init(data) {
					myId = data.myId || "";
					channels = data.channels || [];
					quick = data.quick || [];
					active = data.active || "";
					lines = data.lines || [];
					inputDisabled = data.inputDisabled === true;
					gameId = data.gameId || "";
					seats = data.seats || [];
					myNum = Number(data.myNum) || 0;

					const open = data.open === true;
					qs("#full").classList.toggle("hidden", !open);
					qs("#mini").classList.toggle("hidden", open);

					draw();
					drawRoster();
					render();

					/*
					 * 다른 위젯이 채워 달라고 부탁한 글 (프로필 창의 💌).
					 *
					 * 접혀 있었다면 서버가 펴면서 이 길로 실어 보낸다 — 펴기는
					 * 위젯을 다시 여는 것이라 접혀 있던 문서가 남겨 줄 방법이 없다.
					 */
					if (!inputDisabled && data.prefill) {
						qs("#input").value = String(data.prefill).slice(0, MAX_TEXT);
					} else if (!inputDisabled && Parent.store.chatDraft) {
						// 부탁받은 글이 없으면 접기 전에 쓰던 글을 되살린다
						qs("#input").value = String(Parent.store.chatDraft).slice(0, MAX_TEXT);
					}

					// 게임 화면에서 Enter로 펴고 들어온 경우. 앞 문서가 남긴
					// 의도를 이어받는 곳은 여기 하나뿐이다
					if (data.focus) takeFocus(data.focus === "command");
				},

				/** 이미 펴져 있을 때의 같은 부탁. 문서가 살아 있으니 바로 채운다 */
				prefill(data) {
					if (inputDisabled) return;
					qs("#input").value = String(data.text || "").slice(0, MAX_TEXT);
					takeFocus(false);
				},

				/*
				 * 권한만 바뀐 것이다 (단계 전환·사망·입퇴장). 다시 그리지 않는
				 * 이유는 읽던 자리와 입력하던 글자를 지키기 위해서다 —
				 * 활성 탭이 실제로 바뀌었을 때만 기록을 갈아끼운다.
				 */
				channels(data) {
					const next = data.active || active;
					const moved = next !== active;
					// 무엇이 늘었는지 알 수 있는 마지막 순간이다. 아래에서 덮인다
					const before = channels.map(view => view.id);
					channels = data.channels || [];
					quick = data.quick || [];
					inputDisabled = data.inputDisabled === true;
					// 판이 시작되어도 채팅은 다시 열리지 않는다. 메모 열쇠는 이 길로 바뀐다
					const game = gameId;
					gameId = data.gameId || "";
					const roster = seats.length;
					seats = data.seats || [];
					myNum = Number(data.myNum) || 0;
					active = next;
					draw();
					drawRoster();
					// 판이 바뀌면 열려 있던 메모는 지난 판의 것이다
					if (game !== gameId) closeMemo();
					// init에서는 부르지 않는다 — 접었다 펴는 것도 새 문서라
					// 그때마다 모든 탭이 "방금 생긴 탭"이 되어 판마다 깜빡인다
					flashNew(before);
					// 줄 번호가 메모 단추가 되거나 그만두는 순간에도 다시 그린다
					if (moved || (roster === 0) !== (seats.length === 0) || game !== gameId) render();
				},

				/*
				 * 서버가 허락한 발언을 ZEP 기본 채팅으로도 내보낸다 —
				 * 내 아바타 위에 말풍선이 뜬다.
				 *
				 * 어느 채널이 여기 오는지도, 청중을 어디까지 넓힐지(data.area)도
				 * 서버가 정한다 (ChatChannel의 zepAudienceFor). 위젯은 판단하지
				 * 않는다 — 마피아 밀담이 이 길로 새면 게임이 그 자리에서 끝난다.
				 */
				say(data) {
					NativeChat.say(data.text, data.area);
				},

				line(data) {
					if (data.channels) channels = data.channels;
					if (data.line) append(data.line);
					drawBadges();
					drawMini();
				},
			});
		</script>
	</body>
</html>
