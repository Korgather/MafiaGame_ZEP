<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>전환</title>
		<!--@theme-->
		<style>
			/*
			 * 단계 전환 컷.
			 *
			 * 다른 위젯과 규칙이 둘 다르다.
			 *
			 * 1. .panel을 쓰지 않는다. panel은 "화면 한쪽에 놓인 판"의 문법이고
			 *    (테두리·둥근 모서리·그림자) 이 위젯은 화면 그 자체다. 테두리가
			 *    보이는 순간 "덮었다"가 아니라 "큰 창이 떴다"로 읽힌다.
			 *
			 * 2. 시간 진행을 JS 타이머로 만들지 않는다. 서버가 payload에 실어 준
			 *    ms 하나에서 모든 지연을 비율로 계산해 CSS animation-delay로 넘긴다.
			 *    setInterval로 한 줄씩 붙이면 프레임이 밀릴 때 서버가 컷을 걷는
			 *    순간까지 마지막 줄이 안 뜰 수 있고, 무엇보다 "언제 무엇이 뜨는가"가
			 *    두 곳(여기와 Cut.ts)에 나뉜다.
			 *
			 * 개정에서 바뀐 것: 톤별 색을 theme.css의 단계 토큰에서 가져온다.
			 * 전에는 같은 색을 rgba로 다시 적고 있어서, 밤 배경을 조정하면
			 * 진행 화면과 컷이 어긋났다.
			 */
			.cut {
				position: relative;
				display: flex;
				align-items: center;
				justify-content: center;
				width: 100%;
				height: 100%;
				padding: var(--s6);
				text-align: center;
				/* 아래 톤 클래스가 덮어쓴다 */
				--ink-cut: var(--accent);
				--cut-1: var(--surface);
				--cut-2: var(--bg);
				--vignette: rgba(0, 0, 0, 0.45);
				background: linear-gradient(160deg, var(--cut-1) 0%, var(--cut-2) 100%);
				/*
				 * 맵이 희미하게 비쳐야 "게임이 잠깐 멈춘 것"이지 "다른 화면으로
				 * 넘어간 것"이 아니다. 불투명도를 그라디언트 색이 아니라 여기서
				 * 한 번에 준다 — 톤이 늘어도 이 값을 다시 적지 않는다.
				 */
				opacity: 0.96;
			}

			.cut.night {
				--ink-cut: #9db4ee;
				--cut-1: var(--night-1);
				--cut-2: var(--night-2);
				/* 밤이 가장 짙다. 가장자리를 닫아야 화면이 좁아진 느낌이 난다 */
				--vignette: rgba(0, 0, 0, 0.62);
			}
			.cut.day {
				--ink-cut: var(--accent);
				--cut-1: var(--day-1);
				--cut-2: var(--day-2);
				/* 아침은 열려야 한다. 밤과 같은 값을 쓰면 아침이 밤처럼 답답하다 */
				--vignette: rgba(0, 0, 0, 0.28);
			}
			.cut.mafia {
				--ink-cut: var(--mafia-ink);
				--cut-1: var(--mafia-dim);
				--cut-2: #180c0c;
				--vignette: rgba(48, 6, 6, 0.66);
			}
			.cut.citizen {
				--ink-cut: var(--citizen-ink);
				--cut-1: var(--citizen-dim);
				--cut-2: #0b1218;
				--vignette: rgba(4, 14, 26, 0.5);
			}

			/*
			 * 비네팅. 가장자리를 눌러 가운데 글자로 시선을 모은다.
			 *
			 * 톤마다 색과 세기가 다른 이유는 이 한 겹이 "어떤 컷인가"를 배경색
			 * 다음으로 크게 말하기 때문이다. 밤은 닫히고 아침은 열리며 마피아
			 * 승리는 붉게 닫힌다 — 제목을 읽기 전에 그것부터 온다.
			 */
			.cut::after {
				content: "";
				position: absolute;
				inset: 0;
				pointer-events: none;
				background: radial-gradient(ellipse 78% 62% at 50% 50%, transparent 38%, var(--vignette) 100%);
			}

			/*
			 * 마피아가 이긴 컷에만 붉은 섬광이 한 번 스친다.
			 *
			 * 시민 승리에 대칭을 맞추지 않는다. 두 컷 모두 번쩍이면 그것은
			 * 연출이 아니라 이 위젯의 기본 동작이 되고, 그러면 어느 쪽이
			 * 이겼는지를 섬광이 더 이상 말해주지 않는다. 한 번, 520ms.
			 */
			.cut.mafia::before {
				content: "";
				position: absolute;
				inset: 0;
				pointer-events: none;
				background: rgba(232, 85, 79, 0.45);
				animation: strike 520ms var(--ease) 120ms both;
			}

			@keyframes strike {
				0% {
					opacity: 0;
				}
				18% {
					opacity: 1;
				}
				100% {
					opacity: 0;
				}
			}

			/*
			 * 두 겹(::before·::after)이 글자를 덮지 않게 띄운다. 가상 요소는
			 * position: absolute라 아무것도 하지 않으면 static인 .band 위에 온다.
			 */
			.band {
				position: relative;
				z-index: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: var(--s3);
				max-width: 640px;
			}

			/*
			 * 제목은 자간이 좁혀지며 들어온다.
			 *
			 * 줄과 같은 rise를 쓰면 제목이 여러 줄 중 첫 줄로 읽힌다. 컷에서
			 * 제목은 그 화면의 이름이고("🌙 3번째 밤"), 이름은 다른 방식으로
			 * 도착해야 한다. 벌어진 글자가 제자리로 모이는 동안 눈이 그 줄에
			 * 머무는 것이 여기서 필요한 전부다.
			 */
			.title {
				font-size: var(--t-2xl);
				font-weight: 800;
				line-height: 1.2;
				letter-spacing: -0.02em;
				color: var(--ink-cut);
				text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
				word-break: keep-all;
				animation: headline 520ms var(--ease) 80ms both;
			}

			@keyframes headline {
				from {
					opacity: 0;
					letter-spacing: 0.22em;
					transform: translateY(6px);
				}
			}

			.lines {
				display: flex;
				flex-direction: column;
				gap: var(--s2);
			}

			/*
			 * 한 줄씩 떠오른다. 지연은 서버가 준 길이에서 계산해 style로 박는다 —
			 * 줄 수가 몇이든 마지막 줄이 컷이 걷히기 전에 뜬다.
			 */
			.lines span {
				font-size: var(--t-lg);
				color: var(--ink);
				word-break: keep-all;
				animation: rise 420ms var(--ease) both;
			}

			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(10px);
				}
			}

			/*
			 * 남은 시간. 숫자를 읽게 하지 않는다 — 읽어서 할 일이 없는 시간이고,
			 * 다만 "곧 끝난다"는 것만 보이면 멈춘 화면으로 오해하지 않는다.
			 */
			.clockbar {
				width: 96px;
				height: 2px;
				border-radius: 99px;
				background: rgba(255, 255, 255, 0.14);
				overflow: hidden;
			}

			.clockbar i {
				display: block;
				width: 100%;
				height: 100%;
				background: var(--ink-cut);
				transform-origin: left center;
				animation: drain linear both;
			}

			@keyframes drain {
				to {
					transform: scaleX(0);
				}
			}

			@keyframes veil {
				from {
					opacity: 0;
				}
			}

			@keyframes fade {
				to {
					opacity: 0;
				}
			}
		</style>
	</head>
	<body>
		<div class="cut" id="cut" role="status" aria-live="polite">
			<div class="band">
				<h1 class="title" id="title"></h1>
				<div class="lines" id="lines"></div>
				<div class="clockbar" aria-hidden="true"><i id="clockbar"></i></div>
			</div>
		</div>

		<!--@shared-->
		<script>
			/*
			 * 컷 길이(ms) 안에서 각 구간이 차지하는 비율.
			 *
			 * 초 단위 상수를 여기에 또 두지 않는 것이 요점이다. Cut.ts의 LEAD/STEP/TAIL이
			 * 바뀌거나 상한(MAX)에 걸려 길이가 줄어도, 비율로 나누면 줄이 잘리지 않는다.
			 */
			const HEAD = 0.18;
			const BODY = 0.62;
			/** 화면이 걷히기 직전에 흐려지는 시간(ms) */
			const OUT = 300;

			Parent.on({
				init(data) {
					const ms = Math.max(1000, Number(data.ms) || 3000);
					const lines = Array.isArray(data.lines) ? data.lines : [];
					const cut = qs("#cut");

					cut.classList.add(data.tone || "neutral");
					// 나타남과 사라짐을 한 줄에 싣는다. 걷는 것은 서버(Cut.ts의 advanceCut)라
					// 여기서는 그 순간에 맞춰 흐려지기만 하면 된다
					cut.style.animation =
						"veil 260ms var(--ease), fade " +
						OUT +
						"ms var(--ease) " +
						Math.max(0, ms - OUT) +
						"ms both";

					qs("#title").textContent = data.title || "";
					qs("#lines").innerHTML = html`${lines.map(
						(line, i) =>
							html`<span style="animation-delay:${Math.round(
								ms * (HEAD + (BODY * i) / lines.length)
							)}ms"
								>${line}</span
							>`
					)}`;
					qs("#clockbar").style.animationDuration = ms + "ms";
				},
			});
		</script>
	</body>
</html>
