<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>투표</title>
		<!--@theme-->
		<style>
			/*
			 * 투표 + 개표. 한 파일이 두 메시지를 받는다 — init(투표) / result(개표).
			 * 격자는 4열 auto라 인원수와 무관하다.
			 *
			 * 개정에서 바뀐 것
			 * ---------------
			 * 1. 신분 줄이 생겼다. 이 화면에도 직업이 보여야 한다는 요구는
			 *    "자기 직업이 항상 보인다"의 일부인데, 투표 화면은 판에서 가장
			 *    오래 떠 있는 화면 중 하나면서 유일하게 직업을 안 보여줬다.
			 *    생존 n/m은 seats의 alive를 세서 만든다 — 추가 필드가 없다.
			 * 2. '투표 없음'이 격자 안에서 푸터로 내려갔다. 격자 안에 있으면
			 *    번호를 세며 누르는 눈과 손이 사람이 아닌 칸 하나를 통과해야
			 *    하고, 마지막 줄 위치가 인원수에 따라 흔들린다. 푸터로 내리면
			 *    "사람을 고른다"와 "아무도 고르지 않는다"가 자리로 갈린다.
			 * 3. 진행률 문구가 지시 줄 둘째 줄로 올라갔다(전에는 hd-sub).
			 */

			/*
			 * 개표에서 단상에 오른 사람. 최다 득표자일 뿐이고, 죽는지는 최후의
			 * 반론과 찬반투표를 거쳐야 정해진다. 흔들림은 그대로 둔다 —
			 * 지목당한 순간의 무게는 달라지지 않았다.
			 */
			.tile.out {
				border-color: var(--danger);
				background: var(--mafia-dim);
				animation: shake 420ms var(--ease);
			}

			@keyframes shake {
				0%,
				100% {
					transform: translateX(0);
				}
				25% {
					transform: translateX(-4px);
				}
				75% {
					transform: translateX(4px);
				}
			}

			/*
			 * 방금 부결된 사람. 같은 낮에 두 번 단상에 세우지 않는다.
			 * 사망과 같은 회색으로 두면 "죽은 줄 알았는데 살아 있다"가 되므로
			 * 배지로 이유를 적는다 — 눌리지 않는 칸에는 항상 이유가 있어야 한다.
			 */
			.tile.barred {
				opacity: 0.55;
			}

			.tile.barred .badge {
				color: var(--ink-3);
			}

			/* 개표에서 득표수가 들어갈 자리를 아래에 비워 둔다 */
			.tile.counted {
				padding-bottom: 15px;
			}

			/* 득표 막대. 숫자 하나보다 상대 비교가 빠르다 */
			.bar {
				position: absolute;
				left: 0;
				bottom: 0;
				height: 3px;
				width: 0;
				background: var(--accent);
				/* 길이와 순서는 스크립트가 준다(BAR_MS·STAGGER). 처형 흔들림을
				   "막대가 다 찬 뒤"로 미루려면 같은 값을 알아야 해서 한 곳에만 둔다 */
				transition-property: width;
				transition-timing-function: var(--ease);
			}

			/* '투표 없음' 버튼. 폭 전체를 쓴다 */
			.skip-btn {
				flex: 1 1 auto;
				gap: var(--s2);
				font-weight: 700;
				color: var(--ink-2);
			}
			.skip-btn.picked {
				color: var(--ink);
				background: var(--mafia-dim);
				border-color: var(--mafia);
			}
		</style>
	</head>
	<body>
		<div class="panel vote">
			<div class="idbar">
				<span class="chip" id="myrole">직업</span>
				<span class="ability" id="ability"></span>
				<span class="stat" id="alive"></span>
			</div>

			<div class="lead">
				<div class="lead-text">
					<div class="lead-title" id="heading">투표</div>
					<div class="lead-sub count" id="sub"></div>
				</div>
				<div class="clock" id="timer"></div>
			</div>

			<div class="timeline" aria-hidden="true"><i></i></div>
			<div class="progress" aria-hidden="true"><i id="progress"></i></div>

			<div class="body scroll">
				<div class="grid" id="grid" role="group" aria-label="투표 대상"></div>
			</div>

			<p class="note" id="note" role="status" aria-live="polite"></p>

			<div class="foot" id="foot">
				<button type="button" class="btn skip-btn" id="skip">
					<span aria-hidden="true">🚫</span>투표 없음 — 오늘은 아무도 처형하지 않습니다
				</button>
			</div>
		</div>

		<!--@shared-->
		<script>
			let myNum = 0;
			let myPick = null;
			let locked = false;
			/* 이번 낮에 찬반투표에서 부결된 번호들. 다시 고를 수 없다 */
			let barred = [];

			/* 막대 하나가 차는 시간과 타일 사이 간격(ms) */
			const BAR_MS = 600;
			const STAGGER = 90;

			/* '투표 없음'의 대상 번호. 서버의 Vote.SKIP_VOTE와 같은 값이어야 한다 */
			const SKIP = -1;

			/**
			 * 사람 타일 하나.
			 * seat: { num, name, alive, votes }
			 * "나"는 좌석마다 표시를 실어 보내지 않고 myNum과 비교해서 정한다 —
			 * 같은 목록을 전원에게 그대로 보낼 수 있어야 하기 때문이다.
			 */
			function tile(seat, extra) {
				const mine = seat.num === myNum;
				const out = barred.indexOf(seat.num) >= 0;
				const caption = mine ? "나" : seat.alive ? seat.name || "" : "사망";
				const classes =
					"tile" +
					(mine ? " me" : "") +
					(seat.alive ? "" : " dead") +
					(out ? " barred" : "") +
					(extra ? " " + extra : "");

				return html`<button
					type="button"
					class="${classes}"
					data-num="${seat.num}"
					${flag(locked || !seat.alive || out, "disabled")}
					aria-label="${seat.num}번 ${seat.name || ""}${out ? " (부결됨)" : ""}"
				>
					<span class="num">${seat.num}</span><span class="cap">${caption}</span>
					${out ? html`<span class="badge">부결</span>` : ""}
				</button>`;
			}

			function seats(data) {
				return Array.isArray(data.seats) ? data.seats : [];
			}

			/**
			 * 생존 n/m. 서버가 따로 보내지 않는다 — seats에 alive가 이미 있어서
			 * 세면 나오고, 새 필드는 언젠가 목록과 어긋난다.
			 */
			function paintAlive(list) {
				let alive = 0;
				for (const seat of list) {
					if (seat.alive) alive++;
				}
				qs("#alive").textContent = `생존 ${alive}/${list.length}`;
			}

			function paintPick() {
				for (const el of qsa(".tile")) {
					el.classList.toggle("picked", Number(el.dataset.num) === myPick);
				}
				qs("#skip").classList.toggle("picked", myPick === SKIP);
			}

			function pickNote() {
				if (myPick === null) return "기권했습니다. 다시 고를 수 있습니다.";
				if (myPick === SKIP) return "'투표 없음'을 골랐습니다. 다시 누르면 취소됩니다.";
				return `${myPick}번을 지목했습니다. 다시 누르면 취소됩니다.`;
			}

			/**
			 * 한 표를 넣거나 되돌린다. 격자와 '투표 없음' 버튼이 같이 쓴다 —
			 * 둘이 각자 보내면 취소 규칙이 두 벌이 되고, 그 둘은 언젠가 어긋난다.
			 */
			function choose(num) {
				if (locked) return;
				// 같은 대상을 다시 누르면 취소. 기존에는 한 번 누르면 되돌릴 수
				// 없었고, 눌렸다는 표시조차 없어서 오조작을 알 방법이 없었다
				myPick = myPick === num ? null : num;
				paintPick();
				Parent.send({ type: "vote", target: myPick });
				qs("#note").textContent = pickNote();
			}

			qs("#grid").addEventListener("click", event => {
				const el = event.target.closest(".tile");
				if (!el || el.disabled) return;
				choose(Number(el.dataset.num));
			});

			/*
			 * '투표 없음'. 기권(아무것도 안 누르기)과 다른 선택이다. 기권은
			 * 판단을 남에게 미루는 것이고 이쪽은 "오늘은 아무도 죽이지 말자"는
			 * 한 표다 — 단서가 없는 날 무고한 시민을 죽이지 않고 넘기는 길이다.
			 */
			qs("#skip").addEventListener("click", () => choose(SKIP));

			Parent.on({
				init(data) {
					myNum = Number(data.myNum) || 0;
					// 화면을 다시 여는 경로는 재접속뿐이라 산 사람은 계속 찍을 수
					// 있어야 한다. 잠기는 쪽은 유령 하나다 — 서버도 Voting.canVote로
					// 막지만, 눌리는 버튼을 남기면 실제로 투표된 것처럼 보인다
					const list = seats(data);
					const ghost = list.some(seat => seat.num === myNum && !seat.alive);
					locked = ghost;
					// 재지목이면 방금 부결된 번호가 실려 온다. 첫 투표에서는 빈 배열이다
					barred = Array.isArray(data.rejected) ? data.rejected : [];
					// 재접속으로 화면을 다시 열었을 때 이미 넣은 표를 복원한다.
					// SKIP(-1)도 그대로 살아난다 — 0만 "아직 안 찍음"이다
					myPick = Number(data.picked) || null;

					const role = qs("#myrole");
					role.textContent = (data.glyph ? data.glyph + " " : "") + (data.role || "");
					role.className =
						"chip " + (data.alive === false ? "dead" : data.team === "mafia" ? "mafia" : "citizen");
					qs("#ability").textContent = data.abilityLine || "";
					paintAlive(list);

					qs("#heading").textContent = ghost ? "투표할 수 없습니다" : "누구를 처형할까요";
					qs("#grid").innerHTML = html`${list.map(seat => tile(seat))}`;
					qs("#foot").classList.remove("hidden");
					qs("#skip").disabled = locked;
					paintPick();
					qs("#note").textContent = ghost
						? "👻 유령은 투표할 수 없습니다."
						: myPick === null
							? "고르지 않으면 기권입니다. 단서가 없으면 '투표 없음'도 한 표입니다."
							: pickNote();
					startTimer(qs("#timer"), data.timer);
				},

				// 투표한 사람 수만 갱신한다. 누가 누구를 찍었는지는 개표까지 감춘다
				progress(data) {
					const done = Number(data.voted) || 0;
					const total = Number(data.alive) || 1;
					qs("#progress").style.width = Math.round((done / total) * 100) + "%";
					qs("#sub").textContent = `${done}/${total} 투표 완료`;
				},

				result(data) {
					locked = true;
					myNum = Number(data.myNum) || 0;
					const list = seats(data);

					const role = qs("#myrole");
					role.textContent = (data.glyph ? data.glyph + " " : "") + (data.role || "");
					role.className =
						"chip " + (data.alive === false ? "dead" : data.team === "mafia" ? "mafia" : "citizen");
					qs("#ability").textContent = data.abilityLine || "";
					paintAlive(list);

					qs("#heading").textContent = "개표";
					qs("#progress").style.width = "100%";
					// 개표에는 진행률 문구가 없다. 빈 자리에 서버가 보낸 결과 한 줄을
					// 올린다 — 아래 note에 두면 같은 글이 화면에 두 번 남는다
					qs("#sub").textContent = data.message || "";
					qs("#sub").classList.remove("count");
					qs("#note").textContent = "";
					// 고를 것이 없는 화면에서 '투표 없음'은 자리만 차지한다
					qs("#foot").classList.add("hidden");

					const top = list.reduce((max, seat) => Math.max(max, Number(seat.votes) || 0), 0);

					qs("#grid").innerHTML = html`${list.map(seat =>
						tile(seat, "counted" + (seat.num === data.nominee ? " out" : ""))
					)}`;

					/*
					 * 득표수를 타일 위에 얹는다. 예전에는 이름과 숫자가 별도
					 * 격자에 있어서 어느 숫자가 누구 것인지 눈으로 이어야 했다.
					 *
					 * 막대는 폭 0으로 심고 실제 폭은 다음 프레임에 준다. 최종
					 * 폭을 처음부터 박아 넣으면 브라우저에게는 한 번도 바뀐 적
					 * 없는 값이라 transition이 걸리지 않는다.
					 */
					const bars = [];
					let outTile = null;
					list.forEach((seat, i) => {
						const el = qs(`.tile[data-num="${seat.num}"]`);
						if (!el) return;
						if (seat.num === data.nominee) outTile = el;
						const votes = Number(seat.votes) || 0;
						el.insertAdjacentHTML(
							"beforeend",
							html`<span class="tally">${votes}표</span><span class="bar"></span>`
						);
						const bar = qs(".bar", el);
						bar.style.transitionDuration = BAR_MS + "ms";
						// 서버가 득표 내림차순으로 보낸다(Voting.voteBoard). 위에서부터
						// 차례로 차오르면 1등이 누구인지 마지막 막대를 기다리지 않고 보인다
						bar.style.transitionDelay = i * STAGGER + "ms";
						bars.push({ el: bar, width: top > 0 ? (votes / top) * 100 : 0 });
					});

					// 처형 흔들림은 막대가 다 찬 뒤다. 겹치면 숫자를 읽는 도중에
					// 화면이 흔들려서 둘 다 눈에 들어오지 않는다
					if (outTile) {
						outTile.style.animationDelay = list.length * STAGGER + BAR_MS + "ms";
					}

					requestAnimationFrame(() => {
						for (const entry of bars) entry.el.style.width = entry.width + "%";
					});

					startTimer(qs("#timer"), data.timer);
				},
			});
		</script>
	</body>
</html>
