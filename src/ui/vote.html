<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>투표</title>
		<!--@theme-->
		<style>
			/*
			 * 투표 + 개표.
			 *
			 * 기존에는 vote.html과 voteResult.html 두 파일이었다. 둘 다 같은
			 * 사람 목록을 그리는데 배치가 서로 달라서, 투표할 때 누르던 자리와
			 * 결과에 나온 자리가 일치하지 않았다.
			 *
			 * voteResult.html은 더 심했다. 격자가
			 *   grid-template-columns: 140px 140px; grid-template-rows: 30px 30px 30px
			 * 로 못 박혀 있어서 정확히 6명일 때만 맞았다. 4명이면 아래 두 줄이
			 * 비고, 8명이면 마지막 두 명이 컨테이너 밖으로 잘렸다. MAX_PLAYERS가
			 * 8인데 화면은 6명 전용이었다.
			 *
			 * 이제 한 파일이 두 메시지를 받는다. init(투표) / result(개표).
			 * 격자는 auto-fill이라 인원수와 무관하다.
			 */

			/* 투표 진행률: 몇 명이 투표를 마쳤는지. 기존에는 이 정보가 없어서
			   남은 시간이 다 될 때까지 다들 기다리는지 알 수 없었다 */
			.progress {
				flex: 0 0 auto;
				height: 4px;
				border-radius: 99px;
				background: var(--surface-2);
				overflow: hidden;
			}

			.progress i {
				display: block;
				height: 100%;
				width: 0;
				background: var(--accent);
				transition: width var(--dur) var(--ease);
			}

			/* 개표에서 처형된 사람 */
			.tile.out {
				border-color: var(--danger);
				background: var(--mafia-dim);
				animation: shake 420ms var(--ease);
			}

			@keyframes shake {
				0%,
				100% {
					transform: translateX(0);
				}
				25% {
					transform: translateX(-4px);
				}
				75% {
					transform: translateX(4px);
				}
			}

			/* 협박당해 투표가 막힌 상태. 목록을 숨기지 않고 흐리게만 둔다 —
			   누가 살아 있는지는 여전히 봐야 낮 토론을 따라갈 수 있다 */
			.grid.blocked {
				opacity: 0.4;
				pointer-events: none;
				filter: grayscale(1);
			}

			.note.blocked {
				color: var(--danger);
				font-weight: 600;
			}

			/* 득표 막대. 숫자 하나보다 상대 비교가 빠르다 */
			.bar {
				position: absolute;
				left: 0;
				bottom: 0;
				height: 3px;
				background: var(--accent);
				transition: width 600ms var(--ease);
			}
		</style>
	</head>
	<body>
		<div class="panel vote">
			<div class="hd">
				<div class="hd-title grow">
					<span id="heading">투표</span>
					<span class="hd-sub" id="sub"></span>
				</div>
				<div class="timer" id="timer"></div>
			</div>

			<div class="progress" aria-hidden="true"><i id="progress"></i></div>

			<div class="body scroll">
				<div class="grid" id="grid" role="group" aria-label="투표 대상"></div>
			</div>

			<p class="note" id="note" role="status" aria-live="polite"></p>
		</div>

		<!--@shared-->
		<script>
			var myNum = 0;
			var myPick = null;
			var locked = false;

			/**
			 * 사람 타일 하나.
			 * seat: { num, name, alive, votes }
			 * "나"는 좌석마다 표시를 실어 보내지 않고 myNum과 비교해서 정한다 —
			 * 같은 목록을 전원에게 그대로 보낼 수 있어야 하기 때문이다.
			 */
			function tile(seat, extra) {
				var classes = ["tile"];
				if (seat.num === myNum) classes.push("me");
				if (!seat.alive) classes.push("dead");
				if (extra) classes.push(extra);

				var caption = seat.num === myNum ? "나" : seat.alive ? esc(seat.name || "") : "사망";
				return (
					'<button type="button" class="' +
					classes.join(" ") +
					'" data-num="' +
					seat.num +
					'"' +
					(seat.alive ? "" : " disabled") +
					' aria-label="' +
					seat.num +
					"번 " +
					esc(seat.name || "") +
					'">' +
					'<span class="num">' +
					seat.num +
					"</span>" +
					'<span class="cap ellip">' +
					caption +
					"</span>" +
					"</button>"
				);
			}

			function seats(data) {
				return Array.isArray(data.seats) ? data.seats : [];
			}

			function paintPick() {
				$$(".tile").forEach(function (el) {
					el.classList.toggle("picked", Number(el.dataset.num) === myPick);
				});
			}

			$("#grid").addEventListener("click", function (event) {
				var el = event.target.closest(".tile");
				if (!el || el.disabled || locked) return;

				var num = Number(el.dataset.num);
				// 같은 사람을 다시 누르면 취소. 기존에는 한 번 누르면 되돌릴 수
				// 없었고, 눌렸다는 표시조차 없어서 오조작을 알 방법이 없었다
				myPick = myPick === num ? null : num;
				paintPick();
				send({ type: "vote", target: myPick });
				$("#note").textContent =
					myPick === null ? "기권했습니다. 다시 고를 수 있습니다." : myPick + "번을 지목했습니다. 다시 누르면 취소됩니다.";
			});

			onServer({
				init: function (data) {
					// 건달에게 협박당했으면 표를 낼 수 없다. 서버도 같은 판정으로
					// 막지만(Voting.canVote), 눌리는 버튼을 두고 거절만 하면
					// "왜 안 되는지"를 라벨이 뜬 뒤에야 알게 된다
					locked = !!data.silenced;
					myNum = Number(data.myNum) || 0;
					// 재접속으로 화면을 다시 열었을 때 이미 넣은 표를 복원한다
					myPick = Number(data.picked) || null;
					$("#heading").textContent = locked ? "투표할 수 없습니다" : "누구를 처형할까요";
					$("#grid").innerHTML = seats(data)
						.map(function (seat) {
							return tile(seat);
						})
						.join("");
					$("#grid").classList.toggle("blocked", locked);
					paintPick();
					$("#note").classList.toggle("blocked", locked);
					$("#note").textContent = locked
						? "🥊 협박당해 이번 투표에는 참여할 수 없습니다."
						: myPick === null
							? "고르지 않으면 기권입니다."
							: myPick + "번을 지목했습니다. 다시 누르면 취소됩니다.";
					startTimer($("#timer"), data.timer);
					rearrange(data.isMobile);
				},

				// 투표한 사람 수만 갱신한다. 누가 누구를 찍었는지는 개표까지 감춘다
				progress: function (data) {
					var done = Number(data.voted) || 0;
					var total = Number(data.alive) || 1;
					$("#progress").style.width = Math.round((done / total) * 100) + "%";
					$("#sub").textContent = done + "/" + total + " 투표 완료";
				},

				result: function (data) {
					locked = true;
					myNum = Number(data.myNum) || 0;
					$("#heading").textContent = "개표";
					$("#sub").textContent = "";
					$("#progress").style.width = "100%";
					// 협박당한 사람도 개표는 똑같이 본다. init에서 씌운 흐림을 벗긴다
					$("#grid").classList.remove("blocked");
					$("#note").classList.remove("blocked");

					var list = seats(data);
					var top = list.reduce(function (max, seat) {
						return Math.max(max, Number(seat.votes) || 0);
					}, 0);

					$("#grid").innerHTML = list
						.map(function (seat) {
							return tile(seat, seat.num === data.executed ? "out" : null);
						})
						.join("");

					// 득표수를 타일 위에 얹는다. 예전에는 이름과 숫자가 별도
					// 격자에 있어서 어느 숫자가 누구 것인지 눈으로 이어야 했다
					list.forEach(function (seat) {
						var el = $('.tile[data-num="' + seat.num + '"]');
						if (!el) return;
						var votes = Number(seat.votes) || 0;
						el.insertAdjacentHTML(
							"beforeend",
							'<span class="tally">' +
								votes +
								"표</span>" +
								'<span class="bar" style="width:' +
								(top > 0 ? (votes / top) * 100 : 0) +
								'%"></span>'
						);
					});

					$("#note").textContent = data.message || "";
					startTimer($("#timer"), data.timer);
					rearrange(data.isMobile);
				},
			});
		</script>
	</body>
</html>
