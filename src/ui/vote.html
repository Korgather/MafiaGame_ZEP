<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>투표</title>
		<!--@theme-->
		<style>
			/*
			 * 투표 + 개표.
			 *
			 * 기존에는 vote.html과 voteResult.html 두 파일이었다. 둘 다 같은
			 * 사람 목록을 그리는데 배치가 서로 달라서, 투표할 때 누르던 자리와
			 * 결과에 나온 자리가 일치하지 않았다.
			 *
			 * voteResult.html은 더 심했다. 격자가
			 *   grid-template-columns: 140px 140px; grid-template-rows: 30px 30px 30px
			 * 로 못 박혀 있어서 정확히 6명일 때만 맞았다. 4명이면 아래 두 줄이
			 * 비고, 8명이면 마지막 두 명이 컨테이너 밖으로 잘렸다. MAX_PLAYERS가
			 * 8인데 화면은 6명 전용이었다.
			 *
			 * 이제 한 파일이 두 메시지를 받는다. init(투표) / result(개표).
			 * 격자는 auto-fill이라 인원수와 무관하다.
			 */

			/*
			 * 개표에서 단상에 오른 사람.
			 *
			 * 예전에는 이 칸이 곧 처형된 사람이었다. 이제는 최다 득표자일
			 * 뿐이고, 죽는지는 최후의 반론과 찬반투표를 거쳐야 정해진다.
			 * 흔들림은 그대로 둔다 — 지목당한 순간의 무게는 달라지지 않았다.
			 */
			.tile.out {
				border-color: var(--danger);
				background: var(--mafia-dim);
				animation: shake 420ms var(--ease);
			}

			@keyframes shake {
				0%,
				100% {
					transform: translateX(0);
				}
				25% {
					transform: translateX(-4px);
				}
				75% {
					transform: translateX(4px);
				}
			}

			/*
			 * '투표 없음'. 사람 타일과 같은 격자에 있지만 한 줄을 통째로 쓴다.
			 *
			 * 사람들 사이에 정사각 칸으로 끼워 넣으면 4번과 6번 사이에 얼굴
			 * 없는 칸이 하나 있는 모양이 되어, 번호를 세며 누르는 사람이 한 칸씩
			 * 밀려 누른다. 아래 한 줄로 빼면 "사람을 고르거나, 아무도 고르지
			 * 않거나"라는 두 갈래가 그대로 보인다.
			 */
			.tile.skip {
				grid-column: 1 / -1;
				flex-direction: row;
				gap: var(--s2);
				aspect-ratio: auto;
				padding: var(--s2);
			}

			.tile.skip .cap {
				width: auto;
				font-size: var(--t-sm);
				font-weight: 700;
				color: var(--ink-2);
			}

			.tile.skip.picked .cap {
				color: var(--ink);
			}

			/*
			 * 방금 부결된 사람. 같은 낮에 두 번 단상에 세우지 않는다.
			 *
			 * 사망과 같은 회색으로 두면 "죽은 줄 알았는데 살아 있다"가 되므로
			 * 배지로 이유를 적는다 — 눌리지 않는 칸에는 항상 이유가 있어야 한다.
			 */
			.tile.barred {
				opacity: 0.55;
			}

			.tile.barred .badge {
				color: var(--ink-3);
			}

			/* 득표 막대. 숫자 하나보다 상대 비교가 빠르다 */
			.bar {
				position: absolute;
				left: 0;
				bottom: 0;
				height: 3px;
				width: 0;
				background: var(--accent);
				/* 길이와 순서는 스크립트가 준다(BAR_MS·STAGGER). 처형 흔들림을
				   "막대가 다 찬 뒤"로 미루려면 같은 값을 알아야 해서 한 곳에만 둔다 */
				transition-property: width;
				transition-timing-function: var(--ease);
			}
		</style>
	</head>
	<body>
		<div class="panel vote">
			<div class="hd">
				<div class="hd-title grow">
					<span id="heading">투표</span>
					<span class="hd-sub" id="sub"></span>
				</div>
				<div class="timer" id="timer"></div>
			</div>

			<div class="progress" aria-hidden="true"><i id="progress"></i></div>

			<div class="body scroll">
				<div class="grid" id="grid" role="group" aria-label="투표 대상"></div>
			</div>

			<p class="note" id="note" role="status" aria-live="polite"></p>
		</div>

		<!--@shared-->
		<script>
			let myNum = 0;
			let myPick = null;
			let locked = false;
			/* 이번 낮에 찬반투표에서 부결된 번호들. 다시 고를 수 없다 */
			let barred = [];

			/* 막대 하나가 차는 시간과 타일 사이 간격(ms) */
			const BAR_MS = 600;
			const STAGGER = 90;

			/* '투표 없음'의 대상 번호. 서버의 Vote.SKIP_VOTE와 같은 값이어야 한다 */
			const SKIP = -1;

			/**
			 * 사람 타일 하나.
			 * seat: { num, name, alive, votes }
			 * "나"는 좌석마다 표시를 실어 보내지 않고 myNum과 비교해서 정한다 —
			 * 같은 목록을 전원에게 그대로 보낼 수 있어야 하기 때문이다.
			 */
			function tile(seat, extra) {
				const mine = seat.num === myNum;
				const out = barred.indexOf(seat.num) >= 0;
				const caption = mine ? "나" : seat.alive ? seat.name || "" : "사망";
				const classes =
					"tile" +
					(mine ? " me" : "") +
					(seat.alive ? "" : " dead") +
					(out ? " barred" : "") +
					(extra ? " " + extra : "");

				return html`<button
					type="button"
					class="${classes}"
					data-num="${seat.num}"
					${flag(locked || !seat.alive || out, "disabled")}
					aria-label="${seat.num}번 ${seat.name || ""}${out ? " (부결됨)" : ""}"
				>
					<span class="num">${seat.num}</span><span class="cap ellip">${caption}</span>
					${out ? html`<span class="badge">부결</span>` : ""}
				</button>`;
			}

			/**
			 * '투표 없음' 칸.
			 *
			 * 기권(아무것도 안 누르기)과 다른 선택이다. 기권은 판단을 남에게
			 * 미루는 것이고 이쪽은 "오늘은 아무도 죽이지 말자"는 한 표다.
			 * 단서가 없는 날 무고한 시민을 죽이지 않고 밤으로 넘기는 길이다.
			 */
			function skipTile() {
				return html`<button
					type="button"
					class="tile skip"
					data-num="${SKIP}"
					${flag(locked, "disabled")}
					aria-label="투표 없음 — 오늘은 아무도 처형하지 않습니다"
				>
					<span class="num" aria-hidden="true">🚫</span
					><span class="cap ellip">투표 없음</span>
				</button>`;
			}

			function seats(data) {
				return Array.isArray(data.seats) ? data.seats : [];
			}

			function paintPick() {
				for (const el of qsa(".tile")) {
					el.classList.toggle("picked", Number(el.dataset.num) === myPick);
				}
			}

			function pickNote() {
				if (myPick === null) return "기권했습니다. 다시 고를 수 있습니다.";
				if (myPick === SKIP) return "'투표 없음'을 골랐습니다. 다시 누르면 취소됩니다.";
				return `${myPick}번을 지목했습니다. 다시 누르면 취소됩니다.`;
			}

			qs("#grid").addEventListener("click", event => {
				const el = event.target.closest(".tile");
				if (!el || el.disabled || locked) return;

				const num = Number(el.dataset.num);
				// 같은 사람을 다시 누르면 취소. 기존에는 한 번 누르면 되돌릴 수
				// 없었고, 눌렸다는 표시조차 없어서 오조작을 알 방법이 없었다
				myPick = myPick === num ? null : num;
				paintPick();
				Parent.send({ type: "vote", target: myPick });
				qs("#note").textContent = pickNote();
			});

			Parent.on({
				init(data) {
					myNum = Number(data.myNum) || 0;
					// 화면을 다시 여는 경로는 재접속뿐이라 산 사람은 계속 찍을 수
					// 있어야 한다. 잠기는 쪽은 유령 하나다 — 서버도 Voting.canVote로
					// 막지만, 눌리는 버튼을 남기면 실제로 투표된 것처럼 보인다
					const ghost = seats(data).some(seat => seat.num === myNum && !seat.alive);
					locked = ghost;
					// 재지목이면 방금 부결된 번호가 실려 온다. 첫 투표에서는 빈 배열이다
					barred = Array.isArray(data.rejected) ? data.rejected : [];
					// 재접속으로 화면을 다시 열었을 때 이미 넣은 표를 복원한다.
					// SKIP(-1)도 그대로 살아난다 — 0만 "아직 안 찍음"이다
					myPick = Number(data.picked) || null;
					qs("#heading").textContent = ghost ? "투표할 수 없습니다" : "누구를 처형할까요";
					qs("#grid").innerHTML = html`${seats(data).map(seat => tile(seat))}${skipTile()}`;
					paintPick();
					qs("#note").textContent = ghost
						? "👻 유령은 투표할 수 없습니다."
						: myPick === null
							? "고르지 않으면 기권입니다. 단서가 없으면 '투표 없음'도 한 표입니다."
							: pickNote();
					startTimer(qs("#timer"), data.timer);
				},

				// 투표한 사람 수만 갱신한다. 누가 누구를 찍었는지는 개표까지 감춘다
				progress(data) {
					const done = Number(data.voted) || 0;
					const total = Number(data.alive) || 1;
					qs("#progress").style.width = Math.round((done / total) * 100) + "%";
					qs("#sub").textContent = `${done}/${total} 투표 완료`;
				},

				result(data) {
					locked = true;
					myNum = Number(data.myNum) || 0;
					qs("#heading").textContent = "개표";
					qs("#sub").textContent = "";
					qs("#progress").style.width = "100%";

					const list = seats(data);
					const top = list.reduce((max, seat) => Math.max(max, Number(seat.votes) || 0), 0);

					qs("#grid").innerHTML = html`${list.map(seat =>
						tile(seat, seat.num === data.nominee ? "out" : null)
					)}`;

					/*
					 * 득표수를 타일 위에 얹는다. 예전에는 이름과 숫자가 별도
					 * 격자에 있어서 어느 숫자가 누구 것인지 눈으로 이어야 했다.
					 *
					 * 막대는 폭 0으로 심고 실제 폭은 다음 프레임에 준다. 최종
					 * 폭을 처음부터 박아 넣으면 브라우저에게는 한 번도 바뀐 적
					 * 없는 값이라 transition이 걸리지 않는다 — CSS에 600ms가
					 * 적혀 있었는데도 막대는 자란 적 없이 완성된 채로 떴다.
					 */
					const bars = [];
					let outTile = null;
					list.forEach((seat, i) => {
						const el = qs(`.tile[data-num="${seat.num}"]`);
						if (!el) return;
						if (seat.num === data.nominee) outTile = el;
						const votes = Number(seat.votes) || 0;
						el.insertAdjacentHTML(
							"beforeend",
							html`<span class="tally">${votes}표</span><span class="bar"></span>`
						);
						const bar = qs(".bar", el);
						bar.style.transitionDuration = BAR_MS + "ms";
						// 서버가 득표 내림차순으로 보낸다(Voting.voteBoard). 위에서부터
						// 차례로 차오르면 1등이 누구인지 마지막 막대를 기다리지 않고 보인다
						bar.style.transitionDelay = i * STAGGER + "ms";
						bars.push({ el: bar, width: top > 0 ? (votes / top) * 100 : 0 });
					});

					// 처형 흔들림은 막대가 다 찬 뒤다. 겹치면 숫자를 읽는 도중에
					// 화면이 흔들려서 둘 다 눈에 들어오지 않는다
					if (outTile) {
						outTile.style.animationDelay = list.length * STAGGER + BAR_MS + "ms";
					}

					requestAnimationFrame(() => {
						for (const entry of bars) entry.el.style.width = entry.width + "%";
					});

					qs("#note").textContent = data.message || "";
					startTimer(qs("#timer"), data.timer);
				},
			});
		</script>
	</body>
</html>
