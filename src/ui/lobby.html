<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>대기실</title>
		<!--@theme-->
		<style>
			/*
			 * 대기실: 방 목록 <-> 방 안 좌석 목록.
			 *
			 * 기존 WatingRoom.html은 182KB였다. 배경 이미지 2장을 base64로
			 * 품고 jsdelivr에서 웹폰트 2종을 받았다. 그리고 이런 것들이 있었다:
			 *
			 * - .container가 380x300px 고정이라 폰이 아니라 태블릿에서도 잘렸다.
			 *   미디어 쿼리는 325px 한 개뿐이었다.
			 * - 조작 요소가 전부 <div onclick>이었다. 탭 이동도, 포커스 표시도,
			 *   스크린리더용 이름도 없었다.
			 * - 강퇴 버튼이 현재 표수만 보여줬다. 몇 표가 필요한지, 내가 이미
			 *   눌렀는지 알 수 없어서 같은 버튼을 계속 누르게 됐다(토글이라
			 *   두 번 누르면 취소되는데, 그 사실도 화면에 없었다).
			 * - 준비 버튼을 눌러도 왜 시작하지 않는지 알려주지 않았다.
			 *   최소 인원이 4명이라는 사실이 화면 어디에도 없었다.
			 *
			 * 두 화면 사이 이동은 서버가 보내는 좌석 목록의 길이로 정해진다.
			 * 빈 목록 = 방 밖. 이건 기존 프로토콜 그대로다.
			 */
			.rooms {
				display: grid;
				grid-template-columns: repeat(2, 1fr);
				gap: var(--s2);
				align-content: start;
			}

			.room {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: var(--s2);
				padding: var(--s2) var(--s3);
				font: inherit;
				font-size: var(--t-sm);
				font-weight: 700;
				color: var(--ink);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-radius: var(--r2);
				cursor: pointer;
				transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
			}

			.room:hover:not(:disabled) {
				background: var(--surface-3);
				border-color: var(--accent);
			}
			.room:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			.room:disabled {
				cursor: default;
				color: var(--ink-3);
				opacity: 0.6;
			}

			.room .cnt {
				font-variant-numeric: tabular-nums;
				font-weight: 500;
				color: var(--ink-2);
			}
			.room.full .cnt {
				color: var(--warn);
			}
			.room.playing .cnt {
				color: var(--mafia);
			}

			/* 좌석 한 줄 */
			.seat {
				display: flex;
				align-items: center;
				gap: var(--s2);
				padding: var(--s2);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-radius: var(--r2);
			}

			.seat.ready {
				border-color: var(--ok);
			}
			.seat.me {
				background: var(--surface-3);
			}

			.seat .idx {
				flex: 0 0 auto;
				width: 18px;
				font-size: var(--t-sm);
				font-weight: 700;
				color: var(--ink-3);
				text-align: right;
			}

			.seat .nm {
				font-size: var(--t-sm);
				font-weight: 600;
			}

			.seat .meta {
				font-size: var(--t-xs);
				color: var(--ink-3);
			}

			.seat .state {
				flex: 0 0 auto;
				font-size: var(--t-xs);
				font-weight: 700;
				color: var(--ink-3);
			}
			.seat.ready .state {
				color: var(--ok);
			}

			.kick {
				flex: 0 0 auto;
				min-height: 26px;
				padding: 2px var(--s2);
				font-size: var(--t-xs);
			}
			.kick.voted {
				color: var(--danger);
				border-color: var(--danger);
			}

			.list {
				display: flex;
				flex-direction: column;
				gap: var(--s1);
			}

			.foot {
				display: flex;
				gap: var(--s2);
				flex: 0 0 auto;
			}
		</style>
	</head>
	<body>
		<div class="panel">
			<div class="hd">
				<div class="hd-title grow">
					<span id="heading">방 선택</span>
					<span class="hd-sub" id="sub"></span>
				</div>
			</div>

			<div class="body scroll">
				<div class="rooms" id="rooms" role="group" aria-label="방 목록"></div>
				<div class="list hidden" id="seats" role="list" aria-label="참가자"></div>
			</div>

			<p class="note" id="note" role="status" aria-live="polite"></p>

			<div class="foot hidden" id="foot">
				<button class="btn ghost" id="quit" type="button">나가기</button>
				<button class="btn primary grow" id="ready" type="button">준비</button>
			</div>
		</div>

		<!--@shared-->
		<script>
			let myId = null;
			let iAmReady = false;
			const config = { min: 4, max: 8, kickVotes: 3 };
			let counts = {};

			/* ---------- 방 목록 ---------- */
			function roomHtml(num) {
				const info = counts[num] || { count: 0, started: false };
				const full = info.count >= config.max;
				const state = info.started ? "진행 중" : full ? "가득 참" : `${info.count}/${config.max}`;

				return html`<button
					type="button"
					class="room${info.started ? " playing" : full ? " full" : ""}"
					data-num="${num}"
					${flag(info.started || full, "disabled")}
					aria-label="${num}번 방, ${state}"
				>
					<span>${num}번 방</span><span class="cnt">${state}</span>
				</button>`;
			}

			function paintRooms() {
				const nums = Object.keys(counts).sort((a, b) => Number(a) - Number(b));
				qs("#rooms").innerHTML = html`${nums.map(roomHtml)}`;
			}

			qs("#rooms").addEventListener("click", event => {
				const el = event.target.closest(".room");
				if (!el || el.disabled) return;
				send({ type: "join", roomNum: Number(el.dataset.num) });
			});

			/* ---------- 좌석 목록 ---------- */
			function seatHtml(seat, i) {
				const mine = seat.id === myId;

				// 강퇴는 필요 표수를 함께 보여준다. 몇 표가 남았는지 모르면
				// 누를지 말지 판단할 수 없다
				const kick = mine
					? ""
					: html`<button
							type="button"
							class="btn ghost kick${seat.kickCount > 0 ? " voted" : ""}"
							data-id="${seat.id}"
							aria-label="${seat.name} 강퇴 투표"
						>
							강퇴 ${seat.kickCount}/${config.kickVotes}
						</button>`;

				// .grow 안의 두 span은 한 줄로 둔다. 사이의 공백이 화면에 그대로
				// 나오는 자리라, 줄을 나누면 들여쓰기가 이름 뒤에 붙는다
				return html`<div class="seat${seat.ready ? " ready" : ""}${mine ? " me" : ""}" role="listitem">
					<span class="idx">${i + 1}</span>
					<span class="grow ellip"><span class="nm">${seat.name}${mine ? " (나)" : ""}</span> <span class="meta">${seat.rank} · ${seat.runCount}판</span></span>
					<span class="state">${seat.ready ? "준비" : "대기"}</span>
					${kick}
				</div>`;
			}

			function paintSeats(list) {
				qs("#seats").innerHTML = html`${list.map(seatHtml)}`;

				const readyCount = list.filter(seat => seat.ready).length;
				iAmReady = list.some(seat => seat.id === myId && seat.ready);

				const ready = qs("#ready");
				ready.textContent = iAmReady ? "준비 취소" : "준비";
				ready.classList.toggle("primary", !iAmReady);
				ready.classList.toggle("ok", iAmReady);

				qs("#sub").textContent = `${list.length}명 · 준비 ${readyCount}명`;

				// 왜 시작하지 않는지 항상 한 줄로 말해준다
				qs("#note").textContent =
					list.length < config.min
						? `${config.min - list.length}명 더 모이면 시작할 수 있습니다.`
						: readyCount < list.length
							? `${list.length - readyCount}명이 아직 준비하지 않았습니다.`
							: "곧 시작합니다.";
			}

			qs("#seats").addEventListener("click", event => {
				const el = event.target.closest(".kick");
				if (!el) return;
				send({ type: "kick", id: el.dataset.id });
			});

			qs("#ready").addEventListener("click", () => {
				send({ type: iAmReady ? "cancle-ready" : "ready" });
			});

			qs("#quit").addEventListener("click", () => {
				send({ type: "quit" });
			});

			/* ---------- 화면 전환 ---------- */
			function showRooms(inRoom) {
				qs("#rooms").classList.toggle("hidden", inRoom);
				qs("#seats").classList.toggle("hidden", !inRoom);
				qs("#foot").classList.toggle("hidden", !inRoom);
				qs("#heading").textContent = inRoom ? "대기실" : "방 선택";
				if (!inRoom) {
					qs("#sub").textContent = "";
					qs("#note").textContent = "참가할 방을 고르세요.";
				}
			}

			onServer({
				setID(data) {
					myId = data.id;
					if (data.minPlayers) config.min = data.minPlayers;
					if (data.maxPlayers) config.max = data.maxPlayers;
					if (data.kickVotes) config.kickVotes = data.kickVotes;
					rearrange(data.isMobile);
				},

				init(data) {
					const list = Array.isArray(data.data) ? data.data : [];
					showRooms(list.length > 0);
					if (list.length > 0) paintSeats(list);
					else paintRooms();
				},

				updatePlayerCount(data) {
					counts = data.data || {};
					if (!qs("#rooms").classList.contains("hidden")) paintRooms();
				},
			});
		</script>
	</body>
</html>
