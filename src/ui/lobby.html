<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>대기실</title>
		<!--@theme-->
		<style>
			/*
			 * 대기실: 방 목록 <-> 방 안 좌석 목록.
			 * 두 화면 사이 이동은 서버가 보내는 좌석 목록의 길이로 정해진다.
			 * 빈 목록 = 방 밖. 기존 프로토콜 그대로다.
			 *
			 * 개정에서 바뀐 것
			 * ---------------
			 * 1. 준비 진행률 막대를 머리말 아래에 올렸다. "2명이 아직 준비하지
			 *    않았습니다"는 세어야 알 수 있는 문장이고, 막대는 안 세도 보인다.
			 * 2. 좌석 줄의 준비 상태를 왼쪽 3px 바 + 글자 둘로 표시한다.
			 *    전에는 테두리 전체가 초록으로 변해서, 12줄이 되면 화면이
			 *    초록 격자가 됐다.
			 * 3. 방 선택 화면의 note를 바꿨다. 원래 문장("참가할 방을 고르세요.")은
			 *    머리말로 올라갔고, 빈 자리에 "진행 중인 방은 관전으로 들어갑니다."를
			 *    넣는다 — 버튼 안의 "관전 2"만으로는 처음 보는 사람이 그 방을
			 *    눌러도 되는지 알 수 없었다. 위젯 자체 문자열이라 서버와 무관하다.
			 */
			.rooms {
				display: grid;
				grid-template-columns: repeat(2, 1fr);
				gap: var(--s2);
				align-content: start;
			}

			.room {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: var(--s2);
				min-height: 36px;
				padding: var(--s2) var(--s3);
				font: inherit;
				font-size: var(--t-sm);
				font-weight: 700;
				white-space: nowrap;
				color: var(--ink);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-radius: var(--r2);
				cursor: pointer;
				transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
			}

			.room:hover:not(:disabled) {
				background: var(--surface-3);
				border-color: var(--accent);
			}
			.room:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			.room:disabled {
				cursor: default;
				color: var(--ink-3);
				background: var(--surface);
				border-color: var(--surface-3);
			}

			.room .cnt {
				font-variant-numeric: tabular-nums;
				font-weight: 500;
				color: var(--ink-2);
			}
			.room.full .cnt {
				font-weight: 700;
				color: var(--ink-3);
			}
			/* 진행 중 = 관전 가능. 눌러도 되는 버튼이므로 경고색이 아니라
			   강조색을 쓴다. 빨간 글씨는 "막혔다"로 읽힌다 */
			.room.playing {
				border-color: var(--accent);
			}
			.room.playing .cnt {
				font-weight: 700;
				color: var(--accent);
			}

			/* 좌석 한 줄 */
			.seat {
				display: flex;
				align-items: center;
				gap: var(--s2);
				padding: 7px var(--s2);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-left: 3px solid var(--line);
				border-radius: var(--r2);
			}

			.seat.ready {
				border-left-color: var(--ok);
			}
			.seat.me {
				background: var(--surface-3);
			}

			.seat .idx {
				flex: 0 0 auto;
				width: 16px;
				font-size: var(--t-xs);
				font-weight: 800;
				color: var(--ink-3);
				text-align: right;
			}

			.seat .nm {
				font-size: var(--t-sm);
				font-weight: 700;
			}

			.seat .meta {
				font-size: var(--t-xs);
				color: var(--ink-3);
			}

			.seat .state {
				flex: 0 0 auto;
				font-size: var(--t-xs);
				font-weight: 800;
				white-space: nowrap;
				color: var(--ink-3);
			}
			.seat.ready .state {
				color: var(--ok);
			}

			/*
			 * 강퇴. 기준(34px)보다 작은 유일한 버튼이다 — 오조작이 가장 비싼
			 * 버튼이라 손가락이 스쳐 눌리지 않을 크기로 둔다.
			 * 필요 표수를 함께 보여준다: 몇 표가 남았는지 모르면 누를지 말지
			 * 판단할 수 없고, 토글이라 두 번 누르면 취소된다는 것도 화면에 없었다.
			 */
			.kick {
				flex: 0 0 auto;
				min-height: 26px;
				padding: 2px var(--s2);
				font-size: var(--t-xs);
			}
			.kick.voted {
				color: var(--danger);
				border-color: var(--danger);
			}

			.list {
				display: flex;
				flex-direction: column;
				gap: 5px;
			}
		</style>
	</head>
	<body>
		<div class="panel">
			<div class="hd">
				<div class="hd-title grow">
					<span id="heading">방 선택</span>
					<span class="hd-sub" id="sub"></span>
				</div>
				<!--
					도감을 여는 자리는 여기 하나뿐이다. 게임이 시작되면 이 위젯은
					닫히므로(GameFlow.beginGame → closeMain) 밤·투표 중에 도감을
					여는 길은 채팅의 /도감 하나만 남는다 — 지목 화면을 가릴 수
					있는 버튼을 지목 화면에 두지 않기 위해서다.
				-->
				<button class="icon-btn" id="book" type="button" aria-label="직업 도감 열기" title="직업 도감">
					📖
				</button>
			</div>

			<div class="progress hidden" id="readybar" aria-hidden="true"><i id="readyfill"></i></div>

			<div class="body scroll">
				<div class="rooms" id="rooms" role="group" aria-label="방 목록"></div>
				<div class="list hidden" id="seats" role="list" aria-label="참가자"></div>
			</div>

			<p class="note" id="note" role="status" aria-live="polite"></p>

			<div class="foot hidden" id="foot">
				<button class="btn ghost" id="quit" type="button">나가기</button>
				<button class="btn primary grow" id="ready" type="button">준비</button>
			</div>
		</div>

		<!--@shared-->
		<script>
			let myId = null;
			let iAmReady = false;
			/*
			 * 서버가 알려주기 전까지 쓰는 기본값. 셋 다 좌석 목록(init)이 덮어쓴다.
			 * min/max는 어느 방에 앉았는지가 정하고(속도전 4~8, 침묵전 8~12),
			 * kickVotes는 지금 인원이 정한다.
			 */
			const config = { min: 4, max: 12, kickVotes: 3 };
			let counts = {};

			/* ---------- 방 목록 ---------- */
			/*
			 * 진행 중인 방은 눌린다. 한 판이 5~15분이라 늦게 온 사람은 방 목록
			 * 전체가 회색인 화면을 보고 나가버렸다. 지금은 같은 버튼이 관전으로
			 * 들어가는 문이고, 문구를 "관전 N"으로 바꿔 클릭하면 무슨 일이
			 * 일어나는지 버튼 안에서 알려준다.
			 */
			function roomHtml(num) {
				const info = counts[num] || { count: 0, started: false, watching: 0 };
				// 정원은 방마다 다르다. config.max는 그 값이 빠진 방을
				// undefined로 그리지 않기 위한 보루로만 쓴다
				const max = info.max || config.max;
				const full = info.count >= max;
				const state = info.started
					? `관전 ${info.watching || 0}`
					: full
						? "가득 참"
						: `${info.count}/${max}`;

				return html`<button
					type="button"
					class="room${info.started ? " playing" : full ? " full" : ""}"
					data-num="${num}"
					${flag(!info.started && full, "disabled")}
					aria-label="${num}번 방, ${info.started ? "진행 중, 관전하기" : state}"
				>
					<span>${num}번 방</span><span class="cnt">${state}</span>
				</button>`;
			}

			function paintRooms() {
				const nums = Object.keys(counts).sort((a, b) => Number(a) - Number(b));
				qs("#rooms").innerHTML = html`${nums.map(roomHtml)}`;
			}

			qs("#rooms").addEventListener("click", event => {
				const el = event.target.closest(".room");
				if (!el || el.disabled) return;
				Parent.send({ type: "join", roomNum: Number(el.dataset.num) });
			});

			/* ---------- 좌석 목록 ---------- */
			function seatHtml(seat, i) {
				const mine = seat.id === myId;

				const kick = mine
					? ""
					: html`<button
							type="button"
							class="btn ghost kick${seat.kickCount > 0 ? " voted" : ""}"
							data-id="${seat.id}"
							aria-label="${seat.name} 강퇴 투표, ${seat.kickCount}/${config.kickVotes}표"
						>
							강퇴 ${seat.kickCount}/${config.kickVotes}
						</button>`;

				// .grow 안의 두 span은 한 줄로 둔다. 사이의 공백이 화면에 그대로
				// 나오는 자리라, 줄을 나누면 들여쓰기가 이름 뒤에 붙는다
				return html`<div class="seat${seat.ready ? " ready" : ""}${mine ? " me" : ""}" role="listitem">
					<span class="idx">${i + 1}</span>
					<span class="grow ellip"><span class="nm">${seat.name}${mine ? " (나)" : ""}</span> <span class="meta">${seat.rank} · ${seat.runCount}판</span></span>
					<span class="state">${seat.ready ? "준비" : "대기"}</span>
					${kick}
				</div>`;
			}

			function paintSeats(list) {
				qs("#seats").innerHTML = html`${list.map(seatHtml)}`;

				const readyCount = list.filter(seat => seat.ready).length;
				iAmReady = list.some(seat => seat.id === myId && seat.ready);

				const ready = qs("#ready");
				ready.textContent = iAmReady ? "준비 취소" : "준비";
				ready.classList.toggle("primary", !iAmReady);
				ready.classList.toggle("ok", iAmReady);

				qs("#sub").textContent = `${list.length}명 · 준비 ${readyCount}명`;

				// 몇 명이 남았는지는 세지 않아도 보여야 한다. 문장은 아래 note가
				// 말하고, 막대는 그 문장을 읽기 전에 답한다
				qs("#readybar").classList.remove("hidden");
				qs("#readyfill").style.width =
					list.length > 0 ? Math.round((readyCount / list.length) * 100) + "%" : "0%";

				// 왜 시작하지 않는지 항상 한 줄로 말해준다
				qs("#note").textContent =
					list.length < config.min
						? `${config.min - list.length}명 더 모이면 시작할 수 있습니다.`
						: readyCount < list.length
							? `${list.length - readyCount}명이 아직 준비하지 않았습니다.`
							: "곧 시작합니다.";
			}

			qs("#seats").addEventListener("click", event => {
				const el = event.target.closest(".kick");
				if (!el) return;
				Parent.send({ type: "kick", id: el.dataset.id });
			});

			qs("#ready").addEventListener("click", () => {
				Parent.send({ type: iAmReady ? "cancle-ready" : "ready" });
			});

			qs("#quit").addEventListener("click", () => {
				Parent.send({ type: "quit" });
			});

			qs("#book").addEventListener("click", () => {
				Parent.send({ type: "book" });
			});

			/* ---------- 화면 전환 ---------- */
			function showRooms(inRoom) {
				qs("#rooms").classList.toggle("hidden", inRoom);
				qs("#seats").classList.toggle("hidden", !inRoom);
				qs("#foot").classList.toggle("hidden", !inRoom);
				qs("#readybar").classList.toggle("hidden", !inRoom);
				qs("#heading").textContent = inRoom ? "대기실" : "참가할 방을 고르세요";
				if (!inRoom) {
					qs("#sub").textContent = "";
					qs("#note").textContent = "진행 중인 방은 관전으로 들어갑니다.";
				}
			}

			Parent.on({
				setID(data) {
					myId = data.id;
				},

				init(data) {
					const list = Array.isArray(data.data) ? data.data : [];
					// 좌석을 그리기 전에 갱신해야 "강퇴 2/3"이 이번 인원의 수를,
					// "3명 더 모이면"이 이번 방의 하한을 쓴다.
					// 방 밖에서는 정원이 0으로 와서 마지막 값이 그대로 남는다
					if (data.kickVotes) config.kickVotes = data.kickVotes;
					if (data.minPlayers) config.min = data.minPlayers;
					if (data.maxPlayers) config.max = data.maxPlayers;
					showRooms(list.length > 0);
					if (list.length > 0) paintSeats(list);
					else paintRooms();
				},

				updatePlayerCount(data) {
					counts = data.data || {};
					if (!qs("#rooms").classList.contains("hidden")) paintRooms();
				},
			});
		</script>
	</body>
</html>
