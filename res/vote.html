<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>투표</title>
		<style>
:root {
	--bg: #100c0b;
	--surface: #1c1614;
	--surface-2: #29211e;
	--surface-3: #382d29;
	--line: #4a3b35;
	--ink: #f6f0ea;
	--ink-2: #bfaea4;
	--ink-3: #8a7970;
	--mafia: #e8554f;
	--mafia-dim: #5e1f1d;
	--mafia-ink: #ff8a85;
	--citizen: #56a9e0;
	--citizen-dim: #1e3f57;
	--citizen-ink: #8ec9f5;
	--accent: #e6b44f; 
	--ok: #5fbf7f;
	--danger: #e8554f;
	--dead: #5a4a45;
	--night-1: #1a1d33;
	--night-2: #0c0d17;
	--day-1: #3a2c17;
	--day-2: #17110c;
	--vote-1: #2b2036;
	--vote-2: #140f1a;
	--s1: 4px;
	--s2: 8px;
	--s3: 12px;
	--s4: 16px;
	--s5: 24px;
	--s6: 32px;
	--t-xs: clamp(10px, 2.6vw, 12px);
	--t-sm: clamp(11px, 3vw, 13px);
	--t-md: clamp(13px, 3.5vw, 15px);
	--t-lg: clamp(15px, 4.2vw, 19px);
	--t-xl: clamp(19px, 5.5vw, 24px);
	--t-2xl: clamp(24px, 7vw, 34px);
	--t-3xl: clamp(28px, 9vw, 40px);
	--r1: 6px;
	--r2: 10px;
	--r3: 14px;
	--shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
	--dur: 160ms;
	--ease: cubic-bezier(0.2, 0, 0.2, 1);
}
@media (prefers-reduced-motion: reduce) {
	:root {
		--dur: 1ms;
	}
	*,
	*::before,
	*::after {
		animation-duration: 1ms !important;
		animation-iteration-count: 1 !important;
		transition-duration: 1ms !important;
	}
}
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}
html,
body {
	width: 100%;
	height: 100%;
	overflow: hidden;
}
body {
	font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
		"Malgun Gothic", "맑은 고딕", "Noto Sans KR", system-ui, sans-serif;
	font-size: var(--t-md);
	line-height: 1.45;
	color: var(--ink);
	background: transparent;
	-webkit-font-smoothing: antialiased;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}
.panel {
	position: relative;
	isolation: isolate;
	display: flex;
	flex-direction: column;
	width: 100%;
	height: 100%;
	padding: var(--s3) var(--s3) var(--s3);
	gap: var(--s2);
	background: linear-gradient(165deg, var(--surface) 0%, var(--bg) 100%);
	border: 1px solid var(--line);
	border-radius: var(--r3);
	box-shadow: var(--shadow);
	overflow: hidden;
	animation: panel-in 240ms var(--ease);
}
@keyframes panel-in {
	from {
		opacity: 0;
		transform: translateY(6px);
	}
}
.panel.night {
	background: linear-gradient(165deg, var(--night-1) 0%, var(--night-2) 100%);
	border-color: #3b4160;
}
.panel.day {
	background: linear-gradient(165deg, var(--day-1) 0%, var(--day-2) 100%);
	border-color: #5a4626;
}
.panel.vote {
	background: linear-gradient(165deg, var(--vote-1) 0%, var(--vote-2) 100%);
	border-color: #4a3a5a;
}
.panel.night::after,
.panel.day::after,
.panel.vote::after {
	content: "";
	position: absolute;
	inset: 0;
	z-index: -1;
	pointer-events: none;
}
.panel.night::after {
	background: radial-gradient(120% 70% at 50% -10%, rgba(126, 148, 224, 0.16) 0%, transparent 62%);
	animation: moonlight 9s ease-in-out infinite;
}
@keyframes moonlight {
	0%,
	100% {
		opacity: 0.55;
	}
	50% {
		opacity: 1;
	}
}
.panel.day::after {
	background: linear-gradient(115deg, rgba(255, 196, 106, 0.14) 0%, transparent 45%);
	animation: daylight 11s ease-in-out infinite;
}
@keyframes daylight {
	0%,
	100% {
		opacity: 0.6;
	}
	50% {
		opacity: 1;
	}
}
.panel.vote::after {
	background: radial-gradient(130% 60% at 50% 108%, rgba(232, 85, 79, 0.18) 0%, transparent 60%);
	animation: emberglow 6s ease-in-out infinite;
}
@keyframes emberglow {
	0%,
	100% {
		opacity: 0.5;
	}
	50% {
		opacity: 1;
	}
}
.idbar {
	display: flex;
	align-items: center;
	gap: var(--s2);
	flex: 0 0 auto;
	min-width: 0;
}
.idbar .ability {
	flex: 1 1 auto;
	min-width: 0;
	font-size: var(--t-xs);
	color: var(--ink-3);
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
}
.idbar .stat {
	flex: 0 0 auto;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--ink-2);
	font-variant-numeric: tabular-nums;
	white-space: nowrap;
}
.lead {
	display: flex;
	align-items: flex-end;
	gap: var(--s2);
	flex: 0 0 auto;
}
.lead-text {
	flex: 1 1 auto;
	min-width: 0;
}
.lead-title {
	font-size: var(--t-lg);
	font-weight: 800;
	letter-spacing: -0.02em;
	line-height: 1.25;
	word-break: keep-all;
}
.lead-sub {
	margin-top: 3px;
	font-size: var(--t-xs);
	color: var(--ink-3);
	word-break: keep-all;
}
.lead-sub.count {
	color: var(--accent);
	font-weight: 700;
	font-variant-numeric: tabular-nums;
}
.clock {
	display: flex;
	align-items: baseline;
	gap: 2px;
	flex: 0 0 auto;
	font-variant-numeric: tabular-nums;
}
.clock .n {
	font-size: var(--t-3xl);
	font-weight: 800;
	line-height: 0.9;
	color: var(--ink);
}
.clock .u {
	font-size: var(--t-xs);
	color: var(--ink-2);
}
.clock.urgent .n {
	color: var(--danger);
	animation: pulse 1s var(--ease) infinite;
}
.clock.critical .n {
	animation: pulse 420ms var(--ease) infinite;
}
@keyframes pulse {
	0%,
	100% {
		transform: scale(1);
	}
	50% {
		transform: scale(1.08);
	}
}
.timeline {
	flex: 0 0 auto;
	height: 3px;
	border-radius: 99px;
	background: var(--surface-2);
	overflow: hidden;
}
.timeline i {
	display: block;
	height: 100%;
	width: 100%;
	border-radius: 99px;
	background: var(--accent);
	transition: width 1s linear, background var(--dur) var(--ease);
}
.timeline.urgent i {
	background: var(--danger);
}
.timeline.urgent {
	background: rgba(232, 85, 79, 0.18);
	box-shadow: 0 0 8px rgba(232, 85, 79, 0.5);
}
.progress {
	flex: 0 0 auto;
	height: 4px;
	border-radius: 99px;
	background: var(--surface-2);
	overflow: hidden;
}
.progress i {
	display: block;
	height: 100%;
	width: 0;
	background: var(--ok);
	transition: width var(--dur) var(--ease);
}
.hd {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--s2);
	flex: 0 0 auto;
}
.hd-title {
	display: flex;
	align-items: baseline;
	gap: var(--s2);
	min-width: 0;
	font-size: var(--t-lg);
	font-weight: 800;
	letter-spacing: -0.02em;
}
.hd-sub {
	font-size: var(--t-xs);
	color: var(--ink-3);
	white-space: nowrap;
}
.body {
	flex: 1 1 auto;
	min-height: 0;
	display: flex;
	flex-direction: column;
	gap: var(--s2);
}
.scroll {
	overflow-y: auto;
	overscroll-behavior: contain;
	scrollbar-width: thin;
	scrollbar-color: var(--surface-3) transparent;
}
.scroll::-webkit-scrollbar {
	width: 6px;
}
.scroll::-webkit-scrollbar-thumb {
	background: var(--surface-3);
	border-radius: 99px;
}
.scroll::-webkit-scrollbar-track {
	background: transparent;
}
.stack {
	display: flex;
	flex-direction: column;
	gap: 3px;
	padding: var(--s2) var(--s3);
	background: rgba(0, 0, 0, 0.25);
	border-left: 2px solid var(--danger);
	border-radius: 0 var(--r2) var(--r2) 0;
}
.stack span {
	font-size: var(--t-sm);
	color: var(--mafia-ink);
	word-break: keep-all;
}
.stack span.good {
	color: #8fd6a8;
}
.foot {
	display: flex;
	gap: var(--s2);
	flex: 0 0 auto;
}
.btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--s1);
	min-height: 34px;
	padding: var(--s2) var(--s3);
	font: inherit;
	font-size: var(--t-sm);
	font-weight: 600;
	white-space: nowrap;
	color: var(--ink);
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r1);
	cursor: pointer;
	transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
		transform var(--dur) var(--ease);
}
.btn:hover:not(:disabled) {
	background: var(--surface-3);
}
.btn:active:not(:disabled) {
	transform: scale(0.97);
}
.btn:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 2px;
}
.btn:disabled {
	cursor: default;
	opacity: 0.45;
}
.btn.primary {
	color: var(--bg);
	background: var(--accent);
	border-color: var(--accent);
}
.btn.primary:hover:not(:disabled) {
	filter: brightness(1.1);
}
.btn.ok {
	color: #0e1a12;
	background: var(--ok);
	border-color: var(--ok);
}
.btn.danger {
	color: var(--ink);
	background: var(--mafia-dim);
	border-color: var(--mafia);
}
.btn.ghost {
	background: transparent;
}
.icon-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	flex: 0 0 auto;
	min-width: 34px;
	min-height: 34px;
	padding: var(--s1) var(--s2);
	font: inherit;
	font-size: var(--t-md);
	color: var(--ink-2);
	background: transparent;
	border: none;
	border-radius: var(--r1);
	cursor: pointer;
}
.icon-btn:hover {
	color: var(--ink);
}
.icon-btn:disabled {
	cursor: default;
	opacity: 0.35;
}
.icon-btn:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -2px;
}
.icon-btn.strong {
	font-weight: 800;
}
.grid {
	display: grid;
	grid-template-columns: repeat(4, minmax(0, 1fr));
	gap: var(--s2);
	align-content: center;
}
@media (max-width: 340px) {
	.grid {
		grid-template-columns: repeat(3, minmax(0, 1fr));
	}
}
.tile {
	position: relative;
	display: flex;
	min-width: 0;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 2px;
	aspect-ratio: 1;
	padding: var(--s1);
	font: inherit;
	font-size: var(--t-sm);
	font-weight: 700;
	color: var(--ink);
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r2);
	cursor: pointer;
	transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
		transform var(--dur) var(--ease);
}
.tile:hover:not(:disabled) {
	background: var(--surface-3);
	border-color: var(--ink-3);
}
.tile:active:not(:disabled) {
	transform: scale(0.95);
}
.tile:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 2px;
}
.tile .num {
	font-size: var(--t-lg);
	line-height: 1.1;
}
.tile .cap {
	width: 100%;
	font-size: var(--t-xs);
	font-weight: 500;
	color: var(--ink-3);
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
	text-align: center;
}
.tile.me {
	border-color: var(--ok);
}
.tile.me .cap {
	color: var(--ok);
}
.tile:disabled,
.tile.dead {
	cursor: default;
	color: var(--dead);
	background: var(--surface);
	border-color: var(--surface-2);
}
.tile.dead .cap {
	color: var(--dead);
}
.tile.picked {
	background: var(--mafia-dim);
	border-color: var(--mafia);
	box-shadow: 0 0 0 2px var(--mafia) inset;
}
.tile.picked .cap {
	color: var(--mafia-ink);
}
.tile.ally {
	border-color: var(--mafia);
	background: color-mix(in srgb, var(--mafia-dim) 60%, var(--surface-2));
}
.tile.ally .cap {
	color: var(--mafia-ink);
}
.tile .badge {
	position: absolute;
	top: 2px;
	right: 3px;
	font-size: var(--t-xs);
	line-height: 1;
}
.tile .tally {
	position: absolute;
	bottom: 3px;
	left: 0;
	right: 0;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--accent);
	text-align: center;
}
.chip {
	display: inline-flex;
	align-items: center;
	gap: var(--s1);
	flex: 0 0 auto;
	padding: 3px var(--s2);
	font-size: var(--t-xs);
	font-weight: 800;
	white-space: nowrap;
	color: var(--ink-2);
	border: 1px solid var(--line);
	border-radius: 99px;
	background: var(--surface-2);
}
.chip.mafia {
	color: var(--mafia-ink);
	border-color: var(--mafia);
	background: var(--mafia-dim);
}
.chip.citizen {
	color: var(--citizen-ink);
	border-color: var(--citizen);
	background: var(--citizen-dim);
}
.chip.dead {
	color: var(--ink-2);
	border-color: var(--dead);
	background: var(--surface-2);
}
.note {
	flex: 0 0 auto;
	font-size: var(--t-sm);
	color: var(--ink-2);
	text-align: center;
	word-break: keep-all;
}
.note strong {
	color: var(--ink);
}
.note.flash {
	animation: flash var(--dur) var(--ease);
}
@keyframes flash {
	from {
		opacity: 0;
		transform: translateY(-4px);
	}
}
.chat {
	display: flex;
	flex-direction: column;
	width: 100%;
	height: 100%;
	min-height: 0;
	background: linear-gradient(165deg, var(--surface) 0%, var(--bg) 100%);
	border: 1px solid var(--line);
	border-radius: var(--r2);
	box-shadow: var(--shadow);
	overflow: hidden;
}
.chat-head {
	display: flex;
	align-items: stretch;
	flex: 0 0 auto;
	border-bottom: 1px solid var(--line);
}
.chat-tabwrap {
	position: relative;
	flex: 1 1 auto;
	min-width: 0;
}
.chat-tabwrap::after {
	content: "";
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	width: 20px;
	pointer-events: none;
	opacity: 0;
	background: linear-gradient(to right, rgba(28, 22, 20, 0), var(--surface));
	transition: opacity var(--dur) var(--ease);
}
.chat-tabwrap.more::after {
	opacity: 1;
}
.chat-tabs {
	display: flex;
	gap: 2px;
	width: 100%;
	padding: 2px 2px 0;
	overflow-x: auto;
	scrollbar-width: none;
}
.chat-tabs::-webkit-scrollbar {
	display: none;
}
.tab {
	display: inline-flex;
	align-items: center;
	gap: var(--s1);
	flex: 0 0 auto;
	padding: var(--s1) var(--s2);
	font: inherit;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--ink-3);
	background: transparent;
	border: none;
	border-bottom: 2px solid transparent;
	border-radius: var(--r1) var(--r1) 0 0;
	white-space: nowrap;
	cursor: pointer;
	transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.tab:hover {
	color: var(--ink-2);
	background: var(--surface-2);
}
.tab:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -2px;
}
.tab[aria-selected="true"] {
	color: var(--accent);
	background: var(--surface-3);
	border-bottom-color: var(--accent);
}
.tab.ro::after {
	content: "🔒";
	font-size: 9px;
}
.tab.fresh {
	animation: tabpop 1200ms var(--ease);
}
@keyframes tabpop {
	0%,
	100% {
		box-shadow: none;
	}
	25%,
	65% {
		box-shadow: inset 0 0 0 2px var(--accent);
	}
}
.badge-n {
	min-width: 15px;
	padding: 0 4px;
	font-size: 9px;
	font-weight: 700;
	line-height: 15px;
	text-align: center;
	color: var(--bg);
	background: var(--accent);
	border-radius: 99px;
}
.chat-fold {
	display: inline-flex;
	align-items: center;
	gap: var(--s1);
	flex: 0 0 auto;
	min-width: 44px;
	margin: 2px var(--s1) 2px 0;
	padding: 0 var(--s2);
	font: inherit;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--ink-2);
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r1);
	white-space: nowrap;
	cursor: pointer;
	transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.chat-fold:hover {
	color: var(--ink);
	border-color: var(--ink-3);
}
.chat-fold:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -2px;
}
.chat-body {
	position: relative;
	display: flex;
	flex: 1 1 auto;
	min-height: 0;
}
.chat-log {
	display: flex;
	flex-direction: column;
	gap: var(--s1);
	flex: 1 1 auto;
	min-height: 0;
	padding: var(--s2);
}
.msg {
	display: flex;
	flex-direction: column;
	max-width: 88%;
	font-size: var(--t-sm);
}
.msg .who {
	display: flex;
	align-items: center;
	gap: var(--s1);
	font-size: var(--t-xs);
	color: var(--ink-3);
}
.msg .chip {
	padding: 0 var(--s1);
	font-size: 9px;
}
.msg .reply {
	flex: 0 0 auto;
	min-width: 24px;
	min-height: 24px;
	padding: 0 var(--s1);
	font: inherit;
	font-size: 11px;
	color: var(--ink-3);
	background: transparent;
	border: none;
	border-radius: var(--r1);
	cursor: pointer;
}
.msg .reply:hover {
	color: var(--accent);
}
.msg .reply:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -1px;
}
.msg .txt {
	padding: var(--s1) var(--s2);
	border-radius: var(--r1);
	background: var(--surface-2);
	white-space: pre-wrap;
	word-break: break-word;
}
.msg.mine {
	align-self: flex-end;
	align-items: flex-end;
}
.msg.mine .txt {
	color: var(--bg);
	background: var(--accent);
}
.when {
	flex: 0 0 auto;
	font-size: 9px;
	color: var(--ink-3);
	font-variant-numeric: tabular-nums;
}
.msg.sys,
.msg.evt,
.msg.ntc {
	align-self: center;
	align-items: center;
	max-width: 100%;
	text-align: center;
}
.msg.sys .txt,
.msg.ntc .txt {
	font-size: var(--t-xs);
	color: var(--ink-2);
	background: transparent;
}
.msg.ntc .txt {
	color: var(--ink-3);
}
.msg.evt .txt {
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--accent);
	background: color-mix(in srgb, var(--accent) 14%, transparent);
	border-radius: 99px;
}
.msg.card {
	align-self: stretch;
	align-items: stretch;
	max-width: 100%;
	gap: 2px;
	padding: var(--s2);
	text-align: left;
	border: 1px solid var(--line);
	border-radius: var(--r1);
	background: var(--surface-2);
}
.msg.pm {
	align-self: stretch;
	align-items: stretch;
	max-width: 88%;
	text-align: left;
}
.msg.pm .txt {
	font-size: var(--t-sm);
	color: var(--ink);
	background: color-mix(in srgb, var(--citizen) 18%, transparent);
	border-left: 2px solid var(--citizen);
	border-radius: 0 var(--r1) var(--r1) 0;
}
.msg.card .ttl {
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--accent);
}
.msg.card .row {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--s1);
	font-size: var(--t-xs);
	color: var(--ink-2);
}
.msg.card .row .ellip {

	<body>
		<div class="panel vote">
			<div class="idbar">
				<span class="chip" id="myrole">직업</span>
				<span class="ability" id="ability"></span>
				<span class="stat" id="alive"></span>
			</div>

			<div class="lead">
				<div class="lead-text">
					<div class="lead-title" id="heading">투표</div>
					<div class="lead-sub count" id="sub"></div>
				</div>
				<div class="clock" id="timer"></div>
			</div>

			<div class="timeline" aria-hidden="true"><i></i></div>
			<div class="progress" aria-hidden="true"><i id="progress"></i></div>

			<div class="body scroll">
				<div class="grid" id="grid" role="group" aria-label="투표 대상"></div>
			</div>

			<p class="note" id="note" role="status" aria-live="polite"></p>

			<div class="foot" id="foot">
				<button type="button" class="btn skip-btn" id="skip">
					<span aria-hidden="true">🚫</span>투표 없음 — 오늘은 아무도 처형하지 않습니다
				</button>
			</div>

		<script>
function esc(value) {
 return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function Html(text) {
 this.text = text;
}

Html.prototype.toString = function() {
 return this.text;
};

function frag(value) {
 if (value instanceof Html) return value.text;
 if (Array.isArray(value)) return value.map(frag).join("");
 return esc(value);
}

function html(strings) {
 let out = strings[0];
 for (let i = 1; i < arguments.length; i++) out += frag(arguments[i]) + strings[i];
 return new Html(out);
}

function flag(on, name) {
 return new Html(on ? name : "");
}

function qs(selector, root) {
 return (root || document).querySelector(selector);
}

function qsa(selector, root) {
 return Array.prototype.slice.call((root || document).querySelectorAll(selector));
}

function startTimer(el, seconds) {
 if (!el) return;
 if (el.dataset.timerId) clearInterval(Number(el.dataset.timerId));
 const total = Math.max(1, Math.round(seconds));
 let left = total;
 el.classList.add("clock");
 el.setAttribute("role", "timer");
 el.innerHTML = html`<span class="n"></span><span class="u">초</span>`;
 const label = qs(".n", el);
 const line = qs(".timeline");
 const bar = line ? qs("i", line) : null;
 function paint() {
  const n = Math.max(0, left);
  label.textContent = n < 10 ? "0" + n : String(n);
  el.setAttribute("aria-label", "남은 시간 " + n + "초");
  if (bar) bar.style.width = n / total * 100 + "%";
  el.classList.toggle("urgent", left <= 10);
  el.classList.toggle("critical", left <= 3);
  if (line) line.classList.toggle("urgent", left <= 10);
 }
 paint();
 const id = setInterval(function() {
  left--;
  paint();
  if (left <= 0) clearInterval(id);
 }, 1e3);
 el.dataset.timerId = String(id);
 return id;
}

function scrollToEnd(el) {
 if (el) el.scrollTop = el.scrollHeight;
}

const HostWindow = function() {
 try {
  void window.parent.document.readyState;
  return window.parent;
 } catch (error) {
  return null;
 }
}();

const Parent = function() {
 const store = function() {
  if (!HostWindow) return {};
  if (!HostWindow.__mafiaWidget) HostWindow.__mafiaWidget = {};
  return HostWindow.__mafiaWidget;
 }();
 function send(message) {
  window.parent.postMessage(message, "*");
 }
 function on(handlers) {
  window.addEventListener("message", function(event) {
   const data = event && event.data;
   if (!data) return;
   if (data.layout) applyLayout(data.layout);
   const handler = handlers[data.type];
   if (handler) handler(data);
  });
 }
 function applyLayout(layout) {
  const message = {
   type: "WidgetRearrange",
   anchor: layout.anchor,
   width: layout.width,
   height: layout.height
  };
  if (layout.top) message.top = layout.top;
  if (layout.zIndex) message.zIndex = layout.zIndex;
  send(message);
 }
 function openSignin() {
  window.parent.postMessage({
   type: "ScriptAction:OPEN_Signin_Modal",
   zepSystem: true
  }, "*");
 }
 function editable(el) {
  if (!el || !el.tagName) return false;
  const tag = String(el.tagName).toUpperCase();
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
  return el.isContentEditable === true;
 }
 function onKey(handler) {
  if (!HostWindow) return function() {};
  function off() {
   HostWindow.removeEventListener("keydown", listener, true);
   window.removeEventListener("pagehide", off);
  }
  function listener(event) {
   const frame = window.frameElement;
   if (frame && frame.isConnected === false) {
    off();
    return;
   }
   if (editable(event.target)) return;
   if (event.altKey || event.ctrlKey || event.metaKey) return;
   handler(event);
  }
  HostWindow.addEventListener("keydown", listener, true);
  window.addEventListener("pagehide", off);
  return off;
 }
 function grabFocus() {
  window.focus();
 }
 function releaseFocus() {
  window.parent.focus();
 }
 return {
  send: send,
  on: on,
  onKey: onKey,
  grabFocus: grabFocus,
  releaseFocus: releaseFocus,
  openSignin: openSignin,
  store: store,
  canReadKeys: HostWindow !== null
 };
}();
</script>
		<script>
let myNum = 0;

let myPick = null;

let locked = false;

let barred = [];

const BAR_MS = 600;

const STAGGER = 90;

const SKIP = -1;

function tile(seat, extra) {
 const mine = seat.num === myNum;
 const out = barred.indexOf(seat.num) >= 0;
 const caption = mine ? "나" : seat.alive ? seat.name || "" : "사망";
 const classes = "tile" + (mine ? " me" : "") + (seat.alive ? "" : " dead") + (out ? " barred" : "") + (extra ? " " + extra : "");
 return html`<button
					type="button"
					class="${classes}"
					data-num="${seat.num}"
					${flag(locked || !seat.alive || out, "disabled")}
					aria-label="${seat.num}번 ${seat.name || ""}${out ? " (부결됨)" : ""}"
				>
					<span class="num">${seat.num}</span><span class="cap">${caption}</span>
					${out ? html`<span class="badge">부결</span>` : ""}
				</button>`;
}

function seats(data) {
 return Array.isArray(data.seats) ? data.seats : [];
}

function paintAlive(list) {
 let alive = 0;
 for (const seat of list) {
  if (seat.alive) alive++;
 }
 qs("#alive").textContent = `생존 ${alive}/${list.length}`;
}

function paintCast(nums) {
 for (const el of qsa(".tile")) {
  el.classList.toggle("cast", nums.indexOf(Number(el.dataset.num)) >= 0);
 }
}

function paintPick() {
 for (const el of qsa(".tile")) {
  el.classList.toggle("picked", Number(el.dataset.num) === myPick);
 }
 qs("#skip").classList.toggle("picked", myPick === SKIP);
}

function pickNote() {
 if (myPick === null) return "기권했습니다. 다시 고를 수 있습니다.";
 if (myPick === SKIP) return "'투표 없음'을 골랐습니다. 다시 누르면 취소됩니다.";
 return `${myPick}번을 지목했습니다. 다시 누르면 취소됩니다.`;
}

function choose(num) {
 if (locked) return;
 myPick = myPick === num ? null : num;
 paintPick();
 Parent.send({
  type: "vote",
  target: myPick
 });
 qs("#note").textContent = pickNote();
}

qs("#grid").addEventListener("click", event => {
 const el = event.target.closest(".tile");
 if (!el || el.disabled) return;
 choose(Number(el.dataset.num));
});

qs("#skip").addEventListener("click", () => choose(SKIP));

Parent.on({
 init(data) {
  myNum = Number(data.myNum) || 0;
  const list = seats(data);
  const ghost = list.some(seat => seat.num === myNum && !seat.alive);
  locked = ghost;
  barred = Array.isArray(data.rejected) ? data.rejected : [];
  myPick = Number(data.picked) || null;
  const role = qs("#myrole");
  role.textContent = (data.glyph ? data.glyph + " " : "") + (data.role || "");
  role.className = "chip " + (data.alive === false ? "dead" : data.team === "mafia" ? "mafia" : "citizen");
  qs("#ability").textContent = data.abilityLine || "";
  paintAlive(list);
  qs("#heading").textContent = ghost ? "투표할 수 없습니다" : "누구를 처형할까요";
  qs("#grid").innerHTML = html`${list.map(seat => tile(seat))}`;
  qs("#foot").classList.remove("hidden");
  qs("#skip").disabled = locked;
  paintPick();
  qs("#note").textContent = ghost ? "👻 유령은 투표할 수 없습니다." : myPick === null ? "고르지 않으면 기권입니다. 단서가 없으면 '투표 없음'도 한 표입니다." : pickNote();
  startTimer(qs("#timer"), data.timer);
 },
 progress(data) {
  const count = Number(data.voted) || 0;
  const total = Number(data.alive) || 1;
  qs("#progress").style.width = Math.round(count / total * 100) + "%";
  qs("#sub").textContent = `${count}/${total} 투표 완료`;
  paintCast(Array.isArray(data.done) ? data.done : []);
 },
 result(data) {
  locked = true;
  myNum = Number(data.myNum) || 0;
  const list = seats(data);
  const role = qs("#myrole");
  role.textContent = (data.glyph ? data.glyph + " " : "") + (data.role || "");
  role.className = "chip " + (data.alive === false ? "dead" : data.team === "mafia" ? "mafia" : "citizen");
  qs("#ability").textContent = data.abilityLine || "";
  paintAlive(list);
  qs("#heading").textContent = "개표";
  qs("#progress").style.width = "100%";
  qs("#sub").textContent = data.message || "";
  qs("#sub").classList.remove("count");
  qs("#note").textContent = "";
  qs("#foot").classList.add("hidden");
  const top = list.reduce((max, seat) => Math.max(max, Number(seat.votes) || 0), 0);
  qs("#grid").innerHTML = html`${list.map(seat => tile(seat, "counted" + (seat.num === data.nominee ? " out" : "")))}`;
  const bars = [];
  let outTile = null;
  list.forEach((seat, i) => {
   const el = qs(`.tile[data-num="${seat.num}"]`);
   if (!el) return;
   if (seat.num === data.nominee) outTile = el;
   const votes = Number(seat.votes) || 0;
   el.insertAdjacentHTML("beforeend", html`<span class="tally">${votes}표</span><span class="bar"></span>`);
   const bar = qs(".bar", el);
   bar.style.transitionDuration = BAR_MS + "ms";
   bar.style.transitionDelay = i * STAGGER + "ms";
   bars.push({
    el: bar,
    width: top > 0 ? votes / top * 100 : 0
   });
  });
  if (outTile) {
   outTile.style.animationDelay = list.length * STAGGER + BAR_MS + "ms";
  }
  requestAnimationFrame(() => {
   for (const entry of bars) entry.el.style.width = entry.width + "%";
  });
  startTimer(qs("#timer"), data.timer);
 }
});
</script>
