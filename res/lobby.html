<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>대기실</title>
		<style>
/*
 * 위젯 공통 디자인 시스템.
 *
 * 기존에는 위젯 11개가 각자 CSS를 처음부터 다시 썼다. 같은 의미의 색이
 * 파일마다 다른 값이었고(#484848 / #333333 / #3c3030 / #563d3d …
 * 총 26종), 타이머 글꼴 크기는 화면마다 20px·35px·18px로 제각각이었다.
 * 한 화면의 톤을 바꾸면 나머지 열 개가 어긋났다.
 *
 * 이 파일이 유일한 출처다. tools/build-widgets.js가 각 위젯 HTML의
 * <!--@theme--> 자리에 인라인한다. ZEP 위젯은 iframe이라 외부 CSS 링크의
 * 해석 기준을 신뢰할 수 없어서, 소스는 나누되 산출물은 자기완결로 만든다.
 */

/* ---------- 토큰 ---------- */
:root {
	/* 표면: 뒤로 갈수록 어두워진다 */
	--bg: #14100f;
	--surface: #201a19;
	--surface-2: #2d2523;
	--surface-3: #3b312e;
	--line: #4a3d39;

	/* 글자 */
	--ink: #f5efe9;
	--ink-2: #b9aaa2;
	--ink-3: #7d6e68;

	/* 진영 */
	--mafia: #e04b4b;
	--mafia-dim: #6d2424;
	--citizen: #57a8e0;
	--citizen-dim: #24475f;

	/* 상태 */
	--accent: #e0b355; /* 상호작용 가능·강조 */
	--ok: #5fbf7f;
	--warn: #e0b355;
	--danger: #e04b4b;
	--dead: #5a4a45;

	/* 간격: 4px 배수 */
	--s1: 4px;
	--s2: 8px;
	--s3: 12px;
	--s4: 16px;
	--s5: 24px;

	/* 타이포: 위젯 폭에 따라 늘어난다 */
	--t-xs: clamp(10px, 2.6vw, 12px);
	--t-sm: clamp(11px, 3vw, 13px);
	--t-md: clamp(13px, 3.5vw, 15px);
	--t-lg: clamp(15px, 4.2vw, 18px);
	--t-xl: clamp(19px, 5.5vw, 24px);
	--t-2xl: clamp(24px, 7vw, 34px);

	--r1: 6px;
	--r2: 10px;
	--r3: 14px;

	--shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
	--dur: 160ms;
	--ease: cubic-bezier(0.2, 0, 0.2, 1);
}

/* 애니메이션을 끈 사용자에게는 전환을 즉시 끝낸다 */
@media (prefers-reduced-motion: reduce) {
	:root {
		--dur: 1ms;
	}
	*,
	*::before,
	*::after {
		animation-duration: 1ms !important;
		animation-iteration-count: 1 !important;
		transition-duration: 1ms !important;
	}
}

/* ---------- 리셋 ---------- */
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

html,
body {
	width: 100%;
	height: 100%;
	overflow: hidden;
}

body {
	/*
	 * 웹폰트를 쓰지 않는다. 기존 대기실은 jsdelivr에서 폰트 2종을 받았는데,
	 * 폰트가 도착하기 전까지 목록이 다른 글꼴로 그려졌다가 튀었고(FOUT)
	 * CDN이 막힌 환경에서는 영영 오지 않았다. 시스템 한글 글꼴로 충분하다.
	 */
	font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
		"Malgun Gothic", "맑은 고딕", "Noto Sans KR", system-ui, sans-serif;
	font-size: var(--t-md);
	line-height: 1.45;
	color: var(--ink);
	background: transparent;
	-webkit-font-smoothing: antialiased;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}

/* ---------- 판 ---------- */
/*
 * 모든 위젯은 panel 하나로 시작한다. 기존에는 화면마다 배경 처리가 달라서
 * (이미지 / 반투명 검정 / 없음) 같은 게임인데 화면이 바뀔 때마다
 * 다른 앱처럼 보였다.
 */
.panel {
	display: flex;
	flex-direction: column;
	width: 100%;
	height: 100%;
	padding: var(--s3);
	gap: var(--s2);
	background: linear-gradient(160deg, var(--surface) 0%, var(--bg) 100%);
	border: 1px solid var(--line);
	border-radius: var(--r3);
	box-shadow: var(--shadow);
	overflow: hidden;
}

/* 단계별 분위기. 배경만 갈아끼우고 구조는 같다 */
.panel.night {
	background: linear-gradient(160deg, #1b2340 0%, #0d1020 100%);
}
.panel.day {
	background: linear-gradient(160deg, #40331b 0%, #1a1410 100%);
}
.panel.vote {
	background: linear-gradient(160deg, #2b2036 0%, #140f1a 100%);
}

/* ---------- 머리말 ---------- */
.hd {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--s2);
	flex: 0 0 auto;
}

.hd-title {
	display: flex;
	align-items: center;
	gap: var(--s2);
	min-width: 0;
	font-size: var(--t-lg);
	font-weight: 700;
	letter-spacing: -0.01em;
}

.hd-sub {
	font-size: var(--t-xs);
	color: var(--ink-3);
	white-space: nowrap;
}

/* ---------- 타이머 ---------- */
/*
 * 기존에는 4개 파일이 toHHMMSS를 각자 갖고 있었고 90초를 "00:01:30"으로
 * 표시했다. 시(時) 자리는 이 게임에서 영원히 00이다.
 * 여기서는 남은 초만 크게 보여주고, 링으로 진행률을 함께 그린다.
 */
.timer {
	position: relative;
	flex: 0 0 auto;
	display: grid;
	place-items: center;
	width: 44px;
	height: 44px;
	font-variant-numeric: tabular-nums;
	font-size: var(--t-lg);
	font-weight: 700;
	color: var(--ink);
}

.timer svg {
	position: absolute;
	inset: 0;
	transform: rotate(-90deg);
}

.timer circle {
	fill: none;
	stroke-width: 3;
	stroke-linecap: round;
}

.timer .track {
	stroke: var(--surface-3);
}

.timer .bar {
	stroke: var(--accent);
	transition: stroke-dashoffset 1s linear, stroke var(--dur) var(--ease);
}

/* 마지막 10초 */
.timer.urgent .bar {
	stroke: var(--danger);
}
.timer.urgent {
	color: var(--danger);
	animation: pulse 1s var(--ease) infinite;
}

@keyframes pulse {
	0%,
	100% {
		transform: scale(1);
	}
	50% {
		transform: scale(1.08);
	}
}

/* ---------- 본문 ---------- */
.body {
	flex: 1 1 auto;
	min-height: 0;
	display: flex;
	flex-direction: column;
	gap: var(--s2);
}

.scroll {
	overflow-y: auto;
	overscroll-behavior: contain;
	scrollbar-width: thin;
	scrollbar-color: var(--surface-3) transparent;
}

.scroll::-webkit-scrollbar {
	width: 6px;
}
.scroll::-webkit-scrollbar-thumb {
	background: var(--surface-3);
	border-radius: 99px;
}
.scroll::-webkit-scrollbar-track {
	background: transparent;
}

/* ---------- 버튼 ---------- */
/*
 * 기존 조작 요소는 전부 <div onclick>이었다. 키보드로 도달할 수 없고
 * 포커스 링도 없어서 마우스가 없으면 게임 자체가 불가능했다.
 * 위젯 HTML은 전부 <button>을 쓰고, 모양은 이 클래스가 준다.
 */
.btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--s1);
	min-height: 34px;
	padding: var(--s2) var(--s3);
	font: inherit;
	font-size: var(--t-sm);
	font-weight: 600;
	color: var(--ink);
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r1);
	cursor: pointer;
	transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
		transform var(--dur) var(--ease);
}

.btn:hover:not(:disabled) {
	background: var(--surface-3);
}

.btn:active:not(:disabled) {
	transform: scale(0.97);
}

.btn:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 2px;
}

.btn:disabled {
	cursor: default;
	opacity: 0.45;
}

.btn.primary {
	color: #14100f;
	background: var(--accent);
	border-color: var(--accent);
}
.btn.primary:hover:not(:disabled) {
	filter: brightness(1.1);
}

.btn.ok {
	color: #0e1a12;
	background: var(--ok);
	border-color: var(--ok);
}

.btn.danger {
	color: var(--ink);
	background: var(--mafia-dim);
	border-color: var(--mafia);
}

.btn.ghost {
	background: transparent;
}

/* ---------- 참가자 타일 ---------- */
/*
 * 밤 지목·투표가 같은 격자를 쓴다. 예전에는 밤은 4열 정사각 타일,
 * 투표는 3열 30px 막대로 서로 다른 화면이었다. 같은 동작(사람 하나를
 * 고른다)이면 같은 모양이어야 무엇을 누르는지 배우는 비용이 한 번이다.
 */
.grid {
	display: grid;
	grid-template-columns: repeat(4, 1fr);
	gap: var(--s2);
	align-content: start;
}

@media (max-width: 340px) {
	.grid {
		grid-template-columns: repeat(3, 1fr);
	}
}

.tile {
	position: relative;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 2px;
	aspect-ratio: 1;
	padding: var(--s1);
	font: inherit;
	font-size: var(--t-sm);
	font-weight: 700;
	color: var(--ink);
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r2);
	cursor: pointer;
	transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
		transform var(--dur) var(--ease);
}

.tile:hover:not(:disabled) {
	background: var(--surface-3);
	border-color: var(--ink-3);
}

.tile:active:not(:disabled) {
	transform: scale(0.95);
}

.tile:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 2px;
}

.tile .num {
	font-size: var(--t-lg);
	line-height: 1.1;
}

.tile .cap {
	font-size: var(--t-xs);
	font-weight: 500;
	color: var(--ink-3);
}

/* 나 */
.tile.me {
	border-color: var(--ok);
}
.tile.me .cap {
	color: var(--ok);
}

/* 죽은 사람 */
.tile:disabled,
.tile.dead {
	cursor: default;
	color: var(--dead);
	background: var(--surface);
	border-color: var(--surface-2);
}
.tile.dead .cap {
	color: var(--dead);
}

/* 지목·투표 완료 */
.tile.picked {
	background: var(--mafia-dim);
	border-color: var(--mafia);
	box-shadow: 0 0 0 2px var(--mafia) inset;
}

/* 같은 팀(마피아 채팅) */
.tile.ally {
	border-color: var(--mafia);
	background: color-mix(in srgb, var(--mafia-dim) 60%, var(--surface-2));
}

/* 타일 위 배지: 상태를 글자로도 남긴다 (색만으로 구분하지 않기 위해) */
.tile .badge {
	position: absolute;
	top: 2px;
	right: 3px;
	font-size: var(--t-xs);
	line-height: 1;
}

/* 득표수 */
.tile .tally {
	position: absolute;
	bottom: 2px;
	left: 0;
	right: 0;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--accent);
}

/* ---------- 칩 ---------- */
.chip {
	display: inline-flex;
	align-items: center;
	gap: var(--s1);
	padding: 2px var(--s2);
	font-size: var(--t-xs);
	font-weight: 700;
	white-space: nowrap;
	border: 1px solid var(--line);
	border-radius: 99px;
	background: var(--surface-2);
}

.chip.mafia {
	color: var(--mafia);
	border-color: var(--mafia);
	background: var(--mafia-dim);
}
.chip.citizen {
	color: var(--citizen);
	border-color: var(--citizen);
	background: var(--citizen-dim);
}
.chip.dead {
	color: var(--ink-3);
}

/* ---------- 안내 문구 ---------- */
.note {
	flex: 0 0 auto;
	font-size: var(--t-sm);
	color: var(--ink-2);
	text-align: center;
	word-break: keep-all;
}

.note strong {
	color: var(--ink);
}

/* 상태가 바뀔 때 문구가 갈아끼워지는 것을 눈이 따라가도록 */
.note.flash {
	animation: flash var(--dur) var(--ease);
}

@keyframes flash {
	from {
		opacity: 0;
		transform: translateY(-4px);
	}
}

/* ---------- 채팅 ---------- */
.chat {
	display: flex;
	flex-direction: column;
	flex: 1 1 auto;
	min-height: 0;
	border: 1px solid var(--line);
	border-radius: var(--r2);
	overflow: hidden;
	background: var(--bg);
}

.chat-log {
	display: flex;
	flex-direction: column;
	gap: var(--s1);
	flex: 1 1 auto;
	min-height: 60px;
	padding: var(--s2);
	overflow-y: auto;
	overscroll-behavior: contain;
	scrollbar-width: thin;
	scrollbar-color: var(--surface-3) transparent;
}

.chat-log::-webkit-scrollbar {
	width: 6px;
}
.chat-log::-webkit-scrollbar-thumb {
	background: var(--surface-3);
	border-radius: 99px;
}

.msg {
	display: flex;
	flex-direction: column;
	max-width: 85%;
	font-size: var(--t-sm);
}

.msg .who {
	font-size: var(--t-xs);
	color: var(--ink-3);
}

.msg .txt {
	padding: var(--s1) var(--s2);
	border-radius: var(--r1);
	background: var(--surface-2);
	word-break: break-word;
}

.msg.mine {
	align-self: flex-end;
	align-items: flex-end;
}
.msg.mine .txt {
	color: #14100f;
	background: var(--accent);
}

.msg.sys {
	align-self: center;
	max-width: 100%;
	text-align: center;
}
.msg.sys .txt {
	color: var(--ink-2);
	background: transparent;
	font-size: var(--t-xs);
}

.chat-input {
	flex: 0 0 auto;
	width: 100%;
	padding: var(--s2);
	font: inherit;
	font-size: var(--t-sm);
	color: var(--ink);
	background: var(--surface);
	border: none;
	border-top: 1px solid var(--line);
	outline: none;
}

.chat-input::placeholder {
	color: var(--ink-3);
}

.chat-input:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -2px;
}

/* ---------- 유틸 ---------- */
.hidden {
	display: none !important;
}

.row {
	display: flex;
	align-items: center;
	gap: var(--s2);
}

.grow {
	flex: 1 1 auto;
	min-width: 0;
}

.ellip {
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
}

/* 스크린리더 전용 */
.sr {
	position: absolute;
	width: 1px;
	height: 1px;
	padding: 0;
	margin: -1px;
	overflow: hidden;
	clip: rect(0, 0, 0, 0);
	white-space: nowrap;
	border: 0;
}

</style>
		<style>
			/*
			 * 대기실: 방 목록 <-> 방 안 좌석 목록.
			 *
			 * 기존 WatingRoom.html은 182KB였다. 배경 이미지 2장을 base64로
			 * 품고 jsdelivr에서 웹폰트 2종을 받았다. 그리고 이런 것들이 있었다:
			 *
			 * - .container가 380x300px 고정이라 폰이 아니라 태블릿에서도 잘렸다.
			 *   미디어 쿼리는 325px 한 개뿐이었다.
			 * - 조작 요소가 전부 <div onclick>이었다. 탭 이동도, 포커스 표시도,
			 *   스크린리더용 이름도 없었다.
			 * - 강퇴 버튼이 현재 표수만 보여줬다. 몇 표가 필요한지, 내가 이미
			 *   눌렀는지 알 수 없어서 같은 버튼을 계속 누르게 됐다(토글이라
			 *   두 번 누르면 취소되는데, 그 사실도 화면에 없었다).
			 * - 준비 버튼을 눌러도 왜 시작하지 않는지 알려주지 않았다.
			 *   최소 인원이 4명이라는 사실이 화면 어디에도 없었다.
			 *
			 * 두 화면 사이 이동은 서버가 보내는 좌석 목록의 길이로 정해진다.
			 * 빈 목록 = 방 밖. 이건 기존 프로토콜 그대로다.
			 */
			.rooms {
				display: grid;
				grid-template-columns: repeat(2, 1fr);
				gap: var(--s2);
				align-content: start;
			}

			.room {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: var(--s2);
				padding: var(--s2) var(--s3);
				font: inherit;
				font-size: var(--t-sm);
				font-weight: 700;
				color: var(--ink);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-radius: var(--r2);
				cursor: pointer;
				transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
			}

			.room:hover:not(:disabled) {
				background: var(--surface-3);
				border-color: var(--accent);
			}
			.room:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			.room:disabled {
				cursor: default;
				color: var(--ink-3);
				opacity: 0.6;
			}

			.room .cnt {
				font-variant-numeric: tabular-nums;
				font-weight: 500;
				color: var(--ink-2);
			}
			.room.full .cnt {
				color: var(--warn);
			}
			.room.playing .cnt {
				color: var(--mafia);
			}

			/* 좌석 한 줄 */
			.seat {
				display: flex;
				align-items: center;
				gap: var(--s2);
				padding: var(--s2);
				background: var(--surface-2);
				border: 1px solid var(--line);
				border-radius: var(--r2);
			}

			.seat.ready {
				border-color: var(--ok);
			}
			.seat.me {
				background: var(--surface-3);
			}

			.seat .idx {
				flex: 0 0 auto;
				width: 18px;
				font-size: var(--t-sm);
				font-weight: 700;
				color: var(--ink-3);
				text-align: right;
			}

			.seat .nm {
				font-size: var(--t-sm);
				font-weight: 600;
			}

			.seat .meta {
				font-size: var(--t-xs);
				color: var(--ink-3);
			}

			.seat .state {
				flex: 0 0 auto;
				font-size: var(--t-xs);
				font-weight: 700;
				color: var(--ink-3);
			}
			.seat.ready .state {
				color: var(--ok);
			}

			.kick {
				flex: 0 0 auto;
				min-height: 26px;
				padding: 2px var(--s2);
				font-size: var(--t-xs);
			}
			.kick.voted {
				color: var(--danger);
				border-color: var(--danger);
			}

			.list {
				display: flex;
				flex-direction: column;
				gap: var(--s1);
			}

			.foot {
				display: flex;
				gap: var(--s2);
				flex: 0 0 auto;
			}
		</style>
	</head>
	<body>
		<div class="panel">
			<div class="hd">
				<div class="hd-title grow">
					<span id="heading">방 선택</span>
					<span class="hd-sub" id="sub"></span>
				</div>
			</div>

			<div class="body scroll">
				<div class="rooms" id="rooms" role="group" aria-label="방 목록"></div>
				<div class="list hidden" id="seats" role="list" aria-label="참가자"></div>
			</div>

			<p class="note" id="note" role="status" aria-live="polite"></p>

			<div class="foot hidden" id="foot">
				<button class="btn ghost" id="quit" type="button">나가기</button>
				<button class="btn primary grow" id="ready" type="button">준비</button>
			</div>
		</div>

		<script>
/*
 * 위젯 공통 스크립트.
 *
 * 기존에는 toHHMMSS가 4개 파일에, esc가 2개 파일에 복사돼 있었다.
 * 복사본은 갈라진다 — night.html의 타이머는 다 되면 글자를 흰색으로,
 * morning.html은 #484848로 되돌렸다. 같은 타이머인데 화면마다 달랐다.
 *
 * tools/build-widgets.js가 각 위젯 HTML의 <!--@shared--> 자리에 인라인한다.
 */

/** 서버가 보낸 문자열은 다른 플레이어가 정한 값이다. 태그로 해석되면 안 된다 */
function esc(value) {
	return String(value == null ? "" : value)
		.replace(/&/g, "&amp;")
		.replace(/</g, "&lt;")
		.replace(/>/g, "&gt;")
		.replace(/"/g, "&quot;")
		.replace(/'/g, "&#39;");
}

function $(selector, root) {
	return (root || document).querySelector(selector);
}

function $(selector, root) {
	return Array.prototype.slice.call((root || document).querySelectorAll(selector));
}

/** 부모(ZEP 클라이언트)에게 보낸다 */
function send(message) {
	window.parent.postMessage(message, "*");
}

/**
 * 서버 메시지 구독. type별 핸들러 표를 받는다.
 *
 * 기존 위젯은 전부 addEventListener("message") + switch였고, morning/night는
 * type을 아예 보지 않아 어떤 메시지가 와도 타이머를 다시 시작했다.
 */
function onServer(handlers) {
	window.addEventListener("message", function (event) {
		var data = event && event.data;
		if (!data) return;
		var handler = handlers[data.type];
		if (handler) handler(data);
	});
}

/**
 * 남은 시간 표시.
 *
 * 기존 toHHMMSS는 90초를 "00:01:30"으로 그렸다. 이 게임의 최장 단계는
 * 60초라 시(時) 자리는 영원히 00이고, 분 자리도 대부분 00이다.
 * 화면에서 실제로 변하는 것은 초뿐인데 6글자를 읽게 했다.
 *
 * el은 .timer이며 내부에 진행률 링(svg)을 갖는다. 남은 비율을 함께
 * 그려서 숫자를 읽지 않아도 얼마나 남았는지 보이게 한다.
 */
function startTimer(el, seconds) {
	if (!el) return;
	// 같은 위젯이 payload를 두 번 받으면 타이머도 두 개가 된다. 둘 다 살아서
	// 서로 다른 숫자를 번갈아 쓰기 때문에 남은 시간이 튀어 보인다.
	// 이전 것을 먼저 끄면 몇 번을 다시 받든 항상 하나만 돈다.
	if (el.dataset.timerId) clearInterval(Number(el.dataset.timerId));
	var total = Math.max(1, Math.round(seconds));
	var left = total;
	var label = document.createElement("span");
	var RADIUS = 19;
	var CIRC = 2 * Math.PI * RADIUS;

	el.innerHTML =
		'<svg viewBox="0 0 44 44" aria-hidden="true">' +
		'<circle class="track" cx="22" cy="22" r="' +
		RADIUS +
		'"></circle>' +
		'<circle class="bar" cx="22" cy="22" r="' +
		RADIUS +
		'" stroke-dasharray="' +
		CIRC +
		'" stroke-dashoffset="0"></circle>' +
		"</svg>";
	el.appendChild(label);
	el.setAttribute("role", "timer");

	var bar = $(".bar", el);

	function paint() {
		label.textContent = String(Math.max(0, left));
		el.setAttribute("aria-label", "남은 시간 " + Math.max(0, left) + "초");
		bar.style.strokeDashoffset = String(CIRC * (1 - Math.max(0, left) / total));
		// 마지막 10초는 색과 맥동으로도 알린다. 소리를 못 듣는 환경이 있다
		if (left <= 10) el.classList.add("urgent");
		else el.classList.remove("urgent");
	}

	paint();
	var id = setInterval(function () {
		left--;
		paint();
		if (left <= 0) clearInterval(id);
	}, 1000);
	el.dataset.timerId = String(id);
	return id;
}

/**
 * 위젯 위치 보정.
 *
 * 기존에는 이 계산이 3개 파일에 서로 다르게 복사돼 있었다. 대기실은
 * 태블릿을 768px로, 밤 위젯은 같은 768px을 다른 의미로 썼고, 투표·개표
 * 화면은 보정 자체가 없어 모바일에서 화면 밖으로 나갔다.
 */
function rearrange(isMobile) {
	if (!isMobile) {
		send({ type: "WidgetRearrange", top: "-12px", anchor: "topright" });
		return;
	}
	var tablet = window.screen.width >= 768;
	send({
		type: "WidgetRearrange",
		anchor: "top",
		top: tablet ? "-40px" : "-24px",
		width: tablet ? "60%" : "96%",
	});
}

/** 로그 맨 아래로. 붙인 뒤에 호출해야 한다 */
function scrollToEnd(el) {
	if (el) el.scrollTop = el.scrollHeight;
}

</script>
		<script>
			var myId = null;
			var iAmReady = false;
			var config = { min: 4, max: 8, kickVotes: 3 };
			var counts = {};

			/* ---------- 방 목록 ---------- */
			function paintRooms() {
				var nums = Object.keys(counts).sort(function (a, b) {
					return Number(a) - Number(b);
				});

				$("#rooms").innerHTML = nums
					.map(function (num) {
						var info = counts[num] || { count: 0, started: false };
						var full = info.count >= config.max;
						var blocked = info.started || full;
						var state = info.started ? "진행 중" : full ? "가득 참" : info.count + "/" + config.max;

						return (
							'<button type="button" class="room' +
							(info.started ? " playing" : full ? " full" : "") +
							'" data-num="' +
							num +
							'"' +
							(blocked ? " disabled" : "") +
							' aria-label="' +
							num +
							"번 방, " +
							state +
							'">' +
							"<span>" +
							num +
							"번 방</span>" +
							'<span class="cnt">' +
							state +
							"</span>" +
							"</button>"
						);
					})
					.join("");
			}

			$("#rooms").addEventListener("click", function (event) {
				var el = event.target.closest(".room");
				if (!el || el.disabled) return;
				send({ type: "join", roomNum: Number(el.dataset.num) });
			});

			/* ---------- 좌석 목록 ---------- */
			function paintSeats(list) {
				var readyCount = 0;
				var me = null;

				$("#seats").innerHTML = list
					.map(function (seat, i) {
						if (seat.ready) readyCount++;
						var mine = seat.id === myId;
						if (mine) me = seat;

						// 강퇴는 필요 표수를 함께 보여준다. 몇 표가 남았는지 모르면
						// 누를지 말지 판단할 수 없다
						var kick = mine
							? ""
							: '<button type="button" class="btn ghost kick' +
								(seat.kickCount > 0 ? " voted" : "") +
								'" data-id="' +
								esc(seat.id) +
								'" aria-label="' +
								esc(seat.name) +
								' 강퇴 투표">강퇴 ' +
								seat.kickCount +
								"/" +
								config.kickVotes +
								"</button>";

						return (
							'<div class="seat' +
							(seat.ready ? " ready" : "") +
							(mine ? " me" : "") +
							'" role="listitem">' +
							'<span class="idx">' +
							(i + 1) +
							"</span>" +
							'<span class="grow ellip">' +
							'<span class="nm">' +
							esc(seat.name) +
							(mine ? " (나)" : "") +
							"</span> " +
							'<span class="meta">Lv.' +
							esc(seat.level) +
							" · " +
							esc(seat.runCount) +
							"판</span>" +
							"</span>" +
							'<span class="state">' +
							(seat.ready ? "준비" : "대기") +
							"</span>" +
							kick +
							"</div>"
						);
					})
					.join("");

				iAmReady = !!(me && me.ready);
				var ready = $("#ready");
				ready.textContent = iAmReady ? "준비 취소" : "준비";
				ready.classList.toggle("primary", !iAmReady);
				ready.classList.toggle("ok", iAmReady);

				$("#sub").textContent = list.length + "명 · 준비 " + readyCount + "명";

				// 왜 시작하지 않는지 항상 한 줄로 말해준다
				if (list.length < config.min) {
					$("#note").textContent = config.min - list.length + "명 더 모이면 시작할 수 있습니다.";
				} else if (readyCount < list.length) {
					$("#note").textContent = list.length - readyCount + "명이 아직 준비하지 않았습니다.";
				} else {
					$("#note").textContent = "곧 시작합니다.";
				}
			}

			$("#seats").addEventListener("click", function (event) {
				var el = event.target.closest(".kick");
				if (!el) return;
				send({ type: "kick", id: el.dataset.id });
			});

			$("#ready").addEventListener("click", function () {
				send({ type: iAmReady ? "cancle-ready" : "ready" });
			});

			$("#quit").addEventListener("click", function () {
				send({ type: "quit" });
			});

			/* ---------- 화면 전환 ---------- */
			function showRooms(inRoom) {
				$("#rooms").classList.toggle("hidden", inRoom);
				$("#seats").classList.toggle("hidden", !inRoom);
				$("#foot").classList.toggle("hidden", !inRoom);
				$("#heading").textContent = inRoom ? "대기실" : "방 선택";
				if (!inRoom) {
					$("#sub").textContent = "";
					$("#note").textContent = "참가할 방을 고르세요.";
				}
			}

			onServer({
				setID: function (data) {
					myId = data.id;
					if (data.minPlayers) config.min = data.minPlayers;
					if (data.maxPlayers) config.max = data.maxPlayers;
					if (data.kickVotes) config.kickVotes = data.kickVotes;
					rearrange(data.isMobile);
				},

				init: function (data) {
					var list = Array.isArray(data.data) ? data.data : [];
					showRooms(list.length > 0);
					if (list.length > 0) paintSeats(list);
					else paintRooms();
				},

				updatePlayerCount: function (data) {
					counts = data.data || {};
					if (!$("#rooms").classList.contains("hidden")) paintRooms();
				},
			});
		</script>
	</body>
</html>
