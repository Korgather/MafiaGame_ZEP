<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>대기실</title>
		<style>
/*
 * 위젯 공통 디자인 시스템.
 *
 * 기존에는 위젯 11개가 각자 CSS를 처음부터 다시 썼다. 같은 의미의 색이
 * 파일마다 다른 값이었고(#484848 / #333333 / #3c3030 / #563d3d …
 * 총 26종), 타이머 글꼴 크기는 화면마다 20px·35px·18px로 제각각이었다.
 * 한 화면의 톤을 바꾸면 나머지 열 개가 어긋났다.
 *
 * 이 파일이 유일한 출처다. tools/build-widgets.js가 각 위젯 HTML의
 * <!--@theme--> 자리에 인라인한다. ZEP 위젯은 iframe이라 외부 CSS 링크의
 * 해석 기준을 신뢰할 수 없어서, 소스는 나누되 산출물은 자기완결로 만든다.
 */

/* ---------- 토큰 ---------- */
:root {
	/* 표면: 뒤로 갈수록 어두워진다 */
	--bg: #14100f;
	--surface: #201a19;
	--surface-2: #2d2523;
	--surface-3: #3b312e;
	--line: #4a3d39;

	/* 글자 */
	--ink: #f5efe9;
	--ink-2: #b9aaa2;
	--ink-3: #7d6e68;

	/* 진영 */
	--mafia: #e04b4b;
	--mafia-dim: #6d2424;
	--citizen: #57a8e0;
	--citizen-dim: #24475f;

	/* 상태 */
	--accent: #e0b355; /* 상호작용 가능·강조 */
	--ok: #5fbf7f;
	--warn: #e0b355;
	--danger: #e04b4b;
	--dead: #5a4a45;

	/* 간격: 4px 배수 */
	--s1: 4px;
	--s2: 8px;
	--s3: 12px;
	--s4: 16px;
	--s5: 24px;

	/* 타이포: 위젯 폭에 따라 늘어난다 */
	--t-xs: clamp(10px, 2.6vw, 12px);
	--t-sm: clamp(11px, 3vw, 13px);
	--t-md: clamp(13px, 3.5vw, 15px);
	--t-lg: clamp(15px, 4.2vw, 18px);
	--t-xl: clamp(19px, 5.5vw, 24px);
	--t-2xl: clamp(24px, 7vw, 34px);

	--r1: 6px;
	--r2: 10px;
	--r3: 14px;

	--shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
	--dur: 160ms;
	--ease: cubic-bezier(0.2, 0, 0.2, 1);
}

/* 애니메이션을 끈 사용자에게는 전환을 즉시 끝낸다 */
@media (prefers-reduced-motion: reduce) {
	:root {
		--dur: 1ms;
	}
	*,
	*::before,
	*::after {
		animation-duration: 1ms !important;
		animation-iteration-count: 1 !important;
		transition-duration: 1ms !important;
	}
}

/* ---------- 리셋 ---------- */
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

html,
body {
	width: 100%;
	height: 100%;
	overflow: hidden;
}

body {
	/*
	 * 웹폰트를 쓰지 않는다. 기존 대기실은 jsdelivr에서 폰트 2종을 받았는데,
	 * 폰트가 도착하기 전까지 목록이 다른 글꼴로 그려졌다가 튀었고(FOUT)
	 * CDN이 막힌 환경에서는 영영 오지 않았다. 시스템 한글 글꼴로 충분하다.
	 */
	font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
		"Malgun Gothic", "맑은 고딕", "Noto Sans KR", system-ui, sans-serif;
	font-size: var(--t-md);
	line-height: 1.45;
	color: var(--ink);
	background: transparent;
	-webkit-font-smoothing: antialiased;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}

/* ---------- 판 ---------- */
/*
 * 모든 위젯은 panel 하나로 시작한다. 기존에는 화면마다 배경 처리가 달라서
 * (이미지 / 반투명 검정 / 없음) 같은 게임인데 화면이 바뀔 때마다
 * 다른 앱처럼 보였다.
 */
.panel {
	display: flex;
	flex-direction: column;
	width: 100%;
	height: 100%;
	padding: var(--s3);
	gap: var(--s2);
	background: linear-gradient(160deg, var(--surface) 0%, var(--bg) 100%);
	border: 1px solid var(--line);
	border-radius: var(--r3);
	box-shadow: var(--shadow);
	overflow: hidden;
}

/* 단계별 분위기. 배경만 갈아끼우고 구조는 같다 */
.panel.night {
	background: linear-gradient(160deg, #1b2340 0%, #0d1020 100%);
}
.panel.day {
	background: linear-gradient(160deg, #40331b 0%, #1a1410 100%);
}
.panel.vote {
	background: linear-gradient(160deg, #2b2036 0%, #140f1a 100%);
}

/* ---------- 머리말 ---------- */
.hd {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--s2);
	flex: 0 0 auto;
}

.hd-title {
	display: flex;
	align-items: center;
	gap: var(--s2);
	min-width: 0;
	font-size: var(--t-lg);
	font-weight: 700;
	letter-spacing: -0.01em;
}

.hd-sub {
	font-size: var(--t-xs);
	color: var(--ink-3);
	white-space: nowrap;
}

/* ---------- 타이머 ---------- */
/*
 * 기존에는 4개 파일이 toHHMMSS를 각자 갖고 있었고 90초를 "00:01:30"으로
 * 표시했다. 시(時) 자리는 이 게임에서 영원히 00이다.
 * 여기서는 남은 초만 크게 보여주고, 링으로 진행률을 함께 그린다.
 */
.timer {
	position: relative;
	flex: 0 0 auto;
	display: grid;
	place-items: center;
	width: 44px;
	height: 44px;
	font-variant-numeric: tabular-nums;
	font-size: var(--t-lg);
	font-weight: 700;
	color: var(--ink);
}

.timer svg {
	position: absolute;
	inset: 0;
	transform: rotate(-90deg);
}

.timer circle {
	fill: none;
	stroke-width: 3;
	stroke-linecap: round;
}

.timer .track {
	stroke: var(--surface-3);
}

.timer .bar {
	stroke: var(--accent);
	transition: stroke-dashoffset 1s linear, stroke var(--dur) var(--ease);
}

/* 마지막 10초 */
.timer.urgent .bar {
	stroke: var(--danger);
}
.timer.urgent {
	color: var(--danger);
	animation: pulse 1s var(--ease) infinite;
}

@keyframes pulse {
	0%,
	100% {
		transform: scale(1);
	}
	50% {
		transform: scale(1.08);
	}
}

/* ---------- 본문 ---------- */
.body {
	flex: 1 1 auto;
	min-height: 0;
	display: flex;
	flex-direction: column;
	gap: var(--s2);
}

.scroll {
	overflow-y: auto;
	overscroll-behavior: contain;
	scrollbar-width: thin;
	scrollbar-color: var(--surface-3) transparent;
}

.scroll::-webkit-scrollbar {
	width: 6px;
}
.scroll::-webkit-scrollbar-thumb {
	background: var(--surface-3);
	border-radius: 99px;
}
.scroll::-webkit-scrollbar-track {
	background: transparent;
}

/* ---------- 버튼 ---------- */
/*
 * 기존 조작 요소는 전부 <div onclick>이었다. 키보드로 도달할 수 없고
 * 포커스 링도 없어서 마우스가 없으면 게임 자체가 불가능했다.
 * 위젯 HTML은 전부 <button>을 쓰고, 모양은 이 클래스가 준다.
 */
.btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--s1);
	min-height: 34px;
	padding: var(--s2) var(--s3);
	font: inherit;
	font-size: var(--t-sm);
	font-weight: 600;
	color: var(--ink);
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r1);
	cursor: pointer;
	transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
		transform var(--dur) var(--ease);
}

.btn:hover:not(:disabled) {
	background: var(--surface-3);
}

.btn:active:not(:disabled) {
	transform: scale(0.97);
}

.btn:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 2px;
}

.btn:disabled {
	cursor: default;
	opacity: 0.45;
}

.btn.primary {
	color: #14100f;
	background: var(--accent);
	border-color: var(--accent);
}
.btn.primary:hover:not(:disabled) {
	filter: brightness(1.1);
}

.btn.ok {
	color: #0e1a12;
	background: var(--ok);
	border-color: var(--ok);
}

.btn.danger {
	color: var(--ink);
	background: var(--mafia-dim);
	border-color: var(--mafia);
}

.btn.ghost {
	background: transparent;
}

/* ---------- 참가자 타일 ---------- */
/*
 * 밤 지목·투표가 같은 격자를 쓴다. 예전에는 밤은 4열 정사각 타일,
 * 투표는 3열 30px 막대로 서로 다른 화면이었다. 같은 동작(사람 하나를
 * 고른다)이면 같은 모양이어야 무엇을 누르는지 배우는 비용이 한 번이다.
 */
.grid {
	display: grid;
	grid-template-columns: repeat(4, 1fr);
	gap: var(--s2);
	align-content: start;
}

@media (max-width: 340px) {
	.grid {
		grid-template-columns: repeat(3, 1fr);
	}
}

.tile {
	position: relative;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 2px;
	aspect-ratio: 1;
	padding: var(--s1);
	font: inherit;
	font-size: var(--t-sm);
	font-weight: 700;
	color: var(--ink);
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r2);
	cursor: pointer;
	transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
		transform var(--dur) var(--ease);
}

.tile:hover:not(:disabled) {
	background: var(--surface-3);
	border-color: var(--ink-3);
}

.tile:active:not(:disabled) {
	transform: scale(0.95);
}

.tile:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 2px;
}

.tile .num {
	font-size: var(--t-lg);
	line-height: 1.1;
}

.tile .cap {
	font-size: var(--t-xs);
	font-weight: 500;
	color: var(--ink-3);
}

/* 나 */
.tile.me {
	border-color: var(--ok);
}
.tile.me .cap {
	color: var(--ok);
}

/* 죽은 사람 */
.tile:disabled,
.tile.dead {
	cursor: default;
	color: var(--dead);
	background: var(--surface);
	border-color: var(--surface-2);
}
.tile.dead .cap {
	color: var(--dead);
}

/* 지목·투표 완료 */
.tile.picked {
	background: var(--mafia-dim);
	border-color: var(--mafia);
	box-shadow: 0 0 0 2px var(--mafia) inset;
}

/* 같은 팀(마피아 채팅) */
.tile.ally {
	border-color: var(--mafia);
	background: color-mix(in srgb, var(--mafia-dim) 60%, var(--surface-2));
}

/* 타일 위 배지: 상태를 글자로도 남긴다 (색만으로 구분하지 않기 위해) */
.tile .badge {
	position: absolute;
	top: 2px;
	right: 3px;
	font-size: var(--t-xs);
	line-height: 1;
}

/* 득표수 */
.tile .tally {
	position: absolute;
	bottom: 2px;
	left: 0;
	right: 0;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--accent);
}

/* ---------- 칩 ---------- */
.chip {
	display: inline-flex;
	align-items: center;
	gap: var(--s1);
	padding: 2px var(--s2);
	font-size: var(--t-xs);
	font-weight: 700;
	white-space: nowrap;
	border: 1px solid var(--line);
	border-radius: 99px;
	background: var(--surface-2);
}

.chip.mafia {
	color: var(--mafia);
	border-color: var(--mafia);
	background: var(--mafia-dim);
}
.chip.citizen {
	color: var(--citizen);
	border-color: var(--citizen);
	background: var(--citizen-dim);
}
.chip.dead {
	color: var(--ink-3);
}

/* ---------- 안내 문구 ---------- */
.note {
	flex: 0 0 auto;
	font-size: var(--t-sm);
	color: var(--ink-2);
	text-align: center;
	word-break: keep-all;
}

.note strong {
	color: var(--ink);
}

/* 상태가 바뀔 때 문구가 갈아끼워지는 것을 눈이 따라가도록 */
.note.flash {
	animation: flash var(--dur) var(--ease);
}

@keyframes flash {
	from {
		opacity: 0;
		transform: translateY(-4px);
	}
}

/* ---------- 채팅 ---------- */
/*
 * 채팅은 접속해 있는 내내 떠 있는 유일한 위젯이라 다른 화면과 규칙이 다르다.
 *
 * 1. 두 가지 모습으로 산다 — 펼친 창(.chat)과 접힌 막대(.chat-mini).
 *    위젯은 iframe이라 투명해도 그 자리의 클릭을 먹는다. 그래서 접기는
 *    CSS로 내용을 숨기는 것이 아니라 더 작은 위젯으로 다시 여는 것이고
 *    (WidgetSize.CHAT_BAR), 두 모습이 한 파일 안에 함께 있어야 한다.
 *
 * 2. .panel을 쓰지 않는다. panel은 여닫히는 화면의 문법(머리말·본문·안내)인데
 *    채팅은 늘 떠 있는 도구다. 여백을 panel만큼 주면 세로 320px 중 실제로
 *    글이 보이는 자리가 절반으로 줄어든다.
 */
.chat {
	display: flex;
	flex-direction: column;
	width: 100%;
	height: 100%;
	min-height: 0;
	background: linear-gradient(160deg, var(--surface) 0%, var(--bg) 100%);
	border: 1px solid var(--line);
	border-radius: var(--r2);
	box-shadow: var(--shadow);
	overflow: hidden;
}

/* 탭 줄 */
.chat-head {
	display: flex;
	align-items: stretch;
	flex: 0 0 auto;
	border-bottom: 1px solid var(--line);
}

.chat-tabs {
	display: flex;
	gap: 2px;
	flex: 1 1 auto;
	min-width: 0;
	padding: 2px 2px 0;
	overflow-x: auto;
	scrollbar-width: none;
}
.chat-tabs::-webkit-scrollbar {
	display: none;
}

.tab {
	display: inline-flex;
	align-items: center;
	gap: var(--s1);
	flex: 0 0 auto;
	padding: var(--s1) var(--s2);
	font: inherit;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--ink-3);
	background: transparent;
	border: none;
	border-bottom: 2px solid transparent;
	border-radius: var(--r1) var(--r1) 0 0;
	white-space: nowrap;
	cursor: pointer;
	transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
}

.tab:hover {
	color: var(--ink-2);
	background: var(--surface-2);
}

.tab:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -2px;
}

.tab[aria-selected="true"] {
	color: var(--ink);
	background: var(--surface-2);
	border-bottom-color: var(--accent);
}

/* 읽기만 되는 탭. 색이 아니라 글리프로 알린다 */
.tab.ro::after {
	content: "🔒";
	font-size: 9px;
}

/* 미확인 개수 */
.badge-n {
	min-width: 15px;
	padding: 0 4px;
	font-size: 9px;
	font-weight: 700;
	line-height: 15px;
	text-align: center;
	color: #14100f;
	background: var(--accent);
	border-radius: 99px;
}

/*
 * 접기 버튼.
 *
 * 전에는 글리프 ▾ 하나가 투명한 배경 위에 --ink-3(흐린 회색)으로 떠 있었다.
 * 데스크톱에서는 겨우 읽혔지만 모바일에서는 "여기를 누를 수 있다"는 신호가
 * 전혀 아니었다 — 탭 줄 오른쪽 끝의 장식으로 보였다.
 *
 * 그래서 셋을 바꾼다.
 *   1. 글자를 붙인다("접기"). 글리프만으로는 무엇이 일어날지 알 수 없다.
 *   2. 테두리와 배경을 준다. 눌리는 것과 아닌 것이 색으로 갈린다.
 *   3. 손가락이 닿을 크기를 준다(min-height 40px, min-width 44px).
 *
 * 이 높이가 머리말 전체의 높이가 된다(.chat-head가 stretch다) — 위아래
 * 여백까지 더해 45px. 세로 320px 중 17px쯤을 더 쓰는 셈인데, 진짜 과녁은
 * 이 버튼이 아니라 머리말 한 줄 전체이고(chat.html의 .chat-head 리스너)
 * 그 줄이 45px면 손가락 기준(44px)을 넘긴다. 누를 수 없는 버튼은 없는 것과
 * 같으므로 이쪽이 남는 장사다.
 */
.chat-fold {
	display: inline-flex;
	align-items: center;
	gap: var(--s1);
	flex: 0 0 auto;
	min-width: 44px;
	min-height: 40px;
	margin: 2px var(--s1) 2px 0;
	padding: 0 var(--s2);
	font: inherit;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--ink-2);
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r1);
	white-space: nowrap;
	cursor: pointer;
	transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.chat-fold:hover {
	color: var(--ink);
	border-color: var(--ink-3);
}
.chat-fold:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -2px;
}

/* 기록 */
.chat-body {
	position: relative;
	display: flex;
	flex: 1 1 auto;
	min-height: 0;
}

.chat-log {
	display: flex;
	flex-direction: column;
	gap: var(--s1);
	flex: 1 1 auto;
	min-height: 0;
	padding: var(--s2);
}

.msg {
	display: flex;
	flex-direction: column;
	max-width: 88%;
	font-size: var(--t-sm);
}

.msg .who {
	display: flex;
	align-items: center;
	gap: var(--s1);
	font-size: var(--t-xs);
	color: var(--ink-3);
}

/* 직업 배지는 마피아·유령 탭에서만 온다 (ChannelDef.revealsRole) */
.msg .chip {
	padding: 0 var(--s1);
	font-size: 9px;
}

.msg .txt {
	padding: var(--s1) var(--s2);
	border-radius: var(--r1);
	background: var(--surface-2);
	/* 서버 안내는 여러 줄일 수 있다 (/도움말) */
	white-space: pre-wrap;
	word-break: break-word;
}

.msg.mine {
	align-self: flex-end;
	align-items: flex-end;
}
.msg.mine .txt {
	color: #14100f;
	background: var(--accent);
}

.when {
	flex: 0 0 auto;
	font-size: 9px;
	color: var(--ink-3);
	font-variant-numeric: tabular-nums;
}

/*

/*
 * 위젯 공통 스크립트 — 화면을 만드는 쪽.
 *
 * 기존에는 toHHMMSS가 4개 파일에, esc가 2개 파일에 복사돼 있었다.
 * 복사본은 갈라진다 — night.html의 타이머는 다 되면 글자를 흰색으로,
 * morning.html은 #484848로 되돌렸다. 같은 타이머인데 화면마다 달랐다.
 *
 * 부모(ZEP 클라이언트)와 주고받는 일은 여기 없다. 전부 bridge.js에 있다 —
 * "글자를 escape한다"와 "부모 창에 키 리스너를 단다"는 같은 파일에 있을
 * 이유가 없고, 섞여 있으면 부모와의 계약이 어디까지인지 보이지 않는다.
 *
 * tools/build-widgets.js가 각 위젯 HTML의 <!--@shared--> 자리에 bridge.js와
 * 함께 인라인한다. 여기는 클라이언트(브라우저·웹뷰)에서 도는 코드다.

/** 서버가 보낸 문자열은 다른 플레이어가 정한 값이다. 태그로 해석되면 안 된다 */
function esc(value) {
	return String(value == null ? "" : value)
		.replace(/&/g, "&amp;")
		.replace(/</g, "&lt;")
		.replace(/>/g, "&gt;")
		.replace(/"/g, "&quot;")
		.replace(/'/g, "&#39;");
}

/**
 * 이미 escape를 마친 HTML 조각. html`` 이 만들고 html`` 이 알아본다.
 *
 * 이 표시가 없으면 조각을 조각에 끼울 때마다 두 번 escape되어
 * &amp;lt; 같은 글자가 화면에 뜬다. 표시가 있으니 중첩이 그냥 된다.

function Html(text) {
	this.text = text;
}

Html.prototype.toString = function () {
	return this.text;
};

function frag(value) {
	if (value instanceof Html) return value.text;
	// 배열은 이어 붙인다. 호출부가 .join("")을 하면 그 순간 표시가 벗겨져서
	// 바깥 템플릿이 조각 전체를 다시 escape해 버린다 — 그 함정을 없앤다.
	if (Array.isArray(value)) return value.map(frag).join("");
	return esc(value);

/**
 * HTML 조립. 끼워 넣는 값은 전부 자동으로 escape된다.
 *
 *   el.innerHTML = html`<span class="nm">${seat.name}</span>`;
 *
 * 기존에는 위젯마다 문자열 concat으로 태그를 쌓았다. tabHtml() 하나가

 * escape가 기본이고, escape를 건너뛰려면 Html 조각이어야 한다.

function startTimer(el, seconds) {
	if (!el) return;
	// 같은 위젯이 payload를 두 번 받으면 타이머도 두 개가 된다. 둘 다 살아서

	if (el.dataset.timerId) clearInterval(Number(el.dataset.timerId));
	const total = Math.max(1, Math.round(seconds));

	const label = document.createElement("span");

		el.classList.toggle("urgent", left <= 10);

	const id = setInterval(function () {
		left--;
		paint();
		if (left <= 0) clearInterval(id);
	}, 1000);

	 * 부모 문서에 직접 닿을 수 있는가.
	 *
	 * 같은 출처면 부모의 window를 그대로 만질 수 있고, 그러면 게임 화면에
	 * 포커스가 있는 동안 눌린 키까지 받을 수 있다. 교차 출처면 만지는 순간
	 * SecurityError가 나므로 postMessage 말고는 길이 없다.
	 *
	 * 판정은 로드 때 한 번만 하고, 안 되면 조용히 기능을 접는다 — 여기서
	 * 예외가 새어 나가면 위젯 스크립트 전체가 로드에 실패한다.
	 */
	const win = (function () {
		try {
			// 존재 확인만으로는 부족하다. 실제로 읽어야 교차 출처가 드러난다
			void window.parent.document.readyState;
			return window.parent;
		} catch (error) {
			return null;
		}
	})();

	/*
	 * 프레임보다 오래 살아야 하는 것을 두는 자리.
	 *
	 * 채팅창 접기/펴기는 CSS가 아니라 크기가 다른 위젯으로 다시 여는
	 * 것이라(Widgets.ts의 openChat) 그때마다 문서가 통째로 새로 만들어진다.
	 * 입력 기록 같은 것을 위젯 안에만 두면 접을 때마다 지워진다.
	 *
	 * 교차 출처면 그냥 빈 객체다 — 기능이 사라지는 게 아니라 수명만 짧아진다.
	 */
	const store = (function () {
		if (!win) return {};
		if (!win.__mafiaWidget) win.__mafiaWidget = {};
		return win.__mafiaWidget;
	})();

	// ────────────────────────────────────────────── 1. 게임 서버에게

	/** 게임 서버(widget.onMessage)로 보낸다 */
	function send(message) {
		window.parent.postMessage(message, "*");
	}

	/**
	 * 서버 메시지 구독. type별 핸들러 표를 받는다.
	 *
	 * 기존 위젯은 전부 addEventListener("message") + switch였고, morning/night는
	 * type을 아예 보지 않아 어떤 메시지가 와도 타이머를 다시 시작했다.
	 */
	function on(handlers) {
		window.addEventListener("message", function (event) {
			const data = event && event.data;
			if (!data) return;
			// 크기는 메시지 종류와 상관없이 실려 온다. 위젯이 "부르는 것을 잊는"
			// 자리를 없애기 위해 핸들러보다 먼저, 표에 없는 종류에도 적용한다.
			if (data.layout) applyLayout(data.layout);
			const handler = handlers[data.type];
			if (handler) handler(data);
		});
	}

	// ────────────────────────────────────────────── 2. ZEP 클라이언트에게

	/**
	 * 위젯이 차지할 상자를 ZEP 클라이언트에게 알린다.
	 * 서버가 아니라 클라이언트가 읽고 처리하는 메시지다.
	 *
	 * 기존 구조의 문제
	 * ----------------
	 * 여기서 기기를 보고 크기를 스스로 정했다(rearrange). 그런데 세로는
	 * 아무도 정하지 않아 모바일에서도 데스크톱 픽셀이 그대로 남았고,
	 * 이 함수를 부를지 말지는 위젯 각자의 자유라 채팅과 직업 카드는
	 * 아예 부르지 않았다 — 모바일 보정이 통째로 빠진 화면이 둘 있었다.
	 *
	 * 지금은 서버(Widgets.ts의 layoutOf)가 한 곳에서 정해 payload에 실어
	 * 보내고, 여기서는 받은 대로 넘기기만 한다. 기기 판정도 서버가 한다
	 * (player.isMobile / isTablet) — window.screen.width로 태블릿을
	 * 넘겨짚을 이유가 없어졌다.
	 */
	function applyLayout(layout) {
		const message = {
			type: "WidgetRearrange",
			anchor: layout.anchor,
			width: layout.width,
			height: layout.height,
		};
		// 상단바 보정은 위쪽에 붙는 위젯에만 실려 온다
		if (layout.top) message.top = layout.top;
		send(message);
	}

	// ────────────────────────────────────────────── 3. 부모 문서의 키 입력

	/** 남이 글을 쓰고 있는 칸인가. ZEP 기본 채팅 입력창이 여기 걸린다 */
	function editable(el) {
		if (!el || !el.tagName) return false;
		const tag = String(el.tagName).toUpperCase();
		if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
		return el.isContentEditable === true;
	}

	/**
	 * 게임 화면(캔버스)에 포커스가 있는 동안 눌린 키를 받는다.
	 *
	 * 위젯 안에 포커스가 있을 때는 여기로 오지 않는다 — 키 이벤트는 프레임
	 * 경계를 넘지 않기 때문이다. 그래서 "게임 중일 때"와 "채팅 치는 중일 때"를
	 * 따로 판정할 필요가 없다. 브라우저가 이미 나눠준다.
	 *
	 * 같은 이유로 "채팅 입력 중 이동·단축키 비활성화"도 따로 할 일이 없다.
	 * 입력창에 포커스가 있으면 WASD는 애초에 ZEP 캔버스에 도달하지 않는다.
	 *
	 * 돌려주는 함수를 부르면 구독이 끊긴다. 프레임이 사라질 때도 자동으로 끊는다.
	 */
	function onKey(handler) {
		if (!win) return function () {};

		function off() {
			win.removeEventListener("keydown", listener, true);
			window.removeEventListener("pagehide", off);
		}

		function listener(event) {
			// 접었다 펴는 순간 옛 프레임과 새 프레임이 잠깐 함께 산다.
			// 죽은 쪽이 반응하면 이미 사라진 입력창에 포커스를 주게 된다.
			const frame = window.frameElement;
			if (frame && frame.isConnected === false) {
				off();
				return;
			}
			// 부모에는 ZEP 기본 채팅 입력창이 그대로 남아 있다(0.16.5에는 숨기는
			// API가 없다). 남이 글을 쓰고 있는 칸은 건드리지 않는다.
			if (editable(event.target)) return;
			// 조합키는 브라우저와 ZEP의 몫이다
			if (event.altKey || event.ctrlKey || event.metaKey) return;
			handler(event);
		}

		// 부모 window의 캡처 단계. 이 프레임에서 닿을 수 있는 가장 이른 지점이다.
		// 그래도 ZEP이 먼저 등록한 리스너보다 앞설 수는 없다 — 같은 대상·같은
		// 단계에서는 등록 순서가 곧 실행 순서고, 부모 문서가 우리보다 먼저 뜬다.
		win.addEventListener("keydown", listener, true);
		// 위젯이 파괴되면 부모에는 리스너만 남는다. 반드시 같이 떼야 한다
		window.addEventListener("pagehide", off);
		return off;
	}

	/**
	 * 이 프레임으로 포커스를 가져온다.
	 *
	 * 부모 문서에서 키를 받아 들어오는 길에서는 포커스가 아직 캔버스에 있다.
	 * 안쪽 엘리먼트에 focus()만 하면 되는 경우가 대부분이지만, 프레임 자체를
	 * 먼저 깨워두는 편이 확실하다.
	 */
	function grabFocus() {
		window.focus();
	}

	return {
		send,
		on,
		onKey,
		grabFocus,
		store,
		/** 게임 화면의 키 입력을 받을 수 있는가 (부모와 같은 출처인가) */
		canReadKeys: win !== null,
	};
})();

</script>
		<script>
			let myId = null;
			let iAmReady = false;
			const config = { min: 4, max: 8, kickVotes: 3 };
			let counts = {};

			/* ---------- 방 목록 ---------- */
			function roomHtml(num) {
				const info = counts[num] || { count: 0, started: false };
				const full = info.count >= config.max;
				const state = info.started ? "진행 중" : full ? "가득 참" : `${info.count}/${config.max}`;

				return html`<button
					type="button"
					class="room${info.started ? " playing" : full ? " full" : ""}"
					data-num="${num}"
					${flag(info.started || full, "disabled")}
					aria-label="${num}번 방, ${state}"
				>
					<span>${num}번 방</span><span class="cnt">${state}</span>
				</button>`;
			}

			function paintRooms() {
				const nums = Object.keys(counts).sort((a, b) => Number(a) - Number(b));
				qs("#rooms").innerHTML = html`${nums.map(roomHtml)}`;
			}

			qs("#rooms").addEventListener("click", event => {
				const el = event.target.closest(".room");
				if (!el || el.disabled) return;
				Parent.send({ type: "join", roomNum: Number(el.dataset.num) });
			});

			/* ---------- 좌석 목록 ---------- */
			function seatHtml(seat, i) {
				const mine = seat.id === myId;

				// 강퇴는 필요 표수를 함께 보여준다. 몇 표가 남았는지 모르면
				// 누를지 말지 판단할 수 없다
				const kick = mine
					? ""
					: html`<button
							type="button"
							class="btn ghost kick${seat.kickCount > 0 ? " voted" : ""}"
							data-id="${seat.id}"
							aria-label="${seat.name} 강퇴 투표"
						>
							강퇴 ${seat.kickCount}/${config.kickVotes}
						</button>`;

				// .grow 안의 두 span은 한 줄로 둔다. 사이의 공백이 화면에 그대로
				// 나오는 자리라, 줄을 나누면 들여쓰기가 이름 뒤에 붙는다
				return html`<div class="seat${seat.ready ? " ready" : ""}${mine ? " me" : ""}" role="listitem">
					<span class="idx">${i + 1}</span>
					<span class="grow ellip"><span class="nm">${seat.name}${mine ? " (나)" : ""}</span> <span class="meta">${seat.rank} · ${seat.runCount}판</span></span>
					<span class="state">${seat.ready ? "준비" : "대기"}</span>
					${kick}
				</div>`;
			}

			function paintSeats(list) {
				qs("#seats").innerHTML = html`${list.map(seatHtml)}`;

				const readyCount = list.filter(seat => seat.ready).length;
				iAmReady = list.some(seat => seat.id === myId && seat.ready);

				const ready = qs("#ready");
				ready.textContent = iAmReady ? "준비 취소" : "준비";
				ready.classList.toggle("primary", !iAmReady);
				ready.classList.toggle("ok", iAmReady);

				qs("#sub").textContent = `${list.length}명 · 준비 ${readyCount}명`;

				// 왜 시작하지 않는지 항상 한 줄로 말해준다
				qs("#note").textContent =
					list.length < config.min
						? `${config.min - list.length}명 더 모이면 시작할 수 있습니다.`
						: readyCount < list.length
							? `${list.length - readyCount}명이 아직 준비하지 않았습니다.`
							: "곧 시작합니다.";
			}

			qs("#seats").addEventListener("click", event => {
				const el = event.target.closest(".kick");
				if (!el) return;
				Parent.send({ type: "kick", id: el.dataset.id });
			});

			qs("#ready").addEventListener("click", () => {
				Parent.send({ type: iAmReady ? "cancle-ready" : "ready" });
			});

			qs("#quit").addEventListener("click", () => {
				Parent.send({ type: "quit" });
			});

			/* ---------- 화면 전환 ---------- */
			function showRooms(inRoom) {
				qs("#rooms").classList.toggle("hidden", inRoom);
				qs("#seats").classList.toggle("hidden", !inRoom);
				qs("#foot").classList.toggle("hidden", !inRoom);
				qs("#heading").textContent = inRoom ? "대기실" : "방 선택";
				if (!inRoom) {
					qs("#sub").textContent = "";
					qs("#note").textContent = "참가할 방을 고르세요.";
				}
			}

			Parent.on({
				setID(data) {
					myId = data.id;
					if (data.minPlayers) config.min = data.minPlayers;
					if (data.maxPlayers) config.max = data.maxPlayers;
					if (data.kickVotes) config.kickVotes = data.kickVotes;
				},

				init(data) {
					const list = Array.isArray(data.data) ? data.data : [];
					showRooms(list.length > 0);
					if (list.length > 0) paintSeats(list);
					else paintRooms();
				},

				updatePlayerCount(data) {
					counts = data.data || {};
					if (!qs("#rooms").classList.contains("hidden")) paintRooms();
				},
			});
		</script>
	</body>
</html>
