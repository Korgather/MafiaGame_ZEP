<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>대기실</title>
		<style>
:root {		--bg: #100c0b;	--surface: #1c1614;	--surface-2: #29211e;	--surface-3: #382d29;	--line: #4a3b35;		--ink: #f6f0ea;	--ink-2: #bfaea4;	--ink-3: #8a7970;		--mafia: #e8554f;	--mafia-dim: #5e1f1d;	--mafia-ink: #ff8a85;	--citizen: #56a9e0;	--citizen-dim: #1e3f57;	--citizen-ink: #8ec9f5;		--accent: #e6b44f; 	--ok: #5fbf7f;	--danger: #e8554f;	--dead: #5a4a45;		--night-1: #1a1d33;	--night-2: #0c0d17;	--day-1: #3a2c17;	--day-2: #17110c;	--vote-1: #2b2036;	--vote-2: #140f1a;		--s1: 4px;	--s2: 8px;	--s3: 12px;	--s4: 16px;	--s5: 24px;	--s6: 32px;		--t-xs: clamp(10px, 2.6vw, 12px);	--t-sm: clamp(11px, 3vw, 13px);	--t-md: clamp(13px, 3.5vw, 15px);	--t-lg: clamp(15px, 4.2vw, 19px);	--t-xl: clamp(19px, 5.5vw, 24px);	--t-2xl: clamp(24px, 7vw, 34px);		--t-3xl: clamp(28px, 9vw, 40px);	--r1: 6px;	--r2: 10px;	--r3: 14px;	--shadow: 0 4px 16px rgba(0, 0, 0, 0.45);	--dur: 160ms;	--ease: cubic-bezier(0.2, 0, 0.2, 1);}@media (prefers-reduced-motion: reduce) {	:root {		--dur: 1ms;	}	*,	*::before,	*::after {		animation-duration: 1ms !important;		animation-iteration-count: 1 !important;		transition-duration: 1ms !important;	}}* {	margin: 0;	padding: 0;	box-sizing: border-box;}html,body {	width: 100%;	height: 100%;	overflow: hidden;}body {		font-family:		"Pretendard",		-apple-system,		BlinkMacSystemFont,		"Apple SD Gothic Neo",		"Malgun Gothic",		"맑은 고딕",		"Noto Sans KR",		system-ui,		sans-serif;	font-size: var(--t-md);	line-height: 1.45;	color: var(--ink);	background: transparent;	-webkit-font-smoothing: antialiased;	-webkit-user-select: none;	user-select: none;	-webkit-tap-highlight-color: transparent;}.panel {	position: relative;	isolation: isolate;	display: flex;	flex-direction: column;	width: 100%;	height: 100%;	padding: var(--s3) var(--s3) var(--s3);	gap: var(--s2);	background: linear-gradient(165deg, var(--surface) 0%, var(--bg) 100%);	border: 1px solid var(--line);	border-radius: var(--r3);	box-shadow: var(--shadow);	overflow: hidden;	animation: panel-in 240ms var(--ease);}@keyframes panel-in {	from {		opacity: 0;		transform: translateY(6px);	}}.panel.night {	background: linear-gradient(165deg, var(--night-1) 0%, var(--night-2) 100%);	border-color: #3b4160;}.panel.day {	background: linear-gradient(165deg, var(--day-1) 0%, var(--day-2) 100%);	border-color: #5a4626;}.panel.vote {	background: linear-gradient(165deg, var(--vote-1) 0%, var(--vote-2) 100%);	border-color: #4a3a5a;}.panel.night::after,.panel.day::after,.panel.vote::after {	content: "";	position: absolute;	inset: 0;	z-index: -1;	pointer-events: none;}.panel.night::after {	background: radial-gradient(120% 70% at 50% -10%, rgba(126, 148, 224, 0.16) 0%, transparent 62%);	animation: moonlight 9s ease-in-out infinite;}@keyframes moonlight {	0%,	100% {		opacity: 0.55;	}	50% {		opacity: 1;	}}.panel.day::after {	background: linear-gradient(115deg, rgba(255, 196, 106, 0.14) 0%, transparent 45%);	animation: daylight 11s ease-in-out infinite;}@keyframes daylight {	0%,	100% {		opacity: 0.6;	}	50% {		opacity: 1;	}}.panel.vote::after {	background: radial-gradient(130% 60% at 50% 108%, rgba(232, 85, 79, 0.18) 0%, transparent 60%);	animation: emberglow 6s ease-in-out infinite;}@keyframes emberglow {	0%,	100% {		opacity: 0.5;	}	50% {		opacity: 1;	}}.idbar {	display: flex;	align-items: center;	gap: var(--s2);	flex: 0 0 auto;	min-width: 0;}.idbar .ability {	flex: 1 1 auto;	min-width: 0;	font-size: var(--t-xs);	color: var(--ink-3);	overflow: hidden;	white-space: nowrap;	text-overflow: ellipsis;}.idbar .stat {	flex: 0 0 auto;	font-size: var(--t-xs);	font-weight: 700;	color: var(--ink-2);	font-variant-numeric: tabular-nums;	white-space: nowrap;}.lead {	display: flex;	align-items: flex-end;	gap: var(--s2);	flex: 0 0 auto;}.lead-text {	flex: 1 1 auto;	min-width: 0;}.lead-title {	font-size: var(--t-lg);	font-weight: 800;	letter-spacing: -0.02em;	line-height: 1.25;	word-break: keep-all;}.lead-sub {	margin-top: 3px;	font-size: var(--t-xs);	color: var(--ink-3);	word-break: keep-all;}.lead-sub.count {	color: var(--accent);	font-weight: 700;	font-variant-numeric: tabular-nums;}.clock {	display: flex;	align-items: baseline;	gap: 2px;	flex: 0 0 auto;	font-variant-numeric: tabular-nums;}.clock .n {	font-size: var(--t-3xl);	font-weight: 800;	line-height: 0.9;	color: var(--ink);}.clock .u {	font-size: var(--t-xs);	color: var(--ink-2);}.clock.urgent .n {	color: var(--danger);	animation: pulse 1s var(--ease) infinite;}.clock.critical .n {	animation: pulse 420ms var(--ease) infinite;}@keyframes pulse {	0%,	100% {		transform: scale(1);	}	50% {		transform: scale(1.08);	}}.timeline {	flex: 0 0 auto;	height: 3px;	border-radius: 99px;	background: var(--surface-2);	overflow: hidden;}.timeline i {	display: block;	height: 100%;	width: 100%;	border-radius: 99px;	background: var(--accent);	transition:		width 1s linear,		background var(--dur) var(--ease);}.timeline.urgent i {	background: var(--danger);}.timeline.urgent {	background: rgba(232, 85, 79, 0.18);	box-shadow: 0 0 8px rgba(232, 85, 79, 0.5);}.progress {	flex: 0 0 auto;	height: 4px;	border-radius: 99px;	background: var(--surface-2);	overflow: hidden;}.progress i {	display: block;	height: 100%;	width: 0;	background: var(--ok);	transition: width var(--dur) var(--ease);}.hd {	display: flex;	align-items: center;	justify-content: space-between;	gap: var(--s2);	flex: 0 0 auto;}.hd-title {	display: flex;	align-items: baseline;	gap: var(--s2);	min-width: 0;	font-size: var(--t-lg);	font-weight: 800;	letter-spacing: -0.02em;}.hd-sub {	font-size: var(--t-xs);	color: var(--ink-3);	white-space: nowrap;}.body {	flex: 1 1 auto;	min-height: 0;	display: flex;	flex-direction: column;	gap: var(--s2);}.scroll {	overflow-y: auto;	overscroll-behavior: contain;	scrollbar-width: thin;	scrollbar-color: var(--surface-3) transparent;}.scroll::-webkit-scrollbar {	width: 6px;}.scroll::-webkit-scrollbar-thumb {	background: var(--surface-3);	border-radius: 99px;}.scroll::-webkit-scrollbar-track {	background: transparent;}.stack {	display: flex;	flex-direction: column;	gap: 3px;	padding: var(--s2) var(--s3);	background: rgba(0, 0, 0, 0.25);	border-left: 2px solid var(--danger);	border-radius: 0 var(--r2) var(--r2) 0;}.stack span {	font-size: var(--t-sm);	color: var(--mafia-ink);	word-break: keep-all;}.stack span.good {	color: #8fd6a8;}.foot {	display: flex;	gap: var(--s2);	flex: 0 0 auto;}.btn {	display: inline-flex;	align-items: center;	justify-content: center;	gap: var(--s1);	min-height: 34px;	padding: var(--s2) var(--s3);	font: inherit;	font-size: var(--t-sm);	font-weight: 600;	white-space: nowrap;	color: var(--ink);	background: var(--surface-2);	border: 1px solid var(--line);	border-radius: var(--r1);	cursor: pointer;	transition:		background var(--dur) var(--ease),		border-color var(--dur) var(--ease),		transform var(--dur) var(--ease);}.btn:hover:not(:disabled) {	background: var(--surface-3);}.btn:active:not(:disabled) {	transform: scale(0.97);}.btn:focus-visible {	outline: 2px solid var(--accent);	outline-offset: 2px;}.btn:disabled {	cursor: default;	opacity: 0.45;}.btn.primary {	color: var(--bg);	background: var(--accent);	border-color: var(--accent);}.btn.primary:hover:not(:disabled) {	filter: brightness(1.1);}.btn.ok {	color: #0e1a12;	background: var(--ok);	border-color: var(--ok);}.btn.danger {	color: var(--ink);	background: var(--mafia-dim);	border-color: var(--mafia);}.btn.ghost {	background: transparent;}.icon-btn {	display: inline-flex;	align-items: center;	justify-content: center;	flex: 0 0 auto;	min-width: 34px;	min-height: 34px;	padding: var(--s1) var(--s2);	font: inherit;	font-size: var(--t-md);	color: var(--ink-2);	background: transparent;	border: none;	border-radius: var(--r1);	cursor: pointer;}.icon-btn:hover {	color: var(--ink);}.icon-btn:disabled {	cursor: default;	opacity: 0.35;}.icon-btn:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.icon-btn.strong {	font-weight: 800;}.grid {	display: grid;	grid-template-columns: repeat(4, minmax(0, 1fr));	gap: var(--s2);	align-content: center;}@media (max-width: 340px) {	.grid {		grid-template-columns: repeat(3, minmax(0, 1fr));	}}.tile {	position: relative;	display: flex;	min-width: 0;	flex-direction: column;	align-items: center;	justify-content: center;	gap: 2px;	aspect-ratio: 1;	padding: var(--s1);	font: inherit;	font-size: var(--t-sm);	font-weight: 700;	color: var(--ink);	background: var(--surface-2);	border: 1px solid var(--line);	border-radius: var(--r2);	cursor: pointer;	transition:		background var(--dur) var(--ease),		border-color var(--dur) var(--ease),		transform var(--dur) var(--ease);}.tile:hover:not(:disabled) {	background: var(--surface-3);	border-color: var(--ink-3);}.tile:active:not(:disabled) {	transform: scale(0.95);}.tile:focus-visible {	outline: 2px solid var(--accent);	outline-offset: 2px;}.tile .num {	font-size: var(--t-lg);	line-height: 1.1;}.tile .cap {	width: 100%;	font-size: var(--t-xs);	font-weight: 500;	color: var(--ink-3);	overflow: hidden;	white-space: nowrap;	text-overflow: ellipsis;	text-align: center;}.tile.me {	border-color: var(--ok);}.tile.me .cap {	color: var(--ok);}.tile:disabled,.tile.dead {	cursor: default;	color: var(--dead);	background: var(--surface);	border-color: var(--surface-2);}.tile.dead .cap {	color: var(--dead);}.tile.picked {	background: var(--mafia-dim);	border-color: var(--mafia);	box-shadow: 0 0 0 2px var(--mafia) inset;}.tile.picked .cap {	color: var(--mafia-ink);}.tile.ally {	border-color: var(--mafia);	background: color-mix(in srgb, var(--mafia-dim) 60%, var(--surface-2));}.tile.ally .cap {	color: var(--mafia-ink);}.tile .badge {	position: absolute;	top: 2px;	right: 3px;	font-size: var(--t-xs);	line-height: 1;}.tile .tally {	position: absolute;	bottom: 3px;	left: 0;	right: 0;	font-size: var(--t-xs);	font-weight: 700;	color: var(--accent);	text-align: center;}.chip {	display: inline-flex;	align-items: center;	gap: var(--s1);	flex: 0 0 auto;	padding: 3px var(--s2);	font-size: var(--t-xs);	font-weight: 800;	white-space: nowrap;	color: var(--ink-2);	border: 1px solid var(--line);	border-radius: 99px;	background: var(--surface-2);}.chip.mafia {	color: var(--mafia-ink);	border-color: var(--mafia);	background: var(--mafia-dim);}.chip.citizen {	color: var(--citizen-ink);	border-color: var(--citizen);	background: var(--citizen-dim);}.chip.dead {	color: var(--ink-2);	border-color: var(--dead);	background: var(--surface-2);}.note {	flex: 0 0 auto;	font-size: var(--t-sm);	color: var(--ink-2);	text-align: center;	word-break: keep-all;}.note strong {	color: var(--ink);}.note.flash {	animation: flash var(--dur) var(--ease);}@keyframes flash {	from {		opacity: 0;		transform: translateY(-4px);	}}.chat {	display: flex;	flex-direction: column;	width: 100%;	height: 100%;	min-height: 0;	background: linear-gradient(165deg, var(--surface) 0%, var(--bg) 100%);	border: 1px solid var(--line);	border-radius: var(--r2);	box-shadow: var(--shadow);	overflow: hidden;}.chat-head {	display: flex;	align-items: stretch;	flex: 0 0 auto;	border-bottom: 1px solid var(--line);}.chat-tabwrap {	position: relative;	flex: 1 1 auto;	min-width: 0;}.chat-tabwrap::after {	content: "";	position: absolute;	top: 0;	right: 0;	bottom: 0;	width: 20px;	pointer-events: none;	opacity: 0;	background: linear-gradient(to right, rgba(28, 22, 20, 0), var(--surface));	transition: opacity var(--dur) var(--ease);}.chat-tabwrap.more::after {	opacity: 1;}.chat-tabs {	display: flex;	gap: 2px;	width: 100%;	padding: 2px 2px 0;	overflow-x: auto;	scrollbar-width: none;}.chat-tabs::-webkit-scrollbar {	display: none;}.tab {	display: inline-flex;	align-items: center;	gap: var(--s1);	flex: 0 0 auto;	padding: var(--s1) var(--s2);	font: inherit;	font-size: var(--t-xs);	font-weight: 700;	color: var(--ink-3);	background: transparent;	border: none;	border-bottom: 2px solid transparent;	border-radius: var(--r1) var(--r1) 0 0;	white-space: nowrap;	cursor: pointer;	transition:		color var(--dur) var(--ease),		background var(--dur) var(--ease);}.tab:hover {	color: var(--ink-2);	background: var(--surface-2);}.tab:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.tab[aria-selected="true"] {	color: var(--accent);	background: var(--surface-3);	border-bottom-color: var(--accent);}.tab.ro::after {	content: "🔒";	font-size: 9px;}.tab.fresh {	animation: tabpop 1200ms var(--ease);}@keyframes tabpop {	0%,	100% {		box-shadow: none;	}	25%,	65% {		box-shadow: inset 0 0 0 2px var(--accent);	}}.badge-n {	min-width: 15px;	padding: 0 4px;	font-size: 9px;	font-weight: 700;	line-height: 15px;	text-align: center;	color: var(--bg);	background: var(--accent);	border-radius: 99px;}.chat-fold {	display: inline-flex;	align-items: center;	gap: var(--s1);	flex: 0 0 auto;	min-width: 44px;	margin: 2px var(--s1) 2px 0;	padding: 0 var(--s2);	font: inherit;	font-size: var(--t-xs);	font-weight: 700;	color: var(--ink-2);	background: var(--surface-2);	border: 1px solid var(--line);	border-radius: var(--r1);	white-space: nowrap;	cursor: pointer;	transition:		color var(--dur) var(--ease),		border-color var(--dur) var(--ease);}.chat-fold:hover {	color: var(--ink);	border-color: var(--ink-3);}.chat-fold:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.chat-body {	position: relative;	display: flex;	flex: 1 1 auto;	min-height: 0;}.chat-log {	display: flex;	flex-direction: column;	gap: var(--s1);	flex: 1 1 auto;	min-height: 0;	padding: var(--s2);}.msg {	display: flex;	flex-direction: column;	max-width: 88%;	font-size: var(--t-sm);}.msg .who {	display: flex;	align-items: center;	gap: var(--s1);	font-size: var(--t-xs);	color: var(--ink-3);}.msg .chip {	padding: 0 var(--s1);	font-size: 9px;}.msg .reply {	flex: 0 0 auto;	min-width: 24px;	min-height: 24px;	padding: 0 var(--s1);	font: inherit;	font-size: 11px;	color: var(--ink-3);	background: transparent;	border: none;	border-radius: var(--r1);	cursor: pointer;}.msg .reply:hover {	color: var(--accent);}.msg .reply:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -1px;}.msg .txt {	padding: var(--s1) var(--s2);	border-radius: var(--r1);	background: var(--surface-2);	white-space: pre-wrap;	word-break: break-word;}.msg.mine {	align-self: flex-end;	align-items: flex-end;}.msg.mine .txt {	color: var(--bg);	background: var(--accent);}.when {	flex: 0 0 auto;	font-size: 9px;	color: var(--ink-3);	font-variant-numeric: tabular-nums;}.msg.sys,.msg.evt,.msg.ntc {	align-self: center;	align-items: center;	max-width: 100%;	text-align: center;}.msg.sys .txt,.msg.ntc .txt {	font-size: var(--t-xs);	color: var(--ink-2);	background: transparent;}.msg.ntc .txt {	color: var(--ink-3);}.msg.evt .txt {	font-size: var(--t-xs);	font-weight: 700;	color: var(--accent);	background: color-mix(in srgb, var(--accent) 14%, transparent);	border-radius: 99px;}.msg.card {	align-self: stretch;	align-items: stretch;	max-width: 100%;	gap: 2px;	padding: var(--s2);	text-align: left;	border: 1px solid var(--line);	border-radius: var(--r1);	background: var(--surface-2);}.msg.pm {	align-self: stretch;	align-items: stretch;	max-width: 88%;	text-align: left;}.msg.pm .txt {	font-size: var(--t-sm);	color: var(--ink);	background: color-mix(in srgb, var(--citizen) 18%, transparent);	border-left: 2px solid var(--citizen);	border-radius: 0 var(--r1) var(--r1) 0;}.msg.card .ttl {	font-size: var(--t-xs);	font-weight: 700;	color: var(--accent);}.msg.card .row {	display: flex;	align-items: center;	justify-content: space-between;	gap: var(--s1);	font-size: var(--t-xs);	color: var(--ink-2);}.msg.card .row .ellip {	flex: 1 1 auto;	min-width: 0;}.msg.card .val {	flex: 0 0 auto;	color: var(--ink-3);}.msg.card .row.dim {	opacity: 0.5;}.chat-jump {	position: absolute;	left: 50%;	bottom: var(--s2);	z-index: 2;	transform: translateX(-50%);	padding: 2px var(--s3);	font: inherit;	font-size: var(--t-xs);	font-weight: 700;	white-space: nowrap;	color: var(--bg);	background: var(--accent);	border: none;	border-radius: 99px;	box-shadow: var(--shadow);	cursor: pointer;}.emoji-pad {	position: absolute;	inset: auto 0 0 0;	z-index: 3;	display: grid;	grid-template-columns: repeat(8, 1fr);	gap: 2px;	padding: var(--s2);	background: var(--surface);	border-top: 1px solid var(--line);}.emoji-pad button {	padding: 2px 0;	font-size: 17px;	line-height: 1.3;	background: transparent;	border: none;	border-radius: var(--r1);	cursor: pointer;}.emoji-pad button:hover {	background: var(--surface-3);}.emoji-pad button:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.quick {	display: flex;	flex-wrap: wrap;	gap: var(--s1);	flex: 0 0 auto;	padding: var(--s1) var(--s2);	border-top: 1px solid var(--line);}.quick button {	flex: 0 0 auto;	padding: 2px var(--s2);	font: inherit;	font-size: var(--t-xs);	color: var(--ink-2);	background: var(--surface-2);	border: 1px solid var(--line);	border-radius: 99px;	white-space: nowrap;	cursor: pointer;}.quick button:hover { function esc(value) {

  el.setAttribute("aria-label", "남은 시간 " + n + "초");
  if (bar) bar.style.width = n / total * 100 + "%";
  el.classList.toggle("urgent", left <= 10);
  el.classList.toggle("critical", left <= 3);
  if (line) line.classList.toggle("urgent", left <= 10);
 }
 paint();
 const id = setInterval(function() {
  left--;
  paint();
  if (left <= 0) clearInterval(id);
 }, 1e3);
 el.dataset.timerId = String(id);
 return id;
}

function scrollToEnd(el) {
 if (el) el.scrollTop = el.scrollHeight;
}

function assetUrl(file) {
 try {
  const url = new URL(document.baseURI);
  if (!url.searchParams.has("appHashId")) return file;
  url.searchParams.set("fileName", file);
  return url.href;
 } catch (e) {
  return file;
 }
}

const HostWindow = function() {
 try {
  void window.parent.document.readyState;
  return window.parent;
 } catch (error) {
  return null;
 }
}();

const Parent = function() {
 const store = function() {
  if (!HostWindow) return {};
  if (!HostWindow.__mafiaWidget) HostWindow.__mafiaWidget = {};
  return HostWindow.__mafiaWidget;
 }();
 function send(message) {
  window.parent.postMessage(message, "*");
 }
 function on(handlers) {
  window.addEventListener("message", function(event) {
   const data = event && event.data;
   if (!data) return;
   if (data.layout) applyLayout(data.layout);
   const handler = handlers[data.type];
   if (handler) handler(data);
  });
 }
 function isLandscape() {
  const o = window.screen && window.screen.orientation;
  if (o && o.type) return o.type.indexOf("landscape") === 0;
  if (typeof window.orientation === "number") return Math.abs(window.orientation) === 90;
  return window.screen.width > window.screen.height;
 }
 function landscapeLayout(layout) {
  if (layout.width !== "96%" || !isLandscape()) return layout;
  const pct = parseFloat(layout.height);
  const out = {
   ...layout,
   width: "46%"
  };
  if (pct > 0 && String(layout.height).slice(-1) === "%") out.height = `${Math.min(Math.round(pct * 1.8), 86)}%`;
  if (layout.anchor === "top") out.anchor = "topright"; else if (layout.anchor === "bottom") out.anchor = "bottomleft";
  return out;
 }
 let lastLayout = null;
 const relayout = () => lastLayout && applyLayout(lastLayout);
 if (window.screen && window.screen.orientation && window.screen.orientation.addEventListener) {
  window.screen.orientation.addEventListener("change", relayout);
 } else {
  window.addEventListener("orientationchange", relayout);
 }
 function applyLayout(raw) {
  lastLayout = raw;
  const layout = landscapeLayout(raw);
  const message = {
   type: "WidgetRearrange",
   anchor: layout.anchor,
   width: layout.width,
   height: layout.height
  };
  if (layout.top) message.top = layout.top;
  if (layout.zIndex) message.zIndex = layout.zIndex;
  send(message);
 }
 function openSignin() {
  window.parent.postMessage({
   type: "ScriptAction:OPEN_Signin_Modal",
   zepSystem: true
  }, "*");
 }
 function editable(el) {
  if (!el || !el.tagName) return false;
  const tag = String(el.tagName).toUpperCase();
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
  return el.isContentEditable === true;
 }
 function onKey(handler) {
  if (!HostWindow) return function() {};
  function off() {
   HostWindow.removeEventListener("keydown", listener, true);
   window.removeEventListener("pagehide", off);
  }
  function listener(event) {
   const frame = window.frameElement;
   if (frame && frame.isConnected === false) {
    off();
    return;
   }
   if (editable(event.target)) return;
   if (event.altKey || event.ctrlKey || event.metaKey) return;
   handler(event);
  }
  HostWindow.addEventListener("keydown", listener, true);
  window.addEventListener("pagehide", off);
  return off;
 }
 function grabFocus() {
  window.focus();
 }
 function releaseFocus() {
  window.parent.focus();
 }
 return {
  send: send,
  on: on,
  onKey: onKey,
  grabFocus: grabFocus,
  releaseFocus: releaseFocus,
  openSignin: openSignin,
  store: store,
  canReadKeys: HostWindow !== null
 };
}();
</script>
		<script>
let myId = null;

let iAmReady = false;

const config = {
 min: 4,
 max: 12,
 kickVotes: 3
};

let counts = {};

function paintOnline(value) {
 const online = Number(value);
 qs("#online").textContent = Number.isFinite(online) ? Math.max(0, Math.floor(online)) : 0;
}

function roomHtml(num) {
 const info = counts[num] || {
  count: 0,
  started: false,
  watching: 0
 };
 const max = info.max || config.max;
 const full = info.count >= max;
 const state = info.started ? `관전 ${info.watching || 0}` : full ? "가득 참" : `${info.count}/${max}`;
 return html`<button
					type="button"
					class="room${info.started ? " playing" : full ? " full" : ""}"
					data-num="${num}"
					${flag(!info.started && full, "disabled")}
					aria-label="${num}번 방, ${info.started ? "진행 중, 관전하기" : state}"
				>
					<span>${num}번 방</span><span class="cnt">${state}</span>
				</button>`;
}

function paintRooms() {
 const nums = Object.keys(counts).sort((a, b) => Number(a) - Number(b));
 qs("#rooms").innerHTML = html`${nums.map(roomHtml)}`;
}

qs("#rooms").addEventListener("click", event => {
 const el = event.target.closest(".room");
 if (!el || el.disabled) return;
 Parent.send({
  type: "join",
  roomNum: Number(el.dataset.num)
 });
});

function seatHtml(seat, i) {
 const mine = seat.id === myId;
 const kick = mine ? "" : html`<button
							type="button"
							class="btn ghost kick${seat.kickCount > 0 ? " voted" : ""}"
							data-id="${seat.id}"
							aria-label="${seat.name} 강퇴 투표, ${seat.kickCount}/${config.kickVotes}표"
						>
							강퇴 ${seat.kickCount}/${config.kickVotes}
						</button>`;
 return html`<div
					class="seat${seat.ready ? " ready" : ""}${mine ? " me" : ""}"
					role="listitem"
				>
					<span class="idx">${i + 1}</span>
					<span class="grow ellip"
						><span class="nm">${seat.name}${mine ? " (나)" : ""}</span>
						<span class="meta">${seat.rank} · ${seat.runCount}판</span></span
					>
					<span class="state">${seat.ready ? "준비" : "대기"}</span>
					${kick}
				</div>`;
}

function paintSeats(list) {
 qs("#seats").innerHTML = html`${list.map(seatHtml)}`;
 const readyCount = list.filter(seat => seat.ready).length;
 iAmReady = list.some(seat => seat.id === myId && seat.ready);
 const ready = qs("#ready");
 ready.textContent = iAmReady ? "준비 취소" : "준비";
 ready.classList.toggle("primary", !iAmReady);
 ready.classList.toggle("ok", iAmReady);
 qs("#sub").textContent = `${list.length}명 · 준비 ${readyCount}명`;
 qs("#readybar").classList.remove("hidden");
 qs("#readyfill").style.width = list.length > 0 ? Math.round(readyCount / list.length * 100) + "%" : "0%";
 qs("#note").textContent = list.length < config.min ? `${config.min - list.length}명 더 모이면 시작할 수 있습니다.` : readyCount < list.length ? `${list.length - readyCount}명이 아직 준비하지 않았습니다.` : "곧 시작합니다.";
}

qs("#seats").addEventListener("click", event => {
 const el = event.target.closest(".kick");
 if (!el) return;
 Parent.send({
  type: "kick",
  id: el.dataset.id
 });
});

qs("#ready").addEventListener("click", () => {
 Parent.send({
  type: iAmReady ? "cancle-ready" : "ready"
 });
});

qs("#quit").addEventListener("click", () => {
 Parent.send({
  type: "quit"
 });
});

qs("#book").addEventListener("click", () => {
 Parent.send({
  type: "book"
 });
});

qs("#guide").addEventListener("click", () => {
 Parent.send({
  type: "guide"
 });
});

function showRooms(inRoom) {
 qs("#rooms").classList.toggle("hidden", inRoom);
 qs("#seats").classList.toggle("hidden", !inRoom);
 qs("#foot").classList.toggle("hidden", !inRoom);
 qs("#readybar").classList.toggle("hidden", !inRoom);
 qs("#heading").textContent = inRoom ? "대기실" : "참가할 방을 고르세요";
 if (!inRoom) {
  qs("#sub").textContent = "";
  qs("#note").textContent = "진행 중인 방은 관전으로 들어갑니다.";
 }
}

Parent.on({
 setID(data) {
  myId = data.id;
  paintOnline(data.online);
 },
 init(data) {
  const list = Array.isArray(data.data) ? data.data : [];
  if (data.kickVotes) config.kickVotes = data.kickVotes;
  if (data.minPlayers) config.min = data.minPlayers;
  if (data.maxPlayers) config.max = data.maxPlayers;
  showRooms(list.length > 0);
  if (list.length > 0) paintSeats(list); else paintRooms();
 },
 updatePlayerCount(data) {
  counts = data.data || {};
  if (!qs("#rooms").classList.contains("hidden")) paintRooms();
 },
 updateOnlineCount(data) {
  paintOnline(data.online);
 },
 loginRequired(data) {
  if (!window.confirm(String(data.message))) return;
  Parent.openSignin();
 }
});
</script>
