<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>채팅</title>
		<style>
:root {		--bg: #14100f;	--surface: #201a19;	--surface-2: #2d2523;	--surface-3: #3b312e;	--line: #4a3d39;		--ink: #f5efe9;	--ink-2: #b9aaa2;	--ink-3: #7d6e68;		--mafia: #e04b4b;	--mafia-dim: #6d2424;	--citizen: #57a8e0;	--citizen-dim: #24475f;		--accent: #e0b355; 	--ok: #5fbf7f;	--warn: #e0b355;	--danger: #e04b4b;	--dead: #5a4a45;		--s1: 4px;	--s2: 8px;	--s3: 12px;	--s4: 16px;	--s5: 24px;		--t-xs: clamp(10px, 2.6vw, 12px);	--t-sm: clamp(11px, 3vw, 13px);	--t-md: clamp(13px, 3.5vw, 15px);	--t-lg: clamp(15px, 4.2vw, 18px);	--t-xl: clamp(19px, 5.5vw, 24px);	--t-2xl: clamp(24px, 7vw, 34px);	--r1: 6px;	--r2: 10px;	--r3: 14px;	--shadow: 0 4px 16px rgba(0, 0, 0, 0.45);	--dur: 160ms;	--ease: cubic-bezier(0.2, 0, 0.2, 1);}@media (prefers-reduced-motion: reduce) {	:root {		--dur: 1ms;	}	*,	*::before,	*::after {		animation-duration: 1ms !important;		animation-iteration-count: 1 !important;		transition-duration: 1ms !important;	}}* {	margin: 0;	padding: 0;	box-sizing: border-box;}html,body {	width: 100%;	height: 100%;	overflow: hidden;}body {		font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",		"Malgun Gothic", "맑은 고딕", "Noto Sans KR", system-ui, sans-serif;	font-size: var(--t-md);	line-height: 1.45;	color: var(--ink);	background: transparent;	-webkit-font-smoothing: antialiased;	-webkit-user-select: none;	user-select: none;	-webkit-tap-highlight-color: transparent;}.panel {
	position: relative;
	display: flex;
	flex-direction: column;
	width: 100%;
	height: 100%;
	padding: var(--panel-pad, calc(var(--panel-border) + 2px));
	gap: var(--s2);
	--panel-frame: url("art_ui_popup_frame.png");
	--panel-slice: 63 54 63 53 fill;
	--panel-border: 18px;
	background-color: var(--bg);
	background-image: linear-gradient(160deg, rgba(32, 26, 25, 0.93), rgba(20, 16, 15, 0.97)),
		url("art_ui_panel_texture.png");
	background-position: center, center;
	background-size: cover, cover;
	background-repeat: no-repeat;
	border: 0;
	border-radius: var(--r3);
	box-shadow: var(--shadow);
	overflow: hidden;
}
.panel::before {
	content: "";
	position: absolute;
	inset: 0;
	z-index: 0;
	border: var(--panel-border) solid transparent;
	border-image-source: var(--panel-frame);
	border-image-slice: var(--panel-slice);
	border-image-width: var(--panel-border);
	border-image-repeat: stretch;
	pointer-events: none;
}
.panel > * {
	position: relative;
	z-index: 1;
}
.panel.night {
	background-image: linear-gradient(160deg, rgba(25, 43, 74, 0.28), rgba(16, 27, 49, 0.54)),
		url("art_bg_village_night.png");
}
.panel.day {
	background-image: linear-gradient(160deg, rgba(79, 63, 37, 0.18), rgba(31, 27, 31, 0.52)),
		url("art_bg_village_day.png");
}
.panel.vote {
	--panel-frame: url("art_ui_vote_frame.png");
	--panel-slice: 59 38 51 37 fill;
	--panel-border: 20px;
	background-image: linear-gradient(160deg, rgba(48, 42, 78, 0.24), rgba(24, 22, 43, 0.58)),
		url("art_bg_vote_hall.png");
}
.hd {	display: flex;	align-items: center;	justify-content: space-between;	gap: var(--s2);	flex: 0 0 auto;}.hd-title {	display: flex;	align-items: center;	gap: var(--s2);	min-width: 0;	font-size: var(--t-lg);	font-weight: 700;	letter-spacing: -0.01em;}.hd-sub {	font-size: var(--t-xs);	color: var(--ink-3);	white-space: nowrap;}.timer {
	position: relative;	flex: 0 0 auto;	display: grid;	place-items: center;	width: 44px;	height: 44px;	font-variant-numeric: tabular-nums;	font-size: var(--t-lg);	font-weight: 700;	color: var(--ink);
	background: url("art_icon_time.png") center / 82% 82% no-repeat;
}
.timer svg {	position: absolute;	inset: 0;	transform: rotate(-90deg);}.timer circle {	fill: none;	stroke-width: 3;	stroke-linecap: round;}.timer .track {	stroke: var(--surface-3);}.timer .bar {	stroke: var(--accent);	transition: stroke-dashoffset 1s linear, stroke var(--dur) var(--ease);}.timer.urgent .bar {	stroke: var(--danger);}.timer.urgent {	color: var(--danger);	animation: pulse 1s var(--ease) infinite;}.timer.critical {	animation: pulse 420ms var(--ease) infinite;}@keyframes pulse {	0%,	100% {		transform: scale(1);	}	50% {		transform: scale(1.08);	}}.progress {	flex: 0 0 auto;	height: 4px;	border-radius: 99px;	background: var(--surface-2);	overflow: hidden;}.progress i {	display: block;	height: 100%;	width: 0;	background: var(--accent);	transition: width var(--dur) var(--ease);}.body {	flex: 1 1 auto;	min-height: 0;	display: flex;	flex-direction: column;	gap: var(--s2);}.scroll {	overflow-y: auto;	overscroll-behavior: contain;	scrollbar-width: thin;	scrollbar-color: var(--surface-3) transparent;}.scroll::-webkit-scrollbar {	width: 6px;}.scroll::-webkit-scrollbar-thumb {	background: var(--surface-3);	border-radius: 99px;}.scroll::-webkit-scrollbar-track {	background: transparent;}.foot {	display: flex;	gap: var(--s2);	flex: 0 0 auto;}.btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--s1);
	min-height: 34px;
	padding: var(--s1) var(--s2);
	font: inherit;
	font-size: var(--t-sm);
	font-weight: 600;
	color: var(--ink);
	background-color: var(--surface-2);
	border: 8px solid transparent;
	border-image-source: url("art_ui_button_secondary.png");
	border-image-slice: 84 fill;
	border-image-width: 8px 16px;
	border-image-repeat: stretch;
	border-radius: var(--r1);
	cursor: pointer;
	transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
		transform var(--dur) var(--ease);}.btn:hover:not(:disabled) {	background: var(--surface-3);}.btn:active:not(:disabled) {	transform: scale(0.97);}.btn:focus-visible {	outline: 2px solid var(--accent);	outline-offset: 2px;}.btn:disabled {	cursor: default;	opacity: 0.45;}.btn.primary {
	color: #14100f;
	background-color: var(--accent);
	border-image-source: url("art_ui_button_primary.png");
	border-color: var(--accent);
}
.btn.primary:hover:not(:disabled) {	filter: brightness(1.1);}.btn.ok {
	color: #0e1a12;
	background: var(--ok);
	border-color: var(--ok);
	border-image-source: none;
}
.btn.danger {
	color: var(--ink);
	background-color: var(--mafia-dim);
	border-image-source: url("art_ui_button_danger.png");
	border-color: var(--mafia);
}
.btn.ghost {
	background: transparent;
	border-image-source: none;
	border-color: var(--line);
}
.icon-btn {	display: inline-flex;	align-items: center;	justify-content: center;	flex: 0 0 auto;	min-width: 34px;	min-height: 34px;	padding: var(--s1) var(--s2);	font: inherit;	font-size: var(--t-md);	color: var(--ink-2);	background: transparent;	border: none;	cursor: pointer;}.icon-btn:hover {	color: var(--ink);}.icon-btn:focus-visible {
	outline: 2px solid var(--accent);	outline-offset: -2px;}
.ui-icon {
	width: 20px;
	height: 20px;
	object-fit: contain;
	flex: 0 0 auto;
}
.grid {	display: grid;	grid-template-columns: repeat(4, 1fr);	gap: var(--s2);	align-content: start;}@media (max-width: 340px) {	.grid {		grid-template-columns: repeat(3, 1fr);	}}.tile {	position: relative;	display: flex;	flex-direction: column;	align-items: center;	justify-content: center;	gap: 2px;	aspect-ratio: 1;	padding: var(--s1);	font: inherit;	font-size: var(--t-sm);	font-weight: 700;	color: var(--ink);	background: var(--surface-2);	border: 1px solid var(--line);	border-radius: var(--r2);	cursor: pointer;	transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),		transform var(--dur) var(--ease);}.tile:hover:not(:disabled) {	background: var(--surface-3);	border-color: var(--ink-3);}.tile:active:not(:disabled) {	transform: scale(0.95);}.tile:focus-visible {	outline: 2px solid var(--accent);	outline-offset: 2px;}.tile .num {	font-size: var(--t-lg);	line-height: 1.1;}.tile .cap {	font-size: var(--t-xs);	font-weight: 500;	color: var(--ink-3);}.tile.me {	border-color: var(--ok);}.tile.me .cap {	color: var(--ok);}.tile:disabled,.tile.dead {	cursor: default;	color: var(--dead);	background: var(--surface);	border-color: var(--surface-2);}.tile.dead .cap {	color: var(--dead);}.tile.picked {	background: var(--mafia-dim);	border-color: var(--mafia);	box-shadow: 0 0 0 2px var(--mafia) inset;}.tile.ally {	border-color: var(--mafia);	background: color-mix(in srgb, var(--mafia-dim) 60%, var(--surface-2));}.tile .badge {	position: absolute;	top: 2px;	right: 3px;	font-size: var(--t-xs);	line-height: 1;}.tile .tally {	position: absolute;	bottom: 2px;	left: 0;	right: 0;	font-size: var(--t-xs);	font-weight: 700;	color: var(--accent);}.chip {	display: inline-flex;	align-items: center;	gap: var(--s1);	padding: 2px var(--s2);	font-size: var(--t-xs);	font-weight: 700;	white-space: nowrap;	border: 1px solid var(--line);	border-radius: 99px;	background: var(--surface-2);}.chip.mafia {	color: var(--mafia);	border-color: var(--mafia);	background: var(--mafia-dim);}.chip.citizen {	color: var(--citizen);	border-color: var(--citizen);	background: var(--citizen-dim);}.chip.dead {	color: var(--ink-3);}.note {
	position: relative;
	isolation: isolate;
	flex: 0 0 auto;
	font-size: var(--t-sm);
	color: var(--ink-2);
	text-align: center;
	word-break: keep-all;
	min-height: 28px;
	padding: var(--s2) var(--s4);
	background: transparent;
}
.note::before {
	content: "";
	position: absolute;
	inset: 0;
	z-index: -1;
	border: 14px solid transparent;
	border-image-source: url("art_ui_notification_banner.png");
	border-image-slice: 119 96 135 96 fill;
	border-image-width: 14px 22px;
	border-image-repeat: stretch;
	pointer-events: none;
}
.note strong {	color: var(--ink);}.note.flash {	animation: flash var(--dur) var(--ease);}@keyframes flash {	from {		opacity: 0;		transform: translateY(-4px);	}}.chat {
	position: relative;
	display: flex;
	flex-direction: column;
	width: 100%;
	height: 100%;
	min-height: 0;
	padding: 18px;
	background-color: var(--bg);
	background-image: linear-gradient(160deg, rgba(32, 26, 25, 0.94), rgba(20, 16, 15, 0.98)),
		url("art_ui_panel_texture.png");
	background-position: center;
	background-size: cover, cover;
	background-repeat: no-repeat;
	border: 0;
	border-radius: var(--r2);
	box-shadow: var(--shadow);
	overflow: hidden;
}
.chat::before {
	content: "";
	position: absolute;
	inset: 0;
	z-index: 0;
	border: 18px solid transparent;
	border-image-source: url("art_ui_chat_frame.png");
	border-image-slice: 26 27 45 27 fill;
	border-image-width: 18px;
	border-image-repeat: stretch;
	pointer-events: none;
}
.chat > * {
	position: relative;
	z-index: 1;
}
.chat-head {	display: flex;	align-items: stretch;	flex: 0 0 auto;	border-bottom: 1px solid var(--line);}.chat-tabs {	display: flex;	gap: 2px;	flex: 1 1 auto;	min-width: 0;	padding: 2px 2px 0;	overflow-x: auto;	scrollbar-width: none;}.chat-tabs::-webkit-scrollbar {	display: none;}.tab {	display: inline-flex;	align-items: center;	gap: var(--s1);	flex: 0 0 auto;	padding: var(--s1) var(--s2);	font: inherit;	font-size: var(--t-xs);	font-weight: 700;	color: var(--ink-3);	background: transparent;	border: none;	border-bottom: 2px solid transparent;	border-radius: var(--r1) var(--r1) 0 0;	white-space: nowrap;	cursor: pointer;	transition: color var(--dur) var(--ease), background var(--dur) var(--ease);}.tab:hover {	color: var(--ink-2);	background: var(--surface-2);}.tab:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.tab[aria-selected="true"] {	color: var(--ink);	background: var(--surface-2);	border-bottom-color: var(--accent);}.tab.ro::after {	content: "🔒";	font-size: 9px;}.badge-n {	min-width: 15px;	padding: 0 4px;	font-size: 9px;	font-weight: 700;	line-height: 15px;	text-align: center;	color: #14100f;	background: var(--accent);	border-radius: 99px;}.chat-fold {	display: inline-flex;	align-items: center;	gap: var(--s1);	flex: 0 0 auto;	min-width: 44px;	min-height: 40px;	margin: 2px var(--s1) 2px 0;	padding: 0 var(--s2);	font: inherit;	font-size: var(--t-xs);	font-weight: 700;	color: var(--ink-2);	background: var(--surface-2);	border: 1px solid var(--line);	border-radius: var(--r1);	white-space: nowrap;	cursor: pointer;	transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);}.chat-fold:hover {	color: var(--ink);	border-color: var(--ink-3);}.chat-fold:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.chat-body {	position: relative;	display: flex;	flex: 1 1 auto;	min-height: 0;}.chat-log {	display: flex;	flex-direction: column;	gap: var(--s1);	flex: 1 1 auto;	min-height: 0;	padding: var(--s2);}.msg {	display: flex;	flex-direction: column;	max-width: 88%;	font-size: var(--t-sm);}.msg .who {	display: flex;	align-items: center;	gap: var(--s1);	font-size: var(--t-xs);	color: var(--ink-3);}.msg .chip {	padding: 0 var(--s1);	font-size: 9px;}.msg .txt {	padding: var(--s1) var(--s2);	border-radius: var(--r1);	background: var(--surface-2);		white-space: pre-wrap;	word-break: break-word;}.msg.mine {	align-self: flex-end;	align-items: flex-end;}.msg.mine .txt {	color: #14100f;	background: var(--accent);}.when {	flex: 0 0 auto;	font-size: 9px;	color: var(--ink-3);	font-variant-numeric: tabular-nums;}.msg.sys,.msg.evt,.msg.ntc {	align-self: center;	align-items: center;	max-width: 100%;	text-align: center;}.msg.sys .txt,.msg.ntc .txt {	font-size: var(--t-xs);	color: var(--ink-2);	background: transparent;}.msg.ntc .txt {	color: var(--ink-3);}.msg.evt .txt {	font-size: var(--t-xs);	font-weight: 700;	color: var(--accent);	background: color-mix(in srgb, var(--accent) 14%, transparent);	border-radius: 99px;}.msg.card {	align-self: stretch;	align-items: stretch;	max-width: 100%;	gap: 2px;	padding: var(--s2);	text-align: left;	border: 1px solid var(--line);	border-radius: var(--r1);	background: var(--surface-2);}.msg.pm {	align-self: stretch;	align-items: stretch;	max-width: 88%;	text-align: left;}.msg.pm .txt {	font-size: var(--t-sm);	color: var(--ink);	background: color-mix(in srgb, var(--citizen) 18%, transparent);	border-left: 2px solid var(--citizen);	border-radius: 0 var(--r1) var(--r1) 0;}.msg.card .ttl {	font-size: var(--t-xs);	font-weight: 700;	color: var(--accent);}.msg.card .row {	display: flex;	align-items: center;	justify-content: space-between;	gap: var(--s1);	font-size: var(--t-xs);	color: var(--ink-2);}.msg.card .row .ellip {	flex: 1 1 auto;	min-width: 0;}.msg.card .val {	flex: 0 0 auto;	color: var(--ink-3);}.msg.card .row.dim {	opacity: 0.5;}.chat-jump {	position: absolute;	left: 50%;	bottom: var(--s2);	z-index: 2;	transform: translateX(-50%);	padding: 2px var(--s3);	font: inherit;	font-size: var(--t-xs);	font-weight: 700;	color: #14100f;	background: var(--accent);	border: none;	border-radius: 99px;	box-shadow: var(--shadow);	cursor: pointer;}.emoji-pad {	position: absolute;	inset: auto 0 0 0;	z-index: 3;	display: grid;	grid-template-columns: repeat(8, 1fr);	gap: 2px;	padding: var(--s2);	background: var(--surface);	border-top: 1px solid var(--line);}.emoji-pad button {	padding: 2px 0;	font-size: 17px;	line-height: 1.3;	background: transparent;	border: none;	border-radius: var(--r1);	cursor: pointer;}.emoji-pad button:hover {	background: var(--surface-3);}.emoji-pad button:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.quick {	display: flex;	gap: var(--s1);	flex: 0 0 auto;	padding: var(--s1) var(--s2);	overflow-x: auto;	scrollbar-width: none;	border-top: 1px solid var(--line);}.quick::-webkit-scrollbar {	display: none;}.quick button {	flex: 0 0 auto;	padding: 2px var(--s2);	font: inherit;	font-size: var(--t-xs);	color: var(--ink-2);	background: var(--surface-2);	border: 1px solid var(--line);	border-radius: 99px;	white-space: nowrap;	cursor: pointer;}.quick button:hover {	color: var(--ink);	background: var(--surface-3);}.quick button:focus-visible {	outline: 2px solid var(--accent);	outline-offset: 1px;}.chat-entry {	display: flex;	align-items: center;	flex: 0 0 auto;	background: var(--surface);	border-top: 1px solid var(--line);}.chat-input {	flex: 1 1 auto;	min-width: 0;	padding: var(--s2) var(--s1);	font: inherit;	font-size: var(--t-sm);	color: var(--ink);	background: transparent;	border: none;	outline: none;	-webkit-user-select: text;	user-select: text;}.chat-input::placeholder {	color: var(--ink-3);}.chat-input:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.chat-mini {	display: flex;	align-items: center;	gap: var(--s2);	width: 100%;	height: 100%;	padding: 0 var(--s3);	font: inherit;	font-size: var(--t-sm);	font-weight: 700;	color: var(--ink-2);	background: linear-gradient(160deg, var(--surface) 0%, var(--bg) 100%);	border: 1px solid var(--line);	border-radius: 99px;	box-shadow: var(--shadow);	cursor: pointer;	transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);}.chat-mini:hover {	color: var(--ink);	border-color: var(--ink-3);}.chat-mini:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.chat-mini.alert {	color: var(--ink);	border-color: var(--accent);}.hidden {	display: none !important;}.row {	display: flex;	align-items: center;	gap: var(--s2);}.grow {	flex: 1 1 auto;	min-width: 0;}.ellip {	overflow: hidden;	white-space: nowrap;	text-overflow: ellipsis;}.sr {	position: absolute;	width: 1px;	height: 1px;	padding: 0;	margin: -1px;	overflow: hidden;	clip: rect(0, 0, 0, 0);	white-space: nowrap;	border: 0;}
</style>

	<body>
		<button type="button" class="chat-mini hidden" id="mini" aria-label="채팅 열기">

		<circle class="track" cx="22" cy="22" r="${RADIUS}"></circle>

    scope: scope,
    name: name

  for (const queue of queues) {
   const req = requireFrom(queue.scope[queue.name]);
   if (req) return req;
  }
  if (queues.length > 0) {
   const names = queues.map(q => q.name).join(", ");
   return fold("청크 큐 " + names + "에서 webpack require를 얻지 못했습니다");
  }

		<script>
const MAX_LINES = 200;

const MAX_TEXT = 200;

const BOTTOM_SLACK = 24;

const MAX_SENT = 30;

const EMOJI = [ "👍", "👏", "🙏", "❤️", "😀", "😂", "😅", "😭", "😱", "😡", "🤔", "😎", "🔪", "👻", "🕵️", "🚨" ];

let lines = [];

let channels = [];

let quick = [];

let active = "";

let myId = "";

const sent = Parent.store.chatSent || (Parent.store.chatSent = []);

let sentAt = sent.length;

function clock(at) {
 const d = new Date(Number(at) || 0);
 return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

function viewOf(id) {
 for (const view of channels) {
  if (view.id === id) return view;
 }
 return null;
}

function card(line, cls) {
 const rows = line.rows.map(row => {
  const value = !row.value ? "" : row.tone ? html`<span class="chip ${row.tone === "mafia" ? "mafia" : "citizen"}"
									>${row.value}</span
								>` : html`<span class="val">${row.value}</span>`;
  return html`<div class="row${row.dim ? " dim" : ""}">
						<span class="ellip">${row.label}</span>${value}
					</div>`;
 });
 return html`<div class="msg card ${cls}">
					<div class="ttl">${line.text}</div>
					${rows}
				</div>`;
}

function bubble(line) {
 const when = html`<span class="when">${clock(line.at)}</span>`;
 const pm = line.to !== "" ? " pm" : "";
 if (line.kind !== "USER") {
  const cls = line.kind === "EVENT" ? "evt" : line.kind === "NOTICE" ? "ntc" : "sys";
  if (line.rows && line.rows.length) return card(line, cls);
  return html`<div class="msg ${cls}${pm}">
						<div class="txt">${when} ${line.text}</div>
					</div>`;
 }
 const mine = line.senderId !== "" && line.senderId === myId;
 let who = when;
 if (!mine) {
  const chip = line.role ? html`<span class="chip ${line.team === "mafia" ? "mafia" : "citizen"}"
								>${line.role}</span
							>` : "";
  const name = line.num > 0 ? line.num + "번 " + line.name : line.name;
  who = html`${chip}<span class="ellip">${name}</span>${when}`;
 }
 return html`<div class="msg${mine ? " mine" : ""}${pm}">
					<div class="who">${who}</div>
					<div class="txt">${line.text}</div>
				</div>`;
}

function nearBottom(el) {
 return el.scrollHeight - el.scrollTop - el.clientHeight < BOTTOM_SLACK;
}

function jump(show) {
 qs("#jump").classList.toggle("hidden", !show);
}

function render() {
 const el = qs("#log");
 el.innerHTML = html`${lines.filter(line => line.channel === active).map(bubble)}`;
 scrollToEnd(el);
 jump(false);
}

function append(line) {
 lines.push(line);
 if (lines.length > MAX_LINES) lines.splice(0, lines.length - MAX_LINES);
 if (line.channel !== active) return;
 const el = qs("#log");
 const follow = nearBottom(el);
 el.insertAdjacentHTML("beforeend", bubble(line));
 while (el.childElementCount > MAX_LINES) el.removeChild(el.firstElementChild);
 if (follow) scrollToEnd(el);
 jump(!follow);
}

function badgeText(unread) {
 return unread > 99 ? "99+" : String(unread);
}

function tabHtml(view) {
 const badge = view.unread > 0 ? html`<span class="badge-n">${badgeText(view.unread)}</span>` : "";
 return html`<button
					type="button"
					role="tab"
					class="tab${view.write ? "" : " ro"}"
					aria-selected="${view.id === active}"
					data-id="${view.id}"
					aria-label="${view.label + (view.write ? "" : ", 읽기 전용")}"

				</button>`;
}

function drawTabs() {
 qs("#tabs").innerHTML = html`${channels.map(tabHtml)}`;
 const view = viewOf(active);
 qs("#input").placeholder = view ? view.placeholder : "";
}

function drawBadges() {
 for (const tab of qsa(".tab", qs("#tabs"))) {
  const view = viewOf(tab.dataset.id);
  if (!view) continue;
  let badge = qs(".badge-n", tab);
  if (view.unread <= 0) {
   if (badge) badge.remove();
   continue;
  }
  if (!badge) {
   tab.insertAdjacentHTML("beforeend", '<span class="badge-n"></span>');
   badge = qs(".badge-n", tab);
  }
  badge.textContent = badgeText(view.unread);
 }
}

function drawQuick() {
 const view = viewOf(active);
 const usable = view !== null && view.write && quick.length > 0;
 qs("#quick").classList.toggle("hidden", !usable);
 if (!usable) return;
 qs("#quick").innerHTML = html`${quick.map(text => html`<button type="button">${text}</button>`)}`;
}

const MINI_LABEL = Parent.canReadKeys ? "채팅 (Enter)" : "채팅";

function drawMini() {
 let total = 0;
 for (const view of channels) total += view.unread;
 const active_ = viewOf(active);
 qs("#miniGlyph").textContent = active_ ? active_.glyph : "💬";
 qs("#miniText").textContent = total > 0 ? "새 메시지" : MINI_LABEL;
 qs("#miniBadge").textContent = badgeText(total);
 qs("#miniBadge").classList.toggle("hidden", total === 0);
 qs("#mini").classList.toggle("alert", total > 0);
}

function draw() {
 drawTabs();
 drawQuick();
 drawMini();
}

function remember(text) {
 if (sent[sent.length - 1] !== text) sent.push(text);
 if (sent.length > MAX_SENT) sent.shift();
 resetRecall();
}

function resetRecall() {
 sentAt = sent.length;
}

function recall(step) {
 const at = Math.max(0, Math.min(sent.length, sentAt + step));
 if (at === sentAt) return;
 sentAt = at;
 const input = qs("#input");
 input.value = at === sent.length ? "" : sent[at];
 input.setSelectionRange(input.value.length, input.value.length);
}

function submit(text) {
 const trimmed = String(text == null ? "" : text).trim();
 if (trimmed === "") return false;
 const view = viewOf(active);
 if (trimmed.charAt(0) !== "/" && (view === null || !view.write)) return false;

  type: "send",
  channel: active,
  text: trimmed
 });

 return true;
}

function submitInput() {
 if (!submit(qs("#input").value)) return;
 qs("#input").value = "";
 qs("#pad").classList.add("hidden");
}

function selectChannel(id) {
 if (id === active) return;
 active = id;
 const view = viewOf(active);
 if (view) view.unread = 0;
 draw();
 render();
 Parent.send({
  type: "channel",
  channel: active
 });
}

function cycleChannel(step) {
 if (channels.length < 2) return;
 let at = 0;
 for (let i = 0; i < channels.length; i++) {
  if (channels[i].id === active) at = i;
 }
 selectChannel(channels[(at + step + channels.length) % channels.length].id);
}

qs("#tabs").addEventListener("click", event => {
 const el = event.target.closest(".tab");
 if (el) selectChannel(el.dataset.id);
});

qs("#chatHead").addEventListener("click", event => {
 if (event.target.closest(".tab")) return;
 Parent.send({
  type: "toggle",
  open: false
 });
});

qs("#mini").addEventListener("click", () => {
 Parent.send({
  type: "toggle",
  open: true
 });
});

qs("#jump").addEventListener("click", () => {
 scrollToEnd(qs("#log"));
 jump(false);
});

qs("#log").addEventListener("scroll", () => {
 if (nearBottom(qs("#log"))) jump(false);
});

qs("#emoji").addEventListener("click", () => {
 qs("#pad").classList.toggle("hidden");
});

qs("#pad").addEventListener("click", event => {
 if (event.target.tagName !== "BUTTON") return;
 const input = qs("#input");
 input.value = (input.value + event.target.textContent).slice(0, MAX_TEXT);
 qs("#pad").classList.add("hidden");
 input.focus();
});

qs("#quick").addEventListener("click", event => {
 if (event.target.tagName !== "BUTTON") return;
 submit(event.target.textContent);
});

qs("#submit").addEventListener("click", submitInput);

function focusInput(slash) {
 if (qs("#full").classList.contains("hidden")) {
  Parent.send({
   type: "toggle",
   open: true,
   focus: slash ? "command" : "input"
  });
  return;
 }
 takeFocus(slash);
}

function takeFocus(slash) {
 Parent.grabFocus();
 const input = qs("#input");
 if (slash && input.value === "") input.value = "/";
 input.focus();
 input.setSelectionRange(input.value.length, input.value.length);
}

qs("#input").addEventListener("keydown", event => {
 const input = qs("#input");
 if (event.key === "Enter") {
  submitInput();
  Parent.releaseFocus();
  return;
 }
 if (event.key === "Escape") {
  if (input.value !== "") {
   input.value = "";
   resetRecall();
   return;
  }
  qs("#pad").classList.add("hidden");
  input.blur();
  Parent.releaseFocus();
  return;
 }
 if (event.key === "Tab") {
  event.preventDefault();
  cycleChannel(event.shiftKey ? -1 : 1);
  return;
 }
 if (event.key === "ArrowUp" || event.key === "ArrowDown") {
  event.preventDefault();
  recall(event.key === "ArrowUp" ? -1 : 1);
 }
});

Parent.onKey(event => {
 if (event.key !== "Enter" && event.key !== "/") return;
 event.preventDefault();
 event.stopImmediatePropagation();
 focusInput(event.key === "/");
});

qs("#pad").innerHTML = html`${EMOJI.map(glyph => html`<button type="button" aria-label="${glyph}">${glyph}</button>`)}`;

Parent.on({
 init(data) {
  myId = data.myId || "";
  channels = data.channels || [];
  quick = data.quick || [];
  active = data.active || "";
  lines = data.lines || [];
  const open = data.open === true;
  qs("#full").classList.toggle("hidden", !open);
  qs("#mini").classList.toggle("hidden", open);
  draw();
  render();
  if (data.focus) takeFocus(data.focus === "command");
 },
 channels(data) {
  const next = data.active || active;
  const moved = next !== active;
  channels = data.channels || [];
  quick = data.quick || [];
  active = next;
  draw();
  if (moved) render();
 },
 say(data) {
  NativeChat.say(data.text, data.area);
 },
 line(data) {
  if (data.channels) channels = data.channels;
  if (data.line) append(data.line);
  drawBadges();
  drawMini();
 }
});
</script>
