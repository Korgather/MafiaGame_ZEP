<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>채팅</title>
		<style>
/*
 * 위젯 공통 디자인 시스템.
 *
 * 기존에는 위젯 11개가 각자 CSS를 처음부터 다시 썼다. 같은 의미의 색이
 * 파일마다 다른 값이었고(#484848 / #333333 / #3c3030 / #563d3d …
 * 총 26종), 타이머 글꼴 크기는 화면마다 20px·35px·18px로 제각각이었다.
 * 한 화면의 톤을 바꾸면 나머지 열 개가 어긋났다.
 *
 * 이 파일이 유일한 출처다. tools/build-widgets.js가 각 위젯 HTML의
 * <!--@theme--> 자리에 인라인한다. ZEP 위젯은 iframe이라 외부 CSS 링크의
 * 해석 기준을 신뢰할 수 없어서, 소스는 나누되 산출물은 자기완결로 만든다.
 */

/* ---------- 토큰 ---------- */
:root {
	/* 표면: 뒤로 갈수록 어두워진다 */
	--bg: #14100f;
	--surface: #201a19;
	--surface-2: #2d2523;
	--surface-3: #3b312e;
	--line: #4a3d39;

	/* 글자 */
	--ink: #f5efe9;
	--ink-2: #b9aaa2;
	--ink-3: #7d6e68;

	/* 진영 */
	--mafia: #e04b4b;
	--mafia-dim: #6d2424;
	--citizen: #57a8e0;
	--citizen-dim: #24475f;

	/* 상태 */
	--accent: #e0b355; /* 상호작용 가능·강조 */
	--ok: #5fbf7f;
	--warn: #e0b355;
	--danger: #e04b4b;
	--dead: #5a4a45;

	/* 간격: 4px 배수 */
	--s1: 4px;
	--s2: 8px;
	--s3: 12px;
	--s4: 16px;
	--s5: 24px;

	/* 타이포: 위젯 폭에 따라 늘어난다 */
	--t-xs: clamp(10px, 2.6vw, 12px);
	--t-sm: clamp(11px, 3vw, 13px);
	--t-md: clamp(13px, 3.5vw, 15px);
	--t-lg: clamp(15px, 4.2vw, 18px);
	--t-xl: clamp(19px, 5.5vw, 24px);
	--t-2xl: clamp(24px, 7vw, 34px);

	--r1: 6px;
	--r2: 10px;
	--r3: 14px;

	--shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
	--dur: 160ms;
	--ease: cubic-bezier(0.2, 0, 0.2, 1);
}

/* 애니메이션을 끈 사용자에게는 전환을 즉시 끝낸다 */
@media (prefers-reduced-motion: reduce) {
	:root {
		--dur: 1ms;
	}
	*,
	*::before,
	*::after {
		animation-duration: 1ms !important;
		animation-iteration-count: 1 !important;
		transition-duration: 1ms !important;
	}
}

/* ---------- 리셋 ---------- */
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

html,
body {
	width: 100%;
	height: 100%;
	overflow: hidden;
}

body {
	/*
	 * 웹폰트를 쓰지 않는다. 기존 대기실은 jsdelivr에서 폰트 2종을 받았는데,
	 * 폰트가 도착하기 전까지 목록이 다른 글꼴로 그려졌다가 튀었고(FOUT)
	 * CDN이 막힌 환경에서는 영영 오지 않았다. 시스템 한글 글꼴로 충분하다.
	 */
	font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
		"Malgun Gothic", "맑은 고딕", "Noto Sans KR", system-ui, sans-serif;
	font-size: var(--t-md);
	line-height: 1.45;
	color: var(--ink);
	background: transparent;
	-webkit-font-smoothing: antialiased;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}

/* ---------- 판 ---------- */
/*
 * 모든 위젯은 panel 하나로 시작한다. 기존에는 화면마다 배경 처리가 달라서
 * (이미지 / 반투명 검정 / 없음) 같은 게임인데 화면이 바뀔 때마다
 * 다른 앱처럼 보였다.
 */
.panel {
	display: flex;
	flex-direction: column;
	width: 100%;
	height: 100%;
	padding: var(--s3);
	gap: var(--s2);
	background: linear-gradient(160deg, var(--surface) 0%, var(--bg) 100%);
	border: 1px solid var(--line);
	border-radius: var(--r3);
	box-shadow: var(--shadow);
	overflow: hidden;
}

/* 단계별 분위기. 배경만 갈아끼우고 구조는 같다 */
.panel.night {
	background: linear-gradient(160deg, #1b2340 0%, #0d1020 100%);
}
.panel.day {
	background: linear-gradient(160deg, #40331b 0%, #1a1410 100%);
}
.panel.vote {
	background: linear-gradient(160deg, #2b2036 0%, #140f1a 100%);
}

/* ---------- 머리말 ---------- */
.hd {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--s2);
	flex: 0 0 auto;
}

.hd-title {
	display: flex;
	align-items: center;
	gap: var(--s2);
	min-width: 0;
	font-size: var(--t-lg);
	font-weight: 700;
	letter-spacing: -0.01em;
}

.hd-sub {
	font-size: var(--t-xs);
	color: var(--ink-3);
	white-space: nowrap;
}

/* ---------- 타이머 ---------- */
/*
 * 기존에는 4개 파일이 toHHMMSS를 각자 갖고 있었고 90초를 "00:01:30"으로
 * 표시했다. 시(時) 자리는 이 게임에서 영원히 00이다.
 * 여기서는 남은 초만 크게 보여주고, 링으로 진행률을 함께 그린다.
 */
.timer {
	position: relative;
	flex: 0 0 auto;
	display: grid;
	place-items: center;
	width: 44px;
	height: 44px;
	font-variant-numeric: tabular-nums;
	font-size: var(--t-lg);
	font-weight: 700;
	color: var(--ink);
}

.timer svg {
	position: absolute;
	inset: 0;
	transform: rotate(-90deg);
}

.timer circle {
	fill: none;
	stroke-width: 3;
	stroke-linecap: round;
}

.timer .track {
	stroke: var(--surface-3);
}

.timer .bar {
	stroke: var(--accent);
	transition: stroke-dashoffset 1s linear, stroke var(--dur) var(--ease);
}

/* 마지막 10초 */
.timer.urgent .bar {
	stroke: var(--danger);
}
.timer.urgent {
	color: var(--danger);
	animation: pulse 1s var(--ease) infinite;
}

@keyframes pulse {
	0%,
	100% {
		transform: scale(1);
	}
	50% {
		transform: scale(1.08);
	}
}

/* ---------- 본문 ---------- */
.body {
	flex: 1 1 auto;
	min-height: 0;
	display: flex;
	flex-direction: column;
	gap: var(--s2);
}

.scroll {
	overflow-y: auto;
	overscroll-behavior: contain;
	scrollbar-width: thin;
	scrollbar-color: var(--surface-3) transparent;
}

.scroll::-webkit-scrollbar {
	width: 6px;
}
.scroll::-webkit-scrollbar-thumb {
	background: var(--surface-3);
	border-radius: 99px;
}
.scroll::-webkit-scrollbar-track {
	background: transparent;
}

/* ---------- 버튼 ---------- */
/*
 * 기존 조작 요소는 전부 <div onclick>이었다. 키보드로 도달할 수 없고
 * 포커스 링도 없어서 마우스가 없으면 게임 자체가 불가능했다.
 * 위젯 HTML은 전부 <button>을 쓰고, 모양은 이 클래스가 준다.
 */
.btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--s1);
	min-height: 34px;
	padding: var(--s2) var(--s3);
	font: inherit;
	font-size: var(--t-sm);
	font-weight: 600;
	color: var(--ink);
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r1);
	cursor: pointer;
	transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
		transform var(--dur) var(--ease);
}

.btn:hover:not(:disabled) {
	background: var(--surface-3);
}

.btn:active:not(:disabled) {
	transform: scale(0.97);
}

.btn:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 2px;
}

.btn:disabled {
	cursor: default;
	opacity: 0.45;
}

.btn.primary {
	color: #14100f;
	background: var(--accent);
	border-color: var(--accent);
}
.btn.primary:hover:not(:disabled) {
	filter: brightness(1.1);
}

.btn.ok {
	color: #0e1a12;
	background: var(--ok);
	border-color: var(--ok);
}

.btn.danger {
	color: var(--ink);
	background: var(--mafia-dim);
	border-color: var(--mafia);
}

.btn.ghost {
	background: transparent;
}

/*
 * 기호 하나짜리 버튼. 채팅의 ☺·➤와 대기실의 📖이 같은 것을 쓴다.
 *
 * 채팅 섹션에 있던 것을 여기로 옮겼다. 대기실이 두 번째 사용처가 되는 순간
 * "채팅의 부품"이라는 자리가 거짓이 됐고, 그대로 두면 다음 사람이 채팅과
 * 무관한 화면에서 이 클래스를 찾지 못해 똑같은 것을 다시 만든다.
 *
 * 최소 크기를 .btn과 같은 34px로 맞춘다. 그러지 않으면 글자 크기만큼만
 * 커져서(27px) 손가락으로 누르기 어렵다 — 실제로 채팅의 보내기 버튼이
 * 그 크기였다. 44px(모바일 권장)까지 키우지 않는 이유는 채팅 입력줄이
 * 그만큼 세로를 더 먹기 때문이고, 이 화면의 다른 모든 버튼이 34px다.
 */
.icon-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	flex: 0 0 auto;
	min-width: 34px;
	min-height: 34px;
	padding: var(--s1) var(--s2);
	font: inherit;
	font-size: var(--t-md);
	color: var(--ink-2);
	background: transparent;
	border: none;
	cursor: pointer;
}
.icon-btn:hover {
	color: var(--ink);
}
.icon-btn:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -2px;
}

/* ---------- 참가자 타일 ---------- */
/*
 * 밤 지목·투표가 같은 격자를 쓴다. 예전에는 밤은 4열 정사각 타일,
 * 투표는 3열 30px 막대로 서로 다른 화면이었다. 같은 동작(사람 하나를
 * 고른다)이면 같은 모양이어야 무엇을 누르는지 배우는 비용이 한 번이다.
 */
.grid {
	display: grid;
	grid-template-columns: repeat(4, 1fr);
	gap: var(--s2);
	align-content: start;
}

@media (max-width: 340px) {
	.grid {
		grid-template-columns: repeat(3, 1fr);
	}
}

.tile {
	position: relative;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 2px;
	aspect-ratio: 1;
	padding: var(--s1);
	font: inherit;
	font-size: var(--t-sm);
	font-weight: 700;
	color: var(--ink);
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r2);
	cursor: pointer;
	transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
		transform var(--dur) var(--ease);
}

.tile:hover:not(:disabled) {
	background: var(--surface-3);
	border-color: var(--ink-3);
}

.tile:active:not(:disabled) {
	transform: scale(0.95);
}

.tile:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 2px;
}

.tile .num {
	font-size: var(--t-lg);
	line-height: 1.1;
}

.tile .cap {
	font-size: var(--t-xs);
	font-weight: 500;
	color: var(--ink-3);
}

/* 나 */
.tile.me {
	border-color: var(--ok);
}
.tile.me .cap {
	color: var(--ok);
}

/* 죽은 사람 */
.tile:disabled,
.tile.dead {
	cursor: default;
	color: var(--dead);
	background: var(--surface);
	border-color: var(--surface-2);
}
.tile.dead .cap {
	color: var(--dead);
}

/* 지목·투표 완료 */
.tile.picked {
	background: var(--mafia-dim);
	border-color: var(--mafia);
	box-shadow: 0 0 0 2px var(--mafia) inset;
}

/* 같은 팀(마피아 채팅) */
.tile.ally {
	border-color: var(--mafia);
	background: color-mix(in srgb, var(--mafia-dim) 60%, var(--surface-2));
}

/* 타일 위 배지: 상태를 글자로도 남긴다 (색만으로 구분하지 않기 위해) */
.tile .badge {
	position: absolute;
	top: 2px;
	right: 3px;
	font-size: var(--t-xs);
	line-height: 1;
}

/* 득표수 */
.tile .tally {
	position: absolute;
	bottom: 2px;
	left: 0;
	right: 0;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--accent);
}

/* ---------- 칩 ---------- */
.chip {
	display: inline-flex;
	align-items: center;
	gap: var(--s1);
	padding: 2px var(--s2);
	font-size: var(--t-xs);
	font-weight: 700;
	white-space: nowrap;
	border: 1px solid var(--line);
	border-radius: 99px;
	background: var(--surface-2);
}

.chip.mafia {
	color: var(--mafia);
	border-color: var(--mafia);
	background: var(--mafia-dim);
}
.chip.citizen {
	color: var(--citizen);
	border-color: var(--citizen);
	background: var(--citizen-dim);
}
.chip.dead {
	color: var(--ink-3);
}

/* ---------- 안내 문구 ---------- */
.note {
	flex: 0 0 auto;
	font-size: var(--t-sm);
	color: var(--ink-2);
	text-align: center;
	word-break: keep-all;
}

.note strong {
	color: var(--ink);
}

/* 상태가 바뀔 때 문구가 갈아끼워지는 것을 눈이 따라가도록 */
.note.flash {
	animation: flash var(--dur) var(--ease);
}

@keyframes flash {
	from {
		opacity: 0;
		transform: translateY(-4px);
	}
}

/* ---------- 채팅 ---------- */
/*
 * 채팅은 접속해 있는 내내 떠 있는 유일한 위젯이라 다른 화면과 규칙이 다르다.
 *
 * 1. 두 가지 모습으로 산다 — 펼친 창(.chat)과 접힌 막대(.chat-mini).
 *    위젯은 iframe이라 투명해도 그 자리의 클릭을 먹는다. 그래서 접기는
 *    CSS로 내용을 숨기는 것이 아니라 더 작은 위젯으로 다시 여는 것이고
 *    (WidgetSize.CHAT_BAR), 두 모습이 한 파일 안에 함께 있어야 한다.
 *
 * 2. .panel을 쓰지 않는다. panel은 여닫히는 화면의 문법(머리말·본문·안내)인데
 *    채팅은 늘 떠 있는 도구다. 여백을 panel만큼 주면 세로 320px 중 실제로
 *    글이 보이는 자리가 절반으로 줄어든다.
 */
.chat {
	display: flex;
	flex-direction: column;
	width: 100%;
	height: 100%;
	min-height: 0;
	background: linear-gradient(160deg, var(--surface) 0%, var(--bg) 100%);
	border: 1px solid var(--line);
	border-radius: var(--r2);
	box-shadow: var(--shadow);
	overflow: hidden;
}

/* 탭 줄 */
.chat-head {
	display: flex;
	align-items: stretch;
	flex: 0 0 auto;
	border-bottom: 1px solid var(--line);
}

.chat-tabs {
	display: flex;
	gap: 2px;
	flex: 1 1 auto;
	min-width: 0;
	padding: 2px 2px 0;
	overflow-x: auto;
	scrollbar-width: none;
}
.chat-tabs::-webkit-scrollbar {
	display: none;
}

.tab {
	display: inline-flex;
	align-items: center;
	gap: var(--s1);
	flex: 0 0 auto;
	padding: var(--s1) var(--s2);
	font: inherit;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--ink-3);
	background: transparent;
	border: none;
	border-bottom: 2px solid transparent;
	border-radius: var(--r1) var(--r1) 0 0;
	white-space: nowrap;
	cursor: pointer;
	transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
}

.tab:hover {
	color: var(--ink-2);
	background: var(--surface-2);
}

.tab:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -2px;
}

.tab[aria-selected="true"] {
	color: var(--ink);
	background: var(--surface-2);
	border-bottom-color: var(--accent);
}

/* 읽기만 되는 탭. 색이 아니라 글리프로 알린다 */
.tab.ro::after {
	content: "🔒";
	font-size: 9px;
}

/* 미확인 개수 */
.badge-n {
	min-width: 15px;
	padding: 0 4px;
	font-size: 9px;
	font-weight: 700;
	line-height: 15px;
	text-align: center;
	color: #14100f;
	background: var(--accent);
	border-radius: 99px;
}

/*
 * 접기 버튼.
 *
 * 전에는 글리프 ▾ 하나가 투명한 배경 위에 --ink-3(흐린 회색)으로 떠 있었다.
 * 데스크톱에서는 겨우 읽혔지만 모바일에서는 "여기를 누를 수 있다"는 신호가
 * 전혀 아니었다 — 탭 줄 오른쪽 끝의 장식으로 보였다.
 *
 * 그래서 셋을 바꾼다.
 *   1. 글자를 붙인다("접기"). 글리프만으로는 무엇이 일어날지 알 수 없다.
 *   2. 테두리와 배경을 준다. 눌리는 것과 아닌 것이 색으로 갈린다.
 *   3. 손가락이 닿을 크기를 준다(min-height 40px, min-width 44px).
 *
 * 이 높이가 머리말 전체의 높이가 된다(.chat-head가 stretch다) — 위아래
 * 여백까지 더해 45px. 세로 320px 중 17px쯤을 더 쓰는 셈인데, 진짜 과녁은
 * 이 버튼이 아니라 머리말 한 줄 전체이고(chat.html의 .chat-head 리스너)
 * 그 줄이 45px면 손가락 기준(44px)을 넘긴다. 누를 수 없는 버튼은 없는 것과
 * 같으므로 이쪽이 남는 장사다.
 */
.chat-fold {
	display: inline-flex;
	align-items: center;
	gap: var(--s1);
	flex: 0 0 auto;
	min-width: 44px;
	min-height: 40px;
	margin: 2px var(--s1) 2px 0;
	padding: 0 var(--s2);
	font: inherit;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--ink-2);
	background: var(--surface-2);
	border: 1px solid var(--line);

	 * SecurityError가 나므로 postMessage 말고는 길이 없다.
	 *
	 * 판정은 로드 때 한 번만 하고, 안 되면 조용히 기능을 접는다 — 여기서
	 * 예외가 새어 나가면 위젯 스크립트 전체가 로드에 실패한다.
	 */
	const win = (function () {
		try {
			// 존재 확인만으로는 부족하다. 실제로 읽어야 교차 출처가 드러난다
			void window.parent.document.readyState;
			return window.parent;
		} catch (error) {
			return null;
		}
	})();

	/*
	 * 프레임보다 오래 살아야 하는 것을 두는 자리.
	 *
	 * 채팅창 접기/펴기는 CSS가 아니라 크기가 다른 위젯으로 다시 여는
	 * 것이라(Widgets.ts의 openChat) 그때마다 문서가 통째로 새로 만들어진다.
	 * 입력 기록 같은 것을 위젯 안에만 두면 접을 때마다 지워진다.
	 *
	 * 교차 출처면 그냥 빈 객체다 — 기능이 사라지는 게 아니라 수명만 짧아진다.
	 */
	const store = (function () {
		if (!win) return {};
		if (!win.__mafiaWidget) win.__mafiaWidget = {};
		return win.__mafiaWidget;
	})();

	// ────────────────────────────────────────────── 1. 게임 서버에게

	/** 게임 서버(widget.onMessage)로 보낸다 */
	function send(message) {
		window.parent.postMessage(message, "*");
	}

	/**
	 * 서버 메시지 구독. type별 핸들러 표를 받는다.
	 *
	 * 기존 위젯은 전부 addEventListener("message") + switch였고, morning/night는
	 * type을 아예 보지 않아 어떤 메시지가 와도 타이머를 다시 시작했다.
	 */
	function on(handlers) {
		window.addEventListener("message", function (event) {
			const data = event && event.data;
			if (!data) return;
			// 크기는 메시지 종류와 상관없이 실려 온다. 위젯이 "부르는 것을 잊는"
			// 자리를 없애기 위해 핸들러보다 먼저, 표에 없는 종류에도 적용한다.
			if (data.layout) applyLayout(data.layout);
			const handler = handlers[data.type];
			if (handler) handler(data);
		});
	}

	// ────────────────────────────────────────────── 2. ZEP 클라이언트에게

	/**
	 * 위젯이 차지할 상자를 ZEP 클라이언트에게 알린다.
	 * 서버가 아니라 클라이언트가 읽고 처리하는 메시지다.
	 *
	 * 기존 구조의 문제
	 * ----------------
	 * 여기서 기기를 보고 크기를 스스로 정했다(rearrange). 그런데 세로는
	 * 아무도 정하지 않아 모바일에서도 데스크톱 픽셀이 그대로 남았고,
	 * 이 함수를 부를지 말지는 위젯 각자의 자유라 채팅과 직업 카드는
	 * 아예 부르지 않았다 — 모바일 보정이 통째로 빠진 화면이 둘 있었다.
	 *
	 * 지금은 서버(Widgets.ts의 layoutOf)가 한 곳에서 정해 payload에 실어
	 * 보내고, 여기서는 받은 대로 넘기기만 한다. 기기 판정도 서버가 한다
	 * (player.isMobile / isTablet) — window.screen.width로 태블릿을
	 * 넘겨짚을 이유가 없어졌다.
	 */
	function applyLayout(layout) {
		const message = {
			type: "WidgetRearrange",
			anchor: layout.anchor,
			width: layout.width,
			height: layout.height,
		};
		// 상단바 보정은 위쪽에 붙는 위젯에만 실려 온다
		if (layout.top) message.top = layout.top;
		send(message);
	}

	// ────────────────────────────────────────────── 3. 부모 문서의 키 입력

	/** 남이 글을 쓰고 있는 칸인가. ZEP 기본 채팅 입력창이 여기 걸린다 */
	function editable(el) {
		if (!el || !el.tagName) return false;
		const tag = String(el.tagName).toUpperCase();
		if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
		return el.isContentEditable === true;
	}

	/**
	 * 게임 화면(캔버스)에 포커스가 있는 동안 눌린 키를 받는다.
	 *
	 * 위젯 안에 포커스가 있을 때는 여기로 오지 않는다 — 키 이벤트는 프레임
	 * 경계를 넘지 않기 때문이다. 그래서 "게임 중일 때"와 "채팅 치는 중일 때"를
	 * 따로 판정할 필요가 없다. 브라우저가 이미 나눠준다.
	 *
	 * 같은 이유로 "채팅 입력 중 이동·단축키 비활성화"도 따로 할 일이 없다.
	 * 입력창에 포커스가 있으면 WASD는 애초에 ZEP 캔버스에 도달하지 않는다.
	 *
	 * 돌려주는 함수를 부르면 구독이 끊긴다. 프레임이 사라질 때도 자동으로 끊는다.
	 */
	function onKey(handler) {
		if (!win) return function () {};

		function off() {
			win.removeEventListener("keydown", listener, true);
			window.removeEventListener("pagehide", off);
		}

		function listener(event) {
			// 접었다 펴는 순간 옛 프레임과 새 프레임이 잠깐 함께 산다.
			// 죽은 쪽이 반응하면 이미 사라진 입력창에 포커스를 주게 된다.
			const frame = window.frameElement;
			if (frame && frame.isConnected === false) {
				off();
				return;
			}
			// 부모에는 ZEP 기본 채팅 입력창이 그대로 남아 있다(0.16.5에는 숨기는
			// API가 없다). 남이 글을 쓰고 있는 칸은 건드리지 않는다.
			if (editable(event.target)) return;
			// 조합키는 브라우저와 ZEP의 몫이다
			if (event.altKey || event.ctrlKey || event.metaKey) return;
			handler(event);
		}

		// 부모 window의 캡처 단계. 이 프레임에서 닿을 수 있는 가장 이른 지점이다.
		// 그래도 ZEP이 먼저 등록한 리스너보다 앞설 수는 없다 — 같은 대상·같은
		// 단계에서는 등록 순서가 곧 실행 순서고, 부모 문서가 우리보다 먼저 뜬다.
		win.addEventListener("keydown", listener, true);
		// 위젯이 파괴되면 부모에는 리스너만 남는다. 반드시 같이 떼야 한다
		window.addEventListener("pagehide", off);
		return off;
	}

	/**
	 * 이 프레임으로 포커스를 가져온다.
	 *
	 * 부모 문서에서 키를 받아 들어오는 길에서는 포커스가 아직 캔버스에 있다.
	 * 안쪽 엘리먼트에 focus()만 하면 되는 경우가 대부분이지만, 프레임 자체를
	 * 먼저 깨워두는 편이 확실하다.
	 */
	function grabFocus() {
		window.focus();
	}

	return {
		send,
		on,
		onKey,
		grabFocus,
		store,
		/** 게임 화면의 키 입력을 받을 수 있는가 (부모와 같은 출처인가) */
		canReadKeys: win !== null,
	};
})();

</script>
		<script>
			/** 위젯이 들고 있는 줄 수 상한. 서버 기록(120줄)보다 넉넉하다 */
			const MAX_LINES = 200;
			const MAX_TEXT = 200;
			/* 스크롤이 이만큼 안쪽이면 "바닥을 보고 있다"로 친다 */
			const BOTTOM_SLACK = 24;
			/** ↑로 되짚을 수 있는 이전 입력 수 */
			const MAX_SENT = 30;

			/*
			 * 이모지는 고정 목록이다. 스티커·커스텀 이모지를 붙일 자리이기도
			 * 하다 — 서버가 목록을 보내주도록 바꾸면 payload 한 필드로 끝난다.
			 */
			const EMOJI = [
				"👍",
				"👏",
				"🙏",
				"❤️",
				"😀",
				"😂",
				"😅",
				"😭",
				"😱",
				"😡",
				"🤔",
				"😎",
				"🔪",
				"👻",
				"🕵️",
				"🚨",
			];

			let lines = [];
			let channels = [];
			let quick = [];
			let active = "";
			let myId = "";

			/*
			 * 보낸 글 기록(↑/↓). 이 문서보다 오래 살아야 한다.
			 *
			 * 채팅 접기/펴기는 CSS가 아니라 크기가 다른 위젯으로 다시 여는
			 * 것이라(Widgets.ts의 openChat) 그때마다 문서가 통째로 새로 만들어진다.
			 * 여기 두면 한 번 접을 때마다 기록이 비어서, 방금 친 말도 못 되짚는다.
			 * 부모 창에 두면 프레임이 몇 번 갈리든 남는다.
			 */
			const sent = Parent.store.chatSent || (Parent.store.chatSent = []);
			let sentAt = sent.length;

			// ────────────────────────────────────────────────── 그리기

			/** epoch ms를 HH:MM으로. 서버는 UTC ms만 보내고 형식은 여기서 정한다 */
			function clock(at) {
				const d = new Date(Number(at) || 0);
				return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
			}

			function viewOf(id) {
				for (const view of channels) {
					if (view.id === id) return view;
				}
				return null;
			}

			function bubble(line) {
				const when = html`<span class="when">${clock(line.at)}</span>`;

				// 사람이 친 말이 아니면 가운데 한 줄로 눕힌다
				if (line.kind !== "USER") {
					const cls = line.kind === "EVENT" ? "evt" : line.kind === "NOTICE" ? "ntc" : "sys";
					return html`<div class="msg ${cls}">
						<div class="txt">${when} ${line.text}</div>
					</div>`;
				}

				// 내 말은 이름을 다시 읽을 필요가 없다. 시각만 남긴다
				const mine = line.senderId !== "" && line.senderId === myId;
				let who = when;
				if (!mine) {
					const chip = line.role
						? html`<span class="chip ${line.team === "mafia" ? "mafia" : "citizen"}"
								>${line.role}</span
							>`
						: "";
					const name = line.num > 0 ? line.num + "번 " + line.name : line.name;
					who = html`${chip}<span class="ellip">${name}</span>${when}`;
				}

				return html`<div class="msg${mine ? " mine" : ""}">
					<div class="who">${who}</div>
					<div class="txt">${line.text}</div>
				</div>`;
			}

			function nearBottom(el) {
				return el.scrollHeight - el.scrollTop - el.clientHeight < BOTTOM_SLACK;
			}

			function jump(show) {
				qs("#jump").classList.toggle("hidden", !show);
			}

			/** 활성 탭의 줄만 다시 그린다. 탭 전환·재접속이 지나는 길 */
			function render() {
				const el = qs("#log");
				el.innerHTML = html`${lines.filter(line => line.channel === active).map(bubble)}`;
				scrollToEnd(el);
				jump(false);
			}

			function append(line) {
				lines.push(line);
				if (lines.length > MAX_LINES) lines.splice(0, lines.length - MAX_LINES);
				if (line.channel !== active) return;

				const el = qs("#log");
				// 붙이기 *전에* 재야 한다. 붙인 뒤에 재면 방금 늘어난 높이 때문에
				// 늘 "위로 올라가 있음"이 되어 자동 스크롤이 영영 멈춘다.
				// 기존 roleAction.html의 밤 채팅이 정확히 이 순서로 어긋나 있었다.
				const follow = nearBottom(el);
				el.insertAdjacentHTML("beforeend", bubble(line));
				while (el.childElementCount > MAX_LINES) el.removeChild(el.firstElementChild);

				if (follow) scrollToEnd(el);
				// 읽던 자리를 뺏지 않는다. 새 줄이 왔다는 것만 알린다
				jump(!follow);
			}

			function badgeText(unread) {
				return unread > 99 ? "99+" : String(unread);
			}

			function tabHtml(view) {
				const badge = view.unread > 0 ? html`<span class="badge-n">${badgeText(view.unread)}</span>` : "";
				return html`<button
					type="button"
					role="tab"
					class="tab${view.write ? "" : " ro"}"
					aria-selected="${view.id === active}"
					data-id="${view.id}"
					aria-label="${view.label + (view.write ? "" : ", 읽기 전용")}"
				>
					<span aria-hidden="true">${view.glyph}</span><span>${view.label}</span>${badge}
				</button>`;
			}

			function drawTabs() {
				qs("#tabs").innerHTML = html`${channels.map(tabHtml)}`;

				const view = viewOf(active);
				/*
				 * 입력창은 잠그지 않는다. 명령어(/도움말)는 채널 권한과 무관하게
				 * 서버가 받아주고, 밤의 시민처럼 쓸 수 있는 탭이 하나도 없는
				 * 상황이 정상이기 때문이다. 잠그면 그 사람은 명령어를 영영 쓸 수
				 * 없다. 대신 안내 문구와 탭의 자물쇠로 지금 상태를 알린다.
				 *
				 * 문구는 서버가 통째로 준다. 여기서 지어내면 밤·사망·협박이
				 * 모두 "지금은 읽기만 됩니다" 한 줄로 뭉개진다 — 이유를 아는
				 * 곳은 권한 표 하나뿐인데 그것이 서버에 있다.
				 */
				qs("#input").placeholder = view ? view.placeholder : "";
			}

			/**
			 * 미확인 수만 갈아끼운다.
			 *
			 * 줄이 하나 올 때마다 drawTabs()를 부르면 탭 막대의 innerHTML이
			 * 통째로 새로 만들어진다. 탭에 포커스를 두고 키보드로 넘기던 중이면
			 * 포커스가 날아가고, 탭이 많아 가로 스크롤 중이면 스크롤도 처음으로
			 * 돌아간다. 실제로 바뀌는 것은 숫자 하나뿐이다.
			 */
			function drawBadges() {
				for (const tab of qsa(".tab", qs("#tabs"))) {
					const view = viewOf(tab.dataset.id);
					if (!view) continue;
					let badge = qs(".badge-n", tab);
					if (view.unread <= 0) {
						if (badge) badge.remove();
						continue;
					}
					if (!badge) {
						tab.insertAdjacentHTML("beforeend", '<span class="badge-n"></span>');
						badge = qs(".badge-n", tab);
					}
					badge.textContent = badgeText(view.unread);
				}
			}

			function drawQuick() {
				const view = viewOf(active);
				const usable = view !== null && view.write && quick.length > 0;
				qs("#quick").classList.toggle("hidden", !usable);
				if (!usable) return;
				qs("#quick").innerHTML = html`${quick.map(
					text => html`<button type="button">${text}</button>`
				)}`;
			}

			/*
			 * 접힌 바에 뭐라고 쓸지.
			 *
			 * Enter로 열린다는 것은 아무 데도 안 적혀 있으면 아무도 모른다.
			 * 그렇다고 항상 적을 수는 없다 — 부모와 출처가 다르면 Enter는
			 * 정말로 안 먹고, 안 되는 조작을 적어두는 것이 안 적는 것보다 나쁘다.
			 */
			const MINI_LABEL = Parent.canReadKeys ? "채팅 (Enter)" : "채팅";

			function drawMini() {
				let total = 0;
				for (const view of channels) total += view.unread;
				const active_ = viewOf(active);

				qs("#miniGlyph").textContent = active_ ? active_.glyph : "💬";
				qs("#miniText").textContent = total > 0 ? "새 메시지" : MINI_LABEL;
				qs("#miniBadge").textContent = badgeText(total);
				qs("#miniBadge").classList.toggle("hidden", total === 0);
				qs("#mini").classList.toggle("alert", total > 0);
			}

			function draw() {
				drawTabs();
				drawQuick();
				drawMini();
			}

			// ────────────────────────────────────────────────── 보낸 글 기록

			function remember(text) {
				// 같은 말을 두 번 이어 보냈다고 기록이 두 칸이 될 이유는 없다
				if (sent[sent.length - 1] !== text) sent.push(text);
				if (sent.length > MAX_SENT) sent.shift();
				resetRecall();
			}

			function resetRecall() {
				sentAt = sent.length;
			}

			/** step은 -1이 과거, +1이 최근. 끝까지 내려오면 빈 칸으로 돌아온다 */
			function recall(step) {
				const at = Math.max(0, Math.min(sent.length, sentAt + step));
				if (at === sentAt) return;
				sentAt = at;
				const input = qs("#input");
				input.value = at === sent.length ? "" : sent[at];
				// 커서를 끝으로. 안 하면 맨 앞에 놓여서 이어 쓰기가 어색하다
				input.setSelectionRange(input.value.length, input.value.length);
			}

			// ────────────────────────────────────────────────── 보내기

			function submit(text) {
				const trimmed = String(text == null ? "" : text).trim();
				if (trimmed === "") return false;
				const view = viewOf(active);
				// 명령어는 어느 탭에서든 통한다. 서버가 권한 검사보다 먼저 본다
				if (trimmed.charAt(0) !== "/" && (view === null || !view.write)) return false;
				Parent.send({ type: "send", channel: active, text: trimmed });
				remember(trimmed);
				return true;
			}

			/**
			 * 보내지 못한 글은 지우지 않는다.
			 *
			 * 읽기 전용 탭에서 Enter를 눌렀을 때 쓰던 문장이 조용히 사라지면
			 * 다시 칠 방법이 없다. 남겨두면 탭을 옮겨 그대로 보낼 수 있다.
			 */
			function submitInput() {
				if (!submit(qs("#input").value)) return;
				qs("#input").value = "";
				qs("#pad").classList.add("hidden");
			}

			// ────────────────────────────────────────────────── 채널 고르기

			function selectChannel(id) {
				if (id === active) return;

				// 줄은 이미 전부 여기 있으므로 서버를 기다릴 이유가 없다.
				// 기다리면 탭을 눌렀는데 아무 일도 안 일어난 것처럼 보인다.
				active = id;
				const view = viewOf(active);
				if (view) view.unread = 0;
				draw();
				render();
				Parent.send({ type: "channel", channel: active });
			}

			/** Tab으로 넘기기. channels는 서버가 정한 순서 그대로다 */
			function cycleChannel(step) {
				if (channels.length < 2) return;
				let at = 0;
				for (let i = 0; i < channels.length; i++) {
					if (channels[i].id === active) at = i;
				}
				selectChannel(channels[(at + step + channels.length) % channels.length].id);
			}

			// ────────────────────────────────────────────────── 조작

			qs("#tabs").addEventListener("click", event => {
				const el = event.target.closest(".tab");
				if (el) selectChannel(el.dataset.id);
			});

			// 접기는 더 작은 위젯으로 다시 여는 것이다. 서버가 다시 열어준다.
			//
			// #fold가 아니라 머리말 전체에 건다. 채널을 고르는 탭만 빼면 이 줄에서
			// 할 일은 접는 것뿐이고, 탭 사이의 빈 자리는 원래 아무 일도 하지 않던
			// 곳이라 잃는 것이 없다. 손가락에게는 40px짜리 버튼 하나보다
			// 머리말 한 줄 전체가 훨씬 큰 과녁이다.
			qs("#chatHead").addEventListener("click", event => {
				if (event.target.closest(".tab")) return;
				Parent.send({ type: "toggle", open: false });
			});

			qs("#mini").addEventListener("click", () => {
				Parent.send({ type: "toggle", open: true });
			});

			qs("#jump").addEventListener("click", () => {
				scrollToEnd(qs("#log"));
				jump(false);
			});

			qs("#log").addEventListener("scroll", () => {
				if (nearBottom(qs("#log"))) jump(false);
			});

			qs("#emoji").addEventListener("click", () => {
				qs("#pad").classList.toggle("hidden");
			});

			qs("#pad").addEventListener("click", event => {
				if (event.target.tagName !== "BUTTON") return;
				const input = qs("#input");
				input.value = (input.value + event.target.textContent).slice(0, MAX_TEXT);
				qs("#pad").classList.add("hidden");
				input.focus();
			});

			qs("#quick").addEventListener("click", event => {
				if (event.target.tagName !== "BUTTON") return;
				submit(event.target.textContent);
			});

			qs("#submit").addEventListener("click", submitInput);

			// ────────────────────────────────────────────────── 키보드

			/**
			 * 입력창으로 포커스를 옮긴다. 접혀 있으면 먼저 펴야 한다.
			 *
			 * 펴기는 위젯을 다시 여는 것이라 이 문서가 그 자리에서 사라진다.
			 * 그래서 "펴고 나서 포커스"를 여기서 이어 할 수 없다 — 무엇에
			 * 포커스를 줄지 서버에 함께 알려주고, 새로 뜬 문서가 init에서 받는다.
			 */
			function focusInput(slash) {
				if (qs("#full").classList.contains("hidden")) {
					Parent.send({ type: "toggle", open: true, focus: slash ? "command" : "input" });
					return;
				}
				takeFocus(slash);
			}

			function takeFocus(slash) {
				// 게임 화면에서 들어온 길에서는 포커스가 아직 캔버스에 있다
				Parent.grabFocus();
				const input = qs("#input");
				// /는 명령어의 첫 글자다. 넣어두면 바로 이어 칠 수 있다
				if (slash && input.value === "") input.value = "/";
				input.focus();
				input.setSelectionRange(input.value.length, input.value.length);
			}

			qs("#input").addEventListener("keydown", event => {
				const input = qs("#input");

				if (event.key === "Enter") {
					submitInput();
					return;
				}

				if (event.key === "Escape") {
					// 두 걸음이다. 쓰던 글을 먼저 비우고, 빈 칸에서 한 번 더 누르면
					// 게임으로 돌아간다. 한 걸음이면 오타를 지우려다 창을 닫는다
					if (input.value !== "") {
						input.value = "";
						resetRecall();
						return;
					}
					qs("#pad").classList.add("hidden");
					input.blur();
					return;
				}

				if (event.key === "Tab") {
					// 위젯 안에는 Tab으로 갈 만한 곳이 몇 개 없다. 채널 전환이
					// 훨씬 쓸모 있다. 밖으로 나가는 길은 Escape가 맡는다
					event.preventDefault();
					cycleChannel(event.shiftKey ? -1 : 1);
					return;
				}

				if (event.key === "ArrowUp" || event.key === "ArrowDown") {
					// 기본 동작은 커서를 글 끝으로 보내는 것이다. 되짚기와 겹친다
					event.preventDefault();
					recall(event.key === "ArrowUp" ? -1 : 1);
				}
			});

			/*
			 * 게임 화면(캔버스)에 포커스가 있는 동안 눌린 키.
			 *
			 * 위젯 안에서 누른 키는 여기로 오지 않는다 — 키 이벤트는 프레임
			 * 경계를 넘지 않기 때문이다. 그래서 "지금 채팅을 치는 중인가"를 따로
			 * 들고 있을 필요가 없고, 치는 동안 이동·단축키를 꺼줄 일도 없다.
			 * 입력창에 친 WASD는 애초에 ZEP 캔버스에 닿지 않는다.
			 *
			 * 부모와 출처가 다르면 이 구독은 조용히 없던 일이 된다(bridge.js).
			 * 그때는 채팅창을 눌러서 여는 지금까지의 길이 그대로 남는다.
			 */
			Parent.onKey(event => {
				if (event.key !== "Enter" && event.key !== "/") return;
				// ZEP 기본 채팅도 Enter로 열린다. 둘 다 열리면 지금 어느 쪽에
				// 쓰고 있는지 알 수 없다. 여기서 끊어 하나만 열리게 한다
				event.preventDefault();
				event.stopImmediatePropagation();
				focusInput(event.key === "/");
			});

			qs("#pad").innerHTML = html`${EMOJI.map(
				glyph => html`<button type="button" aria-label="${glyph}">${glyph}</button>`
			)}`;

			// ────────────────────────────────────────────────── 서버

			Parent.on({
				init(data) {
					myId = data.myId || "";
					channels = data.channels || [];
					quick = data.quick || [];
					active = data.active || "";
					lines = data.lines || [];

					const open = data.open === true;
					qs("#full").classList.toggle("hidden", !open);
					qs("#mini").classList.toggle("hidden", open);

					draw();
					render();

					// 게임 화면에서 Enter로 펴고 들어온 경우. 앞 문서가 남긴
					// 의도를 이어받는 곳은 여기 하나뿐이다
					if (data.focus) takeFocus(data.focus === "command");
				},

				/*
				 * 권한만 바뀐 것이다 (단계 전환·사망·입퇴장). 다시 그리지 않는
				 * 이유는 읽던 자리와 입력하던 글자를 지키기 위해서다 —
				 * 활성 탭이 실제로 바뀌었을 때만 기록을 갈아끼운다.
				 */
				channels(data) {
					const next = data.active || active;
					const moved = next !== active;
					channels = data.channels || [];
					quick = data.quick || [];
					active = next;
					draw();
					if (moved) render();
				},

				line(data) {
					if (data.channels) channels = data.channels;
					if (data.line) append(data.line);
					drawBadges();
					drawMini();
				},
			});
		</script>
	</body>
</html>
