<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>찬반 투표</title>
		<style>
:root {		--bg: #14100f;	--surface: #201a19;	--surface-2: #2d2523;	--surface-3: #3b312e;	--line: #4a3d39;		--ink: #f5efe9;	--ink-2: #b9aaa2;	--ink-3: #7d6e68;		--mafia: #e04b4b;	--mafia-dim: #6d2424;	--citizen: #57a8e0;	--citizen-dim: #24475f;		--accent: #e0b355; 	--ok: #5fbf7f;	--warn: #e0b355;	--danger: #e04b4b;	--dead: #5a4a45;		--s1: 4px;	--s2: 8px;	--s3: 12px;	--s4: 16px;	--s5: 24px;		--t-xs: clamp(10px, 2.6vw, 12px);	--t-sm: clamp(11px, 3vw, 13px);	--t-md: clamp(13px, 3.5vw, 15px);	--t-lg: clamp(15px, 4.2vw, 18px);	--t-xl: clamp(19px, 5.5vw, 24px);	--t-2xl: clamp(24px, 7vw, 34px);	--r1: 6px;	--r2: 10px;	--r3: 14px;	--shadow: 0 4px 16px rgba(0, 0, 0, 0.45);	--dur: 160ms;	--ease: cubic-bezier(0.2, 0, 0.2, 1);}@media (prefers-reduced-motion: reduce) {	:root {		--dur: 1ms;	}	*,	*::before,	*::after {		animation-duration: 1ms !important;		animation-iteration-count: 1 !important;		transition-duration: 1ms !important;	}}* {	margin: 0;	padding: 0;	box-sizing: border-box;}html,body {	width: 100%;	height: 100%;	overflow: hidden;}body {		font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",		"Malgun Gothic", "맑은 고딕", "Noto Sans KR", system-ui, sans-serif;	font-size: var(--t-md);	line-height: 1.45;	color: var(--ink);	background: transparent;	-webkit-font-smoothing: antialiased;	-webkit-user-select: none;	user-select: none;	-webkit-tap-highlight-color: transparent;}.panel {	display: flex;	flex-direction: column;	width: 100%;	height: 100%;	padding: var(--s3);	gap: var(--s2);	background: linear-gradient(160deg, var(--surface) 0%, var(--bg) 100%);	border: 1px solid var(--line);	border-radius: var(--r3);	box-shadow: var(--shadow);	overflow: hidden;}.panel.night {	background: linear-gradient(160deg, #1b2340 0%, #0d1020 100%);}.panel.day {	background: linear-gradient(160deg, #40331b 0%, #1a1410 100%);}.panel.vote {	background: linear-gradient(160deg, #2b2036 0%, #140f1a 100%);}.hd {	display: flex;	align-items: center;	justify-content: space-between;	gap: var(--s2);	flex: 0 0 auto;}.hd-title {	display: flex;	align-items: center;	gap: var(--s2);	min-width: 0;	font-size: var(--t-lg);	font-weight: 700;	letter-spacing: -0.01em;}.hd-sub {	font-size: var(--t-xs);	color: var(--ink-3);	white-space: nowrap;}.timer {	position: relative;	flex: 0 0 auto;	display: grid;	place-items: center;	width: 44px;	height: 44px;	font-variant-numeric: tabular-nums;	font-size: var(--t-lg);	font-weight: 700;	color: var(--ink);}.timer svg {	position: absolute;	inset: 0;	transform: rotate(-90deg);}.timer circle {	fill: none;	stroke-width: 3;	stroke-linecap: round;}.timer .track {	stroke: var(--surface-3);}.timer .bar {	stroke: var(--accent);	transition: stroke-dashoffset 1s linear, stroke var(--dur) var(--ease);}.timer.urgent .bar {	stroke: var(--danger);}.timer.urgent {	color: var(--danger);	animation: pulse 1s var(--ease) infinite;}.timer.critical {	animation: pulse 420ms var(--ease) infinite;}@keyframes pulse {	0%,	100% {		transform: scale(1);	}	50% {		transform: scale(1.08);	}}.progress {	flex: 0 0 auto;	height: 4px;	border-radius: 99px;	background: var(--surface-2);	overflow: hidden;}.progress i {	display: block;	height: 100%;	width: 0;	background: var(--accent);	transition: width var(--dur) var(--ease);}.body {	flex: 1 1 auto;	min-height: 0;	display: flex;	flex-direction: column;	gap: var(--s2);}.scroll {	overflow-y: auto;	overscroll-behavior: contain;	scrollbar-width: thin;	scrollbar-color: var(--surface-3) transparent;}.scroll::-webkit-scrollbar {	width: 6px;}.scroll::-webkit-scrollbar-thumb {	background: var(--surface-3);	border-radius: 99px;}.scroll::-webkit-scrollbar-track {	background: transparent;}.foot {	display: flex;	gap: var(--s2);	flex: 0 0 auto;}.btn {	display: inline-flex;	align-items: center;	justify-content: center;	gap: var(--s1);	min-height: 34px;	padding: var(--s2) var(--s3);	font: inherit;	font-size: var(--t-sm);	font-weight: 600;	color: var(--ink);	background: var(--surface-2);	border: 1px solid var(--line);	border-radius: var(--r1);	cursor: pointer;	transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),		transform var(--dur) var(--ease);}.btn:hover:not(:disabled) {	background: var(--surface-3);}.btn:active:not(:disabled) {	transform: scale(0.97);}.btn:focus-visible {	outline: 2px solid var(--accent);	outline-offset: 2px;}.btn:disabled {	cursor: default;	opacity: 0.45;}.btn.primary {	color: #14100f;	background: var(--accent);	border-color: var(--accent);}.btn.primary:hover:not(:disabled) {	filter: brightness(1.1);}.btn.ok {	color: #0e1a12;	background: var(--ok);	border-color: var(--ok);}.btn.danger {	color: var(--ink);	background: var(--mafia-dim);	border-color: var(--mafia);}.btn.ghost {	background: transparent;}.icon-btn {	display: inline-flex;	align-items: center;	justify-content: center;	flex: 0 0 auto;	min-width: 34px;	min-height: 34px;	padding: var(--s1) var(--s2);	font: inherit;	font-size: var(--t-md);	color: var(--ink-2);	background: transparent;	border: none;	cursor: pointer;}.icon-btn:hover {	color: var(--ink);}.icon-btn:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.grid {	display: grid;	grid-template-columns: repeat(4, minmax(0, 1fr));	gap: var(--s2);	align-content: start;}@media (max-width: 340px) {	.grid {		grid-template-columns: repeat(3, minmax(0, 1fr));	}}.tile {	position: relative;	display: flex;	min-width: 0;	flex-direction: column;	align-items: center;	justify-content: center;	gap: 2px;	aspect-ratio: 1;	padding: var(--s1);	font: inherit;	font-size: var(--t-sm);	font-weight: 700;	color: var(--ink);	background: var(--surface-2);	border: 1px solid var(--line);	border-radius: var(--r2);	cursor: pointer;	transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),		transform var(--dur) var(--ease);}.tile:hover:not(:disabled) {	background: var(--surface-3);	border-color: var(--ink-3);}.tile:active:not(:disabled) {	transform: scale(0.95);}.tile:focus-visible {	outline: 2px solid var(--accent);	outline-offset: 2px;}.tile .num {	font-size: var(--t-lg);	line-height: 1.1;}.tile .cap {	width: 100%;	font-size: var(--t-xs);	font-weight: 500;	color: var(--ink-3);}.tile.me {	border-color: var(--ok);}.tile.me .cap {	color: var(--ok);}.tile:disabled,.tile.dead {	cursor: default;	color: var(--dead);	background: var(--surface);	border-color: var(--surface-2);}.tile.dead .cap {	color: var(--dead);}.tile.picked {	background: var(--mafia-dim);	border-color: var(--mafia);	box-shadow: 0 0 0 2px var(--mafia) inset;}.tile.ally {	border-color: var(--mafia);	background: color-mix(in srgb, var(--mafia-dim) 60%, var(--surface-2));}.tile .badge {	position: absolute;	top: 2px;	right: 3px;	font-size: var(--t-xs);	line-height: 1;}.tile .tally {	position: absolute;	bottom: 2px;	left: 0;	right: 0;	font-size: var(--t-xs);	font-weight: 700;	color: var(--accent);}.chip {	display: inline-flex;	align-items: center;	gap: var(--s1);	padding: 2px var(--s2);	font-size: var(--t-xs);	font-weight: 700;	white-space: nowrap;	border: 1px solid var(--line);	border-radius: 99px;	background: var(--surface-2);}.chip.mafia {	color: var(--mafia);	border-color: var(--mafia);	background: var(--mafia-dim);}.chip.citizen {	color: var(--citizen);	border-color: var(--citizen);	background: var(--citizen-dim);}.chip.dead {	color: var(--ink-3);}.note {	flex: 0 0 auto;	font-size: var(--t-sm);	color: var(--ink-2);	text-align: center;	word-break: keep-all;}.note strong {	color: var(--ink);}.note.flash {	animation: flash var(--dur) var(--ease);}@keyframes flash {	from {		opacity: 0;		transform: translateY(-4px);	}}.chat {	display: flex;	flex-direction: column;	width: 100%;	height: 100%;	min-height: 0;	background: linear-gradient(160deg, var(--surface) 0%, var(--bg) 100%);	border: 1px solid var(--line);	border-radius: var(--r2);	box-shadow: var(--shadow);	overflow: hidden;}.chat-head {	display: flex;	align-items: stretch;	flex: 0 0 auto;	border-bottom: 1px solid var(--line);}.chat-tabs {	display: flex;	gap: 2px;	flex: 1 1 auto;	min-width: 0;	padding: 2px 2px 0;	overflow-x: auto;	scrollbar-width: none;}.chat-tabs::-webkit-scrollbar {	display: none;}.tab {	display: inline-flex;	align-items: center;	gap: var(--s1);	flex: 0 0 auto;	padding: var(--s1) var(--s2);	font: inherit;	font-size: var(--t-xs);	font-weight: 700;	color: var(--ink-3);	background: transparent;	border: none;	border-bottom: 2px solid transparent;	border-radius: var(--r1) var(--r1) 0 0;	white-space: nowrap;	cursor: pointer;	transition: color var(--dur) var(--ease), background var(--dur) var(--ease);}.tab:hover {	color: var(--ink-2);	background: var(--surface-2);}.tab:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.tab[aria-selected="true"] {	color: var(--ink);	background: var(--surface-2);	border-bottom-color: var(--accent);}.tab.ro::after {	content: "🔒";	font-size: 9px;}.badge-n {	min-width: 15px;	padding: 0 4px;	font-size: 9px;	font-weight: 700;	line-height: 15px;	text-align: center;	color: #14100f;	background: var(--accent);	border-radius: 99px;}.chat-fold {	display: inline-flex;	align-items: center;	gap: var(--s1);	flex: 0 0 auto;	min-width: 44px;	min-height: 40px;	margin: 2px var(--s1) 2px 0;	padding: 0 var(--s2);	font: inherit;	font-size: var(--t-xs);	font-weight: 700;	color: var(--ink-2);	background: var(--surface-2);	border: 1px solid var(--line);	border-radius: var(--r1);	white-space: nowrap;	cursor: pointer;	transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);}.chat-fold:hover {	color: var(--ink);	border-color: var(--ink-3);}.chat-fold:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.chat-body {	position: relative;	display: flex;	flex: 1 1 auto;	min-height: 0;}.chat-log {	display: flex;	flex-direction: column;	gap: var(--s1);	flex: 1 1 auto;	min-height: 0;	padding: var(--s2);}.msg {	display: flex;	flex-direction: column;	max-width: 88%;	font-size: var(--t-sm);}.msg .who {	display: flex;	align-items: center;	gap: var(--s1);	font-size: var(--t-xs);	color: var(--ink-3);}.msg .chip {	padding: 0 var(--s1);	font-size: 9px;}.msg .txt {	padding: var(--s1) var(--s2);	border-radius: var(--r1);	background: var(--surface-2);		white-space: pre-wrap;	word-break: break-word;}.msg.mine {	align-self: flex-end;	align-items: flex-end;}.msg.mine .txt {	color: #14100f;	background: var(--accent);}.when {	flex: 0 0 auto;	font-size: 9px;	color: var(--ink-3);	font-variant-numeric: tabular-nums;}.msg.sys,.msg.evt,.msg.ntc {	align-self: center;	align-items: center;	max-width: 100%;	text-align: center;}.msg.sys .txt,.msg.ntc .txt {	font-size: var(--t-xs);	color: var(--ink-2);	background: transparent;}.msg.ntc .txt {	color: var(--ink-3);}.msg.evt .txt {	font-size: var(--t-xs);	font-weight: 700;	color: var(--accent);	background: color-mix(in srgb, var(--accent) 14%, transparent);	border-radius: 99px;}.msg.card {	align-self: stretch;	align-items: stretch;	max-width: 100%;	gap: 2px;	padding: var(--s2);	text-align: left;	border: 1px solid var(--line);	border-radius: var(--r1);	background: var(--surface-2);}.msg.pm {	align-self: stretch;	align-items: stretch;	max-width: 88%;	text-align: left;}.msg.pm .txt {	font-size: var(--t-sm);	color: var(--ink);	background: color-mix(in srgb, var(--citizen) 18%, transparent);	border-left: 2px solid var(--citizen);	border-radius: 0 var(--r1) var(--r1) 0;}.msg.card .ttl {	font-size: var(--t-xs);	font-weight: 700;	color: var(--accent);}.msg.card .row {	display: flex;	align-items: center;	justify-content: space-between;	gap: var(--s1);	font-size: var(--t-xs);	color: var(--ink-2);}.msg.card .row .ellip {	flex: 1 1 auto;	min-width: 0;}.msg.card .val {	flex: 0 0 auto;	color: var(--ink-3);}.msg.card .row.dim {	opacity: 0.5;}.chat-jump {	position: absolute;	left: 50%;	bottom: var(--s2);	z-index: 2;	transform: translateX(-50%);	padding: 2px var(--s3);	font: inherit;	font-size: var(--t-xs);	font-weight: 700;	color: #14100f;	background: var(--accent);	border: none;	border-radius: 99px;	box-shadow: var(--shadow);	cursor: pointer;}.emoji-pad {	position: absolute;	inset: auto 0 0 0;	z-index: 3;	display: grid;	grid-template-columns: repeat(8, 1fr);	gap: 2px;	padding: var(--s2);	background: var(--surface);	border-top: 1px solid var(--line);}.emoji-pad button {	padding: 2px 0;	font-size: 17px;	line-height: 1.3;	background: transparent;	border: none;	border-radius: var(--r1);	cursor: pointer;}.emoji-pad button:hover {	background: var(--surface-3);}.emoji-pad button:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.quick {	display: flex;	flex-wrap: wrap;	gap: var(--s1);	flex: 0 0 auto;	padding: var(--s1) var(--s2);	border-top: 1px solid var(--line);}.quick button {	flex: 0 0 auto;	padding: 2px var(--s2);	font: inherit;	font-size: var(--t-xs);	color: var(--ink-2);	background: var(--surface-2);	border: 1px solid var(--line);	border-radius: 99px;	white-space: nowrap;	cursor: pointer;}.quick button:hover {	color: var(--ink);	background: var(--surface-3);}.quick button:focus-visible {	outline: 2px solid var(--accent);	outline-offset: 1px;}.chat-entry {	display: flex;	align-items: center;	flex: 0 0 auto;	background: var(--surface);	border-top: 1px solid var(--line);}.chat-input {	flex: 1 1 auto;	min-width: 0;	padding: var(--s2) var(--s1);	font: inherit;	font-size: var(--t-sm);	color: var(--ink);	background: transparent;	border: none;	outline: none;	-webkit-user-select: text;	user-select: text;}.chat-input::placeholder {	color: var(--ink-3);}.chat-input:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.chat-mini {	display: flex;	align-items: center;	gap: var(--s2);	width: 100%;	height: 100%;	padding: 0 var(--s3);	font: inherit;	font-size: var(--t-sm);	font-weight: 700;	color: var(--ink-2);	background: linear-gradient(160deg, var(--surface) 0%, var(--bg) 100%);	border: 1px solid var(--line);	border-radius: 99px;	box-shadow: var(--shadow);	cursor: pointer;	transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);}.chat-mini:hover {	color: var(--ink);	border-color: var(--ink-3);}.chat-mini:focus-visible {	outline: 2px solid var(--accent);	outline-offset: -2px;}.chat-mini.alert {	color: var(--ink);	border-color: var(--accent);}.hidden {	display: none !important;}.row {	display: flex;	align-items: center;	gap: var(--s2);}.grow {	flex: 1 1 auto;	min-width: 0;}.ellip {	overflow: hidden;	white-space: nowrap;	text-overflow: ellipsis;}.sr {	position: absolute;	width: 1px;	height: 1px;	padding: 0;	margin: -1px;	overflow: hidden;	clip: rect(0, 0, 0, 0);	white-space: nowrap;	border: 0;}
</style>

	<body>
		<div class="panel">
			<div class="hd">
				<div class="hd-title grow">
					<span id="heading">최후의 반론</span>
					<span class="hd-sub" id="sub"></span>
				</div>
				<div class="timer" id="timer"></div>
			</div>

			<div class="progress" aria-hidden="true"><i id="progress"></i></div>

			<div class="stand">
				<div class="stand-mark" id="mark" aria-hidden="true">🎤</div>

			</div>

			<div class="foot" id="buttons">

					<span class="mark" aria-hidden="true">O</span><span>찬성</span>
				</button>
				<button
					type="button"
					class="btn danger grow judge-btn"
					id="oppose"
					data-pick="OPPOSE"
					disabled
				>
					<span class="mark" aria-hidden="true">X</span><span>반대</span>
				</button>
			</div>

			<p class="note" id="note" role="status" aria-live="polite"></p>
		</div>

		<script>
function esc(value) {
 return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function Html(text) {
 this.text = text;
}

Html.prototype.toString = function() {
 return this.text;
};

function frag(value) {
 if (value instanceof Html) return value.text;
 if (Array.isArray(value)) return value.map(frag).join("");
 return esc(value);
}

function html(strings) {
 let out = strings[0];
 for (let i = 1; i < arguments.length; i++) out += frag(arguments[i]) + strings[i];
 return new Html(out);
}

function flag(on, name) {
 return new Html(on ? name : "");
}

function qs(selector, root) {
 return (root || document).querySelector(selector);
}

function qsa(selector, root) {
 return Array.prototype.slice.call((root || document).querySelectorAll(selector));
}

function startTimer(el, seconds) {
 if (!el) return;
 if (el.dataset.timerId) clearInterval(Number(el.dataset.timerId));
 const total = Math.max(1, Math.round(seconds));
 let left = total;
 const label = document.createElement("span");
 const RADIUS = 19;
 const CIRC = 2 * Math.PI * RADIUS;
 el.innerHTML = html`<svg viewBox="0 0 44 44" aria-hidden="true">
		<circle class="track" cx="22" cy="22" r="${RADIUS}"></circle>
		<circle
			class="bar"
			cx="22"
			cy="22"
			r="${RADIUS}"
			stroke-dasharray="${CIRC}"
			stroke-dashoffset="0"
		></circle>
	</svg>`;
 el.appendChild(label);
 el.setAttribute("role", "timer");
 const bar = qs(".bar", el);
 function paint() {
  label.textContent = String(Math.max(0, left));
  el.setAttribute("aria-label", "남은 시간 " + Math.max(0, left) + "초");
  bar.style.strokeDashoffset = String(CIRC * (1 - Math.max(0, left) / total));
  el.classList.toggle("urgent", left <= 10);
  el.classList.toggle("critical", left <= 3);
 }
 paint();
 const id = setInterval(function() {
  left--;
  paint();
  if (left <= 0) clearInterval(id);
 }, 1e3);
 el.dataset.timerId = String(id);
 return id;
}

function scrollToEnd(el) {
 if (el) el.scrollTop = el.scrollHeight;
}

const HostWindow = function() {
 try {
  void window.parent.document.readyState;
  return window.parent;
 } catch (error) {
  return null;
 }
}();

const Parent = function() {
 const store = function() {
  if (!HostWindow) return {};
  if (!HostWindow.__mafiaWidget) HostWindow.__mafiaWidget = {};
  return HostWindow.__mafiaWidget;
 }();
 function send(message) {
  window.parent.postMessage(message, "*");
 }
 function on(handlers) {
  window.addEventListener("message", function(event) {
   const data = event && event.data;
   if (!data) return;
   if (data.layout) applyLayout(data.layout);
   const handler = handlers[data.type];
   if (handler) handler(data);
  });
 }
 function applyLayout(layout) {
  const message = {
   type: "WidgetRearrange",
   anchor: layout.anchor,
   width: layout.width,
   height: layout.height
  };
  if (layout.top) message.top = layout.top;
  if (layout.zIndex) message.zIndex = layout.zIndex;
  send(message);
 }
 function editable(el) {
  if (!el || !el.tagName) return false;
  const tag = String(el.tagName).toUpperCase();
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
  return el.isContentEditable === true;
 }
 function onKey(handler) {
  if (!HostWindow) return function() {};
  function off() {
   HostWindow.removeEventListener("keydown", listener, true);
   window.removeEventListener("pagehide", off);
  }
  function listener(event) {
   const frame = window.frameElement;
   if (frame && frame.isConnected === false) {
    off();
    return;
   }
   if (editable(event.target)) return;
   if (event.altKey || event.ctrlKey || event.metaKey) return;
   handler(event);
  }
  HostWindow.addEventListener("keydown", listener, true);
  window.addEventListener("pagehide", off);
  return off;
 }
 function grabFocus() {
  window.focus();
 }
 function releaseFocus() {
  window.parent.focus();
 }
 return {
  send: send,
  on: on,
  onKey: onKey,
  grabFocus: grabFocus,
  releaseFocus: releaseFocus,
  store: store,
  canReadKeys: HostWindow !== null
 };
}();
</script>
		<script>
const NONE = "NONE";

const AGREE = "AGREE";

const OPPOSE = "OPPOSE";

let picked = NONE;

let canJudge = false;

function paintPicked() {
 for (const el of qsa(".judge-btn")) {
  el.classList.toggle("picked", el.dataset.pick === picked);
 }
}

function pickNote() {
 if (picked === AGREE) return "찬성했습니다. 다시 누르면 취소됩니다.";
 if (picked === OPPOSE) return "반대했습니다. 다시 누르면 취소됩니다.";
 return "고르지 않으면 반대로 셉니다.";
}

qs("#buttons").addEventListener("click", event => {
 const el = event.target.closest(".judge-btn");
 if (!el || el.disabled || !canJudge) return;
 picked = picked === el.dataset.pick ? NONE : el.dataset.pick;
 paintPicked();
 Parent.send({
  type: "judge",
  pick: picked
 });
 qs("#note").textContent = pickNote();
});

function paint(data, judging) {
 const nominee = Number(data.nominee) || 0;
 const mine = (Number(data.myNum) || 0) === nominee;
 canJudge = data.canJudge === true;
 picked = data.picked === AGREE || data.picked === OPPOSE ? data.picked : NONE;
 qs("#heading").textContent = judging ? "찬반 투표" : "최후의 반론";
 qs("#mark").textContent = judging ? "🗳️" : "🎤";
 qs("#name").textContent = data.nomineeName || `${nominee}번`;
 qs("#standsub").textContent = judging ? "이 사람을 처형할까요?" : "해명을 듣는 중입니다";
 for (const el of qsa(".judge-btn")) el.disabled = !canJudge;
 paintPicked();
 qs("#note").textContent = canJudge ? pickNote() : judging ? mine ? "당신을 처형할지 정하는 중입니다. 결과를 기다리세요." : "👻 유령은 찬반을 고를 수 없습니다." : mine ? "지금 해명하세요. 이 시간에 말할 수 있는 사람은 당신뿐입니다." : "듣는 시간입니다. 곧 찬성과 반대를 고릅니다.";
 startTimer(qs("#timer"), data.timer);
}

Parent.on({
 defense(data) {
  paint(data, false);
 },
 judge(data) {
  paint(data, true);
 },
 "judge-progress"(data) {
  const done = Number(data.voted) || 0;
  const total = Number(data.voters) || 0;
  qs("#progress").style.width = total > 0 ? Math.round(done / total * 100) + "%" : "0%";
  qs("#sub").textContent = total > 0 ? `${done}/${total} 결정` : "";
 }
});
</script>
