<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>플레이어 보드</title>
		<style>
:root {
	--bg: #100c0b;
	--surface: #1c1614;
	--surface-2: #29211e;
	--surface-3: #382d29;
	--line: #4a3b35;
	--ink: #f6f0ea;
	--ink-2: #bfaea4;
	--ink-3: #8a7970;
	--mafia: #e8554f;
	--mafia-dim: #5e1f1d;
	--mafia-ink: #ff8a85;
	--citizen: #56a9e0;
	--citizen-dim: #1e3f57;
	--citizen-ink: #8ec9f5;
	--accent: #e6b44f; 
	--ok: #5fbf7f;
	--danger: #e8554f;
	--dead: #5a4a45;
	--night-1: #1a1d33;
	--night-2: #0c0d17;
	--day-1: #3a2c17;
	--day-2: #17110c;
	--vote-1: #2b2036;
	--vote-2: #140f1a;
	--s1: 4px;
	--s2: 8px;
	--s3: 12px;
	--s4: 16px;
	--s5: 24px;
	--s6: 32px;
	--t-xs: clamp(10px, 2.6vw, 12px);
	--t-sm: clamp(11px, 3vw, 13px);
	--t-md: clamp(13px, 3.5vw, 15px);
	--t-lg: clamp(15px, 4.2vw, 19px);
	--t-xl: clamp(19px, 5.5vw, 24px);
	--t-2xl: clamp(24px, 7vw, 34px);
	--t-3xl: clamp(28px, 9vw, 40px);
	--r1: 6px;
	--r2: 10px;
	--r3: 14px;
	--shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
	--dur: 160ms;
	--ease: cubic-bezier(0.2, 0, 0.2, 1);
}
@media (prefers-reduced-motion: reduce) {
	:root {
		--dur: 1ms;
	}
	*,
	*::before,
	*::after {
		animation-duration: 1ms !important;
		animation-iteration-count: 1 !important;
		transition-duration: 1ms !important;
	}
}
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}
[hidden] {
	display: none !important;
}
html,
body {
	width: 100%;
	height: 100%;
	overflow: hidden;
}
body {
	font-family:
		"Pretendard",
		-apple-system,
		BlinkMacSystemFont,
		"Apple SD Gothic Neo",
		"Malgun Gothic",
		"맑은 고딕",
		"Noto Sans KR",
		system-ui,
		sans-serif;
	font-size: var(--t-md);
	line-height: 1.45;
	color: var(--ink);
	background: transparent;
	-webkit-font-smoothing: antialiased;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}
.panel {
	position: relative;
	isolation: isolate;
	display: flex;
	flex-direction: column;
	width: 100%;
	height: 100%;
	padding: var(--s3) var(--s3) var(--s3);
	gap: var(--s2);
	background: linear-gradient(165deg, var(--surface) 0%, var(--bg) 100%);
	border: 1px solid var(--line);
	border-radius: var(--r3);
	box-shadow: var(--shadow);
	overflow: hidden;
	animation: panel-in 240ms var(--ease);
}
@keyframes panel-in {
	from {
		opacity: 0;
		transform: translateY(6px);
	}
}
.panel.night {
	background: linear-gradient(165deg, var(--night-1) 0%, var(--night-2) 100%);
	border-color: #3b4160;
}
.panel.day {
	background: linear-gradient(165deg, var(--day-1) 0%, var(--day-2) 100%);
	border-color: #5a4626;
}
.panel.vote {
	background: linear-gradient(165deg, var(--vote-1) 0%, var(--vote-2) 100%);
	border-color: #4a3a5a;
}
.panel.night::after,
.panel.day::after,
.panel.vote::after {
	content: "";
	position: absolute;
	inset: 0;
	z-index: -1;
	pointer-events: none;
}
.panel.night::after {
	background: radial-gradient(120% 70% at 50% -10%, rgba(126, 148, 224, 0.16) 0%, transparent 62%);
	animation: moonlight 9s ease-in-out infinite;
}
@keyframes moonlight {
	0%,
	100% {
		opacity: 0.55;
	}
	50% {
		opacity: 1;
	}
}
.panel.day::after {
	background: linear-gradient(115deg, rgba(255, 196, 106, 0.14) 0%, transparent 45%);
	animation: daylight 11s ease-in-out infinite;
}
@keyframes daylight {
	0%,
	100% {
		opacity: 0.6;
	}
	50% {
		opacity: 1;
	}
}
.panel.vote::after {
	background: radial-gradient(130% 60% at 50% 108%, rgba(232, 85, 79, 0.18) 0%, transparent 60%);
	animation: emberglow 6s ease-in-out infinite;
}
@keyframes emberglow {
	0%,
	100% {
		opacity: 0.5;
	}
	50% {
		opacity: 1;
	}
}
.idbar {
	display: flex;
	align-items: center;
	gap: var(--s2);
	flex: 0 0 auto;
	min-width: 0;
}
.idbar .ability {
	flex: 1 1 auto;
	min-width: 0;
	font-size: var(--t-xs);
	color: var(--ink-3);
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
}
.idbar .stat {
	flex: 0 0 auto;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--ink-2);
	font-variant-numeric: tabular-nums;
	white-space: nowrap;
}
.lead {
	display: flex;
	align-items: flex-end;
	gap: var(--s2);
	flex: 0 0 auto;
}
.lead-text {
	flex: 1 1 auto;
	min-width: 0;
}
.lead-title {
	font-size: var(--t-lg);
	font-weight: 800;
	letter-spacing: -0.02em;
	line-height: 1.25;
	word-break: keep-all;
}
.lead-sub {
	margin-top: 3px;
	font-size: var(--t-xs);
	color: var(--ink-3);
	word-break: keep-all;
}
.lead-sub.count {
	color: var(--accent);
	font-weight: 700;
	font-variant-numeric: tabular-nums;
}
.clock {
	display: flex;
	align-items: baseline;
	gap: 2px;
	flex: 0 0 auto;
	font-variant-numeric: tabular-nums;
}
.clock .n {
	font-size: var(--t-3xl);
	font-weight: 800;
	line-height: 0.9;
	color: var(--ink);
}
.clock .u {
	font-size: var(--t-xs);
	color: var(--ink-2);
}
.clock.urgent .n {
	color: var(--danger);
	animation: pulse 1s var(--ease) infinite;
}
.clock.critical .n {
	animation: pulse 420ms var(--ease) infinite;
}
@keyframes pulse {
	0%,
	100% {
		transform: scale(1);
	}
	50% {
		transform: scale(1.08);
	}
}
.timeline {
	flex: 0 0 auto;
	height: 3px;
	border-radius: 99px;
	background: var(--surface-2);
	overflow: hidden;
}
.timeline i {
	display: block;
	height: 100%;
	width: 100%;
	border-radius: 99px;
	background: var(--accent);
	transition:
		width 1s linear,
		background var(--dur) var(--ease);
}
.timeline.urgent i {
	background: var(--danger);
}
.timeline.urgent {
	background: rgba(232, 85, 79, 0.18);
	box-shadow: 0 0 8px rgba(232, 85, 79, 0.5);
}
.progress {
	flex: 0 0 auto;
	height: 4px;
	border-radius: 99px;
	background: var(--surface-2);
	overflow: hidden;
}
.progress i {
	display: block;
	height: 100%;
	width: 0;
	background: var(--ok);
	transition: width var(--dur) var(--ease);
}
.hd {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--s2);
	flex: 0 0 auto;
}
.hd-title {
	display: flex;
	align-items: baseline;
	gap: var(--s2);
	min-width: 0;
	font-size: var(--t-lg);
	font-weight: 800;
	letter-spacing: -0.02em;
}
.hd-sub {
	font-size: var(--t-xs);
	color: var(--ink-3);
	white-space: nowrap;
}
.body {
	flex: 1 1 auto;
	min-height: 0;
	display: flex;
	flex-direction: column;
	gap: var(--s2);
}
.scroll {
	overflow-y: auto;
	overscroll-behavior: contain;
	scrollbar-width: thin;
	scrollbar-color: var(--surface-3) transparent;
}
.scroll::-webkit-scrollbar {
	width: 6px;
}
.scroll::-webkit-scrollbar-thumb {
	background: var(--surface-3);
	border-radius: 99px;
}
.scroll::-webkit-scrollbar-track {
	background: transparent;
}
.stack {
	display: flex;
	flex-direction: column;
	gap: 3px;
	padding: var(--s2) var(--s3);
	background: rgba(0, 0, 0, 0.25);
	border-left: 2px solid var(--danger);
	border-radius: 0 var(--r2) var(--r2) 0;
}
.stack span {
	font-size: var(--t-sm);
	color: var(--mafia-ink);
	word-break: keep-all;
}
.stack span.good {
	color: #8fd6a8;
}
.stack span.mine {
	font-weight: 700;
	color: var(--ink);
}
.replay {
	display: flex;
	flex-direction: column;
	gap: 3px;
}
.replay details {
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r1);
	padding: 0 var(--s2);
}
.replay summary {
	display: flex;
	gap: var(--s1);
	align-items: center;
	padding: var(--s1) 0;
	list-style: none;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--ink-2);
	cursor: pointer;
}
.replay summary::-webkit-details-marker {
	display: none;
}
.replay summary::before {
	content: "▸";
}
.replay details[open] > summary::before {
	content: "▾";
}
.replay summary:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 2px;
	border-radius: var(--r1);
}
.replay .n {
	margin-left: auto;
	font-weight: 400;
	color: var(--ink-3);
}
.replay p {
	margin: 0 0 var(--s1);
	font-size: var(--t-xs);
	word-break: keep-all;
}
.foot {
	display: flex;
	gap: var(--s2);
	flex: 0 0 auto;
}
.btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: var(--s1);
	min-height: 34px;
	padding: var(--s2) var(--s3);
	font: inherit;
	font-size: var(--t-sm);
	font-weight: 600;
	white-space: nowrap;
	color: var(--ink);
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r1);
	cursor: pointer;
	transition:
		background var(--dur) var(--ease),
		border-color var(--dur) var(--ease),
		transform var(--dur) var(--ease);
}
.btn:hover:not(:disabled) {
	background: var(--surface-3);
}
.btn:active:not(:disabled) {
	transform: scale(0.97);
}
.btn:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 2px;
}
.btn:disabled {
	cursor: default;
	opacity: 0.45;
}
.btn.primary {
	color: var(--bg);
	background: var(--accent);
	border-color: var(--accent);
}
.btn.primary:hover:not(:disabled) {
	filter: brightness(1.1);
}
.btn.ok {
	color: #0e1a12;
	background: var(--ok);
	border-color: var(--ok);
}
.btn.danger {
	color: var(--ink);
	background: var(--mafia-dim);
	border-color: var(--mafia);
}
.btn.ghost {
	background: transparent;
}
.icon-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	flex: 0 0 auto;
	min-width: 34px;
	min-height: 34px;
	padding: var(--s1) var(--s2);
	font: inherit;
	font-size: var(--t-md);
	color: var(--ink-2);
	background: transparent;
	border: none;
	border-radius: var(--r1);
	cursor: pointer;
}
.icon-btn:hover {
	color: var(--ink);
}
.icon-btn:disabled {
	cursor: default;
	opacity: 0.35;
}
.icon-btn:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -2px;
}
.icon-btn.strong {
	font-weight: 800;
}
.grid {
	display: grid;
	grid-template-columns: repeat(4, minmax(0, 1fr));
	gap: var(--s2);
	align-content: safe center;
}
@media (max-width: 300px) {
	.grid {
		grid-template-columns: repeat(3, minmax(0, 1fr));
	}
}
@media (min-aspect-ratio: 1/1) and (max-height: 320px) {
	.grid {
		grid-template-columns: repeat(auto-fit, minmax(32px, 1fr));
		gap: var(--s1);
	}
	.grid .tile .cap {
		display: none;
	}
}
.tile {
	position: relative;
	display: flex;
	min-width: 0;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 2px;
	aspect-ratio: 6 / 5;
	padding: var(--s1);
	font: inherit;
	font-size: var(--t-sm);
	font-weight: 700;
	color: var(--ink);
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r2);
	cursor: pointer;
	transition:
		background var(--dur) var(--ease),
		border-color var(--dur) var(--ease),
		transform var(--dur) var(--ease);
}
.tile:hover:not(:disabled) {
	background: var(--surface-3);
	border-color: var(--ink-3);
}
.tile:active:not(:disabled) {
	transform: scale(0.95);
}
.tile:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 2px;
}
.tile .num {
	font-size: var(--t-lg);
	line-height: 1.1;
}
.tile .cap {
	width: 100%;
	font-size: var(--t-xs);
	font-weight: 500;
	color: var(--ink-3);
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
	text-align: center;
}
.tile.me {
	border-color: var(--ok);
}
.tile.me .cap {
	color: var(--ok);
}
.tile:disabled,
.tile.dead {
	cursor: default;
	color: var(--dead);
	background: var(--surface);
	border-color: var(--surface-2);
}
.tile.dead .cap {
	color: var(--dead);
}
.tile.picked {
	background: var(--mafia-dim);
	border-color: var(--mafia);
	box-shadow: 0 0 0 2px var(--mafia) inset;
}
.tile.picked .cap {
	color: var(--mafia-ink);
}
.tile.ally {
	border-color: var(--mafia);
	background: color-mix(in srgb, var(--mafia-dim) 60%, var(--surface-2));
}
.tile.ally .cap {
	color: var(--mafia-ink);
}
.tile .badge {
	position: absolute;
	top: 2px;
	right: 3px;
	font-size: var(--t-xs);
	line-height: 1;
}
.tile .tally {
	position: absolute;
	bottom: 3px;
	left: 0;
	right: 0;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--accent);
	text-align: center;
}
.chip {
	display: inline-flex;
	align-items: center;
	gap: var(--s1);
	flex: 0 0 auto;
	padding: 3px var(--s2);
	font-size: var(--t-xs);
	font-weight: 800;
	white-space: nowrap;
	color: var(--ink-2);
	border: 1px solid var(--line);
	border-radius: 99px;
	background: var(--surface-2);
}
.chip.mafia {
	color: var(--mafia-ink);
	border-color: var(--mafia);
	background: var(--mafia-dim);
}
.chip.citizen {
	color: var(--citizen-ink);
	border-color: var(--citizen);
	background: var(--citizen-dim);
}
.chip.dead {
	color: var(--ink-2);
	border-color: var(--dead);
	background: var(--surface-2);
}
.note {
	flex: 0 0 auto;
	font-size: var(--t-sm);
	color: var(--ink-2);
	text-align: center;
	word-break: keep-all;
}
.note strong {
	color: var(--ink);
}
.note.flash {
	animation: flash var(--dur) var(--ease);
}
@keyframes flash {
	from {
		opacity: 0;
		transform: translateY(-4px);
	}
}
.chat {
	display: flex;
	flex-direction: column;
	width: 100%;
	height: 100%;
	min-height: 0;
	background: linear-gradient(165deg, var(--surface) 0%, var(--bg) 100%);
	border: 1px solid var(--line);
	border-radius: var(--r2);
	box-shadow: var(--shadow);
	overflow: hidden;
}
.chat-head {
	display: flex;
	align-items: stretch;
	flex: 0 0 auto;
	border-bottom: 1px solid var(--line);
}
.chat-tabwrap {
	position: relative;
	flex: 1 1 auto;
	min-width: 0;
}
.chat-tabwrap::after {
	content: "";
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	width: 20px;
	pointer-events: none;
	opacity: 0;
	background: linear-gradient(to right, rgba(28, 22, 20, 0), var(--surface));
	transition: opacity var(--dur) var(--ease);
}
.chat-tabwrap.more::after {
	opacity: 1;
}
.chat-tabs {
	display: flex;
	gap: 2px;
	width: 100%;
	padding: 2px 2px 0;
	overflow-x: auto;
	scrollbar-width: none;
}
.chat-tabs::-webkit-scrollbar {
	display: none;
}
.tab {
	display: inline-flex;
	align-items: center;
	gap: var(--s1);
	flex: 0 0 auto;
	padding: var(--s1) var(--s2);
	font: inherit;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--ink-3);
	background: transparent;
	border: none;
	border-bottom: 2px solid transparent;
	border-radius: var(--r1) var(--r1) 0 0;
	white-space: nowrap;
	cursor: pointer;
	transition:
		color var(--dur) var(--ease),
		background var(--dur) var(--ease);
}
.tab:hover {
	color: var(--ink-2);
	background: var(--surface-2);
}
.tab:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -2px;
}
.tab[aria-selected="true"] {
	color: var(--accent);
	background: var(--surface-3);
	border-bottom-color: var(--accent);
}
.tab.ro::after {
	content: "🔒";
	font-size: 9px;
}
.tab.fresh {
	animation: tabpop 1200ms var(--ease);
}
@keyframes tabpop {
	0%,
	100% {
		box-shadow: none;
	}
	25%,
	65% {
		box-shadow: inset 0 0 0 2px var(--accent);
	}
}
.badge-n {
	min-width: 15px;
	padding: 0 4px;
	font-size: 9px;
	font-weight: 700;
	line-height: 15px;
	text-align: center;
	color: var(--bg);
	background: var(--accent);
	border-radius: 99px;
}
.chat-fold {
	display: inline-flex;
	align-items: center;
	gap: var(--s1);
	flex: 0 0 auto;
	min-width: 44px;
	margin: 2px var(--s1) 2px 0;
	padding: 0 var(--s2);
	font: inherit;
	font-size: var(--t-xs);
	font-weight: 700;
	color: var(--ink-2);
	background: var(--surface-2);
	border: 1px solid var(--line);
	border-radius: var(--r1);
	white-space: nowrap;
	cursor: pointer;
	transition:
		color var(--dur) var(--ease),
		border-color var(--dur) var(--ease);
}
.chat-fold:hover {
	color: var(--ink);
	border-color: var(--ink-3);
}
.chat-fold:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -2px;
}
.chat-body {
	position: relative;
	display: flex;
	flex: 1 1 auto;
	min-height: 0;
}
.chat-log {
	display: flex;
	flex-direction: column;
	gap: var(--s1);
	flex: 1 1 auto;
	min-height: 0;
	padding: var(--s2);
}
.chat-log > * {
	flex-shrink: 0;
}
.msg {
	display: flex;
	flex-direction: column;
	max-width: 88%;
	font-size: var(--t-sm);
}
.msg .who {
	display: flex;
	align-items: center;
	gap: var(--s1);
	font-size: var(--t-xs);
	color: var(--ink-3);
}
.msg .chip {
	padding: 0 var(--s1);
	font-size: 9px;
}
.msg .reply {
	flex: 0 0 auto;
	min-width: 24px;
	min-height: 24px;
	padding: 0 var(--s1);
	font: inherit;
	font-size: 11px;
	color: var(--ink-3);
	background: transparent;
	border: none;
	border-radius: var(--r1);
	cursor: pointer;
}
.msg .reply:hover {
	color: var(--accent);
}
.msg .reply:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: -1px;
}
.msg .txt {
	padding: var(--s1) var(--s2);
	border-radius: var(--r1);
	background: var(--surface-2);
	white-space: pre-wrap;
	word-break: break-word;
}
.msg.mine {
	align-self: flex-end;
	align-items: flex-end;
}
.msg.mine .txt {
	color: var(--bg);
	background: var(--accent);
}
.when {

function esc(value) {
 return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function Html(text) {
 this.text = text;
}

Html.prototype.toString = function() {
 return this.text;
};

function frag(value) {
 if (value instanceof Html) return value.text;
 if (Array.isArray(value)) return value.map(frag).join("");
 return esc(value);
}

function html(strings) {
 let out = strings[0];
 for (let i = 1; i < arguments.length; i++) out += frag(arguments[i]) + strings[i];
 return new Html(out);
}

function flag(on, name) {
 return new Html(on ? name : "");
}

function qs(selector, root) {
 return (root || document).querySelector(selector);
}

function qsa(selector, root) {
 return Array.prototype.slice.call((root || document).querySelectorAll(selector));
}

function startTimer(el, seconds) {
 if (!el) return;
 if (el.dataset.timerId) clearInterval(Number(el.dataset.timerId));
 const total = Math.max(1, Math.round(seconds));
 let left = total;
 el.classList.add("clock");
 el.setAttribute("role", "timer");
 el.innerHTML = html`<span class="n"></span><span class="u">초</span>`;
 const label = qs(".n", el);
 const line = qs(".timeline");
 const bar = line ? qs("i", line) : null;
 function paint() {
  const n = Math.max(0, left);
  label.textContent = n < 10 ? "0" + n : String(n);
  el.setAttribute("aria-label", "남은 시간 " + n + "초");
  if (bar) bar.style.width = n / total * 100 + "%";
  el.classList.toggle("urgent", left <= 10);
  el.classList.toggle("critical", left <= 3);
  if (line) line.classList.toggle("urgent", left <= 10);
 }
 paint();
 const id = setInterval(function() {
  left--;
  paint();
  if (left <= 0) clearInterval(id);
 }, 1e3);
 el.dataset.timerId = String(id);
 return id;
}

function scrollToEnd(el) {
 if (el) el.scrollTop = el.scrollHeight;
}

const CDN = "https://cdn-static-script.zep.us/mafia/";

function assetUrl(file) {
 if (/\.(gif|webp)$/.test(file)) return CDN + file;
 try {
  const url = new URL(document.baseURI);
  if (!url.searchParams.has("appHashId")) return file;
  url.searchParams.set("fileName", file);
  return url.href;
 } catch (e) {
  return file;
 }
}

const GLYPH_ANIMATED = new Set([ "trophy", "mic", "ballot", "ghost", "dove", "moon", "shaman", "sunrise", "terrorist" ]);

function glyphHtml(glyph) {
 const name = GLYPH_ICON[glyph];
 if (!name) return html`${glyph || ""}`;
 return html`<img
		class="gi"
		src="${assetUrl(`ui_${name}.${GLYPH_ANIMATED.has(name) ? "gif" : "png"}`)}"
		alt="${glyph === "?" ? "" : glyph}"
	/>`;
}

function setGlyph(el, glyph) {
 if (el) el.innerHTML = String(glyphHtml(glyph));
}

qsa('[data-glyph="auto"]').forEach(el => setGlyph(el, el.textContent.trim()));

function replayHtml(entries) {
 const groups = [];
 for (const entry of Array.isArray(entries) ? entries : []) {
  const last = groups[groups.length - 1];
  if (last && last.when === entry.when) last.lines.push(entry.text); else groups.push({
   when: entry.when,
   lines: [ entry.text ]
  });
 }
 return html`${groups.map((group, i) => html`<details ${flag(i === groups.length - 1, "open")}>
			<summary>${group.when} <span class="n">${group.lines.length}건</span></summary>
			${group.lines.map(line => html`<p>${line}</p>`)}
		</details>`)}`;
}

function memoLoad(gameId) {
 try {
  const memo = Parent.store.memo && Parent.store.memo[gameId];
  if (memo) return memo;
 } catch (e) {}
 try {
  const saved = JSON.parse(localStorage.getItem(MEMO_KEY) || "null");
  if (saved && saved.gameId === gameId && saved.memo) return saved.memo;
 } catch (e) {}
 return {};
}

function memoSave(gameId, memo) {
 try {
  if (!Parent.store.memo) Parent.store.memo = {};
  Parent.store.memo[gameId] = memo;
 } catch (e) {}
 try {
  localStorage.setItem(MEMO_KEY, JSON.stringify({
   gameId: gameId,
   memo: memo
  }));
 } catch (e) {}
}

const HostWindow = function() {

 const LANDSCAPE = {
  "96%": {
   width: "40%",
   grow: 1.8,
   max: 86,
   bottom: "bottomleft"
  },
  "60%": {
   width: "32%",
   grow: 1.2,
   max: 70,
   bottom: "bottom"
  }
 };
 function landscapeLayout(layout) {
  const fit = LANDSCAPE[layout.width];
  if (!fit || !isLandscape()) return layout;
  const base = layout.wide || layout.height;
  const pct = parseFloat(base);
  const out = {
   ...layout,
   width: fit.width
  };
  if (pct > 0 && String(base).slice(-1) === "%") out.height = `${Math.min(Math.round(pct * fit.grow), fit.max)}%`;
  if (layout.anchor === "top") out.anchor = layout.wide ? "topright" : "topleft"; else if (layout.anchor === "bottom") out.anchor = fit.bottom;

  window.addEventListener("orientationchange", relayout);

  lastLayout = raw;
  const layout = landscapeLayout(raw);
  const message = {
   type: "WidgetRearrange",
   anchor: layout.anchor,
   width: layout.width,
   height: layout.height

const STAGGER = 90;

const CLOSING_SEC = 10;

const KEYS_HINT = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches ? " (키보드 1–0)" : "";

let mode = "status";

let gameId = "";

let myNum = 0;

let seatList = [];

let pick = null;

let locked = false;

let sent = false;

let chosen = 0;

let promptTitle = "";

let spentDelta = 0;

let closing = false;

let closingId = 0;

let barred = [];

let noSelf = false;

let targetsDead = false;

let final = false;

let memo = {};

function pickName(num) {
 return num === SKIP ? "투표 없음" : `${num}번`;
}

function pickable(seat) {
 if (mode === "vote") return seat.alive && barred.indexOf(seat.num) < 0;
 return targetsDead ? !seat.alive : seat.alive;
}

function tile(seat, extra) {
 const mine = seat.num === myNum;
 const out = mode === "vote" && barred.indexOf(seat.num) >= 0;
 const caption = mine ? "나" : !seat.alive ? "사망" : seat.ally ? "동료" : "";
 const classes = "tile" + (mine ? " me" : "") + (pickable(seat) ? "" : " dead") + (seat.ally ? " ally" : "") + (out ? " barred" : "") + (extra ? " " + extra : "");
 const badge = out ? html`<span class="badge">부결</span>` : "";
 return html`<button
					type="button"
					class="${classes}"
					data-num="${seat.num}"
					${flag(locked || !pickable(seat) || mine && noSelf, "disabled")}
					aria-label="${seat.num}번${mine ? " (나)" : ""}${seat.ally ? " (같은 편)" : ""}${out ? " (부결됨)" : ""}"
				>
					${badge}<span class="num">${seat.num}</span><span class="cap">${caption}</span>
					<span class="by"></span><span class="guess" aria-hidden="true"></span>
				</button>`;
}

function tileOf(num) {
 return qs(`#grid .tile[data-num="${num}"]`);
}

function paintStrip() {
 const state = locked ? "locked" : closing ? "closing" : pick !== null ? "picked" : "none";
 const strip = qs("#strip");
 strip.classList.remove("none", "picked", "closing", "locked");
 strip.classList.add(state);
 const what = pick === null ? "" : pickName(pick);
 let text = `선택: 없음 · 번호를 누르세요${KEYS_HINT}`;
 if (state === "locked") text = what ? `🔒 확정 · ${what}` : "🔒 고를 수 없습니다"; else if (state === "closing") text = chosen ? `⏳ 마감 임박 · ${chosen}번으로 정해집니다` : `⏳ 마감 임박 · ${what ? "선택: " + what : "아직 고르지 않았습니다"}`; else if (chosen) text = `✔ ${final ? chosen + "번에게 씁니다" : pickName(chosen)} · 다른 번호로 바꾸기`; else if (state === "picked") text = `선택: ${what}` + (mode === "vote" ? " · 다시 누르면 취소" : final && !sent ? " · [능력 쓰기]를 눌러야 씁니다" : "");
 qs("#pickText").textContent = text;
 const oneShot = mode === "action" && final && !locked;
 qs("#confirm").classList.toggle("hidden", !(oneShot && pick !== null && !sent && !chosen));
 qs("#cancel").classList.toggle("hidden", !(oneShot && chosen));
}

function paintPick() {
 for (const el of qsa("#grid .tile")) {
  el.classList.toggle("picked", Number(el.dataset.num) === pick);
 }
 qs("#skip").classList.toggle("picked", pick === SKIP);
 paintStrip();
}

function armClosing(seconds) {
 clearTimeout(closingId);
 const left = Number(seconds) || 0;
 closing = left > 0 && left <= CLOSING_SEC;
 if (left > CLOSING_SEC) {
  closingId = setTimeout(() => {
   closing = true;
   paintStrip();
  }, (left - CLOSING_SEC) * 1e3);
 }
}

function voteNote() {
 if (pick === null) return "기권 상태입니다. 다시 고를 수 있습니다.";
 if (pick === SKIP) return "'투표 없음'을 골랐습니다. 다시 누르면 취소됩니다.";
 return `${pick}번을 지목했습니다. 다시 누르면 취소됩니다.`;
}

function vote(num) {
 pick = pick === num ? null : num;
 paintPick();
 Parent.send({
  type: "vote",
  target: pick
 });
 qs("#note").textContent = voteNote();
}

function aim(num) {
 if (num === chosen) return;
 if (final && !chosen && pick !== num) {
  pick = num;
  paintPick();
  return;
 }
 pick = num;
 sent = true;
 paintPick();
 Parent.send({
  type: "select",
  num: num
 });
}

function tap(num) {
 if (locked) return;
 if (mode === "vote") vote(num); else if (mode === "action") aim(num);
}

function clearPick() {
 if (locked || pick === null) return false;
 if (mode === "vote") {
  vote(pick);
  return true;
 }
 if (mode === "action" && !sent) {
  pick = null;
  paintPick();
  return true;
 }
 return false;
}

function choose(num) {
 chosen = num;
 pick = num;
 sent = true;
 qs("#choices").classList.add("hidden");
 qs("#grid").classList.remove("hidden");
 qs("#mode").textContent = `밤 · ${num}번 지목 — 밤이 끝나기 전까지 바꿀 수 있습니다`;
 qs("#note").textContent = "";
 paintPick();
}

function backToGrid() {
 pick = null;
 sent = false;
 qs("#choices").classList.add("hidden");
 qs("#grid").classList.remove("hidden");
 qs("#mode").textContent = promptTitle;
 paintPick();
}

function lockGrid(num) {
 locked = true;
 pick = num;
 for (const el of qsa("#grid .tile")) {
  if (Number(el.dataset.num) !== num) el.disabled = true;
 }
 qs("#grid").classList.add("locked");
 qs("#choices").classList.add("hidden");
 qs("#grid").classList.remove("hidden");
 qs("#mode").textContent = "밤 · 지목했습니다 — 기다리세요";
 qs("#note").textContent = `✔ ${num}번을 지목했습니다.`;
 paintPick();
}

qs("#grid").addEventListener("click", event => {
 const el = event.target.closest(".tile");
 if (!el || el.disabled) return;
 tap(Number(el.dataset.num));
});

qs("#skip").addEventListener("click", () => {
 if (!locked) vote(SKIP);
});

qs("#confirm").addEventListener("click", () => {
 if (pick !== null && !locked) aim(pick);
});

qs("#cancel").addEventListener("click", () => {
 if (chosen && !locked) Parent.send({
  type: "cancel"
 });
});

qs("#tplus").addEventListener("click", () => sendTime(15));

qs("#tminus").addEventListener("click", () => sendTime(-15));

qs("#choices").addEventListener("click", event => {
 const el = event.target.closest("button");
 if (!el) return;
 if (el.dataset.back) backToGrid(); else Parent.send({
  type: "phrase",
  index: Number(el.dataset.index)
 });
});

qs("#quit").addEventListener("click", () => Parent.send({
 type: "spectate-quit"
}));

qs("#guide").addEventListener("click", () => Parent.send({
 type: "guide"
}));

qs("#panel").addEventListener("click", event => {
 if (event.detail !== 0) Parent.releaseFocus();
});

Parent.onKey(event => {
 if (mode !== "vote" && mode !== "action") return;
 if (event.key === "Escape") {
  if (clearPick()) event.preventDefault();
  return;
 }
 if (!/^[0-9]$/.test(event.key) || locked || qs("#grid").classList.contains("hidden")) return;
 const el = tileOf(event.key === "0" ? 10 : Number(event.key));
 if (!el || el.disabled) return;
 event.preventDefault();
 tap(Number(el.dataset.num));
 Parent.releaseFocus();
});

function paintMemo() {
 for (const el of qsa("#grid .tile")) {
  const guess = qs(".guess", el);
  const glyph = memo[el.dataset.num] || "";
  if (guess && guess.dataset.glyph !== glyph) {
   guess.dataset.glyph = glyph;
   guess.innerHTML = String(glyphHtml(glyph));
  }
 }
}

function refreshMemo() {
 if (!gameId) return;
 memo = memoLoad(gameId);
 paintMemo();
}

setInterval(refreshMemo, 1e3);

function paintTimeVote(data) {
 const spent = data.timeSpent === true;
 qs("#timevote").classList.toggle("hidden", data.timeVote !== true);
 qs("#timeused").classList.toggle("hidden", !spent);
 qs("#timeused").textContent = !spent ? "" : spentDelta ? `✔ 오늘 ${spentDelta > 0 ? "+" : "−"}15초를 썼습니다` : "✔ 오늘 시간 조절을 썼습니다";
}

function sendTime(delta) {
 spentDelta = delta;
 paintTimeVote({
  timeSpent: true
 });
 Parent.send({
  type: "time",
  delta: delta
 });
}

function reset(data) {
 mode = data.mode === "vote" || data.mode === "action" ? data.mode : "status";
 gameId = String(data.gameId || "");
 myNum = Number(data.myNum) || 0;
 seatList = Array.isArray(data.seats) ? data.seats : [];
 pick = null;
 locked = false;
 sent = false;
 chosen = 0;
 barred = [];
 noSelf = false;
 targetsDead = false;
 final = false;
 const panel = qs("#panel");
 panel.classList.remove("night", "day", "vote", "help");
 panel.classList.remove("watching");
 qs("#ability").textContent = mode === "action" || data.phase === "night" ? data.abilityLine || "" : "";
 qs("#note").textContent = "";
 qs("#sub").textContent = "";
 qs("#sub").classList.remove("count");
 qs("#progressbar").classList.add("hidden");
 qs("#progress").style.width = "0%";
 qs("#stage").classList.add("hidden");
 qs("#poll").innerHTML = "";
 qs("#poll").classList.add("hidden");
 qs("#grid").classList.add("hidden");
 qs("#grid").classList.remove("locked");
 qs("#choices").classList.add("hidden");
 qs("#choices").innerHTML = "";
 qs("#strip").classList.toggle("hidden", mode === "status");
 qs("#skip").classList.add("hidden");
 qs("#skip").disabled = false;
 qs("#spectateActions").hidden = true;
 paintTimeVote({});
 armClosing(data.timer);
 return panel;
}

function paintRoster(seats, alive, total) {
 const marks = [];
 if (seats.length > 0) {
  for (const seat of seats) marks.push(html`<i class="${seat.alive ? "" : "gone"}">${seat.num}</i>`);
 } else {
  for (let i = 0; i < total; i++) marks.push(html`<i class="${i < alive ? "" : "gone"}">·</i>`);
 }
 qs("#roster").innerHTML = html`${marks}`;
}

function paintPoll(poll) {
 const el = qs("#poll");
 el.classList.toggle("hidden", !poll);
 if (!poll) return;
 const tally = poll.tally || {};
 const mine = Number(poll.suspect) || 0;
 const can = poll.canSuspect === true;
 el.innerHTML = html`<span class="poll-hd" title="${TERMS.여론조사}">여론조사 · 번호별 의심 수 (투표와 무관)</span>${seatList.filter(seat => seat.alive).map(seat => {
  const n = Number(tally[seat.num]) || 0;
  const me = seat.num === mine;
  return html`<button
							type="button"
							class="${me ? "mine" : ""}"
							data-num="${seat.num}"
							aria-pressed="${String(me)}"
							${flag(!can || seat.num === myNum, "disabled")}
							aria-label="${seat.num}번 의심 ${n}${me ? " (내 의심)" : ""}"
						>
							${seat.num}번 ${n}${me ? "✓" : ""}
						</button>`;
 })}`;
}

qs("#poll").addEventListener("click", event => {
 const el = event.target.closest("button");
 if (!el || el.disabled) return;
 Parent.send({
  type: "suspect",
  num: Number(el.dataset.num)
 });
});

function showStatus(data, panel) {
 const night = data.phase === "night";
 panel.classList.add(night ? "night" : "day");
 panel.classList.toggle("watching", data.spectating === true || data.alive === false);
 qs("#mode").textContent = `${night ? "밤" : "낮"} · ${data.lead || (night ? "기다리세요" : "토론 중")}`;
 termTitle(qs("#mode"), data.alive === false && !data.spectating ? "유령" : night ? "밤" : "낮");
 paintPoll(data.poll || null);
 paintTimeVote(data);
 qs("#sub").textContent = data.note || "";
 qs("#spectateActions").hidden = !data.spectating;
 qs("#stage").classList.remove("hidden");
 paintRoster(seatList, Number(data.aliveCount) || 0, Number(data.total) || 0);
 const deaths = Array.isArray(data.deaths) ? data.deaths : [];
 const timeline = Array.isArray(data.timeline) ? data.timeline : [];
 qs("#replay").classList.toggle("hidden", timeline.length === 0);
 qs("#replay").innerHTML = replayHtml(timeline);
 const mine = Array.isArray(data.mine) ? data.mine : [];
 const lines = (timeline.length > 0 ? [] : deaths).concat(mine);
 qs("#deaths").classList.toggle("hidden", lines.length === 0);
 qs("#deaths").innerHTML = html`${lines.map((line, i) => html`<span
							class="${i >= lines.length - mine.length ? "mine" : line.indexOf("☠") >= 0 ? "" : "good"}"
							style="animation-delay:${i * 90}ms"
							>${line}</span
						>`)}`;
}

function showVote(data, panel) {
 panel.classList.add("vote");
 const ghost = seatList.some(seat => seat.num === myNum && !seat.alive);
 locked = ghost;
 barred = Array.isArray(data.rejected) ? data.rejected : [];
 pick = Number(data.picked) || null;
 qs("#mode").textContent = ghost ? "투표 · 투표할 수 없습니다" : "투표 · 처형할 사람을 고르세요";
 termTitle(qs("#mode"), ghost ? "유령" : "투표");
 qs("#progressbar").classList.remove("hidden");
 qs("#grid").innerHTML = html`${seatList.map(seat => tile(seat))}`;
 qs("#grid").classList.remove("hidden");
 qs("#skip").classList.remove("hidden");
 qs("#skip").disabled = locked;
 qs("#note").textContent = ghost ? "👻 유령은 투표할 수 없습니다." : pick === null ? "고르지 않으면 기권입니다. 단서가 없으면 '투표 없음'도 한 표입니다." : voteNote();
 paintPick();
}

function showAction(data, panel) {
 panel.classList.add("night");
 panel.classList.toggle("help", data.team !== "mafia");
 noSelf = !!data.noSelf;
 targetsDead = !!data.targetsDead;
 final = data.final === true;
 promptTitle = `밤 · 능력: ${data.prompt || "대상을 고르세요"}`;
 qs("#mode").textContent = promptTitle;
 termTitle(qs("#mode"), "지목");
 qs("#progressbar").classList.remove("hidden");
 qs("#grid").innerHTML = html`${seatList.map(seat => tile(seat))}`;
 qs("#grid").classList.toggle("hidden", seatList.length === 0);
 qs("#note").textContent = data.note || "";
 const picked = Number(data.picked) || 0;
 if (picked && data.locked === true) lockGrid(picked); else if (picked && data.changeable === true) choose(picked); else if (picked) markProbed(picked); else paintPick();
}

function markProbed(num) {
 const el = tileOf(num);
 if (el) {
  el.classList.add("picked");
  el.disabled = true;
 }
 pick = null;
 sent = false;
 qs("#note").textContent = `✔ ${num}번을 조사했습니다. 한 명을 더 고를 수 있습니다.`;
 paintStrip();
}

function paintAllies(picks) {
 const by = {};
 for (const entry of picks) {
  const from = Number(entry.from) || 0;
  const to = Number(entry.to) || 0;
  if (!from || !to || from === myNum) continue;
  by[to] = by[to] ? by[to] + "," + from : String(from);
 }
 for (const el of qsa("#grid .tile")) {
  const list = by[Number(el.dataset.num)] || "";
  qs(".by", el).textContent = list ? "🔻" + list : "";
  el.classList.toggle("aimed", !!list);
 }
}

Parent.on({
 init(data) {
  const panel = reset(data);
  if (mode === "vote") showVote(data, panel); else if (mode === "action") showAction(data, panel); else showStatus(data, panel);
  refreshMemo();
 },
 timer(data) {
  if (mode === "status") paintTimeVote(data);
 },
 cancelled() {
  chosen = 0;
  pick = null;
  sent = false;
  qs("#mode").textContent = promptTitle;
  paintPick();
 },
 progress(data) {
  const nightish = mode === "action";
  const done = Number(nightish ? data.acted : data.voted) || 0;
  const total = Number(nightish ? data.total : data.alive) || 0;
  qs("#progress").style.width = (total > 0 ? done / total * 100 : 0) + "%";
  const left = total - done;
  qs("#sub").classList.add("count");
  qs("#sub").textContent = total <= 0 ? "" : nightish ? left > 0 ? `${done}/${total} 지목 완료 · ${left}명 남음` : `${total}명 모두 지목했습니다` : `${done}/${total} 투표 완료`;
  if (nightish) return;
  const cast = Array.isArray(data.done) ? data.done : [];
  for (const el of qsa("#grid .tile")) {
   el.classList.toggle("cast", cast.indexOf(Number(el.dataset.num)) >= 0);
  }
 },
 poll(data) {
  if (mode === "status") paintPoll(data);
 },
 allies(data) {
  paintAllies(Array.isArray(data.picks) ? data.picks : []);
 },
 phrases(data) {
  const options = Array.isArray(data.options) ? data.options : [];
  qs("#grid").classList.add("hidden");
  qs("#choices").classList.remove("hidden");
  qs("#choices").innerHTML = html`${options.map((text, i) => html`<button type="button" data-index="${i}">${text}</button>`)}<button type="button" class="back" data-back="1">← 대상 다시 고르기</button>`;
  qs("#mode").textContent = `밤 · ${Number(data.num) || 0}번에게 보낼 문구를 고르세요`;
  qs("#note").textContent = "";
 },
 selectResponse(data) {
  const num = Number(data.num) || 0;
  if (data.again === true) markProbed(num); else if (data.changeable === true) choose(num); else lockGrid(num);
 },
 result(data) {
  const panel = reset(data);
  locked = true;
  panel.classList.add("vote");
  qs("#mode").textContent = "개표";
  termTitle(qs("#mode"), "개표");
  qs("#sub").textContent = data.message || "";
  qs("#strip").classList.add("hidden");
  qs("#progressbar").classList.remove("hidden");
  qs("#progress").style.width = "100%";
  const top = seatList.reduce((max, seat) => Math.max(max, Number(seat.votes) || 0), 0);
  qs("#grid").innerHTML = html`${seatList.map(seat => tile(seat, "counted" + (seat.num === data.nominee ? " out" : "")))}`;
  qs("#grid").classList.remove("hidden");
  const bars = [];
  let outTile = null;
  seatList.forEach((seat, i) => {
   const el = tileOf(seat.num);
   if (!el) return;
   if (seat.num === data.nominee) outTile = el;
   const votes = Number(seat.votes) || 0;
   el.insertAdjacentHTML("beforeend", html`<span class="tally">${votes}표</span><span class="bar"></span>`);
   const bar = qs(".bar", el);
   bar.style.transitionDuration = BAR_MS + "ms";
   bar.style.transitionDelay = i * STAGGER + "ms";
   bars.push({
    el: bar,
    width: top > 0 ? votes / top * 100 : 0
   });
  });
  if (outTile) outTile.style.animationDelay = seatList.length * STAGGER + BAR_MS + "ms";
  requestAnimationFrame(() => {
   for (const entry of bars) entry.el.style.width = entry.width + "%";
  });
  refreshMemo();
 }
});
</script>
